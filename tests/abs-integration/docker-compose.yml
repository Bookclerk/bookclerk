# Docker Compose for ABS ↔ Bookclerk integration CI.
#
# ABS image tag should stay in the same release family as
# crates/bookclerk-integrations/openapi/PIN.md.

services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.35.1
    environment:
      AUDIOBOOKSHELF_UID: "0"
      AUDIOBOOKSHELF_GID: "0"
    volumes:
      - abs-config:/config
      - abs-metadata:/metadata
      - shared-audiobooks:/audiobooks
    ports:
      - "13378:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30

  bookclerkd:
    image: bookclerk:abs-ci
    build:
      context: ../..
      dockerfile: tests/abs-integration/Dockerfile
    environment:
      BOOKCLERK_FILES_DIR: /data
      BOOKCLERK_DAEMON_LISTEN: 0.0.0.0:8787
      BOOKCLERK_ABS_ENABLED: "true"
      BOOKCLERK_ABS_BASE_URL: http://audiobookshelf:80
      BOOKCLERK_ABS_API_KEY: ${BOOKCLERK_ABS_API_KEY:-}
      BOOKCLERK_ABS_LIBRARY_ID: ${BOOKCLERK_ABS_LIBRARY_ID:-}
      BOOKCLERK_INTEGRATIONS_PUBLIC_ORIGIN: http://127.0.0.1:8787
      BOOKCLERK_AUTH_ALLOW_PLAINTEXT: "true"
    volumes:
      - bookclerk-data:/data
      - shared-audiobooks:/data/Audiobooks
    ports:
      - "8787:8787"
    depends_on:
      audiobookshelf:
        condition: service_healthy

volumes:
  abs-config:
  abs-metadata:
  shared-audiobooks:
  bookclerk-data:
