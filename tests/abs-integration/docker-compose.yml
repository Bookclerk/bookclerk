# Audiobookshelf and bookclerkd for the integration test (smoke.sh).
#
# The ABS image should stay in the same release family as
# crates/bookclerk-plugins/optional/integration-audiobookshelf/openapi/PIN.md.

services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.35.1
    volumes:
      - abs-config:/config
      - abs-metadata:/metadata
      - shared-audiobooks:/audiobooks
    # bookclerkd shares this network namespace, so it reaches Audiobookshelf
    # on loopback: the plugin accepts plain http only for a loopback host.
    ports:
      - "127.0.0.1:13378:80"
      - "127.0.0.1:8787:8787"

  bookclerkd:
    image: bookclerk:abs-ci-plugin
    build:
      context: ../..
      dockerfile: tests/abs-integration/Dockerfile
    environment:
      BOOKCLERK_DAEMON_LISTEN: 0.0.0.0:8787
      # Wraps master.key at rest; passed through by name from smoke.sh.
      BOOKCLERK_AUTH_PASSWORD:
    network_mode: service:audiobookshelf
    volumes:
      - bookclerk-config:/config
      - shared-audiobooks:/data/Audiobooks
    depends_on:
      - audiobookshelf

volumes:
  abs-config:
  abs-metadata:
  shared-audiobooks:
  bookclerk-config:
