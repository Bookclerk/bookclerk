# Coverage areas for CI Gate, read by scripts/coverage_gate.py.
#
# Each area is one test job's LCOV report. `report` is where the job writes it
# under the coverage directory (and so under CI Gate's download of the
# `coverage-*` artifacts), `root` the directory the report's
# relative paths start from, `paths` the repository-relative prefixes the area
# owns and `suffixes` the file types it measures. `test_results` is the
# job's JUnit report beside it, sent to Codecov Test Analytics. `floor` is
# the lowest line coverage, in percent, the area may report: raise it when
# coverage rises (keep it a little below the measured value so noise does
# not fail a run), and never lower it to make a change pass. `workspace_check` names the CI
# plan check whose selective runs test only the affected packages: the floor
# is then not checked, while patch coverage still is.
#
# `mode = "report"` only warns; `mode = "enforce"` fails CI Gate when patch
# coverage is below `patch_target` or an area is below its floor. See
# docs/contributing/ci.md#coverage.

mode = "report"
patch_target = 80

# Generated files: left out of every area's coverage and of patch coverage,
# since tests exercise the generator, not each line it writes.
# `.github/codecov.yml` ignores the same list, and a test fails when a file
# an area owns carries a generated-file header but is missing here.
generated = [
  "crates/bookclerk-plugin-abi/src/generated.rs",
  "crates/bookclerk-workerd/src/pin.rs",
  "packages/plugin-sdk-python/src/bookclerk_plugin_sdk/_abi.py",
  "packages/plugin-sdk-python/src/bookclerk_plugin_sdk/_wire.py",
  "packages/plugin-sdk-python/src/bookclerk_plugin_sdk/abi.py",
]

[areas.rust]
report = "rust/lcov.info"
test_results = "rust/junit.xml"
root = "."
paths = ["crates/", "fuzz/", "examples/"]
suffixes = [".rs"]
floor = 73
workspace_check = "rust_test"

[areas.site]
report = "site/lcov.info"
test_results = "site/junit.xml"
root = "tools/site"
paths = ["tools/site/"]
suffixes = [".ts"]
floor = 98

[areas.demo]
report = "demo/lcov.info"
test_results = "demo/junit.xml"
root = "tools/demo"
paths = ["tools/demo/"]
suffixes = [".ts"]
floor = 78

[areas.collector]
report = "collector/lcov.info"
test_results = "collector/junit.xml"
root = "tools/diagnostics-collector"
paths = ["tools/diagnostics-collector/"]
suffixes = [".ts"]
floor = 93

[areas.python-sdk]
report = "python-sdk/lcov.info"
test_results = "python-sdk/junit.xml"
root = "."
paths = ["packages/plugin-sdk-python/src/"]
suffixes = [".py"]
floor = 60
