# OSV-Scanner config (applies to Cargo.lock / package-lock in this directory).
# Prefer fixing or replacing vulnerable deps. Exceptions must be INFO/unmaintained
# or otherwise non-actionable, with a concrete mitigation written down.

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
reason = """
INFO / unmaintained advisory on crates.io `paste` 1.0.15 — no CVE, no patched
registry release, and no safe crates.io substitute under the same package name.
Pulled only as a compile-time proc-macro by transitive deps of discovery
embeddings (`fastembed` → `tokenizers` / related crates; `onig` feature does not
drop it). It does not ship in Bookclerk binaries and has no known runtime
exploit path. We do not vendor a rename-to-`paste` fork: OSV still matches the
lockfile package name, so a path patch would not clear the scan. Accept the
INFO finding until upstream moves to maintained `pastey` (or equivalent).
Re-evaluate when tokenizers/fastembed stop depending on `paste`.
"""
