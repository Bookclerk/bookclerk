[package]
name = "bookclerk-desktop"
description = "Desktop window for Bookclerk: the host runs in-process and the web app talks to it over a custom scheme, with no listener"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "bookclerk-desktop"
path = "src/main.rs"

[features]
# The Tauri window. Off by default because it needs the platform webview's
# development files to build (WebKitGTK 4.1 on Linux); see
# docs/contributing/ui/README.md. Without it the binary only explains that.
default = []
window = [
    "dep:bookclerkd",
    "dep:bookclerk-player-engine",
    "dep:cpal",
    "dep:serde",
    "dep:serde_json",
    "dep:souvlaki",
    "dep:tokio",
    "dep:tracing",
    "dep:tauri",
    "dep:tauri-build",
]

[dependencies]
anyhow.workspace = true
# The in-process host and its runtime, which only the window runs.
bookclerkd = { path = "../bookclerkd", optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
# Default features minus `compression` (the window embeds no assets: the
# web app comes from the host over the custom scheme).
# The window's own player: the engine, the output device (ALSA on Linux,
# which needs libasound2-dev to build) and the system's media controls
# (MPRIS over zbus on Linux, so no libdbus).
bookclerk-player-engine = { path = "../bookclerk-player-engine", optional = true }
cpal = { version = "0.18.2", optional = true }
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tauri = { version = "2.12.5", default-features = false, features = ["wry", "common-controls-v6"], optional = true }

[build-dependencies]
tauri-build = { version = "2.5", default-features = false, optional = true , features = [] }

[lints]
workspace = true
