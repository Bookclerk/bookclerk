[package]
name = "bookclerk-plugin-catalog"
description = "Registry-neutral plugin discovery, manifests, and secure install"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
bookclerk-plugin-manifest.workspace = true
bookclerk-sandbox.workspace = true
chrono.workspace = true
fs4.workspace = true
flate2.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
ureq.workspace = true
url = { version = "2", features = ["serde"] }
walkdir.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile.workspace = true
flate2.workspace = true
tar.workspace = true

[lints]
workspace = true

[[test]]
name = "plugin_mutation_lock"
path = "tests/plugin_mutation_lock.rs"
harness = false
