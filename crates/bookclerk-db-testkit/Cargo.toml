[package]
name = "bookclerk-db-testkit"
description = "Contract conformance test kit: capability profiles, begin refusal and fault injection for database tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
bookclerk-db-exec.workspace = true
bookclerk-library = { workspace = true, features = ["test-support"] }
bookclerk-plugin-abi = { workspace = true, features = ["host"] }
bookclerk-plugin-database-sqlite = { workspace = true, features = ["host-helpers"] }
bookclerk-workerd.workspace = true
rusqlite.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "io-util", "io-std", "net", "sync", "time"] }
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
