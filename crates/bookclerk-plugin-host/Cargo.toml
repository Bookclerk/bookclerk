[package]
name = "bookclerk-plugin-host"
description = "External plugin host: discovery, spawn, consent, and workerd-fronted guests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Empty: production hosts never link ordinary plugin implementation crates.
default = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
bookclerk-acquire.workspace = true
bookclerk-config.workspace = true
bookclerk-db-exec.workspace = true
bookclerk-sandbox.workspace = true
bookclerk-integrations.workspace = true
bookclerk-library.workspace = true
bookclerk-plugin-manifest.workspace = true
bookclerk-plugin-catalog.workspace = true
bookclerk-plugin-abi = { workspace = true, features = ["host"] }
bookclerk-plugin-sdk = { workspace = true, features = ["db"] }
bookclerk-source.workspace = true
bookclerk-storage.workspace = true
bytes.workspace = true
chrono.workspace = true
sea-orm.workspace = true
hex.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
ureq.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
bookclerk-plugin-database-sqlite = { workspace = true, features = ["host-helpers"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util"] }

[lints]
workspace = true
