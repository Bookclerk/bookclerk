[package]
name = "bookclerk-plugin-host"
description = "External plugin host: discovery, spawn, JSON-RPC, and optional in-process builtins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Empty by default so platform builds stay external-guest-only. Opt in via
# host `bundled-plugins` (or these feature names) for in-process storefronts.
default = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
bookclerk-acquire.workspace = true
bookclerk-config.workspace = true
bookclerk-sandbox.workspace = true
bookclerk-integrations.workspace = true
bookclerk-library.workspace = true
bookclerk-plugin-manifest.workspace = true
bookclerk-plugin-sdk = { workspace = true, features = ["db"] }
bookclerk-source.workspace = true
bookclerk-storage.workspace = true
bytes.workspace = true
chrono.workspace = true
sea-orm.workspace = true
bookclerk-plugin-source-audible = { workspace = true, optional = true }
bookclerk-plugin-source-libro = { workspace = true, optional = true }
bookclerk-plugin-source-chirp = { workspace = true, optional = true }
bookclerk-plugin-source-graphicaudio = { workspace = true, optional = true }
bookclerk-plugin-integration-audiobookshelf = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
ureq.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
bookclerk-plugin-database-sqlite.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util"] }

[lints]
workspace = true
