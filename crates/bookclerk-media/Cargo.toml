[package]
name = "bookclerk-media"
description = "Clear-media packaging: remux, metadata fix-up, and MP3 encode (no DRM)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
bookclerk-config.workspace = true
# Capability probe only: the pool reports at startup whether this platform can
# confine a worker at all, instead of letting the first acquire discover it.
bookclerk-sandbox.workspace = true
bookclerk-mp4.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing.workspace = true
tempfile.workspace = true
serde_json.workspace = true
mp4ameta = "0.13"
id3 = "1.17"
symphonia = { version = "0.6", default-features = false, features = ["aac", "isomp4", "mp3", "pcm"] }
mp3lame-encoder = "0.2"
fdk-aac = "0.8"

[dev-dependencies]
# The faststart layout is written by the remuxer, so the tests that cover
# editing one build it from the same synthetic file the remuxer's own tests use.
bookclerk-mp4 = { workspace = true, features = ["fixtures"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
