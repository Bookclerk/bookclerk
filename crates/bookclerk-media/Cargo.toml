[package]
name = "bookclerk-media"
description = "Clear-media packaging: remux, metadata fix-up, and MP3 encode (no DRM)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# FFmpeg decoders (bookclerk-libav) for AC-3, E-AC-3, WMA and AMR. Release
# and Docker builds turn it on (bookclerk-dev's release build); the default
# dev build leaves it off. Unix and Windows (MSVC) only.
libav = ["dep:bookclerk-libav"]

[dependencies]
anyhow.workspace = true
bookclerk-libav = { workspace = true, optional = true }
bookclerk-config.workspace = true
# Cover pipeline types and the frames the cover worker speaks.
bookclerk-cover.workspace = true
# Embedded tag reader and the frames the tag worker speaks.
bookclerk-tags.workspace = true
# Bounded archive extraction for the `extract_archive` job, and the report
# the host re-checks.
bookclerk-archive.workspace = true
# Capability probe only: the pool reports at startup whether this platform can
# confine a worker at all, instead of letting the first acquire discover it.
bookclerk-sandbox.workspace = true
bookclerk-mp4.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "sync", "time", "rt"] }
tracing.workspace = true
tempfile.workspace = true
serde_json.workspace = true
mp4ameta = "0.13"
id3 = "1.17"
symphonia = { version = "0.6", default-features = false, features = [
    "aac",
    "adpcm",
    "aiff",
    "alac",
    "caf",
    "flac",
    "isomp4",
    "mp1",
    "mp2",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
mp3lame-encoder = "0.3"
fdk-aac = "0.8"
# libopus through its safe bindings (opusic-sys underneath, bundled build):
# the Opus decoder behind Ogg Opus input and the encoder for Opus output.
opusic-c = { version = "1.6", default-features = false, features = ["bundled"] }
# Vorbis comment and picture writing for Ogg Opus output; M4B stays on
# mp4ameta (chapters) and MP3 on id3.
lofty = "0.25"

[dev-dependencies]
# The faststart layout is written by the remuxer, so the tests that cover
# editing one build it from the same synthetic file the remuxer's own tests use.
bookclerk-mp4 = { workspace = true, features = ["fixtures"] }
# The probe tests read the tag reader's own sample files.
bookclerk-tags = { workspace = true, features = ["fixtures"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
bookclerk-archive = { workspace = true, features = ["fixtures"] }

# Tests on Linux, macOS and Windows (MSVC) run with the FFmpeg decoders and
# their sample files, so CI covers the `libav` code paths on every OS.
[target.'cfg(any(unix, all(windows, target_env = "msvc")))'.dev-dependencies]
bookclerk-media = { workspace = true, features = ["libav"] }
bookclerk-libav = { workspace = true, features = ["fixtures"] }

[lints]
workspace = true
