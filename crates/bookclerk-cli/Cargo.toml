[package]
name = "bookclerk-cli"
description = "Bookclerk command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "bookclerk"
path = "src/main.rs"

[features]
# Hosts load storefronts only as staged external guests (plugins/ or
# BOOKCLERK_PLUGIN_DIRS). There is no in-process product plugin path.
default = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
bookclerk-config.workspace = true
bookclerk-enrich.workspace = true
bookclerk-acquire.workspace = true
bookclerk-library.workspace = true
bookclerk-media.workspace = true
bookclerk-migrate.workspace = true
bookclerk-node-client.workspace = true
bookclerk-naming.workspace = true
bookclerk-search.workspace = true
bookclerk-source.workspace = true
bookclerk-storage.workspace = true
bookclerk-integrations.workspace = true
bookclerk-discover.workspace = true
bookclerk-plugin-host.workspace = true
bookclerk-plugin-abi.workspace = true
bookclerk-plugin-catalog.workspace = true
sea-orm.workspace = true
rusqlite.workspace = true
chrono.workspace = true
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
csv.workspace = true
rust_xlsxwriter.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
ureq.workspace = true
secrecy.workspace = true
zeroize.workspace = true

# Reading a secret from a terminal with echo off (`secret_input`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Console",
] }

[dev-dependencies]
bookclerk-plugin-database-sqlite = { workspace = true, features = ["host-helpers"] }
bookclerk-plugin-manifest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
