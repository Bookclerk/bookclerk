[package]
name = "bookclerk-media-worker"
description = "Confined child process that runs one Bookclerk media job, or serves cover images"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "bookclerk-media-worker"
path = "src/main.rs"

[features]
# FFmpeg decoders for AC-3, E-AC-3, WMA and AMR (see bookclerk-media). On
# in every release and Docker build.
libav = ["bookclerk-media/libav"]

[dependencies]
bookclerk-cover.workspace = true
bookclerk-media.workspace = true
bookclerk-sandbox.workspace = true
bookclerk-tags.workspace = true
serde_json.workspace = true
# Cover mode only: one bounded pool decodes several covers at once.
rayon = "1"

[dev-dependencies]
bookclerk-sandbox.workspace = true
futures.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }

[lints]
workspace = true
