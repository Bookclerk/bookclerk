[package]
name = "bookclerk-jail"
description = "Applies a confinement policy, then hands control to the program it was asked to run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "bookclerk-jail"
path = "src/main.rs"

[[bin]]
name = "bookclerk-ac-probe"
path = "src/bin/bookclerk-ac-probe.rs"

[dependencies]
bookclerk-sandbox.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true

[lints]
workspace = true
