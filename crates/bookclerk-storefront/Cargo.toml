[package]
name = "bookclerk-storefront"
description = "Types storefront guests share with the host: DTOs, ABI conversions and listing helpers, with no database, ORM or OpenAPI dependencies"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# Storefront guests link this crate, so keep it free of the host stack:
# no `bookclerk-library` / `bookclerk-config`, no ORM, SQL driver, OpenAPI,
# TLS or async runtime. `bookclerk-source` re-exports it for host code.
[dependencies]
anyhow.workspace = true
bookclerk-plugin-abi.workspace = true
bookclerk-resolve.workspace = true
chrono.workspace = true
html-escape.workspace = true
infer.workspace = true
mime_guess.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
