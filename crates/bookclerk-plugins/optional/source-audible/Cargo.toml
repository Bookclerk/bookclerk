[package]
name = "bookclerk-plugin-source-audible"
description = "Audible source plugin: in-process ContentSource + Workers RPC guest binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
keywords = ["bookclerk", "bookclerk-plugin", "bookclerk-source", "audiobook"]

[package.metadata.bookclerk]
api_version = 2
kind = "source"
id = "audible"
display_name = "Audible"


[lib]
name = "bookclerk_plugin_source_audible"
path = "src/lib.rs"

[[bin]]
name = "bookclerk-plugin-source-audible"
path = "src/main.rs"

[dependencies]
aes = "0.9.2"
cbc = "0.2.1"
ctr = "0.10.1"
hex = "0.4.3"
anyhow.workspace = true
async-trait.workspace = true
audible-rs.workspace = true
base64.workspace = true
chrono.workspace = true
futures.workspace = true
bookclerk-config.workspace = true
bookclerk-enrich.workspace = true
bookclerk-media.workspace = true
bookclerk-mp4.workspace = true
bookclerk-library.workspace = true
bookclerk-plugin-sdk.workspace = true
bookclerk-source.workspace = true
qrcode.workspace = true
reqwest = { version = "0.13", default-features = true, features = ["json"] }
getrandom = "0.4"
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
bookclerk-plugin-database-sqlite.workspace = true
# `fixtures` writes the synthetic aaxc-shaped MP4s the decrypt tests parse.
bookclerk-mp4 = { workspace = true, features = ["fixtures"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock.workspace = true
bookclerk-library.workspace = true
reqwest = { version = "0.13", default-features = true, features = ["json"] }
serde_json.workspace = true
audible-rs.workspace = true
bookclerk-config.workspace = true

[lints]
workspace = true
