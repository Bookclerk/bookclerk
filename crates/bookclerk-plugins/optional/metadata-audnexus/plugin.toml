api_version = 3
id = "audnexus"
name = "Audnexus"
version = "0.1.0"
runtime = "workerd"
entrypoints = ["metadata"]

[media]
works = ["book"]
lists = ["audio"]

[workerd]
compatibility_date = "2026-08-01"
compatibility_flags = []
main_module = "index.js"
modules_dir = "modules"
entrypoint = "default"

[workerd.limits]
cpu_ms = 10000
# A lookup makes one request per ASIN, at most five.
subrequests = 10

# Emitted from `src/` by `npm run build`; CI fails when they drift.
[[modules]]
name = "index.js"
path = "index.js"
type = "js"

[[modules]]
name = "client.js"
path = "client.js"
type = "js"

[[modules]]
name = "audnexus.js"
path = "audnexus.js"
type = "js"

[[modules]]
name = "version.js"
path = "version.js"
type = "js"

[capabilities.network]
mode = "outbound"
# Cover images are linked, not fetched, so only the API host is needed.
domains = ["api.audnex.us"]

[vars]
