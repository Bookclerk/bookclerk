[package]
name = "bookclerk-plugin-database-d1"
description = "Optional Cloudflare D1 library database plugin (Workers RPC guest)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
keywords = ["bookclerk", "bookclerk-plugin", "bookclerk-database"]

[package.metadata.bookclerk]
api_version = 1
kind = "database"
id = "d1"
display_name = "Cloudflare D1"

[[bin]]
name = "bookclerk-plugin-database-d1"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
base64.workspace = true
bookclerk-db-guest.workspace = true
bookclerk-library.workspace = true
bookclerk-plugin-sdk = { workspace = true, features = ["db"] }
chrono.workspace = true
reqwest.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
rusqlite.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock.workspace = true

[lints]
workspace = true
