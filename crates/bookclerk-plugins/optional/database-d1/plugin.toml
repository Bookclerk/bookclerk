api_version = 2
id = "d1"
name = "Cloudflare D1"
kind = "database"
version = "0.1.0"
logo = "https://www.google.com/s2/favicons?domain=cloudflare.com&sz=128"
runtime = "native"
command = "./bookclerk-plugin-database-d1"

[capabilities.network]
mode = "outbound"
[capabilities.bindings]
config = true
secrets = true

[capabilities.methods]
list = [
    "health",
    "diagnose",
    "dbConnect",
    "dbPing",
    "dbQuery",
    "dbExecute",
    "dbAtomic",
]
