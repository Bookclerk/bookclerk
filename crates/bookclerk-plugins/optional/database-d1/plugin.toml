api_version = 3
id = "d1"
name = "Cloudflare D1"
version = "0.1.0"
logo = "https://www.google.com/s2/favicons?domain=cloudflare.com&sz=128"
runtime = "native"
command = "./bookclerk-plugin-database-d1"
entrypoints = ["databaseAdapter"]

[capabilities.network]
mode = "outbound"
tcp = [{ host = "api.cloudflare.com", ports = [443] }]
# Host spawn also overlays `[database.d1].api_base` when this guest is the
# active database plugin. Nested jail denies ambient AF_INET; HTTP goes
# through `bookclerk_plugin_sdk::http`.

