api_version = 3
id = "graphicaudio"
name = "GraphicAudio"
version = "0.1.0"
logo = "https://www.google.com/s2/favicons?domain=graphicaudio.com&sz=128"
runtime = "native"
command = "./bookclerk-plugin-source-graphicaudio"
entrypoints = ["storefront"]

[capabilities.network]
mode = "outbound"
tcp = [
    { host = "www.graphicaudio.net", ports = [443] },
    { host = "media.graphicaudio.net", ports = [443] },
    { host = "*.cloudfront.net", ports = [443] },
]

