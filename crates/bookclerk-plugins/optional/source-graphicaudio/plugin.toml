api_version = 2
id = "graphicaudio"
name = "GraphicAudio"
kind = "source"
version = "0.1.0"
logo = "https://www.google.com/s2/favicons?domain=graphicaudio.com&sz=128"
runtime = "native"
command = "./bookclerk-plugin-source-graphicaudio"

[capabilities.network]
mode = "outbound"
[capabilities.bindings]
config = true
secrets = true
work_fs = true

[capabilities.methods]
list = [
    "health",
    "diagnose",
    "login",
    "scan",
    "fetchTitle",
    "searchCatalog",
    "expandCandidates",
    "purchaseHint",
    "listDeals",
]
