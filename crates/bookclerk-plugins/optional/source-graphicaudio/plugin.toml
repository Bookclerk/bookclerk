api_version = 3
id = "graphicaudio"
name = "GraphicAudio"
version = "0.1.0"
logo = "https://www.google.com/s2/favicons?domain=graphicaudio.com&sz=128"
runtime = "native"
command = "./bookclerk-plugin-source-graphicaudio"
entrypoints = ["storefront"]
# GraphicAudio signs in again with the stored password for each job and
# keeps no rotating token, so every instance the person connects may hold a
# copy.
credentials = "shareable"

[media]
works = ["book"]
lists = ["audio"]
fetches = ["audio"]

[capabilities.network]
mode = "outbound"
tcp = [
    { host = "www.graphicaudio.net", ports = [443] },
    { host = "media.graphicaudio.net", ports = [443] },
    { host = "*.cloudfront.net", ports = [443] },
]

# The public catalog sends no agent of its own, so it carries Bookclerk's.
[capabilities.network.own_user_agent]
hosts = ["www.graphicaudio.net", "media.graphicaudio.net", "*.cloudfront.net"]
reason = "GraphicAudio's app API expects its Android app, and its web player sign-in and streams are only tested with a browser agent."

[vars]

[[settings]]
key = "access"
label = "Access mode"
type = "enum"
values = [{ id = "web", label = "Web player" }, { id = "zip", label = "ZIP download" }, { id = "device", label = "Device stream" }]
default = "web"

[[settings]]
key = "bitrate"
label = "Bitrate (device)"
type = "enum"
values = [{ id = "hi", label = "High" }, { id = "lo", label = "Low" }]
default = "hi"

[[settings]]
key = "container"
label = "Container (zip)"
type = "enum"
values = [{ id = "auto", label = "Auto" }, { id = "m4b", label = "M4B" }, { id = "mp3", label = "MP3" }, { id = "flac", label = "FLAC" }]
default = "auto"

[[settings]]
key = "base_url"
label = "Base URL"
type = "string"
description = "Override the GraphicAudio site origin (testing only)."

[[settings]]
key = "store_url"
label = "Store URL"
type = "string"
description = "Override the GraphicAudio store origin (testing only)."

[secrets]

[work_fs]

# Fingerprints of the titles the last scan listed, so a scan sends the host
# only what changed (see the `bookclerk-scan-delta` crate).
[[databases]]
binding = "SCAN_STATE"
