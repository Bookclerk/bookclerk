api_version = 3
id = "ngrok"
name = "ngrok"
version = "0.1.0"
runtime = "workerd"
entrypoints = ["ingress"]

[workerd]
compatibility_date = "2026-08-01"
compatibility_flags = []
main_module = "index.js"
modules_dir = "modules"
entrypoint = "default"

[workerd.limits]
cpu_ms = 30000
# A request is one library call; each later piece of a large response one
# more.
subrequests = 100

# Emitted from `src/` by `npm run build`; CI fails when they drift.
[[modules]]
name = "index.js"
path = "index.js"
type = "js"

[[modules]]
name = "agent.js"
path = "agent.js"
type = "js"

[[modules]]
name = "ca.js"
path = "ca.js"
type = "js"

[[modules]]
name = "http1.js"
path = "http1.js"
type = "js"

[[modules]]
name = "lifecycle.js"
path = "lifecycle.js"
type = "js"

[[modules]]
name = "messages.js"
path = "messages.js"
type = "js"

[[modules]]
name = "mux.js"
path = "mux.js"
type = "js"

[[modules]]
name = "serve.js"
path = "serve.js"
type = "js"

[[modules]]
name = "version.js"
path = "version.js"
type = "js"

[[modules]]
name = "ws.js"
path = "ws.js"
type = "js"

[ingress]
kind = "relay"

[capabilities.network]
mode = "outbound"
# ngrok's agent endpoint, as one TLS stream the host holds (`tls://`).
tcp = [{ host = "connect.ngrok-agent.com", ports = [443] }]

# The connection to ngrok, and the clients' WebSockets to the library; the
# host holds them while the plugin waits.
[sockets]

[vars]

[[settings]]
key = "domain"
label = "ngrok domain"
type = "string"
required = true
description = "The domain to serve on: your free static domain (such as example.ngrok-free.app) or a domain reserved in your ngrok account."

[[settings]]
key = "authtoken"
label = "ngrok authtoken"
type = "secret"
description = "The authtoken from your ngrok dashboard (Your Authtoken)."

[secrets]
