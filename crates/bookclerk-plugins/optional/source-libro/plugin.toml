api_version = 2
id = "libro"
name = "Libro.fm"
kind = "source"
version = "0.1.0"
logo = "https://www.google.com/s2/favicons?domain=libro.fm&sz=128"
runtime = "native"
command = "./bookclerk-plugin-source-libro"

[capabilities.network]
mode = "outbound"
[capabilities.bindings]
config = true
secrets = true
work_fs = true

[capabilities.methods]
list = [
    "health",
    "diagnose",
    "login",
    "scan",
    "fetchTitle",
    "searchCatalog",
    "catalogDetail",
    "expandCandidates",
    "purchaseHint",
    "listDeals",
]
