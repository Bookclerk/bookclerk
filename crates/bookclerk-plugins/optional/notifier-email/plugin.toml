api_version = 3
id = "email"
name = "Email (SMTP)"
version = "0.1.0"
runtime = "native"
command = "./bookclerk-plugin-notifier-email"
entrypoints = ["notifier"]

[notifier]
destinations = ["channel", "personal"]
account_mail = true
deliverability_check = true
formats = ["text", "html"]

[[notifier.address_fields]]
key = "email"
label = "Email address"
required = true

[capabilities.network]
mode = "outbound"
# The mail server comes from the `server` setting, whose destination the
# operator approves on the consent form. The guest is native because workerd
# plugins can't run TLS on a raw TCP connection: it tunnels through the host
# and runs TLS itself. The three hosts below are only for the operator's
# deliverability check (Postmark's spam check, DNS-over-HTTPS for SPF and
# DMARC records, mail-tester.com results); refusing them on the consent form
# leaves sending untouched and marks those checks as not run.
tcp = [
  { host = "spamcheck.postmarkapp.com", ports = [443] },
  { host = "cloudflare-dns.com", ports = [443] },
  { host = "www.mail-tester.com", ports = [443] },
]

[vars]

[secrets]

[[settings]]
key = "server"
label = "SMTP server"
type = "string"
network = "tcp"
default_port = 587
description = "Your mail provider's submission server, as host or host:port (for example smtp.example.com:587). Port 587 is used when none is given."

[[settings]]
key = "security"
label = "Connection security"
type = "enum"
values = [
  { id = "starttls", label = "STARTTLS (usually port 587)" },
  { id = "tls", label = "TLS (usually port 465)" },
  { id = "none", label = "None (only on a network you trust; no sign-in)" },
]
default = "starttls"

[[settings]]
key = "username"
label = "User name"
type = "string"
description = "The account that signs in to the server. Leave it empty when the server takes mail without signing in."

[[settings]]
key = "password"
label = "Password"
type = "secret"
description = "The account's password or app password. Sent only over TLS."

[[settings]]
key = "from_address"
label = "From address"
type = "string"
description = "The address mail comes from. Most providers only accept an address of the signed-in account or a verified domain."

[[settings]]
key = "from_name"
label = "From name"
type = "string"
default = "Bookclerk"
description = "The name shown beside the from address."

[[settings]]
key = "to"
label = "Channel recipients"
type = "string"
description = "Where channel notifications go: up to 10 addresses separated by commas. Leave it empty when only patrons' own addresses are used."

[[settings]]
key = "mail_tester_account"
label = "mail-tester.com account"
type = "string"
description = "Optional. Your mail-tester.com account name (the part before the dash in your test addresses). With it, the deliverability check also sends a real message through your server to mail-tester and reads its score, which covers DKIM, reverse DNS and blocklists. Tests may use your mail-tester credits."
