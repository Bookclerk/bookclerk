api_version = 2
id = "audiobookshelf"
name = "Audiobookshelf"
kind = "integration"
version = "0.1.0"
logo = "https://www.google.com/s2/favicons?domain=audiobookshelf.org&sz=128"
runtime = "native"
command = "./bookclerk-plugin-integration-audiobookshelf"

[capabilities.network]
mode = "outbound"
# Self-hosted ABS: list your server hostname(s) here. www.audiobookshelf.org
# alone is insufficient for talking to your library instance.
[capabilities.bindings]
config = true

[capabilities.methods]
list = [
    "pollEvents",
    "start",
    "health",
    "diagnose",
    "scanLibrary",
    "syncListening",
    "authenticateUser",
    "onEvent",
    "oidcClients",
]

[capabilities.events]
subscriptions = [
  { type = "book_acquired", schema_versions = [1], supports_suspend = false },
]

[[oidc.clients]]
client_id = "audiobookshelf"
display_name = "Audiobookshelf"
callback_path = "/auth/openid/callback"
public_client = true
default_scopes = ["openid", "profile"]
issue_refresh_token = true
origin_config_key = "integrations.audiobookshelf.base_url"
