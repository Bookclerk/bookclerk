api_version = 3
id = "audiobookshelf"
name = "Audiobookshelf"
version = "0.2.0"
logo = "https://www.google.com/s2/favicons?domain=audiobookshelf.org&sz=128"
runtime = "workerd"
entrypoints = ["remoteLibrary", "oidc"]

[workerd]
compatibility_date = "2026-08-01"
compatibility_flags = []
main_module = "index.js"
modules_dir = "modules"
entrypoint = "default"

[workerd.limits]
cpu_ms = 30000
# A listening sync makes one request per user and one per changed progress
# row; it stops short of this cap and picks up the rest on the next sync
# (see `src/listening.ts`).
subrequests = 1000

# Emitted from `src/` by `npm run build`; CI fails when they drift.
[[modules]]
name = "index.js"
path = "index.js"
type = "js"

[[modules]]
name = "client.js"
path = "client.js"
type = "js"

[[modules]]
name = "settings.js"
path = "settings.js"
type = "js"

[[modules]]
name = "guest.js"
path = "guest.js"
type = "js"

[[modules]]
name = "hash.js"
path = "hash.js"
type = "js"

[[modules]]
name = "keyed.js"
path = "keyed.js"
type = "js"

[[modules]]
name = "listening.js"
path = "listening.js"
type = "js"

[[modules]]
name = "push.js"
path = "push.js"
type = "js"

[[modules]]
name = "watch.js"
path = "watch.js"
type = "js"

[capabilities.network]
mode = "outbound"
# Self-hosted Audiobookshelf has no fixed address, so the plugin asks for any
# public website (`*`); it only ever calls the `base_url` the operator sets.
# A server on a private or loopback address also needs that address's CIDR
# in the grant. The one grant covers the API calls and the pushed-event
# socket. The operator may deny `*` and approve the server's host instead.
domains = ["*"]

# Audiobookshelf pushes new users over Socket.io; the host holds the socket
# while the plugin sleeps and answers its pings (see `src/push.ts`).
[sockets]

[vars]

[[settings]]
key = "base_url"
label = "Audiobookshelf URL"
type = "string"
required = true
description = "Scheme and host of the Audiobookshelf server (https unless loopback)."

[[settings]]
key = "library_id"
label = "Library id"
type = "string"

[[settings]]
key = "watch_users"
label = "Watch users"
type = "bool"
default = true

[[settings]]
key = "notify_scan_on_acquire"
label = "Notify scan on acquire"
type = "bool"
default = true

[[settings]]
key = "allow_credential_login"
label = "Allow credential login"
type = "bool"
default = true

[[settings]]
key = "api_key"
label = "API key"
type = "secret"

[secrets]

# What the last listening sync sent, and the users already reported, so a
# sync passes on only the progress rows that changed and a poll reports only
# new users (see `src/listening.ts` and `src/watch.ts`).
[[databases]]
binding = "LISTENING_STATE"

[[events.consumers]]
type = "book_acquired"
schema_versions = [1]
supports_suspend = false

[[oidc.clients]]
client_id = "audiobookshelf"
display_name = "Audiobookshelf"
callback_path = "/auth/openid/callback"
public_client = true
default_scopes = ["openid", "profile"]
issue_refresh_token = true
origin_config_key = "integrations.audiobookshelf.base_url"
