api_version = 3
id = "audiobookshelf"
name = "Audiobookshelf"
version = "0.1.0"
logo = "https://www.google.com/s2/favicons?domain=audiobookshelf.org&sz=128"
runtime = "native"
command = "./bookclerk-plugin-integration-audiobookshelf"
entrypoints = ["remoteLibrary", "oidc"]

[capabilities.network]
mode = "outbound"
# Self-hosted ABS: host spawn overlays `[integrations.audiobookshelf].base_url`
# as TCP + loopback/private CIDRs. Extra hostnames can be added here or by the
# operator. Nested jail denies ambient AF_INET; HTTP uses the SDK client.

[vars]

[[events.consumers]]
type = "book_acquired"
schema_versions = [1]
supports_suspend = false

[[oidc.clients]]
client_id = "audiobookshelf"
display_name = "Audiobookshelf"
callback_path = "/auth/openid/callback"
public_client = true
default_scopes = ["openid", "profile"]
issue_refresh_token = true
origin_config_key = "integrations.audiobookshelf.base_url"
