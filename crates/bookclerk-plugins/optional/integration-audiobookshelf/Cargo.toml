[package]
name = "bookclerk-plugin-integration-audiobookshelf"
description = "Audiobookshelf integration plugin: in-process Integration + Workers RPC guest binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
keywords = ["bookclerk", "bookclerk-plugin", "bookclerk-integration", "audiobook"]

[package.metadata.bookclerk]
api_version = 2
kind = "integration"
id = "audiobookshelf"
display_name = "Audiobookshelf"

[lib]
name = "bookclerk_plugin_integration_audiobookshelf"
path = "src/lib.rs"

[[bin]]
name = "bookclerk-plugin-integration-audiobookshelf"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
bookclerk-config.workspace = true
bookclerk-integrations.workspace = true
bookclerk-library.workspace = true
bookclerk-plugin-sdk.workspace = true
chrono.workspace = true
reqwest = { version = "0.13", default-features = true, features = ["json", "query", "rustls"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "sync"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock.workspace = true

[lints]
workspace = true
