[package]
name = "bookclerk-plugin-source-chirp"
description = "Chirp source plugin: native storefront guest binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
keywords = ["bookclerk", "bookclerk-plugin", "bookclerk-source", "audiobook"]

[package.metadata.bookclerk]
api_version = 3
kind = "source"
id = "chirp"
display_name = "Chirp"


[lib]
name = "bookclerk_plugin_source_chirp"
path = "src/lib.rs"

[[bin]]
name = "bookclerk-plugin-source-chirp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
bookclerk-plugin-sdk = { workspace = true, features = ["http"] }
bookclerk-storefront.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock.workspace = true
serde_json.workspace = true
bookclerk-storefront.workspace = true

[lints]
workspace = true
