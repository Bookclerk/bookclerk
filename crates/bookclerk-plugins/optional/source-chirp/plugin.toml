api_version = 3
id = "chirp"
name = "Chirp"
version = "0.1.0"
logo = "https://www.google.com/s2/favicons?domain=chirpbooks.com&sz=128"
runtime = "native"
command = "./bookclerk-plugin-source-chirp"
entrypoints = ["storefront"]
# The Chirp session token is not refreshed or rotated, so every instance
# the person connects may hold a copy.
credentials = "shareable"

[media]
works = ["book"]
lists = ["audio"]
fetches = ["audio"]

[capabilities.network]
mode = "outbound"
tcp = [
    { host = "*.chirpbooks.com", ports = [443] },
]

[capabilities.network.own_user_agent]
hosts = ["*.chirpbooks.com"]
reason = "Chirp's API expects the HTTP client of the Chirp Android app."
# GraphQL API, listen-api, and storefront subdomains. Cover/media URLs from
# the API that land on a different CDN still need a matching `tcp` grant
# (operator additions). Fetch `domains` are workerd-only.

[vars]

[[settings]]
key = "graphql_url"
label = "GraphQL URL"
type = "string"
description = "Override the Chirp GraphQL endpoint (testing only)."

[secrets]

[work_fs]

# Fingerprints of the titles the last scan listed, so a scan sends the host
# only what changed (see the `bookclerk-scan-delta` crate).
[[databases]]
binding = "SCAN_STATE"
