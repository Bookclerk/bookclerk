api_version = 3
id = "chirp"
name = "Chirp"
version = "0.1.0"
logo = "https://www.google.com/s2/favicons?domain=chirpbooks.com&sz=128"
runtime = "native"
command = "./bookclerk-plugin-source-chirp"
entrypoints = ["storefront"]

[capabilities.network]
mode = "outbound"
tcp = [
    { host = "*.chirpbooks.com", ports = [443] },
]
# GraphQL API, listen-api, and storefront subdomains. Cover/media URLs from
# the API that land on a different CDN still need a matching `tcp` grant
# (operator additions). Fetch `domains` are workerd-only.

