api_version = 3
id = "postgres"
name = "PostgreSQL"
version = "0.1.0"
logo = "https://www.google.com/s2/favicons?domain=postgresql.org&sz=128"
runtime = "native"
command = "./bookclerk-plugin-database-postgres"
entrypoints = ["databaseAdapter"]

[capabilities.network]
mode = "outbound"
# Native: no `domains` (fetch allowlist is workerd-only). TCP host/port is not
# hardcoded — the host overlays the destination from `[database.postgres].url`
# at spawn. The nested jail denies ambient AF_INET; sqlx dials a local Unix
# socket that the SDK splices through `bookclerk_plugin_sdk::connect`.

[vars]

[secrets]
