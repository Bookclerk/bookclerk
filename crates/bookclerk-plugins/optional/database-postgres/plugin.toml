api_version = 1
id = "postgres"
name = "PostgreSQL"
kind = "database"
version = "0.1.0"
logo = "https://www.google.com/s2/favicons?domain=postgresql.org&sz=128"
runtime = "native"
command = "./bookclerk-plugin-database-postgres"

[capabilities.network]
mode = "outbound"
# Native: no `domains` key (hostname filtering is workerd-only). Postgres dials TCP
# under coarse jail outbound.
[capabilities.bindings]
config = true
secrets = true
