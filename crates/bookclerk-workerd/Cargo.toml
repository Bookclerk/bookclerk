[package]
name = "bookclerk-workerd"
description = "Jailed workerd isolate launcher for Bookclerk script plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "bookclerk_workerd"
path = "src/lib.rs"

[[bin]]
name = "bookclerk-workerd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bookclerk-plugin-abi.workspace = true
bookclerk-plugin-manifest.workspace = true
flate2 = "1"
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "io-std", "fs", "net", "process", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
ureq.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
