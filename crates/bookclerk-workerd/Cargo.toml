[package]
name = "bookclerk-workerd"
description = "Jailed workerd isolate launcher for Bookclerk script plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "bookclerk_workerd"
path = "src/lib.rs"

[[bin]]
name = "bookclerk-workerd"
path = "src/main.rs"

# Native Cap'n Proto twin of the workerd author fixtures. Built with the
# launcher so `tests/conformance.rs` can run identical storefront / CLI / job
# vectors on all three transports; never staged or packaged (bookclerk-dev
# copies helpers by name).
[[bin]]
name = "bookclerk-workerd-native-fixture"
path = "tests/fixtures/native/main.rs"
test = false
doc = false
bench = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bookclerk-plugin-abi.workspace = true
bookclerk-plugin-manifest.workspace = true
capnp.workspace = true
capnp-rpc.workspace = true
flate2 = "1"
hex.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "io-std", "fs", "net", "process", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
ureq.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
bookclerk-plugin-abi = { workspace = true, features = ["host"] }
tempfile.workspace = true

[lints]
workspace = true
