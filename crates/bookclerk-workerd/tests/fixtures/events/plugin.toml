api_version = 2
id = "events_fixture"
name = "Event contract fixture"
kind = "integration"
version = "1.0.0"
runtime = "workerd"

[workerd]
compatibility_date = "2026-08-01"
compatibility_flags = []
main_module = "index.js"
modules_dir = "modules"
entrypoint = "default"

[workerd.limits]
cpu_ms = 30000
subrequests = 50

[[modules]]
name = "index.js"
path = "index.js"
type = "js"

[capabilities.network]
mode = "deny"

[capabilities.bindings]
config = true

[capabilities.methods]
list = ["describe", "integration", "health", "onEvent"]

[capabilities.events]
subscriptions = [
  { type = "book_acquired", schema_versions = [1], supports_suspend = true },
  { type = "test_retry", schema_versions = [1] },
  { type = "test_reject", schema_versions = [1] },
  { type = "test_dead_letter", schema_versions = [1] },
  { type = "test_suspend", schema_versions = [1], supports_suspend = true },
]
