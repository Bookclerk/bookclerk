[package]
name = "bookclerk-storage"
description = "Pluggable local, S3 (feature `s3`) and B2 (feature `b2`) storage backends for acquired audiobooks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
async-trait.workspace = true
bytes.workspace = true
filetime.workspace = true
fs4.workspace = true
hex.workspace = true
same-file.workspace = true
sha2.workspace = true
uuid.workspace = true
bookclerk-config.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "sync"] }
tracing.workspace = true

# The S3 backend (`s3` feature) is only for the `s3` destination plugin. The
# hosts never open S3 themselves, and without it their fat-LTO release links
# skip the AWS SDK.
aws-config = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
aws-sdk-sqs = { workspace = true, optional = true }
aws-smithy-runtime-api = { version = "1", default-features = false, features = ["client", "http-1x"], optional = true }
aws-smithy-types = { version = "1", default-features = false, features = ["http-body-1-x"], optional = true }
bookclerk-plugin-sdk.workspace = true
http-body-util = { version = "0.1", optional = true }
chrono = { workspace = true, optional = true }
# The B2 backend (`b2` feature), for the `b2` destination plugin only.
futures = { workspace = true, optional = true }
sha1 = { version = "0.11", optional = true }
tokio-util = { workspace = true, optional = true }
# Watches a local root for the change feed (`watch` feature), for the
# `local` destination plugin only.
notify = { version = "8", optional = true, default-features = false, features = ["macos_fsevent"] }

[features]
# The S3 / MinIO backend (`S3Backend`) and its notification-queue change
# feed, for the `s3` destination plugin.
s3 = [
  "dep:aws-config",
  "dep:aws-sdk-s3",
  "dep:aws-sdk-sqs",
  "dep:aws-smithy-runtime-api",
  "dep:aws-smithy-types",
  "dep:http-body-util",
  "dep:chrono",
  "bookclerk-plugin-sdk/http",
]
# The Backblaze B2 backend (`B2Backend`) on B2's native API, for the `b2`
# destination plugin.
b2 = [
  "dep:futures",
  "dep:sha1",
  "dep:tokio-util",
  "tokio/time",
  "bookclerk-plugin-sdk/http",
]
# The local backend's change feed (`LocalFsBackend::with_watch`), for the
# `local` destination plugin.
watch = ["dep:notify"]

# File-system classification for the local backend (`fs_kind`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
# The crate's own tests always cover the S3 and B2 backends and the local
# watcher.
bookclerk-storage = { path = ".", features = ["s3", "b2", "watch"] }
bookclerk-plugin-database-sqlite = { workspace = true, features = ["host-helpers"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# The sparse-file test marks its file sparse so NTFS allocates no space.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
] }

[lints]
workspace = true
