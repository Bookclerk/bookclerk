[package]
name = "bookclerk-storage"
description = "Pluggable local and S3 storage backends for acquired audiobooks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
filetime.workspace = true
bookclerk-config.workspace = true
bookclerk-library.workspace = true
bookclerk-source.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net"] }
tracing.workspace = true

# S3 is compiled in but unused until Phase 3 wiring; keeps the trait ready.
aws-config.workspace = true
aws-sdk-s3.workspace = true
aws-smithy-runtime-api = { version = "1", default-features = false, features = ["client", "http-1x"] }
aws-smithy-types = { version = "1", default-features = false, features = ["http-body-1-x"] }
bookclerk-plugin-sdk = { workspace = true, features = ["http"] }
http-body-util = "0.1"
chrono.workspace = true

[dev-dependencies]
bookclerk-plugin-database-sqlite = { workspace = true, features = ["host-helpers"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
