[package]
name = "bookclerk-plugin-sdk"
description = "Guest Bookclerk plugin SDK (Workers RPC ABI + BookclerkEntrypoint + stdio server)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Intended for crates.io later; keep unpublished until the public SDK surface stabilizes.
publish = false

[features]
default = []
# SeaORM proxy helpers + shared database guest session / migration helpers.
db = [
    "dep:sea-orm",
    "dep:base64",
    "dep:futures",
    "dep:uuid",
]
# Native HTTPS through the workerd socket proxy (`connect()` + rustls).
# Storefront / D1 / integration guests should enable this. Platform sqlite/local
# leave it off.
http = [
    "dep:bytes",
    "dep:cookie",
    "dep:cookie_store",
    "dep:futures",
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:reqwest",
    "dep:rustls",
    "dep:serde_urlencoded",
    "dep:tokio-rustls",
    "dep:tower-service",
    "dep:url",
    "dep:webpki-roots",
]

[dependencies]
async-trait.workspace = true
bookclerk-plugin-abi.workspace = true
bookclerk-plugin-manifest.workspace = true
chrono = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "io-std", "macros", "rt", "sync", "time", "net"] }
toml.workspace = true
tracing.workspace = true
base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
cookie = { version = "0.18", optional = true }
cookie_store = { version = "0.22", default-features = false, optional = true }
futures = { workspace = true, optional = true }
http = { version = "1", optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", default-features = false, features = ["http1", "client"], optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["client", "client-legacy", "http1", "tokio"], optional = true }
reqwest = { workspace = true, optional = true, features = ["cookies", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"], optional = true }
sea-orm = { workspace = true, default-features = false, features = ["proxy"], optional = true }
serde_urlencoded = { version = "0.7", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"], optional = true }
tower-service = { version = "0.3", optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
webpki-roots = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
