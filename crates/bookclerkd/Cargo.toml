[package]
name = "bookclerkd"
description = "Bookclerk daemon: scheduled scan, auto-acquire, HTTP control plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "bookclerkd"
path = "src/main.rs"

[features]
# External guests only by default — see `bundled-plugins` on bookclerk-cli.
default = []
bundled-plugins = [
    "bookclerk-plugin-source-audible",
    "bookclerk-plugin-source-libro",
    "bookclerk-plugin-source-chirp",
    "bookclerk-plugin-source-graphicaudio",
    "bookclerk-plugin-integration-audiobookshelf",
]
bookclerk-plugin-source-audible = ["bookclerk-plugin-host/bookclerk-plugin-source-audible"]
bookclerk-plugin-source-libro = ["bookclerk-plugin-host/bookclerk-plugin-source-libro"]
bookclerk-plugin-source-chirp = ["bookclerk-plugin-host/bookclerk-plugin-source-chirp"]
bookclerk-plugin-source-graphicaudio = [
    "bookclerk-plugin-host/bookclerk-plugin-source-graphicaudio",
]
bookclerk-plugin-integration-audiobookshelf = [
    "bookclerk-plugin-host/bookclerk-plugin-integration-audiobookshelf",
]

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
bookclerk-config.workspace = true
bookclerk-enrich.workspace = true
bookclerk-acquire.workspace = true
bookclerk-library.workspace = true
bookclerk-media.workspace = true
bookclerk-search.workspace = true
bookclerk-source.workspace = true
bookclerk-storage.workspace = true
bookclerk-integrations.workspace = true
bookclerk-discover.workspace = true
bookclerk-plugin-host.workspace = true
bookclerk-tray.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
uuid.workspace = true
secrecy.workspace = true
base64.workspace = true
sha2.workspace = true
rand.workspace = true
reqwest.workspace = true
url.workspace = true
webauthn-rs.workspace = true
totp-rs.workspace = true
qrcode.workspace = true
jsonwebtoken.workspace = true
openidconnect.workspace = true
svg-hush.workspace = true

[dev-dependencies]
bookclerk-plugin-database-sqlite.workspace = true
http-body-util = "0.1"
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
wiremock.workspace = true

[lints]
workspace = true
