[package]
name = "bookclerkd"
description = "Bookclerk daemon: scheduled scan, auto-acquire, HTTP control plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "bookclerkd"
path = "src/main.rs"

[features]
# External guests only. Production hosts never link storefront crates.
default = []

[dependencies]
anyhow.workspace = true
# `ws`: the host-node socket at /api/node/v1/connect.
axum = { workspace = true, features = ["ws"] }
# The host side of the node API (this daemon as a host node).
bookclerk-node-client.workspace = true
bookclerk-node-proto.workspace = true
chrono.workspace = true
clap.workspace = true
bookclerk-config.workspace = true
bookclerk-enrich.workspace = true
bookclerk-acquire.workspace = true
bookclerk-library.workspace = true
bookclerk-media.workspace = true
bookclerk-search.workspace = true
bookclerk-source.workspace = true
bookclerk-storage.workspace = true
bookclerk-integrations.workspace = true
bookclerk-discover.workspace = true
bookclerk-plugin-host.workspace = true
bookclerk-plugin-abi.workspace = true
bookclerk-plugin-catalog.workspace = true
bookclerk-tray.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
uuid.workspace = true
secrecy.workspace = true
base64.workspace = true
sha2.workspace = true
rand.workspace = true
zeroize.workspace = true
reqwest.workspace = true
url.workspace = true
webauthn-rs.workspace = true
totp-rs.workspace = true
qrcode.workspace = true
jsonwebtoken.workspace = true
openidconnect.workspace = true
svg-hush.workspace = true
# Node API TLS listener (`[daemon.node_api] mode = "acme" | "self_signed"`):
# TLS-ALPN-01 certificates from Let's Encrypt, served with rustls on aws-lc
# (the provider the rest of the tree already uses).
rustls-acme = { version = "0.15", default-features = false, features = [
  "aws-lc-rs",
  "tls12",
  "webpki-roots",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "aws_lc_rs",
  "tls12",
] }
webpki-roots = "1"
# Self-signed node API certificate; already in the tree via rustls-acme.
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs"] }
futures.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
async-trait.workspace = true
bytes.workspace = true
bookclerk-library = { workspace = true, features = ["test-support"] }
bookclerk-plugin-database-sqlite = { workspace = true, features = ["host-helpers"] }
http-body-util = "0.1"
# Raw SQL in tests (a briefly missing table stands in for a database fault).
sea-orm.workspace = true
tempfile.workspace = true
# Same version axum's `ws` feature uses: a host-side client for socket tests.
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
# Capture log output (tracing events and bridged `log` records, as the
# daemon's subscriber does) in the node socket's no-secrets-in-logs test.
tracing-log = "0.2"
tracing-subscriber.workspace = true
wiremock.workspace = true

[lints]
workspace = true
