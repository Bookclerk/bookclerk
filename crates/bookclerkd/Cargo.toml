[package]
name = "bookclerkd"
description = "Bookclerk daemon: scheduled scan, auto-acquire, HTTP control plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "bookclerkd"
path = "src/main.rs"

[features]
# Which first-party plugins are linked in-process, named after their packages and
# forwarded to the host crate that links them. `--no-default-features` builds an
# external-guest-only daemon; add back only the stores you want to ship. This is
# how a build omits the Audible plugin, and with it every cipher and content-key
# path — see docs/plugins.md#shipping-without-a-store.
default = [
    "bookclerk-plugin-source-audible",
    "bookclerk-plugin-source-libro",
    "bookclerk-plugin-source-chirp",
    "bookclerk-plugin-source-graphicaudio",
    "bookclerk-plugin-integration-audiobookshelf",
]
bookclerk-plugin-source-audible = ["bookclerk-plugin/bookclerk-plugin-source-audible"]
bookclerk-plugin-source-libro = ["bookclerk-plugin/bookclerk-plugin-source-libro"]
bookclerk-plugin-source-chirp = ["bookclerk-plugin/bookclerk-plugin-source-chirp"]
bookclerk-plugin-source-graphicaudio = [
    "bookclerk-plugin/bookclerk-plugin-source-graphicaudio",
]
bookclerk-plugin-integration-audiobookshelf = [
    "bookclerk-plugin/bookclerk-plugin-integration-audiobookshelf",
]

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
bookclerk-config.workspace = true
bookclerk-enrich.workspace = true
bookclerk-acquire.workspace = true
bookclerk-library.workspace = true
bookclerk-media.workspace = true
bookclerk-search.workspace = true
bookclerk-source.workspace = true
bookclerk-storage.workspace = true
bookclerk-integrations.workspace = true
bookclerk-discover.workspace = true
bookclerk-plugin.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
uuid.workspace = true
secrecy.workspace = true

[lints]
workspace = true
