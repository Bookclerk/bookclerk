[package]
name = "bookclerk-enrich"
description = "Source-agnostic Audible metadata enrichment (catalog search, metadata providers, confidence scoring)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# `match_score` ports audiobookshelf (GPL-3.0) and keeps that license; see
# docs/contributing/licensing.md.
license = "AGPL-3.0-or-later AND GPL-3.0-only"
repository.workspace = true
authors.workspace = true

[dependencies]
bookclerk-audible-catalog.workspace = true
chrono.workspace = true
bookclerk-library.workspace = true
bookclerk-plugin-sdk = { workspace = true, features = ["http"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
bookclerk-resolve.workspace = true
async-trait.workspace = true

[dev-dependencies]
bookclerk-plugin-database-sqlite = { workspace = true, features = ["host-helpers"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
bookclerk-library.workspace = true
serde_json.workspace = true

[lints]
workspace = true
