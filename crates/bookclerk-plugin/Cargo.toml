[package]
name = "bookclerk-plugin"
description = "Dynamic plugin discovery and JSON-RPC host/guest protocol for Bookclerk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = [
    "bookclerk-plugin-source-audible",
    "bookclerk-plugin-source-libro",
    "bookclerk-plugin-source-chirp",
    "bookclerk-plugin-source-graphicaudio",
    "bookclerk-plugin-integration-audiobookshelf",
]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bookclerk-config.workspace = true
bookclerk-integrations.workspace = true
bookclerk-library.workspace = true
bookclerk-plugin-sdk.workspace = true
bookclerk-source.workspace = true
bookclerk-plugin-source-audible = { workspace = true, optional = true }
bookclerk-plugin-source-libro = { workspace = true, optional = true }
bookclerk-plugin-source-chirp = { workspace = true, optional = true }
bookclerk-plugin-source-graphicaudio = { workspace = true, optional = true }
bookclerk-plugin-integration-audiobookshelf = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
ureq.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util"] }

[lints]
workspace = true
