[package]
name = "bookclerk-db-guest"
description = "First-party database guest session workers (SeaORM proxy, host IR envelopes)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
base64.workspace = true
bookclerk-db-exec.workspace = true
bookclerk-plugin-abi = { workspace = true, features = ["host"] }
bookclerk-plugin-sdk = { workspace = true, features = ["db"] }
futures.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
bookclerk-library.workspace = true
bookclerk-plugin-database-sqlite = { workspace = true, features = ["host-helpers"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
