[package]
name = "bookclerk-library"
description = "Library database schema, migrations, and book records"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Test-only helpers shared with sibling crates' test suites: the typed
# conformance vector runners, the in-process SQLite atomic backend and the
# capability-profile store (`test_support`). Never enabled by product
# binaries.
test-support = ["bookclerk-db-exec/test-support"]

[dependencies]
anyhow.workspace = true
argon2.workspace = true
async-trait.workspace = true
chacha20poly1305.workspace = true
chrono.workspace = true
email_address.workspace = true
bookclerk-config.workspace = true
bookclerk-naming.workspace = true
bookclerk-sandbox.workspace = true
bookclerk-db-exec.workspace = true
bookclerk-node-proto.workspace = true
bookclerk-plugin-abi = { workspace = true, features = ["host"] }
bookclerk-resolve.workspace = true
bookclerk-storefront.workspace = true
rand.workspace = true
zeroize.workspace = true
base64.workspace = true
hex.workspace = true
sha2.workspace = true
hmac.workspace = true
tar.workspace = true
flate2.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
utoipa.workspace = true

[dev-dependencies]
bookclerk-db-exec = { workspace = true, features = ["test-support"] }
bookclerk-plugin-database-sqlite = { workspace = true, features = ["host-helpers"] }
rusqlite.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
