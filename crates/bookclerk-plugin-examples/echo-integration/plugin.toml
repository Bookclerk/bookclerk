api_version = 1
id = "echo"
name = "Echo Integration"
kind = "integration"
command = "./bookclerk-plugin-echo-integration"

# Echoes what it is handed and talks to nothing, so it gets no sockets at all.
# Worth declaring: a plugin that does not need the network should say so.
[sandbox]
network = "none"

[cli]
[[cli.commands]]
name = "ping"
about = "Probe echo plugin"
[[cli.commands.args]]
name = "message"
long = "message"
kind = "string"
default = "hi"
