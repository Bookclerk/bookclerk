[package]
name = "bookclerk-plugin-echo-integration"
description = "Example external Bookclerk integration plugin (JSON-RPC over stdio)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Keep unpublished until intentionally released as a template crate.
publish = false
keywords = ["bookclerk", "bookclerk-plugin", "bookclerk-integration", "audiobook"]
categories = ["multimedia", "command-line-utilities"]

# Registry taxonomy — see docs/plugin-registry.md
[package.metadata.bookclerk]
api_version = 1
kind = "integration"
id = "echo"
display_name = "Echo Integration"
# artifact_base_url = "https://github.com/fritz-fritz/bookclerk/releases/download/{tag}"

[[bin]]
name = "bookclerk-plugin-echo-integration"
path = "src/main.rs"

[dependencies]
bookclerk-plugin-sdk.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }

[lints]
workspace = true
