api_version = 2
id = "echo_tools"
name = "Echo Tools"
kind = "integration"
version = "0.1.0"
runtime = "native"
command = "./echo-tools"

[capabilities.network]
mode = "deny"

[capabilities.bindings]
config = true

[capabilities.methods]
list = [
    "describe",
    "health",
    "cli",
]

[[cli.commands]]
name = "ping"
about = "Probe"

[[cli.commands.args]]
name = "message"
long = "message"
kind = "string"
required = false
default = "hi"
positional = false
