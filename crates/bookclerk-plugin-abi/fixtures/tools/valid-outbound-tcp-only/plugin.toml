api_version = 3
id = "tcp_only"
version = "0.1.0"
runtime = "workerd"
entrypoints = ["cli"]

[workerd]
compatibility_date = "2026-08-01"
main_module = "index.js"
modules_dir = "modules"
entrypoint = "default"

[capabilities.network]
mode = "outbound"
tcp = [{ host = "connect.example.com", ports = [443] }]

