api_version = 3
id = "covers"
name = "Cover images"
version = "0.1.0"
runtime = "workerd"
entrypoints = ["covers"]

[workerd]
compatibility_date = "2026-08-01"
main_module = "index.js"
modules_dir = "modules"
entrypoint = "default"

[workerd.limits]
cpu_ms = 10000
subrequests = 40

[[modules]]
name = "index.js"
path = "index.js"
type = "js"

[[modules]]
name = "fetcher.js"
path = "fetcher.js"
type = "js"

[[modules]]
name = "version.js"
path = "version.js"
type = "js"

[vars]

[capabilities.network]
mode = "outbound"
domains = ["*"]
