api_version = 3
id = "echo_workerd_ts"
name = "Echo Integration (workerd TypeScript)"
version = "1.0.0"
runtime = "workerd"
entrypoints = ["cli"]

[workerd]
compatibility_date = "2026-08-01"
main_module = "index.js"
modules_dir = "modules"
entrypoint = "default"

[workerd.limits]
cpu_ms = 30000
subrequests = 50

[[modules]]
name = "index.js"
path = "index.js"
type = "js"

[[modules]]
name = "notes.js"
path = "notes.js"
type = "js"

[[events.consumers]]
type = "book_acquired"
schema_versions = [1]
supports_suspend = true
resource_class = "network"

[[databases]]
binding = "DB"

[vars]

[[queues.producers]]
queue = "echo.out"
binding = "ECHO_OUT"

[[queues.consumers]]
queue = "echo"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 2
retry_delay = 0

[ai]
calls = ["textEmbeddings"]

[capabilities.network]
mode = "deny"
