api_version = 3
id = "d1"
name = "Cloudflare D1"
version = "0.1.0"
logo = "https://www.google.com/s2/favicons?domain=cloudflare.com&sz=128"
runtime = "native"
command = "./bookclerk-plugin-database-d1"
entrypoints = [
    "databaseAdapter",
    "provisioning",
]

[vars]

[[settings]]
key = "account_id"
label = "Account ID"
type = "string"
description = "The Cloudflare account that holds the database (32 hex digits); found from the token when it can see only one."

[[settings]]
key = "database_name"
label = "Database name"
type = "string"
default = "bookclerk"
description = "The D1 database the library lives in; created when it doesn't exist."

[[settings]]
key = "jurisdiction"
label = "Jurisdiction"
type = "enum"
default = "default"
description = "Where a new database keeps its data."

[[settings.values]]
id = "default"
label = "Default"

[[settings.values]]
id = "eu"
label = "European Union"

[[settings.values]]
id = "fedramp"
label = "FedRAMP"

[[settings]]
key = "database_id"
label = "Database ID"
type = "string"

[[settings]]
key = "rotate_token"
label = "Replace the API token"
type = "bool"
default = false
description = "Mint a new token and delete the one an earlier setup created. Shared branches hold a copy of the earlier token, so each needs to join again."

[[settings]]
key = "api_token_id"
label = "API token ID"
type = "string"
description = "The id of the token the setup minted, so a later run can delete it."

[[settings]]
key = "api_token"
label = "API token"
type = "secret"
description = "A Cloudflare API token limited to D1."

[secrets]

[provisioning]
provider = "cloudflare"
grants = ["api_token"]
token_url = "https://dash.cloudflare.com/?to=/:account/api-tokens"
token_permissions = [
    "Account > D1 > Edit",
    "Account > Account API Tokens > Edit",
]
inputs = [
    "account_id",
    "database_name",
    "jurisdiction",
    "rotate_token",
]
outputs = [
    "account_id",
    "database_id",
    "database_name",
    "jurisdiction",
    "api_token_id",
    "api_token",
]
deprovision = false

[capabilities.network]
mode = "outbound"

[[capabilities.network.tcp]]
host = "api.cloudflare.com"
ports = [443]
