api_version = 3
id = "echo_native_rust"
name = "Echo Integration (native Rust)"
version = "0.1.0"
runtime = "native"
command = "./bookclerk-plugin-echo-native-rust"
entrypoints = ["cli"]

[[events.consumers]]
type = "book_acquired"
schema_versions = [1]
supports_suspend = false
resource_class = "network"

[[databases]]
binding = "DB"

[vars]

[[queues.producers]]
queue = "echo.out"
binding = "ECHO_OUT"

[[queues.consumers]]
queue = "echo"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 2
retry_delay = 0

[capabilities.network]
mode = "deny"

[[cli.commands]]
name = "ping"
about = "Probe echo plugin"

[[cli.commands.args]]
name = "message"
long = "message"
kind = "string"
required = false
default = "hi"
positional = false

[[cli.commands]]
name = "notes-add"
about = "Store a note COUNT times in the plugin's own database"

[[cli.commands.args]]
name = "body"
long = "body"
kind = "string"
required = true
positional = false

[[cli.commands.args]]
name = "count"
long = "count"
kind = "int"
required = false
default = "1"
positional = false

[[cli.commands]]
name = "notes-list"
about = "List the oldest LIMIT stored notes"

[[cli.commands.args]]
name = "limit"
long = "limit"
kind = "int"
required = false
default = "100"
positional = false
