api_version = 3
id = "libro"
name = "Libro.fm"
version = "0.1.0"
logo = "https://www.google.com/s2/favicons?domain=libro.fm&sz=128"
runtime = "native"
command = "./bookclerk-plugin-source-libro"
entrypoints = ["storefront"]
credentials = "shareable"

[[databases]]
binding = "SCAN_STATE"

[vars]

[[settings]]
key = "container"
label = "Container"
type = "enum"
default = "m4b"

[[settings.values]]
id = "m4b"
label = "M4B"

[[settings.values]]
id = "zip"
label = "ZIP (MP3 parts)"

[[settings]]
key = "base_url"
label = "Base URL"
type = "string"
description = "Override the Libro.fm API origin (testing only)."

[secrets]

[work_fs]

[media]
works = ["book"]
lists = ["audio"]
fetches = ["audio"]

[acquire]
downloads_per_day = 100
min_gap_seconds = 10
cooldown_seconds = 3600

[capabilities.network]
mode = "outbound"

[[capabilities.network.tcp]]
host = "*.libro.fm"
ports = [443]

[capabilities.network.own_user_agent]
hosts = ["*.libro.fm"]
reason = "Libro.fm's sign-in, library and download API answers the HTTP client of the Libro.fm Android app."
