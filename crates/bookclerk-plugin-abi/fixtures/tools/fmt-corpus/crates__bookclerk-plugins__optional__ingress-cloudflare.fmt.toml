api_version = 3
id = "cloudflare_relay"
name = "Cloudflare relay"
version = "0.1.0"
runtime = "workerd"
entrypoints = [
    "ingress",
    "provisioning",
]

[workerd]
compatibility_date = "2026-08-01"
main_module = "index.js"
modules_dir = "modules"
entrypoint = "default"

[workerd.limits]
cpu_ms = 30000
subrequests = 100

[[modules]]
name = "index.js"
path = "index.js"
type = "js"

[[modules]]
name = "api.js"
path = "api.js"
type = "js"

[[modules]]
name = "cloudflare.js"
path = "cloudflare.js"
type = "js"

[[modules]]
name = "lifecycle.js"
path = "lifecycle.js"
type = "js"

[[modules]]
name = "provision.js"
path = "provision.js"
type = "js"

[[modules]]
name = "protocol.js"
path = "protocol.js"
type = "js"

[[modules]]
name = "relay-core.js"
path = "relay-core.js"
type = "js"

[[modules]]
name = "relay-source.js"
path = "relay-source.js"
type = "js"

[[modules]]
name = "serve.js"
path = "serve.js"
type = "js"

[[modules]]
name = "tokens.js"
path = "tokens.js"
type = "js"

[[modules]]
name = "version.js"
path = "version.js"
type = "js"

[vars]

[[settings]]
key = "account_id"
label = "Cloudflare account id"
type = "string"
required = true
description = "The 32-character id on the account's Workers & Pages overview."

[[settings]]
key = "worker_name"
label = "Relay Worker name"
type = "string"
default = "bookclerk-relay"
description = "Name of the Worker the plugin deploys; it becomes the first label of the library's address."

[[settings]]
key = "api_token"
label = "Cloudflare API token"
type = "secret"
description = "An API token with the Workers Scripts: Edit permission on this account. The guided setup fills it in."

[[settings]]
key = "api_token_id"
label = "Setup token id"
type = "string"
description = "Filled in by the guided setup: the id of the API token it created, so a later setup or removal deletes it. Leave it empty when you paste your own token."

[secrets]

[sockets]

[ingress]
kind = "relay"

[provisioning]
provider = "cloudflare"
grants = ["api_token"]
token_url = "https://dash.cloudflare.com/profile/api-tokens"
token_permissions = [
    "Account > Workers Scripts > Edit",
    "Account > Account API Tokens > Edit",
]
inputs = [
    "account_id",
    "worker_name",
]
outputs = [
    "account_id",
    "api_token",
    "api_token_id",
]
deprovision = true

[capabilities.network]
mode = "outbound"
domains = [
    "api.cloudflare.com",
    "*.workers.dev",
]
