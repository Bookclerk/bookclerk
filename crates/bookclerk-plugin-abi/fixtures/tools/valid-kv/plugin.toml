api_version = 3
id = "valid_kv"
version = "0.1.0"
runtime = "workerd"
entrypoints = ["cli"]

[workerd]
compatibility_date = "2026-08-01"
main_module = "index.js"
modules_dir = "modules"
entrypoint = "default"

[[kv_namespaces]]
binding = "KV"

[[kv_namespaces]]
binding = "CURSORS"
namespace = "sync.cursors"
max_value_bytes = 4096
max_keys = 500

[capabilities.network]
mode = "deny"
