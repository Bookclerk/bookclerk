api_version = 3
id = "path_wins_over_py_name"
version = "0.1.0"
runtime = "workerd"
entrypoints = ["cli"]

[workerd]
compatibility_date = "2026-08-01"
main_module = "index.js"
modules_dir = "modules"
entrypoint = "default"

[[modules]]
name = "helper.py"
path = "index.js"
type = "js"

[capabilities.network]
mode = "deny"
