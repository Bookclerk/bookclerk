api_version = 3
id = "js_main_python_helper"
version = "0.1.0"
runtime = "workerd"
entrypoints = ["cli"]

[workerd]
compatibility_date = "2026-08-01"
compatibility_flags = [
    "python_workers",
    "disable_python_external_sdk",
]
main_module = "index.js"
modules_dir = "modules"
entrypoint = "default"

[[modules]]
name = "index.js"
path = "index.js"
type = "js"

[[modules]]
name = "helper.py"
path = "helper.py"
type = "python"

[capabilities.network]
mode = "deny"
