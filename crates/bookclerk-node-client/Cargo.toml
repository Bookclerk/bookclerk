[package]
name = "bookclerk-node-client"
description = "Host-node client: enrollment, the pinned owner socket, heartbeats, claimed work, token write-back, wakes and resume"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
base64.workspace = true
bookclerk-library.workspace = true
bookclerk-node-proto.workspace = true
futures.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
# The owner socket. `handshake` only: this crate dials TCP and TLS itself so
# it can enforce the transport policy and the SPKI pin.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
# TLS to the owner on aws-lc (the provider the rest of the tree uses).
tokio-rustls = { version = "0.26", default-features = false, features = [
  "aws_lc_rs",
  "tls12",
] }
tracing.workspace = true
url.workspace = true
webpki-roots = "1"
zeroize.workspace = true

[lints]
workspace = true
