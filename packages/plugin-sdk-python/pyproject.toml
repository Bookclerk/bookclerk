[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookclerk-plugin-sdk"
version = "0.1.0"
description = "Bookclerk plugin guest SDK — ABI types, native stdio, workerd template, author tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Bookclerk contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=6.0", "ruff>=0.11"]
# Google-style API reference via pdoc (`./scripts/generate-api-docs.sh` installs
# this extra from uv.lock into a throwaway venv). After changing any dependency
# here, run `uv lock` and commit uv.lock.
docs = ["pdoc>=15"]

[project.scripts]
bookclerk-plugin = "bookclerk_plugin_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bookclerk_plugin_sdk = [
    "py.typed",
    "workerd_template/*",
    "workerd-pin.json",
    "bridge/*",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100
# Generated by scripts/gen-plugin-abi.py from plugin.capnp: regenerate, never
# reformat or hand-fix.
extend-exclude = [
  "src/bookclerk_plugin_sdk/abi.py",
  "src/bookclerk_plugin_sdk/_abi.py",
  "src/bookclerk_plugin_sdk/_wire.py",
]

[tool.ruff.lint]
# pycodestyle, Pyflakes, import order, bugbear, pyupgrade and simplify, plus
# Google-style pydocstyle. `ruff format` owns layout.
select = ["D", "E", "F", "W", "I", "B", "UP", "SIM"]
# Keep Google-style pydocstyle; soften a few rules that fight generated/ABI
# surfaces and one-line module docstrings already present.
ignore = [
  "D100",  # missing module docstring — package modules use package README / rustdoc
  "D104",  # missing package docstring
  "D105",  # magic methods
  "D107",  # __init__ docstring (prefer class docstring)
  "D203",  # conflicts with D211 (Google)
  "D213",  # conflicts with D212 (Google multi-line summary)
  "E501",  # line length: `ruff format` wraps code; long strings and URLs stay whole
  "SIM105",  # try/except/pass reads as plainly as contextlib.suppress
  "SIM108",  # a ternary is not clearer than an if/else for long branches
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"**/generated.py" = ["D"]
# The workerd config templates match the TypeScript SDK's byte for byte,
# trailing spaces included.
"src/bookclerk_plugin_sdk/sparse_workerd/config.py" = ["W293"]
