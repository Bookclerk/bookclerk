[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookclerk-plugin-sdk"
version = "0.1.0"
description = "Bookclerk plugin guest SDK — ABI types, native stdio, workerd template, author tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bookclerk contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Google-style API reference via pdoc (`./scripts/generate-api-docs.sh` installs
# this extra into a throwaway venv; local use: pip install -e ".[docs]").
docs = ["pdoc>=15"]

[project.scripts]
bookclerk-plugin = "bookclerk_plugin_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bookclerk_plugin_sdk = [
    "py.typed",
    "workerd_template/*",
    "workerd-pin.json",
    "bridge/*",
]
