[workspace]
resolver = "2"
members = [
    "crates/bookclerk-config",
    "crates/bookclerk-audible",
    "crates/bookclerk-enrich",
    "crates/bookclerk-decrypt",
    "crates/bookclerk-storage",
    "crates/bookclerk-library",
    "crates/bookclerk-source",
    "crates/bookclerk-libro",
    "crates/bookclerk-graphicaudio",
    "crates/bookclerk-chirp",
    "crates/bookclerk-acquire",
    "crates/bookclerk-naming",
    "crates/bookclerk-migrate",
    "crates/bookclerk-search",
    "crates/bookclerk-integrations",
    "crates/bookclerk-plugin",
    "crates/bookclerk-plugin-examples/echo-integration",
    "crates/bookclerk-cli",
    "crates/bookclerkd",
    "crates/bookclerk-tray",
]
default-members = [
    "crates/bookclerk-cli",
    "crates/bookclerkd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "GPL-3.0-or-later"
repository = "https://github.com/fritz-fritz/bookclerk"
authors = ["fritz-fritz <contact@bookclerk.app>"]
description = "Multi-storefront audiobook library manager with pluggable integrations"

[workspace.dependencies]
# Internal crates
bookclerk-config = { path = "crates/bookclerk-config" }
bookclerk-audible = { path = "crates/bookclerk-audible" }
bookclerk-enrich = { path = "crates/bookclerk-enrich" }
bookclerk-decrypt = { path = "crates/bookclerk-decrypt" }
bookclerk-storage = { path = "crates/bookclerk-storage" }
bookclerk-library = { path = "crates/bookclerk-library" }
bookclerk-source = { path = "crates/bookclerk-source" }
bookclerk-libro = { path = "crates/bookclerk-libro" }
bookclerk-graphicaudio = { path = "crates/bookclerk-graphicaudio" }
bookclerk-chirp = { path = "crates/bookclerk-chirp" }
bookclerk-acquire = { path = "crates/bookclerk-acquire" }
bookclerk-naming = { path = "crates/bookclerk-naming" }
bookclerk-migrate = { path = "crates/bookclerk-migrate" }
bookclerk-search = { path = "crates/bookclerk-search" }
bookclerk-integrations = { path = "crates/bookclerk-integrations" }
bookclerk-plugin = { path = "crates/bookclerk-plugin" }

# Async / runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "process", "signal"] }
async-trait = "0.1"
futures = "0.3"

# Error / logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Sync HTTP for crash/error diagnostics upload (usable from panic hooks).
ureq = { version = "2", features = ["json"] }

# Serde / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "6"

# CLI / HTTP
clap = { version = "4", features = ["derive", "env", "string"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace", "fs", "normalize-path"] }
qrcode = { version = "0.14", default-features = false }

# DB / storage — rusqlite (bundled) aligns with audible-rs; one libsqlite3-sys in the tree.
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
# aws-sdk-s3's default `rustls` feature enables smithy's *legacy* rustls 0.21
# path (vulnerable rustls-webpki 0.101). Prefer `default-https-client`, which
# uses rustls 0.23 + aws-lc.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
] }
aws-config = "1"
aws-credential-types = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
tantivy = "0.26"
csv = "1"
filetime = "0.2"
rust_xlsxwriter = "0.96"
tar = "0.4"
flate2 = "1"

# audible-rs (pinned git rev; thin wrapper isolates API churn)
audible-rs = { git = "https://github.com/mkb79/audible-rs", rev = "5a28f507072022ae7fd7f95a62e3bdc5e515d678" }
secrecy = { version = "0.10", features = ["serde"] }

# Test doubles
wiremock = "0.6"

# HTML / media helpers
scraper = "0.27"
html-escape = "0.2"
infer = "0.19"
mime_guess = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace.lints.rust]
# `deny` (not `forbid`) so platform FFI sinks can `#[allow(unsafe_code)]`
# locally — e.g. Windows Event Log in bookclerk-config.
unsafe_code = "deny"

[workspace.lints.clippy]
# Keep CI green on defaults; tighten pedantic lints as crates mature.
pedantic = { level = "allow", priority = -1 }
