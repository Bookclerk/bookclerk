[workspace]
resolver = "2"
members = [
    "crates/bookclerk-acquire",
    "crates/bookclerk-cli",
    "crates/bookclerk-config",
    "crates/bookclerk-db-exec",
    "crates/bookclerk-db-guest",
    "crates/bookclerk-dev",
    "crates/bookclerk-discover",
    "crates/bookclerk-enrich",
    "crates/bookclerk-integrations",
    "crates/bookclerk-jail",
    "crates/bookclerk-library",
    "crates/bookclerk-media",
    "crates/bookclerk-media-worker",
    "crates/bookclerk-migrate",
    "crates/bookclerk-mp4",
    "crates/bookclerk-naming",
    "crates/bookclerk-plugin-abi",
    "crates/bookclerk-plugin-catalog",
    "crates/bookclerk-plugin-e2e",
    "crates/bookclerk-plugin-host",
    "crates/bookclerk-plugin-manifest",
    "crates/bookclerk-plugin-sdk",
    "crates/bookclerk-plugin-tools",
    "crates/bookclerk-sandbox",
    "crates/bookclerk-search",
    "crates/bookclerk-source",
    "crates/bookclerk-storage",
    "crates/bookclerk-tray",
    "crates/bookclerk-workerd",
    "crates/bookclerkd",
    # Auto-pickup: new guests under these trees need only Cargo.toml + plugin.toml.
    "crates/bookclerk-plugins/platform/*",
    "crates/bookclerk-plugins/optional/*",
    "examples/plugins-echo-native-rust",
    "examples/plugins-echo-workerd-rust",
    # Schema tooling: derives `schema/plugin.layout.json` from the capnp compiler.
    "tools/abi-layout",
]
default-members = [
    "crates/bookclerk-cli",
    "crates/bookclerkd",
    "crates/bookclerk-media-worker",
    "crates/bookclerk-jail",
    "crates/bookclerk-workerd",
]
# Vendored fork is a path dep only — do not fmt/clippy/test it as a workspace member
# (upstream tests need fixtures we do not ship). Non-Cargo examples are discovered
# by bookclerk-dev staging, not as workspace members.
exclude = ["third_party/audible-rs", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# SeaORM 2 / sqlx-sqlite require 1.94+.
rust-version = "1.94"
license = "GPL-3.0-or-later"
repository = "https://github.com/fritz-fritz/bookclerk"
authors = ["Roland Fritz <fritz+cursor@fritztech.net>"]
description = "Multi-storefront audiobook library manager with pluggable integrations"

[workspace.dependencies]
# Internal crates
bookclerk-config = { path = "crates/bookclerk-config" }
bookclerk-db-exec = { path = "crates/bookclerk-db-exec" }
bookclerk-db-guest = { path = "crates/bookclerk-db-guest" }
# First-party plugins under bookclerk-plugins/{platform,optional}/.
bookclerk-plugin-source-audible = { path = "crates/bookclerk-plugins/optional/source-audible" }
bookclerk-plugin-source-libro = { path = "crates/bookclerk-plugins/optional/source-libro" }
bookclerk-plugin-source-chirp = { path = "crates/bookclerk-plugins/optional/source-chirp" }
bookclerk-plugin-source-graphicaudio = { path = "crates/bookclerk-plugins/optional/source-graphicaudio" }
bookclerk-plugin-integration-audiobookshelf = { path = "crates/bookclerk-plugins/optional/integration-audiobookshelf" }
bookclerk-plugin-destination-s3 = { path = "crates/bookclerk-plugins/optional/destination-s3" }
bookclerk-plugin-destination-local = { path = "crates/bookclerk-plugins/platform/destination-local" }
bookclerk-plugin-database-sqlite = { path = "crates/bookclerk-plugins/platform/database-sqlite" }
bookclerk-plugin-database-d1 = { path = "crates/bookclerk-plugins/optional/database-d1" }
bookclerk-plugin-database-postgres = { path = "crates/bookclerk-plugins/optional/database-postgres" }
bookclerk-enrich = { path = "crates/bookclerk-enrich" }
bookclerk-sandbox = { path = "crates/bookclerk-sandbox" }
bookclerk-jail = { path = "crates/bookclerk-jail" }
bookclerk-mp4 = { path = "crates/bookclerk-mp4" }
bookclerk-media = { path = "crates/bookclerk-media" }
bookclerk-media-worker = { path = "crates/bookclerk-media-worker" }
bookclerk-storage = { path = "crates/bookclerk-storage" }
bookclerk-library = { path = "crates/bookclerk-library" }
bookclerk-source = { path = "crates/bookclerk-source" }
bookclerk-acquire = { path = "crates/bookclerk-acquire" }
bookclerk-naming = { path = "crates/bookclerk-naming" }
bookclerk-migrate = { path = "crates/bookclerk-migrate" }
bookclerk-search = { path = "crates/bookclerk-search" }
bookclerk-integrations = { path = "crates/bookclerk-integrations" }
bookclerk-discover = { path = "crates/bookclerk-discover" }
bookclerk-tray = { path = "crates/bookclerk-tray" }
bookclerk-plugin-abi = { path = "crates/bookclerk-plugin-abi" }
bookclerk-plugin-manifest = { path = "crates/bookclerk-plugin-manifest" }
bookclerk-plugin-sdk = { path = "crates/bookclerk-plugin-sdk", default-features = false }
bookclerk-plugin-catalog = { path = "crates/bookclerk-plugin-catalog" }
bookclerk-workerd = { path = "crates/bookclerk-workerd" }
# Off by default so the hosts decide which stores they link; a member cannot turn
# an inherited dependency's default features back off.
bookclerk-plugin-host = { path = "crates/bookclerk-plugin-host", default-features = false }

# Async / runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std", "sync", "time", "process", "signal", "net"] }
async-trait = "0.1"
futures = "0.3"
tokio-util = { version = "0.7", features = ["compat", "io"] }
capnp = "0.27"
capnp-rpc = "0.27"
capnpc = "0.27"

# Error / logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Sync HTTP for crash/error diagnostics upload (usable from panic hooks).
ureq = { version = "3", features = ["json"] }

# Serde / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
directories = "6"

# CLI / HTTP
clap = { version = "4", features = ["derive", "env", "string"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["trace", "fs", "normalize-path"] }

# DB / storage — rusqlite 0.37 shares libsqlite3-sys 0.35 with SeaORM's sqlx-sqlite
# (rusqlite 0.40 needs ^0.38 and cannot coexist in one binary). Vendored audible-rs
# under third_party/ matches this pin on its optional `cli` feature.
rusqlite = { version = "0.39", features = ["bundled", "column_decltype", "hooks"] }
sea-orm = { version = "2.0.0", default-features = false, features = [
    "macros",
    "with-chrono",
    "with-uuid",
    "with-json",
    "proxy",
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "stream",
] }
# Crypto for encrypted_secrets (Argon2id KDF + XChaCha20-Poly1305 cipher).
# These are already in the dependency tree via audible-rs — adding them as
# explicit workspace deps keeps versions aligned with no extra downloads.
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = "0.11"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.23"
reqwest = { version = "0.13", default-features = true, features = ["json", "form"] }
url = "2"
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
totp-rs = { version = "6", default-features = false, features = ["std", "otpauth", "gen_secret"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
jsonwebtoken = { version = "11.0", features = ["rust_crypto"] }
openidconnect = { version = "4", default-features = false }
# aws-sdk-s3's default `rustls` feature enables smithy's *legacy* rustls 0.21
# path (vulnerable rustls-webpki 0.101). Prefer `default-https-client`, which
# uses rustls 0.23 + aws-lc.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
] }
aws-config = "1"
aws-credential-types = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
email_address = "0.2"
tantivy = "0.26"
csv = "1"
filetime = "0.2"
rust_xlsxwriter = "0.99"
tar = "0.4"
flate2 = "1"
hex = "0.4"
sha2 = "0.11"
hmac = "0.13"
zip = { version = "8", default-features = false, features = ["deflate"] }
walkdir = "2"
# Cross-platform advisory file locks (`lock_exclusive`) for host-local plugin
# mutation serialization. Ownership is the OS lock, not the file's presence.
fs4 = { version = "0.13", features = ["sync"] }

# audible-rs — path-patched fork. Library-only by default (no CLI / rusqlite).
# Upstream rev and Bookclerk patches: third_party/audible-rs/BOOKCLERK_PATCH.md.
audible-rs = { path = "third_party/audible-rs", default-features = false }
secrecy = { version = "0.10", features = ["serde"] }

# Test doubles
wiremock = "0.6"
proptest = "1"

# HTML / media helpers
scraper = "0.27"
html-escape = "0.2"
infer = "0.22"
mime_guess = "2"
svg-hush = "0.9.7"

[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace.lints.rust]
# `deny` (not `forbid`) so platform FFI sinks can `#[allow(unsafe_code)]`
# locally — e.g. Windows Event Log in bookclerk-config.
unsafe_code = "deny"
# Google-style public API docs (see docs/code-documentation.md). CI promotes
# warnings to errors via RUSTFLAGS="-D warnings".
missing_docs = "warn"

[workspace.lints.clippy]
# Keep CI green on defaults; tighten pedantic lints as crates mature.
pedantic = { level = "allow", priority = -1 }
# Google-style private-item docs (binaries + libs). CI promotes warnings to
# errors via RUSTFLAGS="-D warnings". See docs/code-documentation.md.
missing_docs_in_private_items = "warn"
