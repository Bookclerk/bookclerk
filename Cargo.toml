[workspace]
resolver = "2"
members = [
    "crates/bookclerk-config",
    "crates/bookclerk-enrich",
    "crates/bookclerk-sandbox",
    "crates/bookclerk-jail",
    "crates/bookclerk-mp4",
    "crates/bookclerk-media",
    "crates/bookclerk-media-worker",
    "crates/bookclerk-storage",
    "crates/bookclerk-library",
    "crates/bookclerk-source",
    "crates/bookclerk-acquire",
    "crates/bookclerk-naming",
    "crates/bookclerk-migrate",
    "crates/bookclerk-search",
    "crates/bookclerk-integrations",
    "crates/bookclerk-discover",
    "crates/bookclerk-plugin-sdk",
    "crates/bookclerk-plugin-catalog",
    "crates/bookclerk-plugin-host",
    "crates/bookclerk-plugin-examples/echo-integration",
    "crates/bookclerk-plugins/source-audible",
    "crates/bookclerk-plugins/source-libro",
    "crates/bookclerk-plugins/source-chirp",
    "crates/bookclerk-plugins/source-graphicaudio",
    "crates/bookclerk-plugins/integration-audiobookshelf",
    "crates/bookclerk-plugins/destination-s3",
    "crates/bookclerk-plugins/destination-local",
    "crates/bookclerk-plugins/database",
    "crates/bookclerk-dev",
    "crates/bookclerk-cli",
    "crates/bookclerkd",
    "crates/bookclerk-tray",
]
default-members = [
    "crates/bookclerk-cli",
    "crates/bookclerkd",
    "crates/bookclerk-media-worker",
    "crates/bookclerk-jail",
]
# Vendored fork is a path dep only — do not fmt/clippy/test it as a workspace member
# (upstream tests need fixtures we do not ship).
exclude = ["third_party/audible-rs"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# SeaORM 2 / sqlx-sqlite require 1.94+.
rust-version = "1.94"
license = "GPL-3.0-or-later"
repository = "https://github.com/fritz-fritz/bookclerk"
authors = ["fritz-fritz <contact@bookclerk.app>"]
description = "Multi-storefront audiobook library manager with pluggable integrations"

[workspace.dependencies]
# Internal crates
bookclerk-config = { path = "crates/bookclerk-config" }
# First-party source plugins (lib + JSON-RPC bin under bookclerk-plugins/).
bookclerk-plugin-source-audible = { path = "crates/bookclerk-plugins/source-audible" }
bookclerk-plugin-source-libro = { path = "crates/bookclerk-plugins/source-libro" }
bookclerk-plugin-source-chirp = { path = "crates/bookclerk-plugins/source-chirp" }
bookclerk-plugin-source-graphicaudio = { path = "crates/bookclerk-plugins/source-graphicaudio" }
bookclerk-plugin-integration-audiobookshelf = { path = "crates/bookclerk-plugins/integration-audiobookshelf" }
bookclerk-plugin-destination-s3 = { path = "crates/bookclerk-plugins/destination-s3" }
bookclerk-plugin-destination-local = { path = "crates/bookclerk-plugins/destination-local" }
bookclerk-plugin-database = { path = "crates/bookclerk-plugins/database" }
bookclerk-enrich = { path = "crates/bookclerk-enrich" }
bookclerk-sandbox = { path = "crates/bookclerk-sandbox" }
bookclerk-jail = { path = "crates/bookclerk-jail" }
bookclerk-mp4 = { path = "crates/bookclerk-mp4" }
bookclerk-media = { path = "crates/bookclerk-media" }
bookclerk-media-worker = { path = "crates/bookclerk-media-worker" }
bookclerk-storage = { path = "crates/bookclerk-storage" }
bookclerk-library = { path = "crates/bookclerk-library" }
bookclerk-source = { path = "crates/bookclerk-source" }
bookclerk-acquire = { path = "crates/bookclerk-acquire" }
bookclerk-naming = { path = "crates/bookclerk-naming" }
bookclerk-migrate = { path = "crates/bookclerk-migrate" }
bookclerk-search = { path = "crates/bookclerk-search" }
bookclerk-integrations = { path = "crates/bookclerk-integrations" }
bookclerk-discover = { path = "crates/bookclerk-discover" }
bookclerk-tray = { path = "crates/bookclerk-tray" }
bookclerk-plugin-sdk = { path = "crates/bookclerk-plugin-sdk" }
bookclerk-plugin-catalog = { path = "crates/bookclerk-plugin-catalog" }
# Off by default so the hosts decide which stores they link; a member cannot turn
# an inherited dependency's default features back off.
bookclerk-plugin-host = { path = "crates/bookclerk-plugin-host", default-features = false }

# Async / runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std", "sync", "time", "process", "signal", "net"] }
async-trait = "0.1"
futures = "0.3"

# Error / logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Sync HTTP for crash/error diagnostics upload (usable from panic hooks).
ureq = { version = "3", features = ["json"] }

# Serde / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
directories = "6"

# CLI / HTTP
clap = { version = "4", features = ["derive", "env", "string"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace", "fs", "normalize-path"] }
qrcode = { version = "0.14", default-features = false }

# DB / storage — rusqlite 0.37 shares libsqlite3-sys 0.35 with SeaORM's sqlx-sqlite
# (rusqlite 0.40 needs ^0.38 and cannot coexist in one binary). Vendored audible-rs
# under third_party/ matches this pin — see docs/database.md.
rusqlite = { version = "0.37", features = ["bundled", "column_decltype"] }
rusqlite_migration = "2.3"
sea-orm = { version = "2.0.0", default-features = false, features = [
    "macros",
    "with-chrono",
    "with-uuid",
    "with-json",
    "proxy",
    "sqlx-postgres",
    "runtime-tokio-rustls",
] }
# Crypto for encrypted_secrets (Argon2id KDF + XChaCha20-Poly1305 cipher).
# These are already in the dependency tree via audible-rs — adding them as
# explicit workspace deps keeps versions aligned with no extra downloads.
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
reqwest = { version = "0.13", default-features = true, features = ["json"] }
# aws-sdk-s3's default `rustls` feature enables smithy's *legacy* rustls 0.21
# path (vulnerable rustls-webpki 0.101). Prefer `default-https-client`, which
# uses rustls 0.23 + aws-lc.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
] }
aws-config = "1"
aws-credential-types = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
tantivy = "0.26"
csv = "1"
filetime = "0.2"
rust_xlsxwriter = "0.96"
tar = "0.4"
flate2 = "1"
hex = "0.4"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"

# audible-rs — path-patched fork (rusqlite 0.37). Upstream rev documented in
# third_party/audible-rs/BOOKCLERK_PATCH.md.
audible-rs = { path = "third_party/audible-rs" }
secrecy = { version = "0.10", features = ["serde"] }

# Test doubles
wiremock = "0.6"

# HTML / media helpers
scraper = "0.27"
html-escape = "0.2"
infer = "0.22"
mime_guess = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace.lints.rust]
# `deny` (not `forbid`) so platform FFI sinks can `#[allow(unsafe_code)]`
# locally — e.g. Windows Event Log in bookclerk-config.
unsafe_code = "deny"

[workspace.lints.clippy]
# Keep CI green on defaults; tighten pedantic lints as crates mature.
pedantic = { level = "allow", priority = -1 }
