# cargo-nextest settings (docs/contributing/ci.md#test-results).
#
# The `ci` profile is the default one plus a JUnit report at
# target/nextest/ci/junit.xml. CI runs the instrumented `rust_test` check
# with it and uploads the report to Codecov Test Analytics.

[profile.ci.junit]
path = "junit.xml"
# Codecov shows a failed test's output in its pull request comment.
store-failure-output = true
store-success-output = false

# The `ci-os` profile runs `rust_test` on Windows and macOS (the `test-os`
# job, docs/contributing/ci.md#full-suite-on-windows-and-macos). That job
# only reports for now, so every test runs, a flaky one gets one retry, and
# a test still running after ten minutes is stopped and named instead of
# holding the job until its timeout. Ten minutes leaves room for Windows,
# about twice as slow as Linux, on the slowest integration tests.
[profile.ci-os]
fail-fast = false
retries = 1
slow-timeout = { period = "60s", terminate-after = 10 }
