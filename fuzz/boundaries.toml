artifacts = ["bookclerk"]

[targets.node_account_bundle]
crate = "bookclerk-node-proto"
boundary = "Store accounts and their secrets a library sends a joining branch for its person"
input_from = "peer"
side = "host"
artifacts = ["bookclerk"]

[targets.plan_authz]
crate = "bookclerk-library"
boundary = "Scan and acquire requests a Member sends (over HTTP or through their Host), authorized against the store accounts linked to them"
input_from = "signed-in user"
side = "host"
artifacts = ["bookclerk"]

[targets.relayed_log_line]
crate = "bookclerk-config"
boundary = "Stderr lines from jailed helpers and plugin guests that the host relays into its log"
input_from = "guest"
# The host parses each line in its own process before logging it.
side = "host"
artifacts = ["bookclerk"]

[targets.model_pack]
crate = "bookclerk-model-pack"
boundary = "Embedding model files in the embedder plugin's data directory: the model description (model.json) and the token-row packs"
input_from = "store"
side = "guest"
artifacts = ["bookclerk"]
