api_version = 3
id = "echo_native_rust"
name = "Echo Integration (native Rust)"
version = "0.1.0"
runtime = "native"
command = "./bookclerk-plugin-echo-native-rust"
entrypoints = ["cli"]

[capabilities.network]
mode = "deny"

[vars]

# Isolated plugin-owned databases (Workers-style named bindings): each name
# is its own database, separate from the library and every other plugin.
[[databases]]
binding = "DB"

[[events.consumers]]
type = "book_acquired"
schema_versions = [1]
supports_suspend = false

# Plugin-owned queues on the outbox: `queue(batch)` consumes `echo`; the
# `ECHO_OUT` binding sends to `echo.out` (absent when the host grants no outbox).
[[queues.consumers]]
queue = "echo"
max_retries = 2

[[queues.producers]]
queue = "echo.out"
binding = "ECHO_OUT"

[cli]

[[cli.commands]]
name = "ping"
about = "Probe echo plugin"

[[cli.commands.args]]
name = "message"
long = "message"
kind = "string"
default = "hi"
