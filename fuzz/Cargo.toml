[package]
name = "bookclerk-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "AGPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

# Every `path =` dependency here is a fuzzed crate: the ClusterFuzzLite PR
# workflow's path filter must list it (scripts/tests/test_ci_contract.py).
[dependencies]
libfuzzer-sys = "0.4"
httparse = "1"
serde_json = "1"
bookclerk-plugin-abi = { path = "../crates/bookclerk-plugin-abi", features = ["host"] }
bookclerk-plugin-manifest = { path = "../crates/bookclerk-plugin-manifest" }
bookclerk-db-exec = { path = "../crates/bookclerk-db-exec" }
bookclerk-mp4 = { path = "../crates/bookclerk-mp4" }
bookclerk-workerd = { path = "../crates/bookclerk-workerd" }
bookclerk-plugin-sdk = { path = "../crates/bookclerk-plugin-sdk" }
sea-orm = { version = "2.0.0", default-features = false }
# Runtime for mux_peer: the mux is driven through tokio reader and writer tasks.
tokio = { version = "1", features = ["rt", "time", "io-util"] }
# Oracle for guest_sql_authz: SQLite's own authorizer callback (`hooks`).
rusqlite = { version = "0.39", features = ["bundled", "hooks"] }

[workspace]
members = ["."]

[[bin]]
name = "sql_parse"
path = "fuzz_targets/sql_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sql_lower"
path = "fuzz_targets/sql_lower.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mp4_parse"
path = "fuzz_targets/mp4_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "granted_http"
path = "fuzz_targets/granted_http.rs"
test = false
doc = false
bench = false

[[bin]]
name = "egress_policy"
path = "fuzz_targets/egress_policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plugin_manifest"
path = "fuzz_targets/plugin_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "abi_decode"
path = "fuzz_targets/abi_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "guest_sql_authz"
path = "fuzz_targets/guest_sql_authz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mux_peer"
path = "fuzz_targets/mux_peer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "abi_roundtrip"
path = "fuzz_targets/abi_roundtrip.rs"
test = false
doc = false
bench = false
