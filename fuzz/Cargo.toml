[package]
name = "bookclerk-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "AGPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

# Every `path =` dependency here is a fuzzed crate: the ClusterFuzzLite PR
# workflow's path filter must list it (scripts/tests/test_ci_contract.py).
[dependencies]
libfuzzer-sys = "0.4"
# egress_bridge runs the workerd egress gate (egress.js) in an embedded
# JavaScript engine, against the Rust EgressPolicy.
rquickjs = "0.14"
httparse = "1"
serde_json = "1"
# Determinism checks in the libro_catalog oracle serialize the records;
# the clerk_socket_frame oracle reads a page's works with a derived struct.
serde = { version = "1", features = ["derive"] }
# The event_read oracle restates the cursor time rule.
chrono = "0.4"
bookclerk-plugin-abi = { path = "../crates/bookclerk-plugin-abi", features = ["host"] }
bookclerk-plugin-manifest = { path = "../crates/bookclerk-plugin-manifest" }
bookclerk-db-exec = { path = "../crates/bookclerk-db-exec" }
bookclerk-mp4 = { path = "../crates/bookclerk-mp4" }
bookclerk-workerd = { path = "../crates/bookclerk-workerd" }
bookclerk-plugin-sdk = { path = "../crates/bookclerk-plugin-sdk" }
bookclerk-resolve = { path = "../crates/bookclerk-resolve" }
bookclerk-node-proto = { path = "../crates/bookclerk-node-proto" }
bookclerk-cover = { path = "../crates/bookclerk-cover" }
bookclerk-tags = { path = "../crates/bookclerk-tags" }
bookclerk-model-pack = { path = "../crates/bookclerk-model-pack" }
bookclerk-plugin-catalog = { path = "../crates/bookclerk-plugin-catalog" }
bookclerk-archive = { path = "../crates/bookclerk-archive" }
# media_decode drives the media worker's demux and decode path.
# With the FFmpeg decoders, so media_decode also fuzzes WMA, AC-3/E-AC-3
# and AMR input.
bookclerk-media = { path = "../crates/bookclerk-media", features = ["libav"] }
# media_keep_codec writes each input to a scratch file for the packager.
tempfile = "3"
bookclerk-config = { path = "../crates/bookclerk-config" }
bookclerk-intake = { path = "../crates/bookclerk-intake" }
bookclerk-plugin-source-libro = { path = "../crates/bookclerk-plugins/optional/source-libro" }
bookclerk-audible-catalog = { path = "../crates/bookclerk-audible-catalog" }
bookclerk-plugin-source-graphicaudio = { path = "../crates/bookclerk-plugins/optional/source-graphicaudio" }
bookclerk-plugin-source-chirp = { path = "../crates/bookclerk-plugins/optional/source-chirp" }
bookclerk-plugin-notifier-email = { path = "../crates/bookclerk-plugins/optional/notifier-email" }
# plan_authz drives the scan and acquire planners over an in-memory library.
bookclerk-library = { path = "../crates/bookclerk-library" }
bookclerk-player-api = { path = "../crates/bookclerk-player-api" }
bookclerk-plugin-database-sqlite = { path = "../crates/bookclerk-plugins/platform/database-sqlite", features = ["host-helpers"] }
bookclerk-storefront = { path = "../crates/bookclerk-storefront" }
# s3_event and r2_event read bucket notification messages and queue
# replies, b2_reply B2 API replies and b2_event B2 webhook bodies and
# notification rules (no `s3` or `b2` feature: the
# parsers have no network client).
bookclerk-storage = { path = "../crates/bookclerk-storage" }
# window_policy drives the desktop window's custom-scheme policy.
bookclerk-window-policy = { path = "../crates/bookclerk-window-policy" }
# title_meta_fill checks title-meta queries and the store lookups they plan.
bookclerk-discover = { path = "../crates/bookclerk-discover" }
http = "1"
# The storage_reply oracle reads per-key outcomes straight from the message.
capnp = "0.28"
# Independent re-signing oracle for cover_token.
base64 = "0.23"
hmac = "0.13"
sha2 = "0.11"
url = "2"
sea-orm = { version = "2.0.0", default-features = false }
# Runtime for mux_peer: the mux is driven through tokio reader and writer tasks.
tokio = { version = "1", features = ["rt", "time", "io-util"] }
# Oracle for guest_sql_authz: SQLite's own authorizer callback (`hooks`).
rusqlite = { version = "0.43", features = ["bundled", "hooks"] }

[workspace]
members = ["."]

[[bin]]
name = "sql_parse"
path = "fuzz_targets/sql_parse.rs"
test = false
doc = false
bench = false

