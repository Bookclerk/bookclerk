[package]
name = "bookclerk-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "AGPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

# Every `path =` dependency here is a fuzzed crate: the ClusterFuzzLite PR
# workflow's path filter must list it (scripts/tests/test_ci_contract.py).
[dependencies]
libfuzzer-sys = "0.4"
httparse = "1"
serde_json = "1"
# Determinism checks in the libro_catalog oracle serialize the records.
serde = "1"
# The event_read oracle restates the cursor time rule.
chrono = "0.4"
bookclerk-plugin-abi = { path = "../crates/bookclerk-plugin-abi", features = ["host"] }
bookclerk-plugin-manifest = { path = "../crates/bookclerk-plugin-manifest" }
bookclerk-db-exec = { path = "../crates/bookclerk-db-exec" }
bookclerk-mp4 = { path = "../crates/bookclerk-mp4" }
bookclerk-workerd = { path = "../crates/bookclerk-workerd" }
bookclerk-plugin-sdk = { path = "../crates/bookclerk-plugin-sdk" }
bookclerk-resolve = { path = "../crates/bookclerk-resolve" }
bookclerk-node-proto = { path = "../crates/bookclerk-node-proto" }
bookclerk-cover = { path = "../crates/bookclerk-cover" }
bookclerk-config = { path = "../crates/bookclerk-config" }
bookclerk-plugin-source-libro = { path = "../crates/bookclerk-plugins/optional/source-libro" }
bookclerk-plugin-source-graphicaudio = { path = "../crates/bookclerk-plugins/optional/source-graphicaudio" }
# plan_authz drives the scan and acquire planners over an in-memory library.
bookclerk-library = { path = "../crates/bookclerk-library" }
bookclerk-plugin-database-sqlite = { path = "../crates/bookclerk-plugins/platform/database-sqlite", features = ["host-helpers"] }
bookclerk-storefront = { path = "../crates/bookclerk-storefront" }
# window_policy drives the desktop window's custom-scheme policy.
bookclerk-window-policy = { path = "../crates/bookclerk-window-policy" }
http = "1"
# Independent re-signing oracle for cover_token.
base64 = "0.23"
hmac = "0.13"
sha2 = "0.11"
url = "2"
sea-orm = { version = "2.0.0", default-features = false }
# Runtime for mux_peer: the mux is driven through tokio reader and writer tasks.
tokio = { version = "1", features = ["rt", "time", "io-util"] }
# Oracle for guest_sql_authz: SQLite's own authorizer callback (`hooks`).
rusqlite = { version = "0.39", features = ["bundled", "hooks"] }

[workspace]
members = ["."]

[[bin]]
name = "sql_parse"
path = "fuzz_targets/sql_parse.rs"
test = false
doc = false
bench = false

