# Contributor License Agreement check.
#
# Policy:
# - The pull request author, the account linked to every commit, and every
#   linked `Co-authored-by:` account must have accepted CLA.md, maintainers
#   and organization members included. Only the bots in `BOT_ALLOWLIST`
#   (matched by account type and login, never by git author name) and AI
#   coding assistant accounts in `ASSISTANT_EMAILS` (scripts/cla_check.py)
#   are exempt.
# - A contributor accepts by commenting the exact sentence in `SIGN_PHRASE`
#   on a pull request they are part of. The check records the signature in
#   `signatures/cla.json` on the `cla-signatures` branch (a GitHub-signed API
#   commit), so main is never written.
# - Runs again when a pull request is retargeted, since a new base can add
#   commits without changing the head.
# - `recheck` re-runs the check after a signature or allowlist change.
# - The verdict is the `CLA` commit status on the pull request's head; that
#   context is the one to require. Merge groups get a passing `CLA` status:
#   each pull request in them already passed it to enter the queue.
# - Runs on `pull_request_target` so fork pull requests get a token that can
#   comment and record signatures. It checks out the base branch only and
#   never checks out or runs pull request code; the script reads pull request
#   metadata through the API.
#
# Setup (signature branch, required check): docs/contributing/licensing.md#the-cla-check

name: CLA

on:
  pull_request_target:
    # `edited` covers a new base branch, which can add commits (and so
    # authors) without moving the head; other edits are filtered out below.
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created]
  merge_group:

permissions: {}

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  cla:
    name: CLA check
    if: >-
      (github.event_name == 'pull_request_target' &&
        (github.event.action != 'edited' || github.event.changes.base)) ||
      github.event_name == 'merge_group' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the Bookclerk CLA and I agree to it.'))
    runs-on: ubuntu-latest
    permissions:
      # Read the checker and write signatures to the `cla-signatures` branch.
      contents: write
      # Read the pull request and its commits (REST and GraphQL), and keep
      # the check's comment.
      pull-requests: write
      # Report the `CLA` commit status.
      statuses: write
    steps:
      # The default branch's checker, never the pull request's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/cla_check.py
          sparse-checkout-cone-mode: false

      - name: Check signatures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/cla_check.py
