# Contributor License Agreement check.
#
# Policy:
# - The pull request author, the account linked to every commit, and every
#   linked `Co-authored-by:` account must have accepted CLA.md, maintainers
#   and organization members included. Only the bots in `BOT_ALLOWLIST`
#   (matched by account type and login, never by git author name) and AI
#   coding assistant accounts in `ASSISTANT_EMAILS` (scripts/cla_check.py),
#   as commit author or co-author, are exempt.
# - A contributor accepts by commenting the sentence in `SIGN_PHRASE` on a
#   pull request they are part of. The check records the signature in
#   `signatures/cla.json` on the `cla-signatures` branch (a GitHub-signed API
#   commit), so main is never written.
# - Runs when a pull request is opened, pushed to, reopened, closed or
#   retargeted (a new base can add commits without changing the head).
# - `recheck` re-runs the check after a signature or allowlist change.
# - The verdict is the `CLA` commit status on the pull request's head; that
#   context is the one to require. It passes only when every open pull
#   request with that head passes, since they share the status, and is
#   re-decided when one of them is closed. Merge groups get a
#   passing `CLA` status: each pull request in them already passed it to
#   enter the queue.
# - Pull request events reach this workflow through `workflow_run`: the
#   unprivileged `CLA trigger` workflow (cla-trigger.yml) runs on
#   `pull_request`, and its completion starts this one from the default
#   branch with a token that can comment and record signatures, fork pull
#   requests included. This avoids `pull_request_target`, which GitHub blocks
#   by default on public repositories. The check takes nothing from the
#   trigger run but the head commit, branch and repository GitHub records
#   for it, finds the pull request through the API, checks out the default
#   branch only, and never checks out or runs pull request code.
#
# Setup (signature branch, required check): docs/contributing/licensing.md#the-cla-check

name: CLA

on:
  workflow_run:
    workflows: ["CLA trigger"]
    types: [completed]
  issue_comment:
    types: [created]
  merge_group:

permissions: {}

jobs:
  cla:
    name: CLA check
    # A `workflow_run` counts only for a `pull_request` run that the trigger
    # did not skip (a skipped run is an edit that kept the base). Its other
    # outcomes carry no information.
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion != 'skipped') ||
      github.event_name == 'merge_group' ||
      (github.event.issue.pull_request &&
        (contains(github.event.comment.body, 'recheck') ||
         contains(github.event.comment.body, 'I have read the Bookclerk CLA')))
    runs-on: ubuntu-latest
    # Job-level, so a run whose `if` skips it (an ordinary comment) never
    # replaces a pending run in the queue. Runs for one pull request's
    # comments, or for one head branch, wait for each other; signature
    # writes are also safe across groups (they retry on a conflict).
    concurrency:
      group: cla-${{ github.event_name }}-${{ github.event.issue.number || github.event.workflow_run.head_repository.id || github.ref }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      # Read the checker and write signatures to the `cla-signatures` branch.
      contents: write
      # Read the pull request and its commits (REST and GraphQL), and keep
      # the check's comment.
      pull-requests: write
      # Report the `CLA` commit status.
      statuses: write
    steps:
      # The default branch's checker, never the pull request's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/cla_check.py
          sparse-checkout-cone-mode: false

      - name: Check signatures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/cla_check.py
