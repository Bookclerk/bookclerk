# Contributor License Agreement check.
#
# Policy:
# - Every pull request author and commit author must have accepted CLA.md,
#   except the maintainers and bots in `allowlist`.
# - A contributor accepts by commenting the exact sentence in
#   `custom-pr-sign-comment` on their pull request. The action records the
#   signature in `signatures/cla.json` on the `cla-signatures` branch (a
#   GitHub-signed API commit), so main is never written. The branch starts
#   from main's empty `signatures/cla.json`: the pinned action cannot create
#   a missing file (it compares Octokit's numeric 404 with the string "404").
# - `recheck` re-runs the check after a signature or allowlist change.
# - Runs on `pull_request_target` so fork pull requests get a token that can
#   comment and record signatures. It never checks out or runs pull request
#   code; the action only reads pull request metadata through the API.
# - `merge_group` runs pass straight through: the pull request was already
#   checked, and a required check has to report on queue runs too.
#
# Setup (signature branch, required check): docs/contributing/licensing.md#the-cla-check

name: CLA

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  merge_group:

permissions: {}

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  cla:
    name: CLA
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the Bookclerk CLA and I agree to it.'))
    runs-on: ubuntu-latest
    permissions:
      # Re-run the pull request's earlier CLA run after a signature comment.
      actions: write
      # Write signatures to the `cla-signatures` branch.
      contents: write
      # Comment on and read the pull request.
      pull-requests: write
      statuses: write
    steps:
      - name: Queue runs were checked on their pull request
        if: github.event_name == 'merge_group'
        run: echo "The CLA was checked on the pull request."

      - name: Check signatures
        if: github.event_name != 'merge_group'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: fritz-fritz,dependabot[bot],bookclerk[bot]
          custom-pr-sign-comment: I have read the Bookclerk CLA and I agree to it.
          custom-notsigned-prcomment: >-
            Thank you for your pull request. Before it can be merged, each
            author needs to accept the
            [Bookclerk Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            once, by posting the comment below on this pull request.
          custom-allsigned-prcomment: All authors of this pull request have accepted the Bookclerk CLA.
          signed-commit-message: "chore(cla): record $contributorName's signature from #$pullRequestNo"
          create-file-commit-message: "chore(cla): create the signature file"
          # Locking would also stop review discussion on merged pull requests.
          lock-pullrequest-aftermerge: false
