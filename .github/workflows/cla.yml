# Contributor License Agreement check.
#
# Policy:
# - The pull request author, the account linked to every commit, and every
#   linked `Co-authored-by:` account must have accepted CLA.md, maintainers
#   and organization members included. Only the bots in `BOT_ALLOWLIST`
#   (matched by account type and login, never by git author name) and AI
#   coding assistant accounts in `ASSISTANT_EMAILS` (scripts/cla_check.py),
#   as commit author or co-author, are exempt.
# - A contributor accepts by commenting the sentence in `SIGN_PHRASE` on a
#   pull request they are part of. The check records the signature in
#   `signatures/cla.json` on the `cla-signatures` branch, so main is never
#   written. Each write is an API commit made with a token from the
#   automation App, which GitHub signs for the App; the branch's ruleset lets
#   only that App update it. The first signature starts the branch with a
#   commit that has no history and no signer, then adds itself on top.
# - The check's comment and the `CLA` status are posted as the same App, so
#   they carry the project's name; the default branch's ruleset expects the
#   status from that App. Without the App's secrets the workflow posts both.
# - Runs when a pull request is opened, pushed to, reopened, closed or
#   retargeted (a new base can add commits without changing the head).
# - `@<App slug> recheck` (`@bookclerk recheck` here, `@github-actions
#   recheck` without the App) re-runs the check after a signature or
#   allowlist change. Other comments that mention `recheck` are ignored.
# - The verdict is the `CLA` commit status on the pull request's head; that
#   context is the one to require. It passes only when every open pull
#   request with that head passes, since they share the status, and is
#   re-decided when one of them is closed. Merge groups get a
#   passing `CLA` status: each pull request in them already passed it to
#   enter the queue.
# - Pull request events reach this workflow through `workflow_run`: the
#   unprivileged `CLA trigger` workflow (cla-trigger.yml) runs on
#   `pull_request`, and its completion starts this one from the default
#   branch with tokens that can comment and record signatures, fork pull
#   requests included. This avoids `pull_request_target`, which GitHub blocks
#   by default on public repositories. The check takes nothing from the
#   trigger run but the head commit, branch and repository GitHub records
#   for it, finds the pull request through the API, checks out the default
#   branch only, and never checks out or runs pull request code.
#
# Setup (signature branch, required check): docs/contributing/licensing.md#the-cla-check

name: CLA

on:
  workflow_run:
    workflows: ["CLA trigger"]
    types: [completed]
  issue_comment:
    types: [created]
  merge_group:

permissions: {}

jobs:
  cla:
    name: CLA check
    # A `workflow_run` counts only for a `pull_request` run that the trigger
    # did not skip (a skipped run is an edit that kept the base). Its other
    # outcomes carry no information.
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion != 'skipped') ||
      github.event_name == 'merge_group' ||
      (github.event.issue.pull_request &&
        (contains(github.event.comment.body, 'recheck') ||
         contains(github.event.comment.body, 'I have read the Bookclerk CLA')))
    runs-on: ubuntu-latest
    # Job-level, so a run whose `if` skips it (an ordinary comment) never
    # replaces a pending run in the queue. Runs for one pull request's
    # comments, or for one head branch, wait for each other. Across the two
    # groups, signature writes retry on a conflict, and each run reads the
    # signatures again after posting its status (and re-decides if they
    # changed), so a run that read them before a concurrent signature cannot
    # leave its stale status last.
    concurrency:
      group: cla-${{ github.event_name }}-${{ github.event.issue.number || github.event.workflow_run.head_repository.id || github.ref }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    env:
      # Whether the automation App is configured (a fork may not have it).
      HAS_APP: ${{ secrets.AUTOMATION_APP_CLIENT_ID != '' && secrets.AUTOMATION_APP_PRIVATE_KEY != '' }}
    permissions:
      # Read the checker and the signatures. Signatures are written with the
      # automation App's token instead (below).
      contents: read
      # Read the pull request and its commits (REST and GraphQL), and keep
      # the check's comment when the App is not configured.
      pull-requests: write
      # Report the `CLA` commit status when the App is not configured, or
      # its error when the App's token fails.
      statuses: write
    steps:
      # The default branch's checker, never the pull request's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/cla_check.py
            scripts/cla_branch/
          sparse-checkout-cone-mode: false

      # Signature writes, the check's comment and the `CLA` status use it,
      # narrowed to Contents, Pull requests and Commit statuses on this
      # repository and revoked when the job ends. Without the App's secrets
      # the token is empty: recording a signature fails closed and the
      # workflow comments and reports instead.
      - name: Mint the App token
        id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: write

      - name: Check signatures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLA_SIGNATURE_TOKEN: ${{ steps.app-token.outputs.token }}
          CLA_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: python3 scripts/cla_check.py
