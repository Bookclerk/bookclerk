# Builds the Dev Container image (.devcontainer/Dockerfile) and checks that
# the tools contributors and CI rely on run inside it as the dev user. Nothing
# else builds this image, so without this job a base-image or provision
# script change would only fail when someone next opens the Dev Container.
#
# Path-filtered, plus weekly to catch drift in the unpinned apt packages and
# the stable Rust channel the image installs.
name: Dev Container image

on:
  pull_request:
    paths:
      - ".devcontainer/**"
      - "scripts/dev-env/**"
      - "scripts/tests/requirements.txt"
      - ".dockerignore"
      - ".github/workflows/devcontainer-image.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 2"

# Least privilege: checkout + local docker build only. Nothing is pushed.
permissions:
  contents: read

concurrency:
  group: devcontainer-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: build + tools
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -f .devcontainer/Dockerfile -t bookclerk-dev:ci .

      # Both a plain shell and a login shell (the postCreate command and new
      # terminals), whose /etc/profile resets PATH.
      - name: Tools run as the dev user
        run: |
          for shell_flags in -c -lc; do
            docker run --rm --user bookclerk bookclerk-dev:ci bash -euo pipefail "$shell_flags" '
              cargo --version
              cargo fmt --version
              cargo clippy --version
              cargo nextest --version
              capnp --version
              node --version
              npm --version
              uv --version
              python3 -c "import yaml; print(\"PyYAML\", yaml.__version__)"
              git --version
              ssh -V
            '
          done
