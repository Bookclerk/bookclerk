name: Libro.fm APK API probe

# Re-extract the unofficial Libro.fm mobile API from the latest Android APK.
# Live auth/download smoke runs only when the APK API surface drifted (or when
# workflow_dispatch sets force_live_smoke). On scheduled/manual runs, drift
# files or updates an `api-drift` issue; when the smoke passes, the extracted
# constants go up as a pull request that closes it (see
# .github/actions/api-drift-report).

on:
  schedule:
    # Mondays 14:00 UTC — after typical weekend Play Store pushes.
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      force_live_smoke:
        description: Run live API/download smoke even if APK probe found no drift
        type: boolean
        default: false
  push:
    paths:
      - "scripts/librofm-apk-probe/**"
      - ".github/workflows/librofm-apk-probe.yml"
      - ".github/actions/api-drift-report/**"
      - "crates/bookclerk-plugins/optional/source-libro/src/client.rs"
  pull_request:
    paths:
      - "scripts/librofm-apk-probe/**"
      - ".github/workflows/librofm-apk-probe.yml"
      - ".github/actions/api-drift-report/**"
      - "crates/bookclerk-plugins/optional/source-libro/src/client.rs"

# Issues, branches and pull requests are written with the automation App
# token, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  probe:
    name: extract / smoke / PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Java (jadx)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Probe latest Libro.fm APK
        id: probe
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p artifacts/librofm-apk-probe
          set +e
          python3 scripts/librofm-apk-probe/extract_libro_api.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --workdir "$RUNNER_TEMP/librofm-apk-probe" \
            --out-dir "$GITHUB_WORKSPACE/artifacts/librofm-apk-probe" \
            --no-fail-on-drift
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [[ -f artifacts/librofm-apk-probe/report.json ]]; then
            echo "report=true" >> "$GITHUB_OUTPUT"
            python3 -c 'import json; r=json.load(open("artifacts/librofm-apk-probe/report.json")); print("drift=true" if r.get("has_blocking_drift") else "drift=false"); print("needs_live_smoke=true" if r.get("needs_live_smoke") else "needs_live_smoke=false")' >> "$GITHUB_OUTPUT"
          else
            echo "report=false" >> "$GITHUB_OUTPUT"
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "needs_live_smoke=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$code"

      - name: Decide whether to hit live Libro.fm API
        id: live
        if: always() && steps.probe.outputs.report == 'true'
        run: |
          force="${{ github.event.inputs.force_live_smoke }}"
          if [[ "${{ steps.probe.outputs.needs_live_smoke }}" == "true" || "$force" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            if [[ "$force" == "true" && "${{ steps.probe.outputs.needs_live_smoke }}" != "true" ]]; then
              echo "Live smoke forced via workflow_dispatch (no APK API drift)." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "APK API drift detected — running live auth/download smoke." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No APK API drift — skipping live auth/download smoke (avoids needless Libro.fm traffic)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload probe reports (JSON/Markdown only — no APK / media)
        if: always() && steps.probe.outputs.report == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: librofm-apk-probe
          path: |
            artifacts/librofm-apk-probe/report.json
            artifacts/librofm-apk-probe/report.md
            artifacts/librofm-apk-probe/apk_shapes.json
            artifacts/librofm-apk-probe/public_smoke.json
            artifacts/librofm-apk-probe/live_smoke.json
          if-no-files-found: warn

      - name: Summarize probe
        if: always() && steps.probe.outputs.report == 'true'
        run: |
          echo "## Libro.fm APK API probe" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/librofm-apk-probe/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Public catalog smoke (optional; only on API drift)
        id: public_smoke
        if: always() && steps.live.outputs.run == 'true'
        continue-on-error: true
        run: |
          set +e
          python3 scripts/librofm-apk-probe/live_smoke.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --report "$GITHUB_WORKSPACE/artifacts/librofm-apk-probe/report.json" \
            --profiles public \
            --out "$GITHUB_WORKSPACE/artifacts/librofm-apk-probe/public_smoke.json"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [[ -f artifacts/librofm-apk-probe/public_smoke.json ]]; then
            echo "## Public catalog smoke (informational)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/librofm-apk-probe/public_smoke.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          # Informational only — do not fail the job on public explore drift.
          exit 0

      - name: Auth live-smoke (library + download; only on API drift)
        id: smoke
        if: always() && steps.live.outputs.run == 'true'
        continue-on-error: true
        env:
          TEST_LIBRO_EMAIL: ${{ secrets.TEST_LIBRO_EMAIL }}
          TEST_LIBRO_USERNAME: ${{ secrets.TEST_LIBRO_USERNAME }}
          TEST_LIBRO_USER: ${{ secrets.TEST_LIBRO_USER }}
          TEST_LIBRO_PASSWORD: ${{ secrets.TEST_LIBRO_PASSWORD }}
          TEST_LIBRO_ISBN: ${{ secrets.TEST_LIBRO_ISBN }}
          TEST_LIBRO_CATALOG_ISBN: ${{ secrets.TEST_LIBRO_CATALOG_ISBN }}
          TEST_LIBRO_REQUIRE_MEDIA: ${{ vars.TEST_LIBRO_REQUIRE_MEDIA }}
          BOOKCLERK_LIBRO_PASSWORD: ${{ secrets.BOOKCLERK_LIBRO_PASSWORD }}
          TEST_LIBRO_MAX_DOWNLOAD_BYTES: ${{ vars.TEST_LIBRO_MAX_DOWNLOAD_BYTES }}
        run: |
          set +e
          python3 scripts/librofm-apk-probe/live_smoke.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --report "$GITHUB_WORKSPACE/artifacts/librofm-apk-probe/report.json" \
            --profiles current,apk \
            --no-media-download \
            --out "$GITHUB_WORKSPACE/artifacts/librofm-apk-probe/live_smoke.json"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [[ -f artifacts/librofm-apk-probe/live_smoke.json ]]; then
            echo "report=true" >> "$GITHUB_OUTPUT"
            echo "## Auth live smoke (API JSON only — no media download)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/librofm-apk-probe/live_smoke.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "report=false" >> "$GITHUB_OUTPUT"
          fi
          # 2 = missing credentials — treat as skipped, not failed.
          if [[ "$code" -eq 2 ]]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Auth smoke skipped (TEST_LIBRO_* secrets not configured)." >> "$GITHUB_STEP_SUMMARY"
            echo "Configure email+password (+ optional ISBN) so CI can validate on APK API drift." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Record skipped live smoke (no APK API drift)
        if: always() && steps.probe.outputs.report == 'true' && steps.live.outputs.run != 'true'
        run: |
          echo "skipped=true" >> "$GITHUB_OUTPUT"
          echo "Live smoke not run (no APK API drift; use workflow_dispatch force_live_smoke to override)." >> "$GITHUB_STEP_SUMMARY"

      - name: Apply suggested client.rs updates
        id: apply
        if: >
          always()
          && steps.probe.outputs.drift == 'true'
          && steps.probe.outputs.report == 'true'
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && steps.live.outputs.run == 'true'
          && steps.smoke.outputs.skipped == 'false'
          && steps.smoke.outputs.exit_code == '0'
        run: |
          python3 scripts/librofm-apk-probe/apply_client_updates.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --report "$GITHUB_WORKSPACE/artifacts/librofm-apk-probe/report.json"
          if git diff --quiet -- crates/bookclerk-plugins/optional/source-libro/src/client.rs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint automation App token
        id: app
        if: >
          always()
          && steps.probe.outputs.drift == 'true'
          && steps.probe.outputs.report == 'true'
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Describe drift outcome
        id: outcome
        if: always() && steps.app.outcome == 'success'
        env:
          LIVE_RUN: ${{ steps.live.outputs.run }}
          SMOKE_SKIPPED: ${{ steps.smoke.outputs.skipped }}
          SMOKE_EXIT: ${{ steps.smoke.outputs.exit_code }}
          CHANGED: ${{ steps.apply.outputs.changed }}
        run: |
          set -euo pipefail
          if [[ "$CHANGED" == "true" ]]; then
            # The fixer rewrites constants only; schema drift (and constants the
            # APK gave no value for) stays for a person, so the PR then must not
            # close the issue.
            complete="$(python3 - artifacts/librofm-apk-probe/report.json <<'PY'
          import json, sys
          fixable = {"DEFAULT_BASE_URL", "OAUTH_TOKEN_PATH", "LIBRARY_PATH", "DOWNLOAD_MANIFEST_PATH",
                     "PACKAGED_M4B_PATH", "APP_VER", "USER_AGENT_VALUE"}
          drifts = json.load(open(sys.argv[1])).get("drifts") or []
          blocking = [d for d in drifts if d.get("severity") == "error"]
          print("true" if all(d.get("field") in fixable and d.get("apk") is not None for d in blocking) else "false")
          PY
          )"
            echo "closes_issue=$complete" >> "$GITHUB_OUTPUT"
            if [[ "$complete" == "true" ]]; then
              summary="The Android APK no longer matches \`source-libro/src/client.rs\`. Auth live smoke passed against the extracted constants, so a fix pull request was opened."
            else
              summary="The Android APK no longer matches \`source-libro/src/client.rs\`. Auth live smoke passed against the extracted constants, so a pull request with the constant changes was opened; the remaining drift (see the report) needs a manual change."
            fi
            echo "fix_paths=crates/bookclerk-plugins/optional/source-libro/src/client.rs" >> "$GITHUB_OUTPUT"
          elif [[ "$LIVE_RUN" == "true" && "$SMOKE_SKIPPED" == "true" ]]; then
            summary="The Android APK no longer matches \`source-libro/src/client.rs\`. Auth live smoke was skipped because the \`TEST_LIBRO_*\` secrets are not configured (\`TEST_LIBRO_EMAIL\` or \`TEST_LIBRO_USER\` plus \`TEST_LIBRO_PASSWORD\`), so no fix pull request was opened."
            echo "fix_paths=" >> "$GITHUB_OUTPUT"
          elif [[ "$LIVE_RUN" == "true" && "$SMOKE_EXIT" != "0" ]]; then
            summary="The Android APK no longer matches \`source-libro/src/client.rs\`, and auth live smoke failed against the extracted constants, so no fix pull request was opened. Schema field renames need a manual change."
            echo "fix_paths=" >> "$GITHUB_OUTPUT"
          elif [[ "$LIVE_RUN" != "true" ]]; then
            summary="The Android APK no longer matches \`source-libro/src/client.rs\`, but auth live smoke did not run, so no fix pull request was opened."
            echo "fix_paths=" >> "$GITHUB_OUTPUT"
          else
            summary="The Android APK no longer matches \`source-libro/src/client.rs\`, but the fixer produced no change to commit. The drift needs a manual change."
            echo "fix_paths=" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "summary<<SUMMARY_EOF"
            echo "$summary"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: File drift issue and open fix PR
        if: always() && steps.outcome.outcome == 'success'
        uses: ./.github/actions/api-drift-report
        with:
          token: ${{ steps.app.outputs.token }}
          source: librofm
          source-name: Libro.fm
          summary: ${{ steps.outcome.outputs.summary }}
          report-path: artifacts/librofm-apk-probe/report.md
          legacy-marker: "<!-- librofm-apk-probe-smoke-fail -->"
          fix-paths: ${{ steps.outcome.outputs.fix_paths }}
          closes-issue: ${{ steps.outcome.outputs.closes_issue }}
          commit-message: |
            chore(libro): sync mobile API constants from Android APK probe

            Generated by librofm-apk-probe.yml after APK API drift and a passing
            auth live smoke (oauth, library, download, media probe).
          pr-title: "chore(libro): sync API constants from Libro.fm Android APK"
          pr-notes: |
            This applies the extracted constants (base URL, `/api/vN/` paths,
            `X-LibroFm-AppVer`, OkHttp user-agent). Wiremock tests bind to the
            path constants, so they follow this bump. Schema field renames are
            **not** auto-applied to Rust structs.

      - name: Fail on hard probe error
        if: always() && steps.probe.outputs.exit_code == '2'
        run: |
          echo "Libro.fm APK probe failed hard (download/decompile/parse)."
          exit 1

      - name: Fail on auth live smoke failure (schedule / manual)
        if: >
          always()
          && steps.live.outputs.run == 'true'
          && steps.smoke.outputs.skipped == 'false'
          && steps.smoke.outputs.exit_code == '1'
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          echo "Auth live smoke failed (API JSON and/or media download probe)."
          exit 1
