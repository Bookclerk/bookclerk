# Daily bump of the pinned Cloudflare `workerd` binary.
#
# Policy:
# - Only consider releases published ≥ 7 days ago (supply-chain cooldown).
# - Run Echo workerd integration tests against the new pin in this workflow.
# - Open a PR with the automation App token and turn on auto-merge, so the
#   merge queue lands it once the PR's required checks pass.
#
# The App token is required: the organization does not let GITHUB_TOKEN open
# pull requests, and pushes made with GITHUB_TOKEN would not start CI on the
# PR. See docs/ci.md#automation-app.

name: workerd pin bump

on:
  schedule:
    # Daily 06:17 UTC — offset from the hour to avoid thundering herds.
    - cron: "17 6 * * *"
  workflow_dispatch:

# The branch, PR and auto-merge are written with the automation App token.
permissions:
  contents: read

concurrency:
  group: workerd-pin-bump
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  WORKERD_PIN_COOLDOWN_DAYS: "7"

jobs:
  bump:
    name: bump pin + test + PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          env-vars: RUSTFLAGS
          cache-on-failure: true
          save-if: false

      - name: Select eligible workerd release
        id: select
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if python3 scripts/bump-workerd-pin.py \
              --cooldown-days "$WORKERD_PIN_COOLDOWN_DAYS" --check; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
          else
            code=$?
            if [[ "$code" -eq 2 ]]; then
              echo "bump=false" >> "$GITHUB_OUTPUT"
              echo "No eligible workerd bump (pin current or within cooldown)."
            else
              exit "$code"
            fi
          fi

      - name: Apply pin bump
        if: steps.select.outputs.bump == 'true'
        id: pin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/bump-workerd-pin.py \
            --cooldown-days "$WORKERD_PIN_COOLDOWN_DAYS" --write
          python3 scripts/sync-workerd-pin.py --check
          tag="$(python3 -c 'import json; print(json.load(open("crates/bookclerk-workerd/workerd-pin.json"))["release_tag"])')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # bookclerk-workerd depends on bookclerk-plugin-abi, whose build.rs
      # invokes the capnp compiler (same as ci.yml check/release/postgres jobs).
      - name: Install capnproto
        if: steps.select.outputs.bump == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends capnproto

      - name: Build launcher + ensure workerd
        if: steps.select.outputs.bump == 'true'
        run: |
          cargo build -p bookclerk-workerd -p bookclerk-dev
          cargo ensure-workerd
          test -x target/debug/workerd
          test -x target/debug/bookclerk-workerd

      - name: Echo workerd integration tests
        if: steps.select.outputs.bump == 'true'
        run: |
          chmod +x scripts/test-workerd-echo.sh
          ./scripts/test-workerd-echo.sh debug

      - name: Mint automation App token
        if: steps.select.outputs.bump == 'true'
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update pull request
        if: steps.select.outputs.bump == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app.outputs.token }}
          # Commit through the API so the commit is signed and attributed to the App.
          sign-commits: true
          commit-message: |
            build(deps): bump workerd pin to ${{ steps.pin.outputs.tag }}

            Cloudflare workerd releases daily; Bookclerk pins a release only after
            a ${{ env.WORKERD_PIN_COOLDOWN_DAYS }}-day publish cooldown (supply-chain).
          branch: deps/workerd-pin
          delete-branch: true
          title: "build(deps): bump workerd pin to ${{ steps.pin.outputs.tag }}"
          body: |
            ## Summary
            - Bump pinned Cloudflare `workerd` to `${{ steps.pin.outputs.tag }}`
            - Cooldown: releases must be published ≥ **${{ env.WORKERD_PIN_COOLDOWN_DAYS }} days** ago
            - Echo workerd guests (`ts` / `python` / `rust`) describe + health + `cliInvoke` passed in this workflow

            ## Test plan
            - [x] `scripts/bump-workerd-pin.py` (cooldown filter + digests → workerd-pin.json)
            - [x] `scripts/sync-workerd-pin.py --check` (pin.rs, author-contract dates, SDK stub, bridge copies)
            - [x] `cargo ensure-workerd` for the new pin
            - [x] `scripts/test-workerd-echo.sh`

            Auto-merge is on: the merge queue lands this PR once its required
            checks pass.
          labels: |
            dependencies
          add-paths: |
            crates/bookclerk-workerd/workerd-pin.json
            crates/bookclerk-workerd/src/pin.rs
            crates/bookclerk-plugin-manifest/src/workerd_contract.rs
            crates/bookclerk-plugin-manifest/schema/plugin-toml.json
            crates/bookclerk-plugin-abi/schema/plugin-toml.json
            packages/plugin-sdk/src/tools/validate.ts
            packages/plugin-sdk/workerd-pin.json
            packages/plugin-sdk/bridge/
            packages/plugin-sdk-python/src/bookclerk_plugin_sdk/tools.py
            packages/plugin-sdk-python/workerd-pin.json
            packages/plugin-sdk-python/src/bookclerk_plugin_sdk/workerd-pin.json
            packages/plugin-sdk-python/src/bookclerk_plugin_sdk/bridge/

      # Runs even when the branch was already up to date (operation `none`),
      # so a run whose earlier `gh pr merge --auto` failed gets another try.
      # Enabling auto-merge again on a PR that already has it is a no-op.
      - name: Enable auto-merge
        if: steps.select.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head deps/workerd-pin --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr" ]]; then
            echo "No open workerd pin pull request."
            exit 0
          fi
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto --squash
