# Dependency vulnerability scanning via OSV-Scanner.
# Results upload to GitHub Code Scanning (Security tab) as SARIF —
# complements CodeQL default setup for lockfile advisories (Cargo + npm).
#
# Behavior:
#   - PR / merge_group: fail the check when the PR introduces *new* vulns
#     (reusable-pr diff). Gates merges.
#   - push / schedule / workflow_dispatch: always upload SARIF; do not fail
#     the workflow. Existing advisories are tracked in Security → Code scanning.
#
# https://google.github.io/osv-scanner/github-action/

name: OSV-Scanner

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-pr:
    name: PR scan
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.5.0
    with:
      # Fork and Dependabot pull_request runs get a read-only GITHUB_TOKEN, so
      # security-events: write is not granted and SARIF upload would fail the job.
      # Still scan (annotations/artifacts); only skip Code Scanning upload.
      # merge_group always runs in-repo with a writable token.
      upload-sarif: ${{ github.event_name == 'merge_group' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
      # Fail the PR check when newly introduced vulns are found.
      fail-on-vuln: true
      # Override replaces the reusable default (-r ./); keep those plus
      # experimental deps.dev deprecation/yank reporting (SARIF-compatible).
      scan-args: |-
        --experimental-flag-deprecated-packages
        --recursive
        ./
    permissions:
      actions: read
      contents: read
      security-events: write

  scan-scheduled:
    name: Full scan
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.0
    with:
      # Report via Code Scanning SARIF; do not fail push/schedule runs on
      # already-known advisories (those are triaged in the Security tab).
      fail-on-vuln: false
      # Override replaces the reusable default (-r ./); keep those plus
      # experimental deps.dev deprecation/yank reporting (SARIF-compatible).
      scan-args: |-
        --experimental-flag-deprecated-packages
        --recursive
        ./
    permissions:
      actions: read
      contents: read
      security-events: write
