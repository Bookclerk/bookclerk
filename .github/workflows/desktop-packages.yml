# Builds the desktop app's unsigned packages on Linux, Windows and macOS
# (`cargo package-desktop`, see docs/contributing/ui/README.md#packages):
# a .deb and an AppImage, an NSIS installer, and an app plus .dmg. Each job
# uploads its packages as a workflow artifact (kept 14 days).
#
# A full release build on three runners, so it runs with the images, not on
# every pull request: `images-publish.yml` calls it nightly when main has
# moved, by hand, and for a published release, where the `publish` job
# attaches the packages to the release with build provenance. A pull request
# runs it only when it changes the packaging itself; CI's `desktop` job
# covers the window's code on every pull request
# (docs/contributing/packaging.md#desktop-packages).
name: Desktop packages

on:
  workflow_call:
    inputs:
      release-tag:
        description: >-
          The published release to attach the packages to, already checked
          to be v<major>.<minor>.<patch> on main; empty builds only.
        type: string
        default: ""
  pull_request:
    # Drafts skip this workflow's jobs; `ready_for_review` runs them
    # (docs/contributing/ci.md#draft-pull-requests).
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/desktop-packages.yml"
      - "crates/bookclerk-desktop/tauri.packaging.json"
      - "crates/bookclerk-desktop/tauri.packaging.macos.json"
      - "crates/bookclerk-dev/src/package.rs"
  workflow_dispatch:

# Least privilege: checkout and artifact upload only. Nothing is pushed.
permissions:
  contents: read

# A pull request's newer push cancels its older run; nightly and release
# builds never cancel each other.
concurrency:
  group: desktop-packages-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The Tauri CLI that bundles the app; it matches the `tauri` crate's
  # 2.12 line (crates/bookclerk-desktop/Cargo.toml).
  TAURI_CLI_VERSION: 2.12.4

jobs:
  package:
    name: package (${{ matrix.os }})
    # Deferred on a draft pull request until it is ready for review.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Tool versions shared with the Dev Container and rust-toolchain.toml
      # (docs/contributing/ci.md#tool-versions).
      - name: Read tool pins
        id: pins
        shell: bash
        run: python scripts/tool_versions.py github-output >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.pins.outputs.rust }}
          components: rustfmt, clippy

      - name: Install capnproto and the webview's development files (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends capnproto libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev libfuse2

      - name: Install capnproto (macOS)
        if: runner.os == 'macOS'
        run: brew install capnp

      - name: Install capnproto (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://capnproto.org/capnproto-c++-win32-1.1.0.zip"
          $zip = "$env:RUNNER_TEMP\capnproto.zip"
          $expectedHash = "623b7525501d410e6479c8029eba265aa57ac8153c6fa09ab21a62f906b3e3f9"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          $actualHash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            Write-Error "capnproto checksum mismatch. Expected $expectedHash, got $actualHash"
            exit 1
          }
          Expand-Archive -Path $zip -DestinationPath "C:\capnproto" -Force
          $toolsDir = "C:\capnproto\capnproto-tools-win32-1.1.0"
          if (-not (Test-Path "$toolsDir\capnp.exe")) {
            Write-Error "capnp.exe not found at $toolsDir"
            exit 1
          }
          echo $toolsDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install the Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "=$TAURI_CLI_VERSION" --locked

      - name: Build the packages
        shell: bash
        run: cargo package-desktop

      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bookclerk-desktop-${{ runner.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  # Attaches the packages to the release the caller names, each with a
  # build-provenance attestation (`gh attestation verify <file> --owner
  # <owner>`). Only this job can write to the release.
  publish:
    name: attach to the release
    needs: package
    if: inputs.release-tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bookclerk-desktop-*
          path: ${{ runner.temp }}/packages
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/packages/*

      - name: Attach the packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release-tag }}
          DIR: ${{ runner.temp }}/packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$DIR"/*)
          [[ ${#files[@]} -gt 0 ]]
          # --clobber: a re-run replaces what an earlier attempt attached.
          gh release upload "$TAG" "${files[@]}" --clobber
          printf '%s\n' "${files[@]##*/}" >> "$GITHUB_STEP_SUMMARY"
