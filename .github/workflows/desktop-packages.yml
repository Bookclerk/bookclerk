# Builds the desktop app's unsigned packages on Linux, Windows and macOS
# (`cargo package-desktop`, see docs/contributing/ui/README.md#packages):
# a .deb and an AppImage, an NSIS installer, and an app plus .dmg. Each job
# uploads its packages as a workflow artifact; nothing is published or signed.
#
# A full release build on three runners, so it runs only when the packaging
# or the way the app finds its runtime changes, when asked, and weekly to
# catch drift from the rest of the workspace.
name: Desktop packages

on:
  pull_request:
    # Drafts skip this workflow's jobs; `ready_for_review` runs them
    # (docs/contributing/ci.md#draft-pull-requests).
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/desktop-packages.yml"
      - "crates/bookclerk-desktop/**"
      - "crates/bookclerk-dev/src/package.rs"
      - "crates/bookclerk-sandbox/src/spawn_path.rs"
      - "crates/bookclerk-plugin-host/src/bundled_platform.rs"
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 3"

# Least privilege: checkout and artifact upload only. Nothing is pushed.
permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The Tauri CLI that bundles the app; it matches the `tauri` crate's
  # 2.12 line (crates/bookclerk-desktop/Cargo.toml).
  TAURI_CLI_VERSION: 2.12.4

jobs:
  package:
    name: package (${{ matrix.os }})
    # Deferred on a draft pull request until it is ready for review.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Tool versions shared with the Dev Container and rust-toolchain.toml
      # (docs/contributing/ci.md#tool-versions).
      - name: Read tool pins
        id: pins
        shell: bash
        run: python scripts/tool_versions.py github-output >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.pins.outputs.rust }}
          components: rustfmt, clippy

      - name: Install capnproto and the webview's development files (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends capnproto libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev libfuse2

      - name: Install capnproto (macOS)
        if: runner.os == 'macOS'
        run: brew install capnp

      - name: Install capnproto (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://capnproto.org/capnproto-c++-win32-1.1.0.zip"
          $zip = "$env:RUNNER_TEMP\capnproto.zip"
          $expectedHash = "623b7525501d410e6479c8029eba265aa57ac8153c6fa09ab21a62f906b3e3f9"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          $actualHash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            Write-Error "capnproto checksum mismatch. Expected $expectedHash, got $actualHash"
            exit 1
          }
          Expand-Archive -Path $zip -DestinationPath "C:\capnproto" -Force
          $toolsDir = "C:\capnproto\capnproto-tools-win32-1.1.0"
          if (-not (Test-Path "$toolsDir\capnp.exe")) {
            Write-Error "capnp.exe not found at $toolsDir"
            exit 1
          }
          echo $toolsDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install the Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "=$TAURI_CLI_VERSION" --locked

      - name: Build the packages
        shell: bash
        run: cargo package-desktop

      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bookclerk-desktop-${{ runner.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
