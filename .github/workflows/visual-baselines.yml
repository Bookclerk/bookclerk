# Visual baselines: propose a pull request's new screenshots, and approve them.
#
# Policy (scripts/visual_baselines_bot.py, docs/contributing/ui/visual-testing.md#baselines):
# - When CI's `ui-visual` job on a pull request recorded a complete set that
#   differs from the approved images its `ui/visual/baselines.lock` lists,
#   `propose` validates the set (PNG screenshots with the expected names and
#   sizes only), force-pushes the added and changed images to
#   `pending/pr-<number>` in the public baselines repository, and posts or
#   updates one review comment with the approved and proposed images and an
#   approval checkbox, then requests a review from the `visual-reviewers`
#   team (best effort).
# - A maintainer (admin or maintain role) or an active member of the
#   `visual-reviewers` org team approves by ticking that checkbox (which
#   needs write access) or by replying `@<app> approve-visuals` (the same
#   mention form as the CLA check's `recheck`). `approve` checks
#   the approver and that the comment is still for the pull request's head,
#   tags the set `approved/<commit>` so it is kept, and commits the lock
#   entries of the screenshots it changed to the pull request's branch
#   through the API (signed by GitHub for the App); for a fork it tells the
#   author what to commit. Any other tick is undone with the reason.
# - After main moves in a way the visual checks see, visual-recheck.yml runs
#   the visual check for each ready pull request with auto-merge on, merged
#   into the new main commit; `propose-recheck` proposes what differs on
#   each, the same way, before the merge queue fails on it.
# - Pull request runs reach `propose` through `workflow_run` of CI, which
#   starts this workflow from the default branch with the App's tokens, fork
#   pull requests included. It checks out the default branch only and never
#   checks out or runs pull request code; the artifact is read as data.
#
# Setup (baselines repository, team, App permissions): docs/contributing/ui/visual-testing.md#setup

name: Visual baselines

on:
  workflow_run:
    workflows: ["CI", "Visual recheck"]
    types: [completed]
  issue_comment:
    types: [created, edited]

permissions: {}

env:
  # The public repository holding every baselines set.
  BASELINES_REPOSITORY: ${{ github.repository_owner }}/bookclerk-visual-baselines

jobs:
  propose:
    name: Propose visual baselines
    # Only a pull request run that got as far as finishing; a failed run is
    # expected when screenshots differ.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: visual-baselines-propose-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    env:
      HAS_APP: ${{ secrets.AUTOMATION_APP_CLIENT_ID != '' && secrets.AUTOMATION_APP_PRIVATE_KEY != '' }}
    permissions:
      # Read the scripts and the pull request's lock.
      contents: read
      # Download the CI run's `ui-visual` artifact.
      actions: read
      # Find the pull request for the run's head.
      pull-requests: read
    steps:
      # The default branch's scripts, never the pull request's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/visual_baselines.py
            scripts/visual_baselines_bot.py
            scripts/maintainer_review.py
            scripts/cla_check.py
          sparse-checkout-cone-mode: false

      # A run whose `ui-visual` job was not selected has no such artifact.
      - name: Download the recorded set
        id: artifact
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-visual
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/ui-visual

      # Pushes pending sets: Contents on the baselines repository only.
      - name: Mint the baselines token
        id: baselines-token
        if: env.HAS_APP == 'true' && steps.artifact.outcome == 'success'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: bookclerk-visual-baselines
          permission-contents: write

      # Posts the review comment: Pull requests on this repository only.
      - name: Mint the comment token
        id: pr-token
        if: env.HAS_APP == 'true' && steps.artifact.outcome == 'success'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Propose
        if: env.HAS_APP == 'true' && steps.artifact.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASELINES_TOKEN: ${{ steps.baselines-token.outputs.token }}
          PR_TOKEN: ${{ steps.pr-token.outputs.token }}
          APP_SLUG: ${{ steps.pr-token.outputs.app-slug }}
          ARTIFACT_DIR: ${{ runner.temp }}/ui-visual
        run: python3 scripts/visual_baselines_bot.py propose

  # A visual recheck of main (visual-recheck.yml) compared queued pull
  # requests merged into the new main commit; propose what differs on each.
  propose-recheck:
    name: Propose rechecked visual baselines
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.path == '.github/workflows/visual-recheck.yml' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: visual-baselines-propose-recheck
      cancel-in-progress: true
    env:
      HAS_APP: ${{ secrets.AUTOMATION_APP_CLIENT_ID != '' && secrets.AUTOMATION_APP_PRIVATE_KEY != '' }}
    permissions:
      # Read the scripts and each merge commit's lock.
      contents: read
      # Download the recheck run's artifacts.
      actions: read
      # Read each pull request's state, head and auto-merge.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/visual_baselines.py
            scripts/visual_baselines_bot.py
            scripts/maintainer_review.py
            scripts/cla_check.py
          sparse-checkout-cone-mode: false

      # A run with nothing to recheck uploaded no targets.
      - name: Download the recheck targets
        id: targets
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recheck-targets
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/recheck/recheck-targets

      # One folder per pull request, `ui-visual-<number>`.
      - name: Download the recorded sets
        if: steps.targets.outcome == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ui-visual-*
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/recheck

      - name: Mint the baselines token
        id: baselines-token
        if: env.HAS_APP == 'true' && steps.targets.outcome == 'success'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: bookclerk-visual-baselines
          permission-contents: write

      - name: Mint the comment token
        id: pr-token
        if: env.HAS_APP == 'true' && steps.targets.outcome == 'success'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Propose
        if: env.HAS_APP == 'true' && steps.targets.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASELINES_TOKEN: ${{ steps.baselines-token.outputs.token }}
          PR_TOKEN: ${{ steps.pr-token.outputs.token }}
          APP_SLUG: ${{ steps.pr-token.outputs.app-slug }}
          ARTIFACT_DIR: ${{ runner.temp }}/recheck
        run: python3 scripts/visual_baselines_bot.py propose

  approve:
    name: Approve visual baselines
    # A user's edit of the bot's comment, or a user's `@<app> approve-visuals`
    # reply; the script re-checks every field.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.sender.type == 'User' &&
      ((github.event.action == 'edited' && contains(github.event.comment.body, 'bookclerk-visual-baselines v1')) ||
       (github.event.action == 'created' && contains(github.event.comment.body, 'approve-visuals')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: visual-baselines-approve-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      HAS_APP: ${{ secrets.AUTOMATION_APP_CLIENT_ID != '' && secrets.AUTOMATION_APP_PRIVATE_KEY != '' }}
    permissions:
      # Read the scripts, the lock and the approver's permission.
      contents: read
      # Read the pull request and its comments.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/visual_baselines.py
            scripts/visual_baselines_bot.py
            scripts/maintainer_review.py
            scripts/cla_check.py
          sparse-checkout-cone-mode: false

      # Tags approved sets: Contents on the baselines repository only.
      - name: Mint the baselines token
        id: baselines-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: bookclerk-visual-baselines
          permission-contents: write

      # Writes the lock to the pull request's branch, edits the comment, and
      # reads `visual-reviewers` membership (organization Members: read).
      - name: Mint the approval token
        id: pr-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-members: read

      - name: Approve
        if: env.HAS_APP == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASELINES_TOKEN: ${{ steps.baselines-token.outputs.token }}
          PR_TOKEN: ${{ steps.pr-token.outputs.token }}
          APP_SLUG: ${{ steps.pr-token.outputs.app-slug }}
        run: python3 scripts/visual_baselines_bot.py approve
