name: GraphicAudio API probe

# Public endpoint + constant contract smoke for GraphicAudio. Auth checks run
# only when TEST_GA_* secrets are set; missing secrets do not fail the job.

on:
  schedule:
    - cron: "0 14 * * 2"
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/source-probes/**"
      - ".github/workflows/graphicaudio-api-probe.yml"
      - "crates/bookclerk-graphicaudio/src/client.rs"
      - "crates/bookclerk-graphicaudio/src/magento.rs"
  pull_request:
    paths:
      - "scripts/source-probes/**"
      - ".github/workflows/graphicaudio-api-probe.yml"
      - "crates/bookclerk-graphicaudio/src/client.rs"
      - "crates/bookclerk-graphicaudio/src/magento.rs"

permissions:
  contents: read
  issues: write

jobs:
  probe:
    name: contract / live smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check client constants
        run: python3 scripts/source-probes/check_client_constants.py --sources graphicaudio

      - name: Live API probe (public always; auth if secrets set)
        id: smoke
        env:
          TEST_GA_EMAIL: ${{ secrets.TEST_GA_EMAIL }}
          TEST_GA_PASSWORD: ${{ secrets.TEST_GA_PASSWORD }}
        run: |
          mkdir -p artifacts/graphicaudio-api-probe
          set +e
          python3 scripts/source-probes/probe_all.py \
            --sources graphicaudio \
            --out "$GITHUB_WORKSPACE/artifacts/graphicaudio-api-probe"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [[ -f artifacts/graphicaudio-api-probe/report.json ]]; then
            echo "report=true" >> "$GITHUB_OUTPUT"
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r = json.load(open("artifacts/graphicaudio-api-probe/report.json"))
          checks = r.get("checks") or []
          # Auth skips are OK when secrets are unset — only non-auth failures fail CI.
          failed = [
              c for c in checks
              if not c.get("ok") and not c.get("skipped") and not c.get("needs_auth")
          ]
          auth_failed = [
              c for c in checks
              if c.get("needs_auth") and not c.get("ok") and not c.get("skipped")
          ]
          auth_ran = any(c.get("needs_auth") and not c.get("skipped") for c in checks)
          print("failed=true" if failed else "failed=false")
          print("auth_failed=true" if auth_failed else "auth_failed=false")
          print("auth_ran=true" if auth_ran else "auth_ran=false")
          PY
          else
            echo "report=false" >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "auth_failed=false" >> "$GITHUB_OUTPUT"
            echo "auth_ran=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload probe reports (JSON/Markdown only — no media)
        if: always() && steps.smoke.outputs.report == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: graphicaudio-api-probe
          path: |
            artifacts/graphicaudio-api-probe/report.json
            artifacts/graphicaudio-api-probe/report.md
          if-no-files-found: warn

      - name: Summarize probe
        if: always() && steps.smoke.outputs.report == 'true'
        run: |
          echo "## GraphicAudio API probe" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.smoke.outputs.auth_ran }}" != "true" ]]; then
            echo "_Auth smoke skipped (no TEST_GA_* secrets) — public endpoints only._" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          cat artifacts/graphicaudio-api-probe/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open issue on public probe failure
        if: >
          always()
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && steps.smoke.outputs.failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- graphicaudio-api-probe-fail -->';
            const report = fs.existsSync('artifacts/graphicaudio-api-probe/report.md')
              ? fs.readFileSync('artifacts/graphicaudio-api-probe/report.md', 'utf8')
              : '(no report.md)';
            const title = 'GraphicAudio API probe failed (public endpoints)';
            const body = [
              marker,
              '',
              'Scheduled/manual GraphicAudio reverse-API probe failed on **public** checks.',
              '',
              '<details><summary>Probe report</summary>',
              '',
              report,
              '',
              '</details>',
              '',
              `Workflow: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'graphicaudio-api-drift',
              per_page: 20,
            });
            const existing = issues.data.find(i => (i.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['graphicaudio-api-drift'],
              });
            }

      - name: Fail job when public (or auth, if secrets set) probe failed
        if: >
          always()
          && (steps.smoke.outputs.failed == 'true'
              || steps.smoke.outputs.auth_failed == 'true')
        run: |
          if [[ "${{ steps.smoke.outputs.failed }}" == "true" ]]; then
            echo "GraphicAudio public API probe failed."
          fi
          if [[ "${{ steps.smoke.outputs.auth_failed }}" == "true" ]]; then
            echo "GraphicAudio auth API probe failed (secrets were set)."
          fi
          exit 1
