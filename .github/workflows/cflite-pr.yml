# ClusterFuzzLite on pull requests: fuzz the targets under fuzz/ for a few
# minutes when a change touches fuzzed code. In code-change mode it focuses on
# targets whose coverage the diff touches, using the coverage report the
# scheduled workflow publishes; without one it fuzzes every target.
# https://google.github.io/clusterfuzzlite/running-clusterfuzzlite/github-actions/

name: ClusterFuzzLite PR fuzzing

on:
  pull_request:
    # Drafts skip this workflow's jobs; `ready_for_review` runs them
    # (docs/contributing/ci.md#draft-pull-requests).
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    # Every crate a fuzz target links (`path =` dependencies in
    # fuzz/Cargo.toml); scripts/tests/test_ci_contract.py keeps this in sync.
    paths:
      - "fuzz/**"
      - "crates/bookclerk-mp4/**"
      - "crates/bookclerk-plugin-abi/**"
      - "crates/bookclerk-db-exec/**"
      - "crates/bookclerk-plugin-manifest/**"
      - "crates/bookclerk-workerd/**"
      - "crates/bookclerk-plugin-sdk/**"
      - "crates/bookclerk-resolve/**"
      - "crates/bookclerk-node-proto/**"
      - "crates/bookclerk-cover/**"
      - "crates/bookclerk-tags/**"
      - "crates/bookclerk-archive/**"
      - "crates/bookclerk-media/**"
      # Linked through bookclerk-media's `libav` feature, which the fuzz
      # build turns on.
      - "crates/bookclerk-libav/**"
      - "crates/bookclerk-config/**"
      - "crates/bookclerk-intake/**"
      - "crates/bookclerk-storefront/**"
      - "crates/bookclerk-plugins/optional/source-libro/**"
      - "crates/bookclerk-audible-catalog/**"
      - "crates/bookclerk-plugins/optional/source-graphicaudio/**"
      - "crates/bookclerk-plugins/optional/source-chirp/**"
      - "crates/bookclerk-library/**"
      - "crates/bookclerk-plugins/platform/database-sqlite/**"
      - "crates/bookclerk-window-policy/**"
      - "crates/bookclerk-storage/**"
      - "crates/bookclerk-discover/**"
      - "crates/bookclerk-model-pack/**"
      - "crates/bookclerk-plugin-catalog/**"
      - "crates/bookclerk-player-api/**"
      - "crates/bookclerk-plugins/optional/notifier-email/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/cflite-*.yml"
  workflow_dispatch:

permissions:
  contents: read
  # Code-change mode downloads the batch workflow's coverage and corpus artifacts.
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # A visual approval commit (only ui/visual/baselines.lock changed since a
  # parent whose run of this workflow succeeded) carries that run over
  # instead of running again (docs/contributing/ci.md#visual-approval-commits).
  # It is skipped outside pull requests, and a skipped ancestor skips every
  # later job whose `if` has no status function, so each job after it starts
  # with `!cancelled()` or `always()` and checks its needs' results itself.
  carry:
    name: Look for a visual approval commit
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run-id: ${{ steps.carry.outputs.run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Look for a visual approval commit
        id: carry
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: >-
          python3 scripts/ci_carry.py find --repo "$REPO" --workflow cflite-pr.yml
          --head "$HEAD_SHA" --head-repo "$HEAD_REPO" --head-branch "$HEAD_BRANCH"
          --kind run --dest "$RUNNER_TEMP/ci-carry"

  pr:
    name: fuzz changed code (${{ matrix.sanitizer }})
    # Pull request runs take turns in three slots, each run in the one its run
    # id's last digit picks, so they leave runners for the merge queue
    # (docs/contributing/ci.md#pull-request-lanes).
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('cflite-pr-slot-{0}', ((endsWith(format('{0}', github.run_id), '0') || endsWith(format('{0}', github.run_id), '3') || endsWith(format('{0}', github.run_id), '6') || endsWith(format('{0}', github.run_id), '9')) && '0' || (endsWith(format('{0}', github.run_id), '1') || endsWith(format('{0}', github.run_id), '4') || endsWith(format('{0}', github.run_id), '7')) && '1' || '2')) || format('cflite-{0}-{1}-{2}', github.run_id, github.run_attempt, matrix.sanitizer) }}
      queue: max
    # Deferred on a draft pull request until it is ready for review.
    # Skipped as well for a visual approval commit carried over.
    needs: carry
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      needs.carry.outputs.run-id == ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address]
    steps:
      # The run step's action and its entrypoint script live in the
      # repository. Check out before building: checkout cleans the
      # workspace, which would remove the built fuzzers.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}

      # The stock run_fuzzers action in code-change mode, except that each
      # corpus and coverage lookup is one API request: the stock lookup can
      # page through every artifact until the repository's API budget runs
      # out (docs/contributing/fuzzing.md#artifact-lookups).
      - name: Run fuzzers
        id: run
        uses: ./.github/actions/cflite-run-fuzzers
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          sanitizer: ${{ matrix.sanitizer }}
