# ClusterFuzzLite on pull requests: fuzz the targets under fuzz/ for a few
# minutes when a change touches fuzzed code. In code-change mode it focuses on
# targets whose coverage the diff touches, using the coverage report the
# scheduled workflow publishes; without one it fuzzes every target.
# https://google.github.io/clusterfuzzlite/running-clusterfuzzlite/github-actions/

name: ClusterFuzzLite PR fuzzing

on:
  pull_request:
    branches: [main]
    # Every crate a fuzz target links (`path =` dependencies in
    # fuzz/Cargo.toml); scripts/tests/test_ci_contract.py keeps this in sync.
    paths:
      - "fuzz/**"
      - "crates/bookclerk-mp4/**"
      - "crates/bookclerk-plugin-abi/**"
      - "crates/bookclerk-db-exec/**"
      - "crates/bookclerk-plugin-manifest/**"
      - "crates/bookclerk-workerd/**"
      - "crates/bookclerk-plugin-sdk/**"
      - "crates/bookclerk-resolve/**"
      - "crates/bookclerk-node-proto/**"
      - "crates/bookclerk-cover/**"
      - "crates/bookclerk-config/**"
      - "crates/bookclerk-source/**"
      - "crates/bookclerk-plugins/optional/source-libro/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/cflite-*.yml"
  workflow_dispatch:

permissions:
  contents: read
  # Code-change mode downloads the batch workflow's coverage and corpus artifacts.
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr:
    name: fuzz changed code (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address]
    steps:
      # The run step's action and its entrypoint script live in the
      # repository. Check out before building: checkout cleans the
      # workspace, which would remove the built fuzzers.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}

      # The stock run_fuzzers action in code-change mode, except that each
      # corpus and coverage lookup is one API request: the stock lookup can
      # page through every artifact until the repository's API budget runs
      # out (docs/contributing/fuzzing.md#artifact-lookups).
      - name: Run fuzzers
        id: run
        uses: ./.github/actions/cflite-run-fuzzers
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          sanitizer: ${{ matrix.sanitizer }}
