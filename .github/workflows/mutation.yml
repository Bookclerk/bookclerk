# Mutation testing of the Rust code a pull request changes
# (docs/contributing/ci.md#mutation-testing).
#
# - Coverage shows which lines the tests run, not whether a test would
#   notice them doing the wrong thing. cargo-mutants makes small changes to
#   the changed functions (a flipped comparison, a body that returns a
#   default) and runs the package's tests against each; a change every test
#   still passes on is a "missed" mutant, reported in the job summary and as
#   an annotation on the diff.
# - Only the functions the pull request touches are mutated (`--in-diff`,
#   from the merge commit's diff against the base), so the cost follows the
#   change. The run stops at a time limit and reports what it tested.
# - Trial: report-only and not a required check. Settings live in
#   .cargo/mutants.toml.
#
# It runs the pull request's code with a read-only token, like CI.

name: Mutation testing

on:
  pull_request:
    paths:
      # Any Rust file: workspace members live under crates/, examples/ and
      # tools/; a file outside the workspace yields no mutants.
      - "**/*.rs"
      - ".cargo/mutants.toml"
      - ".github/workflows/mutation.yml"
      - "scripts/mutation_report.py"

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI denies warnings, and a mutant that leaves a parameter unused would
  # then fail to build and be reported as unviable instead of tested. Lints
  # are capped for every build in this job, the prerequisites included, so
  # the mutant builds reuse what they built.
  RUSTFLAGS: "--cap-lints=warn"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: "0"

jobs:
  rust:
    name: Rust mutants (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # As in CI's `unit + integration tests` job: confinement tests that would
    # otherwise skip without enforcement must run, or their mutants would
    # all read as missed.
    env:
      BOOKCLERK_SANDBOX_REQUIRE_ENFORCEMENT: "1"
      BOOKCLERK_SANDBOX_REQUIRE_SPAWN_ENFORCEMENT: "1"
    permissions:
      contents: read
    steps:
      # The pull request merged onto its base branch, as CI tests it, so a
      # branch cut before a workflow change still runs with the scripts this
      # workflow calls.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # The pull request's changes as they land on the base branch: the
      # merge commit against its first parent, the base. Its line numbers
      # match this checkout.
      - name: Diff the pull request
        run: git diff HEAD^1 HEAD > "$RUNNER_TEMP/pr.diff"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      # Tool versions shared with the Dev Container (docs/contributing/ci.md#tool-versions).
      - name: Read tool pins
        id: pins
        run: python3 scripts/tool_versions.py github-output >> "$GITHUB_OUTPUT"

      - name: Install cargo-nextest and cargo-mutants
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@${{ steps.pins.outputs.cargo-nextest }},cargo-mutants@27.1.0

      - name: Install capnproto
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends capnproto

      # Its own cache: mutant builds cap lints and build incrementally, so
      # CI's `debug` cache would not match.
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: mutants
          cache-on-failure: true

      # The helpers and guests CI's `rust_test` check builds first (the jail,
      # the workerd front door, the pinned workerd, the platform guests), so
      # tests that launch them run instead of failing the baseline or
      # skipping. The planner lists them; its summary stays out of this
      # job's.
      - name: Build the test prerequisites
        run: |
          set -euo pipefail
          env -u GITHUB_STEP_SUMMARY python3 scripts/ci-exec.py resolve --force-full --event pull_request --run-id "$GITHUB_RUN_ID" > /dev/null
          python3 scripts/ci-exec.py prereqs rust_test --github-env

      # Mutants live only in function bodies, so a file changed only outside
      # them (an attribute, a constant, a struct the code reads) gives none
      # from the diff. Such files are mutated whole instead, so the tests of
      # the code beside the changed data are checked too: the diff is
      # rewritten to mark the lines of their mutants. Past the budget, lines
      # spread across the files are marked until they admit the budget's
      # worth, starting at a point that follows the pull request number.
      # Each mutant runs its package's whole test suite
      # (about 2 minutes for bookclerk-library), so a file with 230 mutants
      # would otherwise hold a runner for the whole time limit.
      - name: Widen to files changed outside functions
        env:
          PR: ${{ github.event.pull_request.number }}
          WIDEN_BUDGET: "15"
        run: |
          set -euo pipefail
          cargo mutants --workspace --in-diff "$RUNNER_TEMP/pr.diff" --list > "$RUNNER_TEMP/listed.txt"
          python3 scripts/mutation_report.py widen --diff "$RUNNER_TEMP/pr.diff" --listed "$RUNNER_TEMP/listed.txt" > "$RUNNER_TEMP/widened.txt"
          if [ -s "$RUNNER_TEMP/widened.txt" ]; then
            mapfile -t files < "$RUNNER_TEMP/widened.txt"
            filters=()
            for f in "${files[@]}"; do filters+=(--file "$f"); done
            cargo mutants --workspace --list --json "${filters[@]}" > "$RUNNER_TEMP/widened-listed.json"
            python3 scripts/mutation_report.py sample --diff "$RUNNER_TEMP/pr.diff" \
              --listed "$RUNNER_TEMP/widened-listed.json" --budget "$WIDEN_BUDGET" --seed "$PR" \
              --record "$RUNNER_TEMP/sample.json"
          fi

      # `--in-place` mutates this checkout, which the runner throws away;
      # cargo-mutants restores each file after its mutant. The time limit
      # stops it with SIGINT, which still writes the lists of what it tested.
      - name: Test the mutants
        id: mutants
        env:
          # Each mutant rebuilds only what it changed. Set on the step:
          # rust-cache exports CARGO_INCREMENTAL=0 for the rest of the job.
          CARGO_INCREMENTAL: "1"
        run: |
          set +e
          timeout --signal=INT --kill-after=5m 50m \
            cargo mutants --workspace --in-diff "$RUNNER_TEMP/pr.diff" --in-place --no-shuffle --output "$RUNNER_TEMP"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 124 ] || [ "$code" -eq 130 ] || [ "$code" -eq 137 ]; then
            echo "stopped=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Report
        if: ${{ !cancelled() }}
        env:
          CODE: ${{ steps.mutants.outputs.code }}
          STOPPED: ${{ steps.mutants.outputs.stopped }}
        run: |
          set -euo pipefail
          args=(--out "$RUNNER_TEMP/mutants.out" --exit-code "${CODE:-1}" --widened "$RUNNER_TEMP/widened.txt" --sample "$RUNNER_TEMP/sample.json")
          if [ "${STOPPED:-}" = "true" ]; then args+=(--stopped); fi
          python3 scripts/mutation_report.py "${args[@]}"

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-rust
          path: ${{ runner.temp }}/mutants.out
          if-no-files-found: ignore
          retention-days: 7
