# Nightly mutation testing of the Rust code merged since the last run
# (docs/contributing/ci.md#mutation-testing).
#
# - Coverage shows which lines the tests run, not whether a test would
#   notice them doing the wrong thing. cargo-mutants makes small changes to
#   the changed functions (a flipped comparison, a body that returns a
#   default) and runs the package's tests against each; a change every test
#   still passes on is a "missed" mutant, reported in the job summary and
#   filed as an issue (mutation-issue.yml).
# - Only the functions changed since the last successful run are mutated
#   (`--in-diff`, from the default branch's diff against that run's commit;
#   scripts/mutation_base.py), so the cost follows what merged that day. It
#   runs off pull requests so it never slows them, and stops at a time
#   limit and reports what it tested.
# - Never a required check. Settings live in .cargo/mutants.toml.
#
# A manual run can start from an older commit (`base`).

name: Mutation testing

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: "Commit to start from (default: the last successful run's)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: mutation-rust
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # CI denies warnings, and a mutant that leaves a parameter unused would
  # then fail to build and be reported as unviable instead of tested. Lints
  # are capped for every build in this job, the prerequisites included, so
  # the mutant builds reuse what they built.
  RUSTFLAGS: "--cap-lints=warn"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: "0"

jobs:
  rust:
    name: Rust mutants
    runs-on: ubuntu-latest
    # The mutants' 4 hours (plus 5 minutes to stop) and room for the build.
    timeout-minutes: 300
    # As in CI's `unit + integration tests` job: confinement tests that would
    # otherwise skip without enforcement must run, or their mutants would
    # all read as missed.
    env:
      BOOKCLERK_SANDBOX_REQUIRE_ENFORCEMENT: "1"
      BOOKCLERK_SANDBOX_REQUIRE_SPAWN_ENFORCEMENT: "1"
    permissions:
      contents: read
      # The last successful run's commit (scripts/mutation_base.py).
      actions: read
    steps:
      # Full history, to diff against the last run's commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # What merged since the last successful run. Its line numbers match
      # this checkout.
      - name: Diff the code merged since the last run
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          base=$(python3 scripts/mutation_base.py --workflow mutation.yml --base "${BASE:-}")
          git diff "$base" HEAD > "$RUNNER_TEMP/pr.diff"
          # Nothing to build or mutate when no Rust file changed.
          if [ -n "$(git diff --name-only "$base" HEAD -- '*.rs')" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Mutating the Rust changes in \`$base..$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust toolchain
        if: steps.diff.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      # Tool versions shared with the Dev Container (docs/contributing/ci.md#tool-versions).
      - name: Read tool pins
        id: pins
        if: steps.diff.outputs.rust == 'true'
        run: python3 scripts/tool_versions.py github-output >> "$GITHUB_OUTPUT"

      - name: Install cargo-nextest and cargo-mutants
        if: steps.diff.outputs.rust == 'true'
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@${{ steps.pins.outputs.cargo-nextest }},cargo-mutants@27.1.0

      - name: Install capnproto
        if: steps.diff.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends capnproto

      # Its own cache: mutant builds cap lints and build incrementally, so
      # CI's `debug` cache would not match.
      - name: Cache cargo
        if: steps.diff.outputs.rust == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: mutants
          cache-on-failure: true

      # The mutant builds fill the target directory as the night goes on, and
      # a runner whose disk fills up loses contact with GitHub, taking the
      # log and every result with it. Remove preinstalled SDKs the job never
      # uses to give it room.
      - name: Free disk space
        if: steps.diff.outputs.rust == 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / "$RUNNER_TEMP" "$GITHUB_WORKSPACE"

      # The helpers and guests CI's `rust_test` check builds first (the jail,
      # the workerd front door, the pinned workerd, the platform guests), so
      # tests that launch them run instead of failing the baseline or
      # skipping. The planner lists them; its summary stays out of this
      # job's.
      - name: Build the test prerequisites
        if: steps.diff.outputs.rust == 'true'
        run: |
          set -euo pipefail
          env -u GITHUB_STEP_SUMMARY python3 scripts/ci-exec.py resolve --force-full --event pull_request --run-id "$GITHUB_RUN_ID" > /dev/null
          python3 scripts/ci-exec.py prereqs rust_test --github-env

      # Mutants live only in function bodies, so a file changed only outside
      # them (an attribute, a constant, a struct the code reads) gives none
      # from the diff. Such files are mutated whole instead, so the tests of
      # the code beside the changed data are checked too: the diff is
      # rewritten to mark the lines of their mutants. Past the budget, lines
      # spread across the files are marked until they admit the budget's
      # worth, starting at a point that follows the run number.
      # Each mutant runs its package's whole test suite
      # (about 2 minutes for bookclerk-library), so a file with 230 mutants
      # would otherwise hold a runner for the whole time limit.
      - name: Widen to files changed outside functions
        if: steps.diff.outputs.rust == 'true'
        env:
          SEED: ${{ github.run_number }}
          WIDEN_BUDGET: "60"
        run: |
          set -euo pipefail
          cargo mutants --workspace --in-diff "$RUNNER_TEMP/pr.diff" --list > "$RUNNER_TEMP/listed.txt"
          python3 scripts/mutation_report.py widen --diff "$RUNNER_TEMP/pr.diff" --listed "$RUNNER_TEMP/listed.txt" > "$RUNNER_TEMP/widened.txt"
          if [ -s "$RUNNER_TEMP/widened.txt" ]; then
            mapfile -t files < "$RUNNER_TEMP/widened.txt"
            filters=()
            for f in "${files[@]}"; do filters+=(--file "$f"); done
            cargo mutants --workspace --list --json "${filters[@]}" > "$RUNNER_TEMP/widened-listed.json"
            python3 scripts/mutation_report.py sample --diff "$RUNNER_TEMP/pr.diff" \
              --listed "$RUNNER_TEMP/widened-listed.json" --budget "$WIDEN_BUDGET" --seed "$SEED" \
              --record "$RUNNER_TEMP/sample.json"
          fi

      # `--in-place` mutates this checkout, which the runner throws away;
      # cargo-mutants restores each file after its mutant. The time limit
      # stops it with SIGINT, which still writes the lists of what it tested.
      # A watchdog does the same when the disk or memory runs low: a runner
      # that runs out loses contact with GitHub, and the job then fails with
      # no log and no results, so the next run retries an ever larger range.
      # It also logs the disk and memory left every 10 minutes.
      - name: Test the mutants
        id: mutants
        if: steps.diff.outputs.rust == 'true'
        env:
          # Each mutant rebuilds only what it changed. Set on the step:
          # rust-cache exports CARGO_INCREMENTAL=0 for the rest of the job.
          CARGO_INCREMENTAL: "1"
          # Stop below this much free disk (target directory) or available
          # memory, in MiB. Memory must stay low for two checks in a row, so
          # one test's peak does not stop the run.
          MIN_FREE_DISK_MIB: "3072"
          MIN_AVAILABLE_MEMORY_MIB: "768"
        run: |
          set +e
          timeout --signal=INT --kill-after=5m 240m \
            cargo mutants --workspace --in-diff "$RUNNER_TEMP/pr.diff" --in-place --no-shuffle --output "$RUNNER_TEMP" &
          mutants=$!
          reason=""
          low_memory=0
          checks=0
          while kill -0 "$mutants" 2>/dev/null; do
            sleep 15
            disk=$(df --output=avail -BM "$GITHUB_WORKSPACE/target" 2>/dev/null | tail -1 | tr -dc 0-9)
            memory=$(awk '/^MemAvailable:/ { print int($2 / 1024) }' /proc/meminfo)
            checks=$((checks + 1))
            if [ $((checks % 40)) -eq 0 ]; then
              echo "::notice::Watchdog: ${disk:-?} MiB disk free, ${memory:-?} MiB memory available"
            fi
            if [ -n "$disk" ] && [ "$disk" -lt "$MIN_FREE_DISK_MIB" ]; then
              reason=low-disk
            elif [ -n "$memory" ] && [ "$memory" -lt "$MIN_AVAILABLE_MEMORY_MIB" ]; then
              low_memory=$((low_memory + 1))
              if [ "$low_memory" -ge 2 ]; then reason=low-memory; fi
            else
              low_memory=0
            fi
            if [ -n "$reason" ]; then
              # timeout passes the signal on to cargo-mutants. When it has
              # already exited on its own, there is nothing to stop.
              if kill -INT "$mutants" 2>/dev/null; then
                echo "::warning::Stopping cargo-mutants: ${disk:-?} MiB disk free, ${memory:-?} MiB memory available ($reason)"
              else
                reason=""
              fi
              break
            fi
          done
          wait "$mutants"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          interrupted=false
          if [ "$code" -eq 124 ] || [ "$code" -eq 130 ] || [ "$code" -eq 137 ]; then interrupted=true; fi
          # Only an interrupted run is a stopped one: a run that ended on its
          # own (a baseline failure, an error) keeps its exit code's meaning,
          # even if the watchdog fired as it was ending.
          if [ "$interrupted" = true ] && [ -n "$reason" ]; then
            echo "stopped=$reason" >> "$GITHUB_OUTPUT"
          elif [ "$interrupted" = true ]; then
            echo "stopped=time-limit" >> "$GITHUB_OUTPUT"
          fi
          df -h "$GITHUB_WORKSPACE/target"
          exit 0

      - name: Report
        if: ${{ !cancelled() }}
        env:
          RUST: ${{ steps.diff.outputs.rust }}
          DIFF: ${{ steps.diff.outcome }}
          CODE: ${{ steps.mutants.outputs.code }}
          STOPPED: ${{ steps.mutants.outputs.stopped }}
        run: |
          set -euo pipefail
          if [ "$DIFF" != "success" ]; then
            echo "Could not choose the range to mutate; check the job log." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "${RUST:-}" != "true" ]; then
            echo "No Rust file changed since the last run, so nothing was mutated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/issue"
          args=(--out "$RUNNER_TEMP/mutants.out" --exit-code "${CODE:-1}" --widened "$RUNNER_TEMP/widened.txt" --sample "$RUNNER_TEMP/sample.json" --issue "$RUNNER_TEMP/issue/rust.md")
          if [ -n "${STOPPED:-}" ]; then args+=(--stopped "$STOPPED"); fi
          python3 scripts/mutation_report.py "${args[@]}"

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-rust
          path: ${{ runner.temp }}/mutants.out
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the issue body
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-issue-rust
          path: ${{ runner.temp }}/issue/rust.md
          if-no-files-found: ignore
          retention-days: 7

  issue:
    needs: rust
    if: ${{ !cancelled() }}
    permissions:
      issues: write
    uses: ./.github/workflows/mutation-issue.yml
