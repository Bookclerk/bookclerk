# Mutation testing of the Worker code a pull request changes
# (docs/contributing/ci.md#mutation-testing).
#
# - The TypeScript side of mutation.yml: Stryker makes small changes to the
#   lines a pull request changes in each Cloudflare Worker (a flipped
#   condition, an emptied string or array, a removed call) and runs the
#   Worker's Vitest suite against each; a change every test still passes on
#   is a "missed" mutant, listed in the job summary and annotated on the
#   diff. Stryker also mutates literals, so a change to data (a constant
#   string, a table) gets mutants too.
# - Only the changed lines of each Worker's sources are mutated (Stryker's
#   `--mutate path:start-end`, from the merge commit's diff against the
#   base; a deletion counts as a change to the line before it); tests, test
#   support and configuration are not.
# - A changed file whose changed lines give no mutant (a type, an import, an
#   export) gets a second pass on a sample of its other lines, so the tests
#   of the code beside the change are still checked, as mutation.yml does
#   for Rust data changes.
# - Trial: report-only and not a required check. Settings live in
#   scripts/stryker.config.json.
#
# It runs the pull request's code with a read-only token, like CI.

name: Mutation testing (Workers)

on:
  pull_request:
    paths:
      - "tools/site/**"
      - "tools/demo/**"
      - "tools/diagnostics-collector/**"
      - "scripts/stryker.config.json"
      - "scripts/stryker_report.py"
      - ".github/workflows/mutation-workers.yml"

permissions:
  contents: read

concurrency:
  group: mutation-workers-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # A CI-only tool, pinned here like cargo-mutants in mutation.yml. It is
  # installed for the run only (`--no-save`), not added to the Workers'
  # lockfiles, so the deployed Workers' dependency graph stays as it is.
  STRYKER_VERSION: "10.1.1"

jobs:
  worker:
    name: Mutants (${{ matrix.name }}, report only)
    runs-on: ubuntu-latest
    # Stryker's 20 minutes (plus 2 to stop) and room for setup and the report.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: site
            root: tools/site
          - name: demo
            root: tools/demo
          - name: collector
            root: tools/diagnostics-collector
    steps:
      # The pull request merged onto its base branch, as CI tests it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # The pull request's changes as they land on the base branch, then the
      # changed line ranges of this Worker's sources, in Stryker's syntax.
      - name: Find the changed lines
        id: lines
        env:
          ROOT: ${{ matrix.root }}
        run: |
          set -euo pipefail
          git diff HEAD^1 HEAD > "$RUNNER_TEMP/pr.diff"
          mutate=$(python3 scripts/stryker_report.py lines --diff "$RUNNER_TEMP/pr.diff" --root "$ROOT")
          echo "mutate=$mutate" >> "$GITHUB_OUTPUT"

      - name: Install Node.js
        if: steps.lines.outputs.mutate != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: ${{ matrix.root }}/package-lock.json

      - name: Install dependencies and Stryker
        if: steps.lines.outputs.mutate != ''
        working-directory: ${{ matrix.root }}
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save "@stryker-mutator/core@$STRYKER_VERSION" "@stryker-mutator/vitest-runner@$STRYKER_VERSION"

      # `inPlace` mutates this checkout, which the runner throws away;
      # Stryker restores each file afterwards. The time limit (20 minutes
      # for both passes) leaves room to report inside the job's: on SIGINT,
      # incremental mode writes the mutants tested so far to the report.
      # The signal goes to Stryker alone (`--foreground`, and its binary
      # rather than npx), so its test runners are still alive while it
      # saves. The second pass mutates the first pass's lines too, so
      # incremental mode carries their results over instead of dropping
      # them, without testing them again.
      - name: Test the mutants
        id: mutants
        if: steps.lines.outputs.mutate != ''
        working-directory: ${{ matrix.root }}
        env:
          MUTATE: ${{ steps.lines.outputs.mutate }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set +e
          limit=1200
          # 0: finished; 1: stopped at the time limit; 2: failed.
          stryker() {
            timeout --foreground --signal=INT --kill-after=2m "$1" node_modules/.bin/stryker run ../../scripts/stryker.config.json --mutate "$2"
            code=$?
            if [ "$code" -eq 124 ] || [ "$code" -eq 130 ] || [ "$code" -eq 137 ]; then
              echo "stopped=true" >> "$GITHUB_OUTPUT"
              return 1
            fi
            [ "$code" -eq 0 ] || return 2
          }
          SECONDS=0
          stryker "${limit}s" "$MUTATE" || exit 0
          widened=$(python3 ../../scripts/stryker_report.py widen --report reports/mutation/mutation.json --mutate "$MUTATE" --root . --seed "$PR" --list "$RUNNER_TEMP/widened.txt")
          [ -n "$widened" ] || exit 0
          left=$((limit - SECONDS))
          # Too little time for a second start-up, or a second pass that
          # failed: the report names the files it did not sample.
          if [ "$left" -le 120 ]; then
            mv "$RUNNER_TEMP/widened.txt" "$RUNNER_TEMP/unwidened.txt"
          else
            stryker "${left}s" "$widened"
            if [ $? -eq 2 ]; then mv "$RUNNER_TEMP/widened.txt" "$RUNNER_TEMP/unwidened.txt"; fi
          fi
          exit 0

      - name: Report
        if: ${{ !cancelled() }}
        env:
          ROOT: ${{ matrix.root }}
          NAME: ${{ matrix.name }}
          MUTATE: ${{ steps.lines.outputs.mutate }}
          STOPPED: ${{ steps.mutants.outputs.stopped }}
        run: |
          set -euo pipefail
          args=(--report "$ROOT/reports/mutation/mutation.json" --root "$ROOT" --name "$NAME" --widened "$RUNNER_TEMP/widened.txt" --unwidened "$RUNNER_TEMP/unwidened.txt")
          if [ -z "$MUTATE" ]; then args+=(--not-mutated); fi
          if [ "${STOPPED:-}" = "true" ]; then args+=(--stopped); fi
          python3 scripts/stryker_report.py report "${args[@]}"

      - name: Upload the results
        if: ${{ !cancelled() && steps.lines.outputs.mutate != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-${{ matrix.name }}
          path: ${{ matrix.root }}/reports/mutation
          if-no-files-found: ignore
          retention-days: 7
