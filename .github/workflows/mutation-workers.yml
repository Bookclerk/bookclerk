# Mutation testing of the Worker code a pull request changes
# (docs/contributing/ci.md#mutation-testing).
#
# - The TypeScript side of mutation.yml: Stryker makes small changes to the
#   lines a pull request changes in each Cloudflare Worker (a flipped
#   condition, an emptied string or array, a removed call) and runs the
#   Worker's Vitest suite against each; a change every test still passes on
#   is a "missed" mutant, listed in the job summary and annotated on the
#   diff. Stryker also mutates literals, so a change to data (a constant
#   string, a table) gets mutants too.
# - Only the changed lines of each Worker's sources are mutated (Stryker's
#   `--mutate path:start-end`, from the merge commit's diff against the
#   base); tests, test support and configuration are not.
# - Trial: report-only and not a required check. Settings live in
#   scripts/stryker.config.json.
#
# It runs the pull request's code with a read-only token, like CI.

name: Mutation testing (Workers)

on:
  pull_request:
    paths:
      - "tools/site/**"
      - "tools/demo/**"
      - "tools/diagnostics-collector/**"
      - "scripts/stryker.config.json"
      - "scripts/stryker_report.py"
      - ".github/workflows/mutation-workers.yml"

permissions:
  contents: read

concurrency:
  group: mutation-workers-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # A CI-only tool, pinned here like cargo-mutants in mutation.yml. It is
  # installed for the run only (`--no-save`), not added to the Workers'
  # lockfiles, so the deployed Workers' dependency graph stays as it is.
  STRYKER_VERSION: "10.1.1"

jobs:
  worker:
    name: Mutants (${{ matrix.name }}, report only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: site
            root: tools/site
          - name: demo
            root: tools/demo
          - name: collector
            root: tools/diagnostics-collector
    steps:
      # The pull request merged onto its base branch, as CI tests it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # The pull request's changes as they land on the base branch, then the
      # changed line ranges of this Worker's sources, in Stryker's syntax.
      - name: Find the changed lines
        id: lines
        env:
          ROOT: ${{ matrix.root }}
        run: |
          set -euo pipefail
          git diff HEAD^1 HEAD > "$RUNNER_TEMP/pr.diff"
          mutate=$(python3 scripts/stryker_report.py lines --diff "$RUNNER_TEMP/pr.diff" --root "$ROOT")
          echo "mutate=$mutate" >> "$GITHUB_OUTPUT"

      - name: Install Node.js
        if: steps.lines.outputs.mutate != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: ${{ matrix.root }}/package-lock.json

      - name: Install dependencies and Stryker
        if: steps.lines.outputs.mutate != ''
        working-directory: ${{ matrix.root }}
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save "@stryker-mutator/core@$STRYKER_VERSION" "@stryker-mutator/vitest-runner@$STRYKER_VERSION"

      # `inPlace` mutates this checkout, which the runner throws away;
      # Stryker restores each file afterwards. The time limit leaves room to
      # report inside the job's.
      - name: Test the mutants
        if: steps.lines.outputs.mutate != ''
        working-directory: ${{ matrix.root }}
        env:
          MUTATE: ${{ steps.lines.outputs.mutate }}
        run: |
          set +e
          timeout --signal=INT --kill-after=2m 20m npx stryker run ../../scripts/stryker.config.json --mutate "$MUTATE"
          exit 0

      - name: Report
        if: ${{ !cancelled() }}
        env:
          ROOT: ${{ matrix.root }}
          NAME: ${{ matrix.name }}
          MUTATE: ${{ steps.lines.outputs.mutate }}
        run: |
          set -euo pipefail
          args=(--report "$ROOT/reports/mutation/mutation.json" --root "$ROOT" --name "$NAME")
          if [ -z "$MUTATE" ]; then args+=(--not-mutated); fi
          python3 scripts/stryker_report.py report "${args[@]}"

      - name: Upload the results
        if: ${{ !cancelled() && steps.lines.outputs.mutate != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-${{ matrix.name }}
          path: ${{ matrix.root }}/reports/mutation
          if-no-files-found: ignore
          retention-days: 7
