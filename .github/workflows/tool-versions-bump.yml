# Daily bump of the tool pins in .tool-versions (docs/contributing/ci.md#tool-versions).
#
# Policy:
# - Only consider releases published ≥ 7 days ago (supply-chain cooldown, as
#   for Dependabot and the workerd pin).
# - scripts/tool_versions.py reads the releases listing and the image digest
#   (both untrusted) and rewrites .tool-versions and, for a tool with an
#   image, every Dockerfile FROM line that builds from it.
# - Open one PR per tool with the automation App token and turn on
#   auto-merge, so the merge queue lands it once the PR's required checks pass.
#
# Node.js majors are a decision, so `nodejs` is bumped by hand.
#
# The App token is required: the organization does not let GITHUB_TOKEN open
# pull requests, and pushes made with GITHUB_TOKEN would not start CI on the
# PR. See docs/contributing/automation.md#automation-app.

name: tool versions bump

on:
  schedule:
    # Daily 06:41 UTC, offset from workerd-pin-bump.yml.
    - cron: "41 6 * * *"
  workflow_dispatch:

# The branch, PR and auto-merge are written with the automation App token.
permissions:
  contents: read

concurrency:
  group: tool-versions-bump
  cancel-in-progress: false

env:
  TOOL_VERSIONS_COOLDOWN_DAYS: "7"

jobs:
  bump:
    name: bump ${{ matrix.tool }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every tool in scripts/tool_versions.py with a release repository
        # (scripts/tests/test_tool_versions.py checks the list).
        tool: [uv, cargo-nextest]
    env:
      TOOL: ${{ matrix.tool }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select eligible release
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/tool_versions.py describe "$TOOL" >> "$GITHUB_OUTPUT"
          repo="$(python3 scripts/tool_versions.py describe "$TOOL" | sed -n 's/^repo=//p')"
          gh api "repos/${repo}/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          if version="$(python3 scripts/tool_versions.py select "$TOOL" \
              --releases "$RUNNER_TEMP/releases.json" \
              --cooldown-days "$TOOL_VERSIONS_COOLDOWN_DAYS")"; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "bump=true" >> "$GITHUB_OUTPUT"
          else
            code=$?
            if [[ "$code" -eq 2 ]]; then
              echo "bump=false" >> "$GITHUB_OUTPUT"
            else
              exit "$code"
            fi
          fi

      # The registry's digest for the new tag; tool_versions.py refuses
      # anything but sha256:<64 hex>.
      - name: Resolve image digest
        if: steps.select.outputs.bump == 'true' && steps.select.outputs.image != ''
        id: digest
        env:
          IMAGE: ${{ steps.select.outputs.image }}
          VERSION: ${{ steps.select.outputs.version }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::unexpected digest for ${IMAGE}:${VERSION}"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Apply pin bump
        if: steps.select.outputs.bump == 'true'
        env:
          VERSION: ${{ steps.select.outputs.version }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          python3 scripts/tool_versions.py apply "$TOOL" "$VERSION" ${DIGEST:+--digest "$DIGEST"}
          git diff --stat

      - name: Check the pins agree
        if: steps.select.outputs.bump == 'true'
        run: |
          python3 -m pip install --quiet -r scripts/tests/requirements.txt
          python3 scripts/tests/test_dev_env.py
          python3 scripts/tests/test_tool_versions.py

      - name: Mint automation App token
        if: steps.select.outputs.bump == 'true'
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update pull request
        if: steps.select.outputs.bump == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app.outputs.token }}
          # Commit through the API so the commit is signed and attributed to the App.
          sign-commits: true
          commit-message: |
            build(deps): bump ${{ matrix.tool }} to ${{ steps.select.outputs.version }}

            The pin lives in .tool-versions; a release is taken only after a
            ${{ env.TOOL_VERSIONS_COOLDOWN_DAYS }}-day publish cooldown (supply-chain).
          branch: deps/tool-versions-${{ matrix.tool }}
          delete-branch: true
          title: "build(deps): bump ${{ matrix.tool }} to ${{ steps.select.outputs.version }}"
          body: |
            ## Summary
            - Bump `${{ matrix.tool }}` in `.tool-versions` to `${{ steps.select.outputs.version }}` (and its image in every Dockerfile that builds from one)
            - Cooldown: releases must be published ≥ **${{ env.TOOL_VERSIONS_COOLDOWN_DAYS }} days** ago

            ## Test plan
            - [x] `scripts/tool_versions.py` (cooldown filter, version and digest checks)
            - [x] `scripts/tests/test_dev_env.py` (workflows, Dockerfiles and `provision.sh` agree with `.tool-versions`)

            Auto-merge is on: the merge queue lands this PR once its required
            checks pass.
          labels: |
            dependencies
          # Git pathspec wildcards cross directories: every Dockerfile.
          add-paths: |
            .tool-versions
            *Dockerfile

      # Runs even when the branch was already up to date, so a run whose
      # earlier `gh pr merge --auto` failed gets another try.
      - name: Enable auto-merge
        if: steps.select.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "deps/tool-versions-${TOOL}" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr" ]]; then
            echo "No open ${TOOL} pin pull request."
            exit 0
          fi
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto --squash
