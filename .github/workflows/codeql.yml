# CodeQL code scanning (advanced setup).
#
# Replaces CodeQL default setup, which analyzes pull request heads and `main`
# but never merge groups. The "Protect Main" ruleset's code quality rule waits
# for CodeQL results on the commit being merged, so without a `merge_group`
# trigger every merge queue entry sits until the queue's check timeout drops
# it. Running here on `merge_group` gives the queue those results.
#
# Default setup must be switched off for this workflow's uploads to be
# accepted (Settings -> Code security -> CodeQL analysis).
#
# Every language uses build-mode `none`, so no toolchain or build is needed;
# the language list matches what default setup analyzed.
#
# https://docs.github.com/code-security/code-scanning

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

# Cancel superseded PR runs; never cancel merge_group / main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
