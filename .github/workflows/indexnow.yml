# Tell search engines which bookclerk.app pages are new or changed, through
# IndexNow (https://www.indexnow.org; Bing, Yandex, Seznam, Naver and Yep
# share what it receives). Runs after each site deploy and docs publish,
# daily, and by hand.
#
# tools/site/indexnow-run.ts reads every URL the live /sitemap.xml index
# lists, fingerprints each one (its <lastmod>, else a hash of the page as
# Markdown), compares them with the snapshot the previous run kept as an
# artifact, and submits the new, changed and removed URLs, each at most once
# per UTC day. The snapshot is an artifact, not an Actions cache entry,
# because CI's caches push small entries out within minutes. With no
# snapshot (the first run, or 90 days without an accepted run) only pages
# dated today or in the 7 days before are submitted. See
# docs/contributing/automation.md#indexnow.
#
# Variable INDEXNOW_KEY (repository or organization; public by design): the
# key site-deploy.yml serves as https://<DOMAIN>/<key>.txt. Without it the job
# is skipped, so forks submit nothing. No secrets; the only network access is
# to the site and api.indexnow.org.
#
# GITHUB_TOKEN permission keys:
# https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#permissions-for-the-github_token

name: indexnow

on:
  workflow_run:
    workflows: [site-deploy, docs-publish]
    types: [completed]
  # Catches changes the edge caches still hid from an earlier run.
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN:
#   contents → checkout
#   actions  → find and download the previous run's snapshot artifact
permissions:
  contents: read
  actions: read

jobs:
  # Outside the submit job's concurrency group, so a wait never holds up
  # another run.
  wait:
    if: >-
      vars.INDEXNOW_KEY != '' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      # The site serves main's docs from the edge cache for up to five
      # minutes, and GitHub's raw files are cached as long again.
      - name: Wait for the published docs to reach the site
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'docs-publish'
        run: sleep 600

  submit:
    needs: wait
    runs-on: ubuntu-latest
    # One submission at a time, each reading the snapshot the previous one
    # saved.
    concurrency:
      group: indexnow
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/site

      # The script imports nothing outside tools/site, so no npm install.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      # The newest snapshot an earlier run on the default branch kept. The
      # listing is read by previousSnapshotRun (tools/site/indexnow.ts,
      # fuzzed), which prints the run id or nothing.
      - name: Find the previous snapshot
        id: previous
        working-directory: tools/site
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          listing="$RUNNER_TEMP/indexnow-artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=indexnow-snapshot&per_page=20" > "$listing"
          id="$(node indexnow-run.ts --previous-run "$listing" "$DEFAULT_BRANCH")"
          if [[ "$id" =~ ^[1-9][0-9]{0,19}$ ]]; then
            echo "run-id=$id" >> "$GITHUB_OUTPUT"
          else
            echo "No earlier snapshot; this run submits only recently dated pages."
          fi

      - name: Download the previous snapshot
        if: steps.previous.outputs.run-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: indexnow-snapshot
          path: ${{ runner.temp }}
          run-id: ${{ steps.previous.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Submit new and changed URLs
        id: submit
        working-directory: tools/site
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
          SITE_ORIGIN: https://${{ vars.DOMAIN || 'bookclerk.app' }}
          SNAPSHOT: ${{ runner.temp }}/indexnow-snapshot.json
        run: |
          set -euo pipefail
          node indexnow-run.ts "$SNAPSHOT" "$SNAPSHOT.next"
          if [[ -f "$SNAPSHOT.next" ]]; then
            mv "$SNAPSHOT.next" "$SNAPSHOT"
            echo "saved=true" >> "$GITHUB_OUTPUT"
          fi

      # Kept only when IndexNow accepted the submission; a skipped or
      # refused run leaves the previous snapshot for the next one. The daily
      # run renews it long before it expires.
      - name: Keep the new snapshot
        if: steps.submit.outputs.saved == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: indexnow-snapshot
          path: ${{ runner.temp }}/indexnow-snapshot.json
          if-no-files-found: error
          retention-days: 90
          # A re-run of an accepted run replaces the artifact it kept.
          overwrite: true
