# Build and deploy the bookclerk.app website (tools/site) as the Cloudflare
# Worker `bookclerk-site` (static assets plus a script that renders /docs/
# from the Bookclerk/bookclerk-docs repository at request time and serves
# Markdown to `Accept: text/markdown` requests) via wrangler-action.
#
# Runs when the site, the docs or the brand assets change on main, when a
# release is published (the site shows the newest release and drops its
# pre-release notices), when docs-publish has tagged a release's docs in
# bookclerk-docs (the release joins the docs version picker), and by hand.
# /docs/ shows the newest release whose docs are published, else main;
# /docs/v/<ref>/ shows main and every other published release. The docs themselves
# are not deployed: the build reads docs/ only for the sidebar, sitemap.xml
# and llms.txt.
#
# GitHub repository secrets:
#   CLOUDFLARE_API_TOKEN   scoped to the Worker `bookclerk-site` (Workers,
#                          Editor role) and the DOMAIN zone (Workers Routes
#                          edit, for the custom domain); see
#                          docs/contributing/automation.md#cloudflare-worker-deploys
#   CLOUDFLARE_ACCOUNT_ID
#
# Organization variable DOMAIN (default bookclerk.app): the Worker is served on
# the custom domain <DOMAIN>, whose zone must be in the Cloudflare account.
#
# The pages link to the hosted demo (demo-deploy.yml) found the way that
# workflow publishes it: https://demo.<DOMAIN> when DOMAIN is set, otherwise
# the Actions variable DEMO_URL it records for a workers.dev deploy. With
# neither, or with DEMO_URL set to "none" (the demo is taken down), the site
# has no demo links.
#
# https://github.com/cloudflare/wrangler-action
# GITHUB_TOKEN permission keys:
# https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#permissions-for-the-github_token

name: site-deploy

on:
  push:
    branches: [main]
    paths:
      - "tools/site/**"
      - "docs/**"
      - "assets/brand/**"
      # Rendered as /security.
      - "SECURITY.md"
      - ".github/workflows/site-deploy.yml"
  release:
    types: [published]
  # docs-publish tags a release's docs after the release event, usually after
  # this workflow has run for it; redeploy then so the release's docs appear.
  workflow_run:
    workflows: [docs-publish]
    types: [completed]
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN:
#   contents → checkout and reading the latest release
permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Of docs-publish runs, only a successful release publish changes the
    # docs versions; main's publishes need no redeploy.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'release')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/site
    steps:
      # A release builds the current site from main (the tag may predate it)
      # and takes only the docs from the tag, below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}
          persist-credentials: false

      - name: Require deploy secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in CF_TOKEN CF_ACCOUNT; do
            eval "val=\${$name:-}"
            if [ -z "$val" ]; then
              echo "::error::Missing secret for $name (see workflow header)"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: tools/site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The newest published, non-prerelease release; none yet means the
      # site renders its pre-release notices. build.ts validates both values.
      - name: Read release state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DOCS_REPO: ${{ github.repository_owner }}/bookclerk-docs
        run: |
          set -euo pipefail
          # 404 means no release yet; any other failure stops the deploy
          # rather than wrongly marking a released project as pre-release.
          if json=$(gh api "repos/${REPO}/releases/latest" 2>gh-err.txt); then
            tag=$(jq -r '.tag_name' <<<"$json")
            date=$(jq -r '.published_at[0:10]' <<<"$json")
          elif grep -q 'HTTP 404' gh-err.txt; then
            tag=""
            date=""
          else
            cat gh-err.txt >&2
            exit 1
          fi
          # Same shape build.ts enforces; checked here too because the next
          # step passes the tag to git.
          if [[ -n "$tag" && ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Unexpected release tag: $tag"
            exit 1
          fi
          # Every published, non-prerelease release whose docs bookclerk-docs
          # has tagged, newest first, for the docs version picker. A release
          # whose docs are still being published is left out until the
          # workflow_run redeploy. build.ts checks each tag's shape again.
          tags=""
          if [[ -n "$tag" ]]; then
            published=$(gh api --paginate "repos/${DOCS_REPO}/tags?per_page=100" --jq '.[].name')
            releases=$(gh api --paginate "repos/${REPO}/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
            tags=$(grep -Fxf <(printf '%s\n' "$published") <<<"$releases" | tr '\n' ' ' || true)
          fi
          tag_re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          for t in $tags; do
            if [[ ! "$t" =~ $tag_re ]]; then
              echo "::error::Unexpected release tag: $t"
              exit 1
            fi
          done
          docs_tag="${tags%% *}"
          echo "Release: ${tag:-none}; docs versions: ${tags:-none}"
          {
            echo "tag=${tag}"
            echo "date=${date}"
            echo "tags=${tags}"
            echo "docs_tag=${docs_tag}"
          } >> "$GITHUB_OUTPUT"

      # Once a release's docs are published the sidebar, sitemap and llms.txt
      # come from its tag's docs, whatever commit the site is built from.
      - name: Use the release's docs
        if: steps.release.outputs.docs_tag != ''
        env:
          TAG: ${{ steps.release.outputs.docs_tag }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          rm -rf ../../docs
          git checkout "refs/tags/${TAG}" -- ../../docs

      # Wrangler bundles the Worker without checking its types, so a deploy
      # of a commit CI did not test still has to pass tsc.
      - name: Type-check the site
        run: npm run typecheck

      # After the docs swap, so the link check covers the docs listed.
      - name: Test the site generator
        run: npm test

      - name: Build the site
        env:
          SITE_RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SITE_RELEASE_DATE: ${{ steps.release.outputs.date }}
          SITE_DOCS_VERSIONS: ${{ steps.release.outputs.tags }}
          SITE_ORIGIN: https://${{ vars.DOMAIN || 'bookclerk.app' }}
          DOMAIN: ${{ vars.DOMAIN }}
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: |
          set -euo pipefail
          # build.ts validates the result as https://<lowercase hostname>.
          if [ "$DEMO_URL" = none ]; then
            SITE_DEMO_URL=""
          elif [ -n "$DOMAIN" ]; then
            SITE_DEMO_URL="https://demo.${DOMAIN}"
          else
            SITE_DEMO_URL="$DEMO_URL"
          fi
          export SITE_DEMO_URL
          echo "Demo link: ${SITE_DEMO_URL:-none}"
          # The checked-out commit: on a release that is main, not the tag.
          SITE_COMMIT=$(git rev-parse HEAD)
          export SITE_COMMIT
          SITE_BUILT_ON=$(date -u +%F) npm run build

      - name: Route the Worker to its custom domain
        env:
          DOMAIN: ${{ vars.DOMAIN || 'bookclerk.app' }}
        run: |
          set -euo pipefail
          # [[ =~ ]] matches the whole value, so a trailing newline is rejected.
          hostname_re='^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$'
          if [[ ! "$DOMAIN" =~ $hostname_re ]]; then
            echo "::error::DOMAIN is not a lowercase hostname: $DOMAIN"
            exit 1
          fi
          printf '\n[[routes]]\npattern = "%s"\ncustom_domain = true\n' "$DOMAIN" >> wrangler.toml
          echo "Site URL: https://${DOMAIN}"

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/site
          command: deploy
