# Files the missed mutants of a nightly mutation run as issues
# (docs/contributing/ci.md#mutation-testing).
#
# - Called by mutation.yml, mutation-workers.yml and mutation-python.yml
#   after their mutants job. That job's report step writes the summary to
#   `<area>.md` only when a mutant was missed, and uploads it as a
#   `mutation-issue-<area>` artifact; a run that missed nothing uploads none,
#   and this job does nothing.
# - One open issue per area, titled "Missed mutants: <area>", labelled
#   `mutation-testing`. A later run with missed mutants comments on it
#   instead of opening another; closing the issue once the tests are fixed
#   lets the next finding open a new one.
# - The only write token in the mutation workflows lives here, in a job that
#   checks out nothing and runs no repository code. The bodies come from
#   the default branch's own run.

name: Mutation testing issues

on:
  workflow_call:

permissions: {}

jobs:
  issue:
    name: File missed mutants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only the default branch's runs file issues; a manual run from another
    # branch still tests it and keeps its summaries as artifacts.
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      issues: write
    steps:
      - name: Download the summaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-issue-*
          merge-multiple: true
          path: ${{ runner.temp }}/issues

      - name: Open or update the issues
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/issues/*.md)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No missed mutants."
            exit 0
          fi
          gh label create mutation-testing --repo "$GITHUB_REPOSITORY" --color D93F0B \
            --description "Missed mutants from the nightly mutation testing runs" 2>/dev/null || true
          for file in "${files[@]}"; do
            area=$(basename "$file" .md)
            if ! [[ "$area" =~ ^[a-z][a-z0-9-]{0,30}$ ]]; then
              echo "::warning::Skipped a summary with an unexpected name."
              continue
            fi
            title="Missed mutants: $area"
            body="$RUNNER_TEMP/body-$area.md"
            {
              echo "Found by the nightly mutation run [$GITHUB_RUN_ID]($RUN_URL). Each missed mutant is a change to the code that every test still passes; add or tighten a test that fails on it, then close this issue."
              echo
              head -c 60000 "$file"
            } > "$body"
            number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label mutation-testing --state open --limit 1000 \
              --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label mutation-testing --body-file "$body"
            fi
          done
