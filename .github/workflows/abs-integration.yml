name: ABS Integration

# Audiobookshelf integration test: a real Audiobookshelf server and the
# production image with the Audiobookshelf plugin, configured with the CLI
# and exercised end to end (tests/abs-integration/smoke.sh). Heavyweight, so
# it runs by hand, on a published release, and on pull requests that change
# the test or the plugin it exercises.

on:
  workflow_dispatch:
  release:
    types: [published]
  pull_request:
    paths:
      - ".github/workflows/abs-integration.yml"
      - "tests/abs-integration/**"
      - "crates/bookclerk-plugins/optional/integration-audiobookshelf/**"

# Least privilege: checkout and a local Docker stack only.
permissions:
  contents: read

concurrency:
  group: abs-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abs-smoke:
    name: Audiobookshelf + bookclerkd
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The production builder and image, then the plugin layer on top: the
      # release build and three images need more than the runner's free
      # space, and these preinstalled toolchains are never used here.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build the images
        run: |
          set -euo pipefail
          docker build -f packaging/docker/Dockerfile --target builder -t bookclerk-builder:abs-ci .
          docker build -f packaging/docker/Dockerfile -t bookclerk:abs-ci .
          docker compose -f tests/abs-integration/docker-compose.yml build

      - name: Run the integration test
        run: bash tests/abs-integration/smoke.sh
