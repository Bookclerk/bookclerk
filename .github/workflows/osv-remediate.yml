# Bump locked dependencies that open OSV code-scanning alerts flag, prove the
# bump passes the full CI suite, and only then publish it and queue it.
#
# Runs after each full OSV scan of main (push, schedule or manual run of
# osv-scanner.yml). Reads the open OSV-Scanner alerts with the automation App
# token, then `scripts/osv-remediate.py` tries lockfile-only updates
# (Cargo.lock, package-lock.json, uv.lock) that move each flagged package out of its
# advisory's affected ranges. Manifests are never edited.
#
# Nothing about a bump is public until it is known to land:
# - `bump` commits the bump locally and seals it (a git bundle plus the pull
#   request body) with the OSV_REMEDIATION_BUNDLE_KEY secret, because
#   artifacts of a public repository are downloadable by anyone.
# - `verify` runs ci.yml with `private-head: true`: every CI job opens the
#   sealed bundle and checks the bump out, caches are not saved, and cargo
#   output is quiet.
# - `publish` runs only when CI Gate passed: it pushes the branch, opens the
#   pull request ready for review and turns on auto-merge, so the merge queue
#   lands it once the PR's required checks pass. A failed verification
#   publishes nothing; the run fails and the alerts stay in
#   Security -> Code scanning for a maintainer.
#
# While a remediation pull request is open, runs stop at `pending`:
# rebuilding the branch on every push to main would restart its checks and
# drop it from the merge queue. This workflow's own log prints counts only.
# See docs/contributing/automation.md#osv-remediation.

name: OSV remediation

on:
  workflow_run:
    workflows: ["OSV-Scanner"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Alerts are read and the branch and PR written with the automation App token.
permissions:
  contents: read

concurrency:
  group: osv-remediation
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  pending:
    name: check for an open remediation PR
    # Only full scans of main: PR and merge-group scans report diffs, not the
    # alerts on main. The event check also matters for safety: `branches`
    # matches the triggering run's head branch name, which a fork PR can also
    # call `main`. Either way every job checks out `github.sha`, which for
    # these events is the tip of main, never PR code.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      open: ${{ steps.find.outputs.open }}
    steps:
      # An open remediation PR is either queued to land or failed its checks
      # and waits for a maintainer; a new bump on top would only reset it.
      # Its successor runs after the next full scan once it is merged or
      # closed.
      - name: Find an open remediation pull request
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `owner:branch` and the head-repository check count only the
          # branch `publish` pushes here: a fork PR from a branch of the same
          # name must not hold off remediation.
          count="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&head=$GITHUB_REPOSITORY_OWNER:deps/osv-remediation" \
            --jq "[.[] | select(.head.repo.full_name == \"$GITHUB_REPOSITORY\")] | length")"
          if [[ "$count" -gt 0 ]]; then
            echo "::notice::a remediation pull request is open; skipping this run"
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

  bump:
    name: bump flagged dependencies
    needs: pending
    if: needs.pending.outputs.open == 'false'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
      sha: ${{ steps.seal.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      # The Python SDK's uv.lock is updated with `uv lock`. No cache: the
      # bump is not public yet.
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: .tool-versions
          enable-cache: false

      - name: Mint alert-read token
        id: read
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-security-events: read

      - name: Apply lockfile bumps
        id: bump
        env:
          ALERTS_TOKEN: ${{ steps.read.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/osv-remediation"
          python3 scripts/osv-remediate.py \
            --ref refs/heads/main \
            --summary "$RUNNER_TEMP/osv-remediation/summary.md" \
            --github-output "$GITHUB_OUTPUT"

      # A local commit only: it travels sealed to the CI jobs, and `publish`
      # recommits the same lockfiles through the API, signed by the App.
      - name: Commit and seal the bump
        id: seal
        env:
          BUNDLE_KEY: ${{ secrets.OSV_REMEDIATION_BUNDLE_KEY }}
          CHANGED: ${{ steps.bump.outputs.changed }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/osv-remediation"
          if [[ "$CHANGED" == "true" ]]; then
            # The script only rewrites tracked lockfiles.
            git add --update
            git -c user.name="OSV remediation" -c user.email="osv-remediation@invalid" \
              commit --quiet --no-verify -m "build(deps): bump dependencies flagged by OSV"
            git branch osv-remediation
            git bundle create --quiet "$dir/head.bundle" osv-remediation ^HEAD^
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p "$RUNNER_TEMP/osv-remediation-sealed"
          scripts/osv-remediation-bundle.sh seal "$dir" "$RUNNER_TEMP/osv-remediation-sealed/sealed.bin"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-remediation
          path: ${{ runner.temp }}/osv-remediation-sealed/sealed.bin
          if-no-files-found: error
          retention-days: 1

  verify:
    name: verify
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    # ci.yml's fail-fast job needs `actions: write` to cancel this run when a
    # CI job fails; every other ci.yml job keeps `contents: read`.
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/ci.yml
    with:
      private-head: true
      private-sha: ${{ needs.bump.outputs.sha }}
    secrets:
      OSV_REMEDIATION_BUNDLE_KEY: ${{ secrets.OSV_REMEDIATION_BUNDLE_KEY }}

  publish:
    name: publish and queue
    needs: [bump, verify]
    # Publish only a verified bump. `pending` already stopped the run when a
    # remediation PR was open, so there is never an earlier one to update.
    if: needs.bump.outputs.changed == 'true' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open the sealed bump
        id: head
        uses: ./.github/actions/osv-remediation-head
        with:
          key: ${{ secrets.OSV_REMEDIATION_BUNDLE_KEY }}
          sha: ${{ needs.bump.outputs.sha }}

      # Leave the verified lockfiles as uncommitted changes on github.sha for
      # create-pull-request to commit.
      - name: Stage the bump on main
        run: git reset --quiet --soft HEAD^

      - name: Mint pull-request token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app.outputs.token }}
          base: main
          # Commit through the API so the commit is signed and attributed to the App.
          sign-commits: true
          commit-message: |
            build(deps): bump dependencies flagged by OSV

            Lockfile-only updates within existing version requirements.
          branch: deps/osv-remediation
          delete-branch: true
          title: "build(deps): bump dependencies flagged by OSV"
          body-path: ${{ steps.head.outputs.dir }}/summary.md
          labels: |
            dependencies
          # Git pathspecs: `*` also matches `/`, so these cover nested lockfiles.
          add-paths: |
            *Cargo.lock
            *package-lock.json
            *uv.lock

      # The full suite already passed on this bump, so the PR opens ready and
      # goes straight to the merge queue once its required checks pass.
      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash
