# Daily pull of new diagnostics from the Cloudflare Worker `/report`
# endpoint, then triage on the Worker's Workers AI (`/triage`, no model
# tools, daily neuron budget) and open issues from the validated plan.
#
# Required repository secret:
#   DIAGNOSTICS_REPORT_API_KEY — Worker REPORT_API_KEY (set on deploy via wrangler-action);
#     authorizes /report, /report/cursor (where the collector keeps this
#     workflow's pull cursor), /triage, /issues/summaries and /issues/summary
#     (the summary comment kept on each issue) and /issues/notify (which links a filed
#     issue to its reports on the dashboard at once). It exists only here and in the Worker,
#     never in Bookclerk builds.
#
# Worker deploy: .github/workflows/diagnostics-collector-deploy.yml
# Collector URL: https://diagnostics.<DOMAIN> when variable DOMAIN is set,
# otherwise Actions variable DIAGNOSTICS_COLLECTOR_BASE_URL (the
# workers.dev URL the deploy stores)
#
# Permission names:
#   https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens#repository-permissions

name: diagnostics-ingest

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force_full:
        description: "Ignore stored cursor, pull from epoch (0) and re-triage reports that already have an issue"
        type: boolean
        default: false

# Least privilege:
#   contents — checkout (triage script lives in-repo) and releases/latest
#   issues   — create triage issues
permissions:
  contents: read
  issues: write

concurrency:
  group: diagnostics-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Require report API key
        env:
          KEY: ${{ secrets.DIAGNOSTICS_REPORT_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Set DIAGNOSTICS_REPORT_API_KEY (same value as Worker REPORT_API_KEY)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; keep the token out of .git/config.
          persist-credentials: false

      - name: Resolve collector base URL
        id: collector
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          STORED: ${{ vars.DIAGNOSTICS_COLLECTOR_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -n "$DOMAIN" ]; then
            # [[ =~ ]] matches the whole value, so a trailing newline is rejected.
            hostname_re='^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$'
            if [[ ! "$DOMAIN" =~ $hostname_re ]]; then
              echo "::error::DOMAIN is not a lowercase hostname: $DOMAIN"
              exit 1
            fi
            BASE="https://diagnostics.${DOMAIN}"
          else
            BASE="${STORED%/}"
            if [ -z "$BASE" ]; then
              echo "::error::Set DOMAIN, or run diagnostics-collector-deploy to store DIAGNOSTICS_COLLECTOR_BASE_URL"
              exit 1
            fi
          fi
          echo "Using collector URL: $BASE"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Resolve cursor
        id: cursor
        env:
          FORCE: ${{ inputs.force_full }}
        run: |
          set -euo pipefail
          # The collector stores the cursor (POST /report/cursor below), so a
          # run starts where the last one ended. Forced runs pull from epoch;
          # the stored cursor never moves backwards.
          if [ "${FORCE:-false}" = "true" ]; then
            echo "query=since=0" >> "$GITHUB_OUTPUT"
            echo "Pulling from epoch (force_full)"
          else
            echo "query=cursor=stored" >> "$GITHUB_OUTPUT"
            echo "Pulling from the collector's stored cursor"
          fi

      - name: Resolve release baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Resolved here with the job's token rather than by the Worker:
          # unauthenticated calls from Cloudflare's shared egress addresses
          # are rate-limited by GitHub (HTTP 403). No published release
          # (404) means every version is ingested.
          # release_baseline.py parses the response (tools/diagnostics-collector/scripts),
          # so only a plain version label reaches $GITHUB_OUTPUT and the query.
          if gh api "repos/${REPO}/releases/latest" >/tmp/release.json 2>/tmp/baseline.err; then
            TAG=$(python3 tools/diagnostics-collector/scripts/release_baseline.py </tmp/release.json)
          elif grep -q 'HTTP 404' /tmp/baseline.err; then
            TAG=""
          else
            echo "::error::GitHub releases/latest lookup failed"
            cat /tmp/baseline.err
            exit 1
          fi
          echo "Release baseline: ${TAG:-(none, all versions)}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Pull /report
        id: pull
        env:
          BASE: ${{ steps.collector.outputs.base }}
          KEY: ${{ secrets.DIAGNOSTICS_REPORT_API_KEY }}
          CURSOR_QUERY: ${{ steps.cursor.outputs.query }}
          BASELINE_TAG: ${{ steps.baseline.outputs.tag }}
          FORCE: ${{ inputs.force_full }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/diagnostics-batch
          # unfiled=1 has the collector pass over reports an issue already
          # lists, so a re-pull (a forced run, or a failed filing retried)
          # cannot file them again.
          UNFILED_Q="&unfiled=1"
          if [ "${FORCE:-false}" = "true" ]; then
            UNFILED_Q=""
          fi
          # The key goes in a header read from stdin, never on argv.
          HTTP=$(printf 'header = "Authorization: Bearer %s"\n' "$KEY" \
            | curl -sS --config - -o /tmp/diagnostics-batch/report.json -w "%{http_code}" \
            -H "Accept: application/json" \
            "${BASE}/report?${CURSOR_QUERY}${UNFILED_Q}&baseline_version=${BASELINE_TAG}")
          if [ "$HTTP" != "200" ]; then
            echo "::error::Worker /report returned HTTP $HTTP"
            head -c 2000 /tmp/diagnostics-batch/report.json || true
            exit 1
          fi
          COUNT=$(python3 -c 'import json; print(json.load(open("/tmp/diagnostics-batch/report.json")).get("count",0))')
          NEXT=$(python3 -c 'import json; print(json.load(open("/tmp/diagnostics-batch/report.json")).get("next_since",0))')
          NEXT_AFTER=$(python3 -c 'import json; print(json.load(open("/tmp/diagnostics-batch/report.json")).get("next_after") or "")')
          BASELINE=$(python3 -c 'import json; d=json.load(open("/tmp/diagnostics-batch/report.json")); print(d.get("baseline_version") or "(all versions)")')
          SOURCE=$(python3 -c 'import json; print(json.load(open("/tmp/diagnostics-batch/report.json")).get("baseline_source",""))')
          SKIPPED=$(python3 -c 'import json; print(json.load(open("/tmp/diagnostics-batch/report.json")).get("skipped_version",0))')
          FILED=$(python3 -c 'import json; d=json.load(open("/tmp/diagnostics-batch/report.json")); print("%s (filter %s)" % (d.get("skipped_filed", 0), d.get("filed_filter", "off")))')
          LINKED=$(python3 -c 'import json; d=json.load(open("/tmp/diagnostics-batch/report.json")); print(" ".join("%s->#%s" % (l["report_id"][:8], l["issue"]) for l in d.get("linked", [])) or "none")')
          REGRESSIONS=$(python3 -c 'import json; print(json.load(open("/tmp/diagnostics-batch/report.json")).get("regressions",0))')
          {
            echo "count=$COUNT"
            echo "next_since=$NEXT"
            echo "next_after=$NEXT_AFTER"
          } >> "$GITHUB_OUTPUT"
          echo "Pulled count=$COUNT next_since=$NEXT next_after=${NEXT_AFTER:-(none)} baseline=$BASELINE source=$SOURCE skipped_version=$SKIPPED skipped_filed=$FILED linked_by_signature=$LINKED regressions=$REGRESSIONS"

      - name: Triage and file issues
        id: triage
        if: steps.pull.outputs.count != '0'
        env:
          COLLECTOR_BASE_URL: ${{ steps.collector.outputs.base }}
          REPORT_API_KEY: ${{ secrets.DIAGNOSTICS_REPORT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: tools/diagnostics-collector/scripts/triage-and-file.sh /tmp/diagnostics-batch/report.json

      - name: Store pull cursor
        # Only after every report in the batch is filed (or nothing needed
        # triage), so a failed filing is retried by the next run; reports an
        # issue already lists are skipped then (unfiled=1), not filed twice.
        if: ${{ always() && steps.pull.outcome == 'success' && (steps.triage.outcome == 'success' || steps.triage.outcome == 'skipped') }}
        env:
          BASE: ${{ steps.collector.outputs.base }}
          KEY: ${{ secrets.DIAGNOSTICS_REPORT_API_KEY }}
        run: |
          set -euo pipefail
          # The body comes from the collector's own answer; json.dumps keeps
          # the object name a JSON string whatever it holds.
          python3 -c 'import json; d=json.load(open("/tmp/diagnostics-batch/report.json")); print(json.dumps({"since": int(d.get("next_since") or 0), "after": str(d.get("next_after") or "")}))' > /tmp/diagnostics-cursor.json
          # The key goes in a header read from stdin, never on argv.
          printf 'header = "Authorization: Bearer %s"\n' "$KEY" \
            | curl -fsS --config - --max-time 30 \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/diagnostics-cursor.json \
            "${BASE}/report/cursor"
          echo

      - name: Update issue summary comments
        # Every issue whose figures changed (new reports, a member's attach or
        # detach on the dashboard) gets its one summary comment edited in
        # place, whether or not this run pulled anything.
        if: ${{ always() && steps.collector.outcome == 'success' }}
        env:
          COLLECTOR_BASE_URL: ${{ steps.collector.outputs.base }}
          REPORT_API_KEY: ${{ secrets.DIAGNOSTICS_REPORT_API_KEY }}
          # The script edits the summary comment this token's bot account
          # wrote; a different token writes as another account and starts a
          # new comment.
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: tools/diagnostics-collector/scripts/update-summaries.sh
