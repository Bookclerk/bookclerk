# Nightly mutation testing of the Python SDK code merged since the last run
# (docs/contributing/ci.md#python-sdk).
#
# - The Python side of mutation.yml: mutmut makes small changes to the
#   functions changed in packages/plugin-sdk-python/src since the last
#   successful run (scripts/mutation_base.py) (a
#   flipped condition, a changed string or number, a removed argument) and
#   runs the SDK's pytest suite against each; a change every test still
#   passes on is a "missed" mutant, listed in the job summary and filed as
#   an issue (mutation-issue.yml).
# - mutmut names each mutant after its function, so
#   `scripts/mutmut_report.py select` turns the changed lines into name
#   patterns, one per changed function (deleted lines are placed in the
#   starting commit's copy of the file, and count as changing the function they
#   were in). A changed line outside every function (a constant, an
#   import) selects the whole module instead. Tests and the
#   generated ABI modules are never mutated.
# - Never a required check; it runs off pull requests so it never slows
#   them. Settings live in the SDK's pyproject.toml ([tool.mutmut]).
#
# A manual run can start from an older commit (`base`).

name: Mutation testing (Python SDK)

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: "Commit to start from (default: the last successful run's)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: mutation-python
  cancel-in-progress: false

env:
  # A CI-only tool, pinned here like cargo-mutants in mutation.yml. It is
  # installed into the run's virtual environment only, not added to the
  # SDK's uv.lock, so the published package's dependencies stay as they are.
  MUTMUT_VERSION: "3.8.1"
  SDK: packages/plugin-sdk-python

jobs:
  mutants:
    name: Mutants (Python SDK)
    runs-on: ubuntu-latest
    # mutmut's 60 minutes (plus 2 to stop) and room for setup and the report.
    timeout-minutes: 80
    permissions:
      contents: read
      # The last successful run's commit (scripts/mutation_base.py).
      actions: read
    steps:
      # Full history, to diff against the last run's commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # What merged since the last successful run, then mutmut's name
      # pattern for each changed function, one per line, and the changed
      # functions mutmut never mutates (decorated ones).
      - name: Find the changed functions
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          base=$(python3 scripts/mutation_base.py --workflow mutation-python.yml --base "${BASE:-}")
          git diff "$base" HEAD > "$RUNNER_TEMP/pr.diff"
          echo "Mutating the Python SDK changes in \`$base..$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/mutmut_report.py select --diff "$RUNNER_TEMP/pr.diff" --root "$SDK" --base "$base" --skipped "$RUNNER_TEMP/skipped.txt" > "$RUNNER_TEMP/patterns.txt"
          if [ -s "$RUNNER_TEMP/patterns.txt" ]; then
            echo "mutate=true" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/patterns.txt"

      - name: Install uv
        if: steps.select.outputs.mutate == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: .tool-versions
          enable-cache: false

      # The SDK's test dependencies at the versions in uv.lock, as CI's
      # python_sdk check installs them, then mutmut.
      - name: Install the test dependencies and mutmut
        if: steps.select.outputs.mutate == 'true'
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/venv
        run: |
          set -euo pipefail
          uv sync --quiet --project "$SDK" --locked --all-extras --no-install-project --python python3
          uv pip install --quiet --python "$UV_PROJECT_ENVIRONMENT/bin/python" "mutmut==$MUTMUT_VERSION"
          echo "$UV_PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"

      # Tool versions shared with the Dev Container and rust-toolchain.toml
      # (docs/contributing/ci.md#tool-versions).
      - name: Read tool pins
        id: pins
        shell: bash
        run: python3 scripts/tool_versions.py github-output >> "$GITHUB_OUTPUT"

      # tests/test_testkit.py drives the bookclerk-db-testkit binary. Build it
      # once here, as CI's python_sdk check does, so mutmut's baseline run
      # does not try to build it (that needs capnp for bookclerk-plugin-abi's
      # build script) and each mutant reuses the same binary.
      - name: Install Rust toolchain
        if: steps.select.outputs.mutate == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.pins.outputs.rust }}

      - name: Install capnproto
        if: steps.select.outputs.mutate == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends capnproto

      - name: Build bookclerk-db-testkit
        if: steps.select.outputs.mutate == 'true'
        run: |
          set -euo pipefail
          cargo build --locked -p bookclerk-db-testkit --bin bookclerk-db-testkit
          echo "BOOKCLERK_DB_TESTKIT=$GITHUB_WORKSPACE/target/debug/bookclerk-db-testkit" >> "$GITHUB_ENV"

      # mutmut works in a mutants/ copy of the SDK and records each result
      # as it lands, so stopping it at the time limit keeps what it tested
      # (the report also reads a results file the stop cut short). SIGINT
      # goes to the whole process group, mutmut's test workers included.
      # The patterns go to mutmut as separate arguments (no word splitting
      # or globbing by the shell). When no changed function has a mutant,
      # mutmut exits with an error that it found nothing to run; the report
      # reads that from its files.
      - name: Test the mutants
        id: mutants
        if: steps.select.outputs.mutate == 'true'
        working-directory: ${{ env.SDK }}
        run: |
          set +e
          mapfile -t patterns < "$RUNNER_TEMP/patterns.txt"
          timeout --signal=INT --kill-after=2m 60m mutmut run "${patterns[@]}"
          code=$?
          if [ "$code" -eq 124 ] || [ "$code" -eq 130 ] || [ "$code" -eq 137 ]; then
            echo "stopped=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      # Only after a selection: a failed one fails the job instead of
      # reporting that nothing changed.
      - name: Report
        if: ${{ !cancelled() && steps.select.outcome == 'success' }}
        env:
          STOPPED: ${{ steps.mutants.outputs.stopped }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue"
          args=(--mutants "$SDK/mutants" --patterns "$RUNNER_TEMP/patterns.txt" --skipped "$RUNNER_TEMP/skipped.txt" --root "$SDK" --out "$RUNNER_TEMP/mutants-python-sdk" --issue "$RUNNER_TEMP/issue/python-sdk.md")
          if [ "${STOPPED:-}" = "true" ]; then args+=(--stopped); fi
          python3 scripts/mutmut_report.py report "${args[@]}"

      - name: Upload the results
        if: ${{ !cancelled() && steps.select.outputs.mutate == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-python-sdk
          path: ${{ runner.temp }}/mutants-python-sdk
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the issue body
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-issue-python-sdk
          path: ${{ runner.temp }}/issue/python-sdk.md
          if-no-files-found: ignore
          retention-days: 7

  issue:
    needs: mutants
    if: ${{ !cancelled() }}
    permissions:
      issues: write
    uses: ./.github/workflows/mutation-issue.yml
