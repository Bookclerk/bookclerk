# Mutation testing of the Python SDK code a pull request changes
# (docs/contributing/ci.md#python-sdk).
#
# - The Python side of mutation.yml: mutmut makes small changes to the
#   functions a pull request changes in packages/plugin-sdk-python/src (a
#   flipped condition, a changed string or number, a removed argument) and
#   runs the SDK's pytest suite against each; a change every test still
#   passes on is a "missed" mutant, listed in the job summary and annotated
#   on the diff.
# - mutmut names each mutant after its function, so
#   `scripts/mutmut_report.py select` turns the changed lines into name
#   patterns, one per changed function (deleted lines are placed in the
#   base branch's copy of the file, and count as changing the function they
#   were in). A changed line outside every function (a constant, an
#   import) selects the whole module instead. Tests and the
#   generated ABI modules are never mutated.
# - Trial: report-only and not a required check. Settings live in the
#   SDK's pyproject.toml ([tool.mutmut]).
#
# It runs the pull request's code with a read-only token, like CI.

name: Mutation testing (Python SDK)

on:
  pull_request:
    paths:
      - "packages/plugin-sdk-python/**"
      - "scripts/mutmut_report.py"
      - "scripts/mutation_report.py"
      - "scripts/stryker_report.py"
      - ".github/workflows/mutation-python.yml"

permissions:
  contents: read

concurrency:
  group: mutation-python-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # A CI-only tool, pinned here like cargo-mutants in mutation.yml. It is
  # installed into the run's virtual environment only, not added to the
  # SDK's uv.lock, so the published package's dependencies stay as they are.
  MUTMUT_VERSION: "3.8.1"
  SDK: packages/plugin-sdk-python

jobs:
  mutants:
    name: Mutants (Python SDK, report only)
    runs-on: ubuntu-latest
    # mutmut's 20 minutes (plus 2 to stop) and room for setup and the report.
    timeout-minutes: 40
    steps:
      # The pull request merged onto its base branch, as CI tests it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # The pull request's changes as they land on the base branch, then
      # mutmut's name pattern for each changed function, one per line, and
      # the changed functions mutmut never mutates (decorated ones).
      - name: Find the changed functions
        id: select
        run: |
          set -euo pipefail
          git diff HEAD^1 HEAD > "$RUNNER_TEMP/pr.diff"
          python3 scripts/mutmut_report.py select --diff "$RUNNER_TEMP/pr.diff" --root "$SDK" --base HEAD^1 --skipped "$RUNNER_TEMP/skipped.txt" > "$RUNNER_TEMP/patterns.txt"
          if [ -s "$RUNNER_TEMP/patterns.txt" ]; then
            echo "mutate=true" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/patterns.txt"

      - name: Install uv
        if: steps.select.outputs.mutate == 'true'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: .tool-versions
          enable-cache: false

      # The SDK's test dependencies at the versions in uv.lock, as CI's
      # python_sdk check installs them, then mutmut.
      - name: Install the test dependencies and mutmut
        if: steps.select.outputs.mutate == 'true'
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/venv
        run: |
          set -euo pipefail
          uv sync --quiet --project "$SDK" --locked --all-extras --no-install-project --python python3
          uv pip install --quiet --python "$UV_PROJECT_ENVIRONMENT/bin/python" "mutmut==$MUTMUT_VERSION"
          echo "$UV_PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"

      # mutmut works in a mutants/ copy of the SDK and records each result
      # as it lands, so stopping it at the time limit keeps what it tested
      # (the report also reads a results file the stop cut short). SIGINT
      # goes to the whole process group, mutmut's test workers included.
      # The patterns go to mutmut as separate arguments (no word splitting
      # or globbing by the shell). When no changed function has a mutant,
      # mutmut exits with an error that it found nothing to run; the report
      # reads that from its files.
      - name: Test the mutants
        id: mutants
        if: steps.select.outputs.mutate == 'true'
        working-directory: ${{ env.SDK }}
        run: |
          set +e
          mapfile -t patterns < "$RUNNER_TEMP/patterns.txt"
          timeout --signal=INT --kill-after=2m 20m mutmut run "${patterns[@]}"
          code=$?
          if [ "$code" -eq 124 ] || [ "$code" -eq 130 ] || [ "$code" -eq 137 ]; then
            echo "stopped=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      # Only after a selection: a failed one fails the job instead of
      # reporting that nothing changed.
      - name: Report
        if: ${{ !cancelled() && steps.select.outcome == 'success' }}
        env:
          STOPPED: ${{ steps.mutants.outputs.stopped }}
        run: |
          set -euo pipefail
          args=(--mutants "$SDK/mutants" --patterns "$RUNNER_TEMP/patterns.txt" --skipped "$RUNNER_TEMP/skipped.txt" --root "$SDK" --out "$RUNNER_TEMP/mutants-python-sdk")
          if [ "${STOPPED:-}" = "true" ]; then args+=(--stopped); fi
          python3 scripts/mutmut_report.py report "${args[@]}"

      - name: Upload the results
        if: ${{ !cancelled() && steps.select.outputs.mutate == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-python-sdk
          path: ${{ runner.temp }}/mutants-python-sdk
          if-no-files-found: ignore
          retention-days: 7
