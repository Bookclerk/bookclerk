# Deploy the diagnostics collector Worker via wrangler-action when
# tools/diagnostics-collector changes on main.
#
# GitHub repository secrets:
#   CLOUDFLARE_API_TOKEN   scoped to the Worker `bookclerk-diagnostics` (Workers,
#                          Editor role) and the DOMAIN zone (Workers Routes
#                          edit); the first deploy needs the Worker to exist,
#                          and the deploy that creates the TRIAGE_BUDGET KV
#                          namespace needs account Workers KV Storage edit,
#                          see docs/contributing/automation.md#cloudflare-worker-deploys
#   CLOUDFLARE_ACCOUNT_ID
#   DIAGNOSTICS_REPORT_API_KEY   → Worker REPORT_API_KEY (+ ingest workflow)
#   DIAGNOSTICS_B2_KEY_ID
#   DIAGNOSTICS_B2_APPLICATION_KEY
#   DIAGNOSTICS_B2_BUCKET_ID
#
# Member dashboard (optional; off until all three are set, see
# docs/server/diagnostics.md#member-dashboard). The automation GitHub App signs
# organization members in and reads diagnostics issues; the Worker narrows
# every token it mints to read-only:
#   AUTOMATION_APP_CLIENT_ID      → Worker GITHUB_APP_CLIENT_ID
#   AUTOMATION_APP_CLIENT_SECRET  → Worker GITHUB_APP_CLIENT_SECRET
#   AUTOMATION_APP_PRIVATE_KEY    → Worker GITHUB_APP_PRIVATE_KEY
# The DASHBOARD_DB D1 database is created on the first deploy (account D1
# edit on the token) and every deploy applies tools/diagnostics-collector/
# migrations, so the token keeps D1 edit.
#
# Where the Worker is served:
#   DOMAIN set (organization or repository variable): the custom domain
#     diagnostics.<DOMAIN>, whose zone must be in the Cloudflare account.
#     Readers (ingest workflow, CI release builds) derive the same URL from
#     DOMAIN, so nothing is written back.
#   DOMAIN unset (a fork with its own Cloudflare account): the account's
#     workers.dev subdomain, read from the deploy output. Readers cannot
#     derive that, so it is stored in Actions variable
#     DIAGNOSTICS_COLLECTOR_BASE_URL, on the organization when possible and
#     otherwise on the repository. GITHUB_TOKEN cannot write variables; the
#     write uses the automation App (AUTOMATION_APP_CLIENT_ID /
#     AUTOMATION_APP_PRIVATE_KEY, organization and/or repository permission
#     "Variables: write") when its secrets are set, and otherwise prints the
#     `gh variable set` command.
#
# https://github.com/cloudflare/wrangler-action
# GITHUB_TOKEN permission keys:
# https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#permissions-for-the-github_token

name: diagnostics-collector-deploy

on:
  push:
    branches: [main]
    paths:
      - "tools/diagnostics-collector/**"
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN:
#   contents → checkout
permissions:
  contents: read

concurrency:
  group: diagnostics-collector-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/diagnostics-collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require deploy secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REPORT_KEY: ${{ secrets.DIAGNOSTICS_REPORT_API_KEY }}
          B2_ID: ${{ secrets.DIAGNOSTICS_B2_KEY_ID }}
          B2_KEY: ${{ secrets.DIAGNOSTICS_B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.DIAGNOSTICS_B2_BUCKET_ID }}
        run: |
          missing=0
          for name in CF_TOKEN CF_ACCOUNT REPORT_KEY B2_ID B2_KEY B2_BUCKET; do
            eval "val=\${$name:-}"
            if [ -z "$val" ]; then
              echo "::error::Missing secret for $name (see workflow header)"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: tools/diagnostics-collector/package-lock.json

      - name: Install dependencies
        run: npm ci
      # Wrangler bundles the Worker without checking its types, so a deploy
      # of a commit CI did not test still has to pass tsc.
      - name: Type-check the Worker
        run: npm run typecheck
      - name: Route the Worker
        id: route
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          set -euo pipefail
          if [ -z "$DOMAIN" ]; then
            # No custom domain: serve on the account's workers.dev subdomain.
            sed -i 's/^workers_dev = false$/workers_dev = true/' wrangler.toml
            grep -qx 'workers_dev = true' wrangler.toml
            echo "mode=workers_dev" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # [[ =~ ]] matches the whole value, so a trailing newline is rejected.
          hostname_re='^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$'
          if [[ ! "$DOMAIN" =~ $hostname_re ]]; then
            echo "::error::DOMAIN is not a lowercase hostname: $DOMAIN"
            exit 1
          fi
          host="diagnostics.${DOMAIN}"
          printf '\n[[routes]]\npattern = "%s"\ncustom_domain = true\n' "$host" >> wrangler.toml
          echo "mode=custom_domain" >> "$GITHUB_OUTPUT"
          echo "url=https://${host}" >> "$GITHUB_OUTPUT"
          # The website, whose privacy page the sign-in page links to.
          echo "site=https://${DOMAIN}" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/diagnostics-collector
          # Matches package-lock.json; 4.45+ creates the TRIAGE_BUDGET KV
          # namespace on first deploy.
          wranglerVersion: "4.151.0"
          command: deploy${{ steps.route.outputs.site && format(' --var SITE_URL:{0}', steps.route.outputs.site) || '' }}
          secrets: |
            B2_KEY_ID
            B2_APPLICATION_KEY
            B2_BUCKET_ID
            REPORT_API_KEY
        env:
          B2_KEY_ID: ${{ secrets.DIAGNOSTICS_B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.DIAGNOSTICS_B2_APPLICATION_KEY }}
          B2_BUCKET_ID: ${{ secrets.DIAGNOSTICS_B2_BUCKET_ID }}
          REPORT_API_KEY: ${{ secrets.DIAGNOSTICS_REPORT_API_KEY }}

      # Cloudflare's own startup figure for this deploy
      # (docs/contributing/ci.md#worker-startup-time); warns near the limit.
      - name: Report the startup time
        # The job runs in the Worker's directory; the script and its budgets
        # are repository-relative. Reporting never fails a deploy.
        working-directory: .
        continue-on-error: true
        env:
          WRANGLER_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: python3 scripts/worker_startup.py deploy --worker collector

      # The binding has no id: wrangler created the database on deploy, so
      # migrations can only run now. Applied migrations are skipped.
      - name: Apply dashboard database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DASHBOARD_DB --remote

      # Optional, so a fork without the App still deploys. Values go to
      # wrangler on stdin, never on the command line.
      - name: Upload dashboard secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_CLIENT_ID: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          APP_CLIENT_SECRET: ${{ secrets.AUTOMATION_APP_CLIENT_SECRET }}
          APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_CLIENT_SECRET" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::notice::Member dashboard stays off: set AUTOMATION_APP_CLIENT_ID, AUTOMATION_APP_CLIENT_SECRET and AUTOMATION_APP_PRIVATE_KEY to turn it on"
            exit 0
          fi
          jq -n '{GITHUB_APP_CLIENT_ID: env.APP_CLIENT_ID, GITHUB_APP_CLIENT_SECRET: env.APP_CLIENT_SECRET, GITHUB_APP_PRIVATE_KEY: env.APP_PRIVATE_KEY}' \
            | npx wrangler secret bulk

      - name: Resolve the collector URL
        id: url
        env:
          MODE: ${{ steps.route.outputs.mode }}
          ROUTE_URL: ${{ steps.route.outputs.url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          if [ "$MODE" = custom_domain ]; then
            url="$ROUTE_URL"
          else
            url="${DEPLOYMENT_URL%/}"
            # <worker name from wrangler.toml>.<account subdomain>.workers.dev
            workers_dev_re='^https://[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.workers\.dev$'
            if [[ ! "$url" =~ $workers_dev_re ]]; then
              echo "::error::Deploy did not report a workers.dev URL: $url"
              exit 1
            fi
          fi
          echo "Collector URL: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Check the collector answers
        env:
          URL: ${{ steps.url.outputs.url }}
        run: |
          set -euo pipefail
          # A new custom domain or workers.dev subdomain can take a few
          # minutes to answer; allow about six.
          for attempt in 1 2 3 4 5 6 7 8; do
            if body=$(curl -fsS --max-time 10 "$URL/health"); then
              echo "$body"
              exit 0
            fi
            [ "$attempt" -lt 8 ] && sleep $((attempt * 10))
          done
          echo "::error::$URL/health did not answer after deploy"
          exit 1

      # Only the workers.dev URL needs storing; DOMAIN readers derive theirs.
      - name: Check whether the collector URL variable needs writing
        id: record
        if: steps.route.outputs.mode == 'workers_dev'
        env:
          URL: ${{ steps.url.outputs.url }}
          CURRENT: ${{ vars.DIAGNOSTICS_COLLECTOR_BASE_URL }}
          HAS_APP: ${{ secrets.AUTOMATION_APP_CLIENT_ID != '' && secrets.AUTOMATION_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$CURRENT" = "$URL" ]; then
            echo "DIAGNOSTICS_COLLECTOR_BASE_URL is already $URL"
            echo "write=false" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_APP" = true ]; then
            echo "write=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Set the collector URL by hand: gh variable set DIAGNOSTICS_COLLECTOR_BASE_URL --repo $GITHUB_REPOSITORY --body $URL"
            echo "write=false" >> "$GITHUB_OUTPUT"
          fi

      # The installation-token API has no Variables permission to request
      # (only listed permissions can be narrowed to), so the token carries the
      # installation's permissions; it is used for this one write and revoked
      # when the job ends.
      - name: Mint variable-write token
        id: app-token
        if: steps.record.outputs.write == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Store the collector URL
        if: steps.record.outputs.write == 'true'
        env:
          URL: ${{ steps.url.outputs.url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          name=DIAGNOSTICS_COLLECTOR_BASE_URL
          owner="${GITHUB_REPOSITORY%%/*}"
          # Prefer the organization (like DOMAIN); a user-owned fork, or an App
          # without the organization "Variables" permission, falls back to
          # the repository.
          if gh variable set "$name" --org "$owner" --visibility all --body "$URL"; then
            echo "Stored $name on organization $owner"
            # A repository variable overrides the organization one, so keep a
            # stale one from shadowing the new URL.
            if gh variable get "$name" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh variable set "$name" --repo "$GITHUB_REPOSITORY" --body "$URL"
              echo "Updated the repository's own $name too"
            fi
          else
            echo "::notice::Organization variable write failed; storing $name on the repository"
            gh variable set "$name" --repo "$GITHUB_REPOSITORY" --body "$URL"
          fi
