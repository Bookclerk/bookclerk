# Deploy the diagnostics collector Worker via wrangler-action when
# tools/diagnostics-collector changes on main.
#
# GitHub repository secrets:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
#   DIAGNOSTICS_REPORT_API_KEY   → Worker REPORT_API_KEY (+ ingest workflow)
#   DIAGNOSTICS_B2_KEY_ID
#   DIAGNOSTICS_B2_APPLICATION_KEY
#   DIAGNOSTICS_B2_BUCKET_ID
#
# On success, stores wrangler deployment-url in repository variable
# DIAGNOSTICS_COLLECTOR_BASE_URL (ingest workflow + CI release builds).
#
# https://github.com/cloudflare/wrangler-action
# GITHUB_TOKEN permission keys:
# https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#permissions-for-the-github_token

name: diagnostics-collector-deploy

on:
  push:
    branches: [main]
    paths:
      - "tools/diagnostics-collector/**"
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN:
#   contents → checkout
#   actions → `gh variable set DIAGNOSTICS_COLLECTOR_BASE_URL` (Actions variables API)
permissions:
  contents: read
  actions: write

concurrency:
  group: diagnostics-collector-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/diagnostics-collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require deploy secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REPORT_KEY: ${{ secrets.DIAGNOSTICS_REPORT_API_KEY }}
          B2_ID: ${{ secrets.DIAGNOSTICS_B2_KEY_ID }}
          B2_KEY: ${{ secrets.DIAGNOSTICS_B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.DIAGNOSTICS_B2_BUCKET_ID }}
        run: |
          missing=0
          for name in CF_TOKEN CF_ACCOUNT REPORT_KEY B2_ID B2_KEY B2_BUCKET; do
            eval "val=\${$name:-}"
            if [ -z "$val" ]; then
              echo "::error::Missing secret for $name (see workflow header)"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/diagnostics-collector/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@25853364521e0d392ece9b0c1e97a4b37b638087 # v4.1.2
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/diagnostics-collector
          command: deploy
          secrets: |
            B2_KEY_ID
            B2_APPLICATION_KEY
            B2_BUCKET_ID
            REPORT_API_KEY
        env:
          B2_KEY_ID: ${{ secrets.DIAGNOSTICS_B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.DIAGNOSTICS_B2_APPLICATION_KEY }}
          B2_BUCKET_ID: ${{ secrets.DIAGNOSTICS_B2_BUCKET_ID }}
          REPORT_API_KEY: ${{ secrets.DIAGNOSTICS_REPORT_API_KEY }}

      - name: Set collector URL repository variable
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL="${DEPLOY_URL%/}"
          if [ -z "$URL" ]; then
            echo "::error::wrangler-action did not return deployment-url"
            exit 1
          fi
          echo "Collector deployment URL: $URL"
          gh variable set DIAGNOSTICS_COLLECTOR_BASE_URL --body "$URL"
