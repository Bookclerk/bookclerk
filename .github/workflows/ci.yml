name: CI

on:
  push:
    branches: [main]
  # A draft pull request runs the fast jobs only; `ready_for_review` starts
  # the full run, which every later push repeats (see DRAFT_JOBS in
  # scripts/ci_plan/execute.py and docs/contributing/ci.md#draft-pull-requests).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  # The OSV remediation workflow runs the whole suite on a lockfile bump it
  # has not published yet: every job checks out the sealed commit after
  # actions/checkout, caches are not saved, and cargo output is quiet.
  workflow_call:
    inputs:
      private-head:
        description: Check out this run's sealed OSV remediation commit in every job.
        type: boolean
        default: false
      private-sha:
        description: Id of the sealed commit (its parent is github.sha).
        type: string
        default: ""
    secrets:
      OSV_REMEDIATION_BUNDLE_KEY:
        description: Passphrase of the sealed OSV remediation bundle.
        required: false

# Cancel superseded PR runs; never cancel merge_group / main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: checkout + local cargo build/test only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  # Line tables keep file:line in panics and backtraces at a fraction of the
  # link time and cache size of full debuginfo (dev and test profiles only).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # A failing test's panic prints its backtrace. Library backtraces stay off:
  # with RUST_BACKTRACE alone, every error built by an error library such as
  # anyhow would capture a backtrace, slowing tests that create many errors.
  RUST_BACKTRACE: "1"
  RUST_LIB_BACKTRACE: "0"
  # Selective PR CI (#157). "0" = shadow: every job runs at full scope and the
  # selective prediction is recorded in the plan summary for audit. "1" = jobs
  # and checks follow the prediction. merge_group / main always --force-full.
  SELECTIVE_CI: "1"
  # A push to main compiles only, to save the dependency caches (the plan
  # job's resolve step adds --build-only on the same condition).
  CI_BUILD_ONLY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  # Quiet cargo on an unpublished OSV remediation bump: "Compiling <crate>
  # <version>" lines would show the bump in the public log.
  CARGO_TERM_QUIET: ${{ inputs.private-head && 'true' || 'false' }}

# Every job below `plan` downloads the `ci-plan` artifact, validates it
# (schema, run id, checked-out commit) and runs checks through
# `scripts/ci-exec.py run <check>`, which issues the check's prerequisites
# first. `if:` gates read the same artifact via the plan job's outputs.
# scripts/tests/test_ci_contract.py keeps this file and the planner in sync.
jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      job_check: ${{ steps.resolve.outputs.job_check }}
      job_test: ${{ steps.resolve.outputs.job_test }}
      job_e2e: ${{ steps.resolve.outputs.job_e2e }}
      job_release: ${{ steps.resolve.outputs.job_release }}
      job_confinement: ${{ steps.resolve.outputs.job_confinement }}
      job_native_gateway: ${{ steps.resolve.outputs.job_native_gateway }}
      job_tray: ${{ steps.resolve.outputs.job_tray }}
      job_postgres: ${{ steps.resolve.outputs.job_postgres }}
      job_windows_cluster: ${{ steps.resolve.outputs.job_windows_cluster }}
      job_site: ${{ steps.resolve.outputs.job_site }}
      check_lint: ${{ steps.resolve.outputs.check_lint }}
      check_ui: ${{ steps.resolve.outputs.check_ui }}
      check_plugin_sdk_abi: ${{ steps.resolve.outputs.check_plugin_sdk_abi }}
      check_python_sdk: ${{ steps.resolve.outputs.check_python_sdk }}
      check_workerd_guests: ${{ steps.resolve.outputs.check_workerd_guests }}
      check_plugin_examples: ${{ steps.resolve.outputs.check_plugin_examples }}
      check_author_surface: ${{ steps.resolve.outputs.check_author_surface }}
      check_fmt: ${{ steps.resolve.outputs.check_fmt }}
      check_clippy: ${{ steps.resolve.outputs.check_clippy }}
      check_clippy_publish: ${{ steps.resolve.outputs.check_clippy_publish }}
      check_api_docs: ${{ steps.resolve.outputs.check_api_docs }}
      check_doctest: ${{ steps.resolve.outputs.check_doctest }}
      check_store_free: ${{ steps.resolve.outputs.check_store_free }}
      check_site_test: ${{ steps.resolve.outputs.check_site_test }}
      check_site_audit: ${{ steps.resolve.outputs.check_site_audit }}
      check_collector_test: ${{ steps.resolve.outputs.check_collector_test }}
      check_demo_test: ${{ steps.resolve.outputs.check_demo_test }}
      check_release: ${{ steps.resolve.outputs.check_release }}
      check_envelope: ${{ steps.resolve.outputs.check_envelope }}
      check_needs_cargo: ${{ steps.resolve.outputs.check_needs_cargo }}
      check_needs_node: ${{ steps.resolve.outputs.check_needs_node }}
      check_needs_uv: ${{ steps.resolve.outputs.check_needs_uv }}
      release_mode: ${{ steps.resolve.outputs.release_mode }}
      os_matrix: ${{ steps.resolve.outputs.os_matrix }}
      os_legs: ${{ steps.resolve.outputs.os_legs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Fail closed: without the commit id no job would check the bump out,
      # and CI Gate would pass on github.sha alone.
      - name: Require the sealed commit id
        if: inputs.private-head && inputs.private-sha == ''
        run: |
          echo "::error::private-head requires private-sha"
          exit 1

      # Run by the OSV remediation workflow: test its unpublished lockfile
      # bump (see docs/contributing/automation.md#osv-remediation).
      - name: Check out the OSV remediation head
        if: inputs.private-head
        uses: ./.github/actions/osv-remediation-head
        with:
          key: ${{ secrets.OSV_REMEDIATION_BUNDLE_KEY }}
          sha: ${{ inputs.private-sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Resolve base / head
        id: shas
        run: |
          set -euo pipefail
          if [ "${{ inputs.private-head }}" = "true" ]; then
            # The sealed commit sits on top of github.sha.
            HEAD="$(git rev-parse HEAD)"
            BASE="$(git rev-parse HEAD^)"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            BASE="${{ github.event.merge_group.base_sha }}"
            HEAD="${{ github.sha }}"
          else
            # push to main: previous commit as base when available
            HEAD="${{ github.sha }}"
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              BASE="$(git rev-parse HEAD^)"
            else
              BASE="$HEAD"
            fi
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

      - name: Install CI test requirements
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ci-venv"
          "$RUNNER_TEMP/ci-venv/bin/pip" install --require-hashes -r scripts/tests/requirements.txt

      # The scripts under test append to $GITHUB_STEP_SUMMARY by default;
      # their tests' runs are not this job's results, so none reach its
      # summary (the Web API contract report belongs to CI Gate alone).
      - name: Planner, executor and workflow-contract tests
        run: |
          set -euo pipefail
          unset GITHUB_STEP_SUMMARY
          PY="$RUNNER_TEMP/ci-venv/bin/python"
          "$PY" scripts/tests/test_ci_plan.py
          "$PY" scripts/tests/test_ci_relations.py
          "$PY" scripts/tests/test_ci_contract.py
          "$PY" scripts/tests/test_plugin_publisher.py
          "$PY" scripts/tests/test_envelope.py
          "$PY" scripts/tests/test_source_apk_probe.py
          "$PY" scripts/tests/test_librofm_apk_probe.py
          "$PY" scripts/tests/test_osv_remediate.py
          "$PY" scripts/tests/test_fuzz_crash_triage.py
          "$PY" scripts/tests/test_osv_advisories.py
          "$PY" scripts/tests/test_docs_markdown.py
          "$PY" scripts/tests/test_rustdoc_markdown.py
          "$PY" scripts/tests/test_python_api_markdown.py
          "$PY" scripts/tests/test_openapi_markdown.py
          "$PY" scripts/tests/test_docs_publish.py
          "$PY" scripts/tests/test_diagnostics_plan.py
          "$PY" scripts/tests/test_holding_issue.py
          "$PY" scripts/tests/test_regression_issue.py
          "$PY" scripts/tests/test_summary_comment.py
          "$PY" scripts/tests/test_release_baseline.py
          "$PY" scripts/tests/test_image_release_tags.py
          "$PY" scripts/tests/test_demo_image.py
          "$PY" scripts/tests/test_cla_check.py
          "$PY" scripts/tests/test_maintainer_review.py
          "$PY" scripts/tests/test_signed_commits.py
          "$PY" scripts/tests/test_coverage_gate.py
          "$PY" scripts/tests/test_contract_coverage.py
          "$PY" scripts/tests/test_worker_startup.py
          "$PY" scripts/tests/test_mutation_report.py
          "$PY" scripts/tests/test_stryker_report.py
          "$PY" scripts/tests/test_mutmut_report.py
          "$PY" scripts/tests/test_mutation_base.py
          "$PY" scripts/tests/test_codeql_languages.py
          "$PY" scripts/tests/test_codeql_reuse.py
          "$PY" scripts/tests/test_merge_queue_requeue.py
          "$PY" scripts/tests/test_cflite_artifacts.py
          "$PY" scripts/tests/test_dev_env.py
          "$PY" scripts/tests/test_tool_versions.py

      - name: Database plugin isolation
        run: python3 scripts/tests/test_db_plugin_isolation.py -q

      - name: Private-docs lint regression
        run: python3 scripts/tests/test_private_docs_lint.py

      - name: Resolve CI plan
        id: resolve
        env:
          # Never for a called OSV remediation run, which is always full.
          PR_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true && !inputs.private-head }}
          PR_RUN: ${{ github.event_name == 'pull_request' && !inputs.private-head }}
        run: |
          set -euo pipefail
          EXTRA=()
          # Full suite on merge_group / main push / OSV remediation regardless
          # of paths.
          if [ "${{ github.event_name }}" = "merge_group" ] || [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ inputs.private-head }}" = "true" ]; then
            EXTRA+=(--force-full)
          fi
          # main only advances through the merge queue, whose run already
          # tested this exact commit: the push run compiles and saves caches.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            EXTRA+=(--build-only)
          fi
          # A draft pull request runs lints, docs and unit tests; the other
          # jobs wait for `ready_for_review`. The merge queue never takes a
          # draft and always runs the full suite.
          if [ "$PR_DRAFT" = "true" ]; then
            EXTRA+=(--draft)
          fi
          # A pull request run tests on Linux; the Windows legs and the macOS
          # job run in the merge queue, which CI Gate requires before a merge.
          if [ "$PR_RUN" = "true" ]; then
            EXTRA+=(--linux-only)
          fi
          python3 scripts/ci-exec.py resolve \
            --base "${{ steps.shas.outputs.base }}" \
            --head "${{ steps.shas.outputs.head }}" \
            --selective "$SELECTIVE_CI" \
            "${EXTRA[@]+"${EXTRA[@]}"}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan/ci-plan.json
          if-no-files-found: error

      # The lines the change adds, for CI Gate's patch coverage (CI Gate
      # checks out one commit and cannot diff). Hunk headers only: the gate
      # needs line numbers, not content. Not for an unpublished OSV
      # remediation bump, whose diff would name the bumped versions.
      - name: Write the change's added lines
        if: ${{ !inputs.private-head }}
        env:
          BASE: ${{ steps.shas.outputs.base }}
          HEAD: ${{ steps.shas.outputs.head }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-patch"
          git -c core.quotePath=false diff --unified=0 --no-color --no-ext-diff "$BASE...$HEAD" \
            | { grep -E '^(\+\+\+ |@@ )' || true; } > "$RUNNER_TEMP/ci-patch/patch.diff"

      - if: ${{ !inputs.private-head }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-patch
          path: ${{ runner.temp }}/ci-patch/patch.diff
          if-no-files-found: error
          retention-days: 7

  check:
    name: fmt / clippy / docs
    # Pull request runs take turns in one slot per job, so they leave
    # runners for the merge queue (docs/contributing/ci.md#pull-request-slots).
    concurrency:
      group: ${{ github.event_name == 'pull_request' && 'ci-pr-slot-check' || format('ci-{0}-{1}-check-{2}', github.run_id, github.run_attempt, strategy.job-index) }}
      queue: max
    needs: plan
    if: needs.plan.outputs.job_check == 'true'
    runs-on: ubuntu-latest
    env:
      BOOKCLERK_SANDBOX_REQUIRE_ENFORCEMENT: "1"
      BOOKCLERK_SANDBOX_REQUIRE_SPAWN_ENFORCEMENT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Run by the OSV remediation workflow: test its unpublished lockfile
      # bump (see docs/contributing/automation.md#osv-remediation).
      - name: Check out the OSV remediation head
        if: inputs.private-head
        uses: ./.github/actions/osv-remediation-head
        with:
          key: ${{ secrets.OSV_REMEDIATION_BUNDLE_KEY }}
          sha: ${{ inputs.private-sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan

      - name: Validate CI plan
        run: python3 scripts/ci-exec.py validate

      - name: Install Rust toolchain
        if: needs.plan.outputs.check_needs_cargo == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Node.js
        if: needs.plan.outputs.check_needs_node == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          # No npm cache for an unpublished OSV remediation bump.
          cache: ${{ !inputs.private-head && 'npm' || '' }}
          cache-dependency-path: |
            tools/lint/package-lock.json
            ui/package-lock.json
            packages/plugin-sdk/package-lock.json
            crates/bookclerk-plugins/optional/metadata-audnexus/package-lock.json
            crates/bookclerk-plugins/optional/metadata-openlibrary/package-lock.json

      # The Python SDK check and its API docs install from
      # packages/plugin-sdk-python/uv.lock. No uv cache: nothing from an
      # unpublished OSV remediation bump may be saved.
      - name: Install uv
        if: needs.plan.outputs.check_needs_uv == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: .tool-versions
          enable-cache: false

      - name: Install capnproto
        if: needs.plan.outputs.check_needs_cargo == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends capnproto

      # Build-only main push: the dependency cache key covers Cargo.lock, the
      # manifests, the toolchain and the CI env, not this repository's
      # sources, so on most merges this job's key is already saved and the
      # build would save nothing. Skip it then (docs/contributing/ci.md#build-only-main-pushes).
      - name: Look up the saved cache
        id: saved
        if: env.CI_BUILD_ONLY == 'true' && needs.plan.outputs.check_needs_cargo == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          env-vars: RUSTFLAGS CARGO_PROFILE_DEV_DEBUG
          cache-on-failure: true
          lookup-only: true
          save-if: false

      - name: Skip the build when the saved cache is current
        if: steps.saved.outputs.cache-hit == 'true'
        shell: bash
        run: echo "CI_SAVED_CACHE_CURRENT=true" >> "$GITHUB_ENV"

      - name: Cache cargo
        if: needs.plan.outputs.check_needs_cargo == 'true' && env.CI_SAVED_CACHE_CURRENT != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          env-vars: RUSTFLAGS CARGO_PROFILE_DEV_DEBUG
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' && !inputs.private-head }}

      - name: Prettier and markdownlint
        if: needs.plan.outputs.check_lint == 'true'
        run: python3 scripts/ci-exec.py run lint

      - name: UI lint, tests and build
        if: needs.plan.outputs.check_ui == 'true'
        env:
          CI_BUNDLE_DIR: ${{ runner.temp }}/bundles
        run: python3 scripts/ci-exec.py run ui

      # The built UI for Codecov Bundle Analysis
      # (docs/contributing/ci.md#bundle-sizes). Not for an unpublished OSV
      # remediation bump: the bundle holds the bumped dependencies' code.
      - name: Upload the UI bundle
        if: needs.plan.outputs.check_ui == 'true' && !inputs.private-head
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-ui
          path: ${{ runner.temp }}/bundles
          if-no-files-found: ignore
          retention-days: 7

      - name: Plugin SDK ABI schema drift check
        if: needs.plan.outputs.check_plugin_sdk_abi == 'true'
        run: python3 scripts/ci-exec.py run plugin_sdk_abi

      - name: Python plugin SDK tools conformance
        if: needs.plan.outputs.check_python_sdk == 'true'
        env:
          CI_COVERAGE_DIR: ${{ runner.temp }}/coverage
        run: python3 scripts/ci-exec.py run python_sdk

      - name: First-party workerd guests
        if: needs.plan.outputs.check_workerd_guests == 'true'
        env:
          CI_COVERAGE_DIR: ${{ runner.temp }}/coverage
        run: python3 scripts/ci-exec.py run workerd_guests

      - name: Plugin examples under every database profile
        if: needs.plan.outputs.check_plugin_examples == 'true'
        run: python3 scripts/ci-exec.py run plugin_examples

      # The Python SDK's and the guests' coverage reports, and the JUnit
      # reports Codecov Test Analytics reads. Failed tests still upload their
      # test results. A build-only main push runs no tests, so there is no
      # report.
      - name: Upload the Python SDK and workerd guests coverage reports
        if: ${{ !cancelled() && env.CI_BUILD_ONLY != 'true' && (needs.plan.outputs.check_python_sdk == 'true' || needs.plan.outputs.check_workerd_guests == 'true') && !inputs.private-head }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-check
          path: ${{ runner.temp }}/coverage
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'ignore' }}
          retention-days: 7

      - name: Author surface check
        if: needs.plan.outputs.check_author_surface == 'true'
        run: python3 scripts/ci-exec.py run author_surface

      - name: Format
        if: needs.plan.outputs.check_fmt == 'true'
        run: python3 scripts/ci-exec.py run fmt

      - name: Clippy
        if: needs.plan.outputs.check_clippy == 'true'
        run: python3 scripts/ci-exec.py run clippy

      - name: Clippy publish-crate doc lints
        if: needs.plan.outputs.check_clippy_publish == 'true'
        run: python3 scripts/ci-exec.py run clippy_publish

      - name: Generate API docs
        if: needs.plan.outputs.check_api_docs == 'true'
        run: python3 scripts/ci-exec.py run api_docs

      - name: Explicit doctests
        if: needs.plan.outputs.check_doctest == 'true'
        run: python3 scripts/ci-exec.py run doctest

      - name: Hosts build store-free, and stay cipher-free
        if: needs.plan.outputs.check_store_free == 'true'
        run: python3 scripts/ci-exec.py run store_free

  test:
    name: unit + integration tests
    # Pull request runs take turns in one slot per job, so they leave
    # runners for the merge queue (docs/contributing/ci.md#pull-request-slots).
    concurrency:
      group: ${{ github.event_name == 'pull_request' && 'ci-pr-slot-test' || format('ci-{0}-{1}-test-{2}', github.run_id, github.run_attempt, strategy.job-index) }}
      queue: max
    needs: plan
    if: needs.plan.outputs.job_test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BOOKCLERK_SANDBOX_REQUIRE_ENFORCEMENT: "1"
      BOOKCLERK_SANDBOX_REQUIRE_SPAWN_ENFORCEMENT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Run by the OSV remediation workflow: test its unpublished lockfile
      # bump (see docs/contributing/automation.md#osv-remediation).
      - name: Check out the OSV remediation head
        if: inputs.private-head
        uses: ./.github/actions/osv-remediation-head
        with:
          key: ${{ secrets.OSV_REMEDIATION_BUNDLE_KEY }}
          sha: ${{ inputs.private-sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan

      - name: Validate CI plan
        run: python3 scripts/ci-exec.py validate

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview

      # Tool versions shared with the Dev Container (docs/contributing/ci.md#tool-versions).
      - name: Read tool pins
        id: pins
        run: python3 scripts/tool_versions.py github-output >> "$GITHUB_OUTPUT"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-nextest@${{ steps.pins.outputs.cargo-nextest }}

      - name: Install cargo-llvm-cov
        if: env.CI_BUILD_ONLY != 'true'
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Install capnproto
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends capnproto

      # A full-suite coverage build fills most of a hosted runner's disk, and
      # a partial cache restore adds stale dependencies on top, which ran
      # merge groups out of space. Drop the preinstalled SDKs this job never
      # uses, as the mutation job does (docs/contributing/ci.md#test-runner-and-retries).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / "$RUNNER_TEMP" "$GITHUB_WORKSPACE"

      # Build-only main push: the dependency cache key covers Cargo.lock, the
      # manifests, the toolchain and the CI env, not this repository's
      # sources, so on most merges this job's key is already saved and the
      # build would save nothing. Skip it then (docs/contributing/ci.md#build-only-main-pushes).
      - name: Look up the saved cache
        id: saved
        if: env.CI_BUILD_ONLY == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: debug
          env-vars: RUSTFLAGS CARGO_PROFILE_DEV_DEBUG
          cache-on-failure: true
          lookup-only: true
          save-if: false

      - name: Skip the build when the saved cache is current
        if: steps.saved.outputs.cache-hit == 'true'
        shell: bash
        run: echo "CI_SAVED_CACHE_CURRENT=true" >> "$GITHUB_ENV"

      - name: Cache cargo
        if: env.CI_SAVED_CACHE_CURRENT != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: debug
          env-vars: RUSTFLAGS CARGO_PROFILE_DEV_DEBUG
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' && !inputs.private-head }}

      # Coverage: `cargo llvm-cov show-env` sets a rustc wrapper that
      # instruments only the workspace crates, so dependencies still come
      # from the cache above. Exported after the cache step on purpose: the
      # cache key hashes CARGO*/RUST* variables, and the build-only main push
      # that saves the cache runs uninstrumented.
      - name: Instrument the build for coverage
        if: env.CI_BUILD_ONLY != 'true'
        run: |
          set -euo pipefail
          cargo llvm-cov show-env --sh | sed -e 's/^export //' -e "s/='\(.*\)'$/=\1/" >> "$GITHUB_ENV"
          echo "CI_COVERAGE_DIR=$RUNNER_TEMP/coverage" >> "$GITHUB_ENV"

      # The daemon's test build appends to target/contract-report (one file
      # per test process), so the report starts empty for this run.
      - name: Start a fresh Web API contract report
        if: env.CI_BUILD_ONLY != 'true'
        run: rm -rf target/contract-report

      - name: Test
        run: python3 scripts/ci-exec.py run rust_test

      # nextest writes the JUnit report Codecov Test Analytics reads into the
      # workspace (.config/nextest.toml), failed tests included.
      - name: Keep the Rust test results
        if: ${{ !cancelled() && env.CI_BUILD_ONLY != 'true' }}
        run: |
          if [ -f target/nextest/ci/junit.xml ]; then
            mkdir -p "$CI_COVERAGE_DIR/rust"
            cp target/nextest/ci/junit.xml "$CI_COVERAGE_DIR/rust/junit.xml"
          fi

      # The daemon's test build records every response it compared with the
      # OpenAPI document, one file per test process
      # (docs/contributing/ci.md#web-api-contract); CI Gate reports them.
      - name: Keep the Web API contract report
        if: ${{ !cancelled() && env.CI_BUILD_ONLY != 'true' }}
        run: |
          shopt -s nullglob
          reports=(target/contract-report/*.jsonl)
          if [ ${#reports[@]} -gt 0 ]; then
            mkdir -p "$CI_COVERAGE_DIR/contract"
            cp "${reports[@]}" "$CI_COVERAGE_DIR/contract/"
          fi

      - name: Upload the Rust coverage report
        if: ${{ !cancelled() && env.CI_BUILD_ONLY != 'true' && !inputs.private-head }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: ${{ runner.temp }}/coverage
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'ignore' }}
          retention-days: 7

  e2e:
    name: staged plugin installation (e2e)
    # Pull request runs take turns in one slot per job, so they leave
    # runners for the merge queue (docs/contributing/ci.md#pull-request-slots).
    concurrency:
      group: ${{ github.event_name == 'pull_request' && 'ci-pr-slot-e2e' || format('ci-{0}-{1}-e2e-{2}', github.run_id, github.run_attempt, strategy.job-index) }}
      queue: max
    needs: plan
    if: needs.plan.outputs.job_e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Run by the OSV remediation workflow: test its unpublished lockfile
      # bump (see docs/contributing/automation.md#osv-remediation).
      - name: Check out the OSV remediation head
        if: inputs.private-head
        uses: ./.github/actions/osv-remediation-head
        with:
          key: ${{ secrets.OSV_REMEDIATION_BUNDLE_KEY }}
          sha: ${{ inputs.private-sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan

      - name: Validate CI plan
        run: python3 scripts/ci-exec.py validate

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Install capnproto
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends capnproto

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: debug
          env-vars: RUSTFLAGS CARGO_PROFILE_DEV_DEBUG
          cache-on-failure: true
          save-if: false

      - name: Staged plugin installation (e2e)
        run: python3 scripts/ci-exec.py run e2e

  release:
    name: release build + small-VPS envelope (${{ matrix.lto }} LTO)
    # Pull request runs take turns in one slot per job, so they leave
    # runners for the merge queue (docs/contributing/ci.md#pull-request-slots).
    concurrency:
      group: ${{ github.event_name == 'pull_request' && 'ci-pr-slot-release' || format('ci-{0}-{1}-release-{2}', github.run_id, github.run_attempt, strategy.job-index) }}
      queue: max
    needs: plan
    if: needs.plan.outputs.job_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # Pull requests link the release binaries with thin LTO, which uses every
    # core; the merge queue and OSV remediation runs keep the shipping fat
    # LTO, so the build and envelope that gate main measure the binaries we
    # ship. The cache key covers every CARGO* variable, so each mode has its
    # own `release` cache, and the build-only main push seeds both
    # (docs/contributing/ci.md#release-build).
    strategy:
      fail-fast: false
      matrix:
        lto: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.private-head && '["fat","thin"]' || github.event_name == 'pull_request' && !inputs.private-head && '["thin"]' || '["fat"]') }}
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ matrix.lto }}
      # The collector lives on diagnostics.<DOMAIN>, or on the workers.dev URL
      # the deploy stores when DOMAIN is unset
      # (.github/workflows/diagnostics-collector-deploy.yml). Job-wide, so the
      # envelope's install finds the binaries current instead of rebuilding.
      BOOKCLERK_DIAGNOSTICS_COLLECTOR_URL: ${{ vars.DOMAIN && format('https://diagnostics.{0}', vars.DOMAIN) || vars.DIAGNOSTICS_COLLECTOR_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Run by the OSV remediation workflow: test its unpublished lockfile
      # bump (see docs/contributing/automation.md#osv-remediation).
      - name: Check out the OSV remediation head
        if: inputs.private-head
        uses: ./.github/actions/osv-remediation-head
        with:
          key: ${{ secrets.OSV_REMEDIATION_BUNDLE_KEY }}
          sha: ${{ inputs.private-sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan

      - name: Validate CI plan
        run: python3 scripts/ci-exec.py validate

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Install Node.js
        if: needs.plan.outputs.release_mode == 'full'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          # No npm cache for an unpublished OSV remediation bump.
          cache: ${{ !inputs.private-head && 'npm' || '' }}
          cache-dependency-path: ui/package-lock.json

      - name: Install capnproto
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends capnproto

      # Build-only main push: the dependency cache key covers Cargo.lock, the
      # manifests, the toolchain and the CI env, not this repository's
      # sources, so on most merges this job's key is already saved and the
      # build would save nothing. Skip it then (docs/contributing/ci.md#build-only-main-pushes).
      - name: Look up the saved cache
        id: saved
        if: env.CI_BUILD_ONLY == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          env-vars: RUSTFLAGS CARGO_PROFILE_DEV_DEBUG
          cache-on-failure: true
          lookup-only: true
          save-if: false

      - name: Skip the build when the saved cache is current
        if: steps.saved.outputs.cache-hit == 'true'
        shell: bash
        run: echo "CI_SAVED_CACHE_CURRENT=true" >> "$GITHUB_ENV"

      - name: Cache cargo
        if: env.CI_SAVED_CACHE_CURRENT != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          env-vars: RUSTFLAGS CARGO_PROFILE_DEV_DEBUG
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' && !inputs.private-head }}

      - name: Build release binaries
        if: needs.plan.outputs.check_release == 'true'
        run: python3 scripts/ci-exec.py run release

      # The envelope runs on the binaries the release step just built; its
      # `install-platform --release` only compiles what that step did not.
      - name: Measure the 1 GiB envelope
        if: needs.plan.outputs.check_envelope == 'true'
        run: python3 scripts/ci-exec.py run envelope

      - name: Upload envelope metrics
        if: always() && needs.plan.outputs.check_envelope == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: envelope-metrics
          path: ${{ runner.temp }}/BookclerkFiles/envelope-metrics.json
          if-no-files-found: warn

      # The daemon's own log says why it stopped; the step output only says
      # that it did. The daemon redacts secrets and runs on a throwaway seed.
      - name: Upload the envelope daemon log
        if: failure() && needs.plan.outputs.check_envelope == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: envelope-daemon-log
          path: ${{ runner.temp }}/BookclerkFiles/envelope/bookclerkd-envelope.log
          if-no-files-found: warn

  confinement:
    name: sandbox + jailed tiers (${{ matrix.os }})
    # Pull request runs take turns in one slot per job, so they leave
    # runners for the merge queue (docs/contributing/ci.md#pull-request-slots).
    concurrency:
      group: ${{ github.event_name == 'pull_request' && 'ci-pr-slot-confinement' || format('ci-{0}-{1}-confinement-{2}', github.run_id, github.run_attempt, strategy.job-index) }}
      queue: max
