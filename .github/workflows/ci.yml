name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

# Cancel superseded PR runs; never cancel merge_group / main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: checkout + local cargo build/test only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  # Selective PR CI (#157). Keep "0" (shadow) until representative PRs have
  # executed the selective command branches. When "1", job/step selection
  # follows the planner; merge_group / main still force full_suite via
  # --force-full. execute_full_suite collapses to plan.full_suite when
  # selection is on.
  SELECTIVE_CI: "0"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      full_suite: ${{ steps.plan.outputs.full_suite }}
      ui: ${{ steps.plan.outputs.ui }}
      ts_sdk: ${{ steps.plan.outputs.ts_sdk }}
      python_sdk: ${{ steps.plan.outputs.python_sdk }}
      abi_sync: ${{ steps.plan.outputs.abi_sync }}
      build_app_platform: ${{ steps.plan.outputs.build_app_platform }}
      build_app_optional: ${{ steps.plan.outputs.build_app_optional }}
      build_app_examples: ${{ steps.plan.outputs.build_app_examples }}
      confinement: ${{ steps.plan.outputs.confinement }}
      tray: ${{ steps.plan.outputs.tray }}
      store_free: ${{ steps.plan.outputs.store_free }}
      release: ${{ steps.plan.outputs.release }}
      docs_markdown: ${{ steps.plan.outputs.docs_markdown }}
      rust_packages: ${{ steps.plan.outputs.rust_packages }}
      rust_doc_packages: ${{ steps.plan.outputs.rust_doc_packages }}
      rust_doctest_packages: ${{ steps.plan.outputs.rust_doctest_packages }}
      rust_package_count: ${{ steps.plan.outputs.rust_package_count }}
      # Execution gate: true in shadow (SELECTIVE_CI!=1) or when the planner
      # predicts full_suite. Job/step selection and cargo package targeting use
      # this; ``full_suite`` above stays the unmodified prediction for reports.
      execute_full_suite: ${{ steps.flags.outputs.execute_full_suite }}
      run_rust: ${{ steps.flags.outputs.run_rust }}
      run_ui: ${{ steps.flags.outputs.run_ui }}
      run_docs: ${{ steps.flags.outputs.run_docs }}
      run_sdk: ${{ steps.flags.outputs.run_sdk }}
      run_build_app: ${{ steps.flags.outputs.run_build_app }}
      run_confinement: ${{ steps.flags.outputs.run_confinement }}
      run_tray: ${{ steps.flags.outputs.run_tray }}
      run_release: ${{ steps.flags.outputs.run_release }}
      run_store_free: ${{ steps.flags.outputs.run_store_free }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve base / head
        id: shas
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            BASE="${{ github.event.merge_group.base_sha }}"
            HEAD="${{ github.sha }}"
          else
            # push to main: previous commit as base when available
            HEAD="${{ github.sha }}"
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              BASE="$(git rev-parse HEAD^)"
            else
              BASE="$HEAD"
            fi
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

      - name: Run planner unit tests
        run: python3 scripts/tests/test_ci_plan.py -q

      - name: Database plugin isolation
        run: python3 scripts/tests/test_db_plugin_isolation.py -q

      - name: Private-docs lint regression
        run: python3 scripts/tests/test_private_docs_lint.py

      - name: Compute CI plan
        id: plan
        run: |
          set -euo pipefail
          EXTRA=()
          # Full suite on merge_group / main push regardless of paths.
          if [ "${{ github.event_name }}" = "merge_group" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            EXTRA+=(--force-full)
          fi
          python3 scripts/ci-plan.py \
            --base "${{ steps.shas.outputs.base }}" \
            --head "${{ steps.shas.outputs.head }}" \
            --format github-output \
            --write-summary \
            "${EXTRA[@]+"${EXTRA[@]}"}"
          python3 scripts/ci-plan.py \
            --base "${{ steps.shas.outputs.base }}" \
            --head "${{ steps.shas.outputs.head }}" \
            --format json \
            "${EXTRA[@]+"${EXTRA[@]}"}" > ci-plan.json

      - name: Shadow mode notice
        if: env.SELECTIVE_CI != '1'
        run: |
          {
            echo "## Selective CI shadow mode"
            echo ""
            echo "\`SELECTIVE_CI\` is \`${{ env.SELECTIVE_CI }}\`: the planner still"
            echo "records predicted skip/run decisions (\`full_suite\` and surface"
            echo "flags) while \`execute_full_suite=true\` forces the full command"
            echo "baseline so predictions can be compared safely."
            echo "Flip \`SELECTIVE_CI\` to \`1\` after representative PR plans look correct."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Derive run flags
        id: flags
        run: |
          set -euo pipefail
          FULL="${{ steps.plan.outputs.full_suite }}"
          SEL="${{ env.SELECTIVE_CI }}"
          # Execution vs prediction: shadow (SELECTIVE_CI!=1) always executes the
          # full baseline; planner ``full_suite`` remains the reported prediction.
          if [ "$SEL" != "1" ] || [ "$FULL" = "true" ]; then
            echo "execute_full_suite=true" >> "$GITHUB_OUTPUT"
          else
            echo "execute_full_suite=false" >> "$GITHUB_OUTPUT"
          fi
          # When shadowing or the plan predicts full_suite, every job runs.
          if [ "$SEL" != "1" ] || [ "$FULL" = "true" ]; then
            echo "run_rust=true" >> "$GITHUB_OUTPUT"
            echo "run_ui=true" >> "$GITHUB_OUTPUT"
            echo "run_docs=true" >> "$GITHUB_OUTPUT"
            echo "run_sdk=true" >> "$GITHUB_OUTPUT"
            echo "run_build_app=true" >> "$GITHUB_OUTPUT"
            echo "run_confinement=true" >> "$GITHUB_OUTPUT"
            echo "run_tray=true" >> "$GITHUB_OUTPUT"
            echo "run_release=true" >> "$GITHUB_OUTPUT"
            echo "run_store_free=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Selective PR path (SELECTIVE_CI=1 and plan.full_suite=false).
          COUNT="${{ steps.plan.outputs.rust_package_count }}"
          if [ "${COUNT:-0}" != "0" ]; then
            echo "run_rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_rust=false" >> "$GITHUB_OUTPUT"
          fi
          echo "run_ui=${{ steps.plan.outputs.ui }}" >> "$GITHUB_OUTPUT"
          # Docs job: markdown-only changes still skip heavy API generation unless
          # a language surface is affected; rust/ts/python flags drive generate.
          if [ "${{ steps.plan.outputs.ui }}" = "true" ] \
            || [ "${{ steps.plan.outputs.ts_sdk }}" = "true" ] \
            || [ "${{ steps.plan.outputs.python_sdk }}" = "true" ] \
            || [ "${COUNT:-0}" != "0" ]; then
            echo "run_docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_docs=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ steps.plan.outputs.abi_sync }}" = "true" ] \
            || [ "${{ steps.plan.outputs.ts_sdk }}" = "true" ] \
            || [ "${{ steps.plan.outputs.python_sdk }}" = "true" ]; then
            echo "run_sdk=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_sdk=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ steps.plan.outputs.build_app_platform }}" = "true" ] \
            || [ "${{ steps.plan.outputs.build_app_optional }}" = "true" ] \
            || [ "${{ steps.plan.outputs.build_app_examples }}" = "true" ]; then
            echo "run_build_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_build_app=false" >> "$GITHUB_OUTPUT"
          fi
          echo "run_confinement=${{ steps.plan.outputs.confinement }}" >> "$GITHUB_OUTPUT"
          echo "run_tray=${{ steps.plan.outputs.tray }}" >> "$GITHUB_OUTPUT"
          echo "run_release=${{ steps.plan.outputs.release }}" >> "$GITHUB_OUTPUT"
          echo "run_store_free=${{ steps.plan.outputs.store_free }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ci-plan
          path: ci-plan.json
          if-no-files-found: error

  check:
    name: fmt / clippy / test
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        if: needs.plan.outputs.run_rust == 'true' || needs.plan.outputs.run_docs == 'true' || needs.plan.outputs.run_sdk == 'true' || needs.plan.outputs.run_build_app == 'true' || needs.plan.outputs.run_store_free == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Rust toolchain (fmt only)
        if: needs.plan.outputs.run_rust != 'true' && needs.plan.outputs.run_docs != 'true' && needs.plan.outputs.run_sdk != 'true' && needs.plan.outputs.run_build_app != 'true' && needs.plan.outputs.run_store_free != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Node.js
        if: needs.plan.outputs.run_ui == 'true' || needs.plan.outputs.run_sdk == 'true' || needs.plan.outputs.run_docs == 'true' || needs.plan.outputs.run_build_app == 'true' || needs.plan.outputs.run_release == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            packages/plugin-sdk/package-lock.json

      - name: Install capnproto
        if: needs.plan.outputs.run_rust == 'true' || needs.plan.outputs.run_docs == 'true' || needs.plan.outputs.run_sdk == 'true' || needs.plan.outputs.run_build_app == 'true' || needs.plan.outputs.run_store_free == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends capnproto

      - name: Cache cargo
        if: needs.plan.outputs.run_rust == 'true' || needs.plan.outputs.run_docs == 'true' || needs.plan.outputs.run_sdk == 'true' || needs.plan.outputs.run_build_app == 'true' || needs.plan.outputs.run_store_free == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: RUSTFLAGS
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build UI
        if: needs.plan.outputs.run_ui == 'true' || needs.plan.outputs.run_build_app == 'true' || needs.plan.outputs.execute_full_suite == 'true'
        run: |
          cd ui
          npm ci
          npm run lint
          npm run test:safe-html
          npm run build

      - name: Author surface check
        if: needs.plan.outputs.run_sdk == 'true' || needs.plan.outputs.run_rust == 'true'
        run: ./scripts/check-author-surface.sh

      - name: Plugin SDK ABI schema drift check
        if: needs.plan.outputs.run_sdk == 'true'
        run: |
          python3 scripts/gen-plugin-abi.py --check
          python3 scripts/sync-workerd-pin.py --check
          cd packages/plugin-sdk
          npm ci
          npm run build
          # The isolate embed is bundled from src/ by `npm run build`; a stale
          # committed bundle (or mirror) is drift.
          git diff --exit-code -- embed/bookclerk_plugin.js
          npm run lint
          npm run test:tools
          npm run test:db-value
          npm run test:plugin-migrations
          npm run test:entrypoints
          npm run test:entrypoints-codec

      - name: Python plugin SDK tools conformance
        if: needs.plan.outputs.run_sdk == 'true' || needs.plan.outputs.python_sdk == 'true'
        run: |
          python3 -m venv .venv-ci-plugin-sdk
          .venv-ci-plugin-sdk/bin/pip install -e "packages/plugin-sdk-python[dev,docs]"
          .venv-ci-plugin-sdk/bin/ruff check packages/plugin-sdk-python
          .venv-ci-plugin-sdk/bin/pytest packages/plugin-sdk-python/tests -q

      - name: Rust plugin SDK tools conformance
        if: needs.plan.outputs.run_sdk == 'true'
        run: cargo test -p bookclerk-plugin-sdk --features tools --test tools_conformance

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        if: needs.plan.outputs.run_rust == 'true'
        run: |
          set -euo pipefail
          # `-D missing_errors_doc` / `missing_panics_doc` enforce Google-style
          # section *existence* on public items (prose quality is review-only).
          # Private-item section checks use CLIPPY_CONF_DIR=clippy-publish below.
          if [ "${{ needs.plan.outputs.execute_full_suite }}" = "true" ]; then
            cargo clippy --workspace --all-targets -- \
              -D warnings \
              -D clippy::missing_docs_in_private_items \
              -D clippy::missing_errors_doc \
              -D clippy::missing_panics_doc
          else
            PKGS="${{ needs.plan.outputs.rust_packages }}"
            ARGS=()
            for p in $PKGS; do ARGS+=(-p "$p"); done
            cargo clippy "${ARGS[@]}" --all-targets -- \
              -D warnings \
              -D clippy::missing_docs_in_private_items \
              -D clippy::missing_errors_doc \
              -D clippy::missing_panics_doc
          fi

      - name: Clippy publish-crate doc lints
        if: needs.plan.outputs.run_sdk == 'true' || needs.plan.outputs.execute_full_suite == 'true'
        env:
          # Private items included for the publish trio only.
          CLIPPY_CONF_DIR: ${{ github.workspace }}/clippy-publish
        run: >
          cargo clippy -p bookclerk-plugin-abi -p bookclerk-plugin-manifest
          -p bookclerk-plugin-sdk --all-targets --
          -D warnings
          -D clippy::missing_errors_doc
          -D clippy::missing_panics_doc
      - name: Generate API docs
        if: needs.plan.outputs.run_docs == 'true'
        run: |
          set -euo pipefail
          if [ "${{ needs.plan.outputs.execute_full_suite }}" = "true" ]; then
            ./scripts/generate-api-docs.sh --check --all
          else
            ARGS=(--check)
            DOC_PKGS="${{ needs.plan.outputs.rust_doc_packages }}"
            for p in $DOC_PKGS; do ARGS+=(--rust-package "$p"); done
            if [ "${{ needs.plan.outputs.ts_sdk }}" = "true" ]; then
              ARGS+=(--typescript-sdk)
            fi
            if [ "${{ needs.plan.outputs.ui }}" = "true" ]; then
              ARGS+=(--ui)
            fi
            if [ "${{ needs.plan.outputs.python_sdk }}" = "true" ]; then
              ARGS+=(--python)
            fi
            # If only rust packages selected, still generate rust docs.
            if [ -z "$DOC_PKGS" ] && [ "${{ needs.plan.outputs.ts_sdk }}" != "true" ] \
              && [ "${{ needs.plan.outputs.ui }}" != "true" ] \
              && [ "${{ needs.plan.outputs.python_sdk }}" != "true" ]; then
              echo "No API doc surfaces selected; skipping"
              exit 0
            fi
            ./scripts/generate-api-docs.sh "${ARGS[@]}"
          fi

      - name: Explicit doctests
        if: needs.plan.outputs.run_rust == 'true'
        run: |
          set -euo pipefail
          # Compiles every library's rustdoc `# Examples`. Most crates have
          # zero runnable examples (Google-style docs are prose-first); that
          # is not a skip. Unit/integration tests run in the Test step.
          if [ "${{ needs.plan.outputs.execute_full_suite }}" = "true" ]; then
            cargo test --workspace --doc --all-features
          else
            PKGS="${{ needs.plan.outputs.rust_doctest_packages }}"
            if [ -z "${PKGS}" ]; then
              echo "No doctestable packages in plan; skipping cargo test --doc"
              exit 0
            fi
            ARGS=()
            for p in $PKGS; do ARGS+=(-p "$p"); done
            cargo test "${ARGS[@]}" --doc --all-features
          fi

      - name: Plugin host without in-process sources
        if: needs.plan.outputs.run_store_free == 'true'
        run: cargo check -p bookclerk-plugin-host --no-default-features

      - name: Hosts build store-free, and stay cipher-free
        if: needs.plan.outputs.run_store_free == 'true'
        run: |
          cargo clippy -p bookclerk-cli -p bookclerkd --no-default-features \
            --all-targets -- -D warnings
          ./scripts/check-store-free-hosts.sh
          ./scripts/check-plugin-architecture.sh

      - name: Build app (platform + optional + examples)
        if: needs.plan.outputs.run_build_app == 'true'
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${{ needs.plan.outputs.execute_full_suite }}" = "true" ] \
            || [ "${{ needs.plan.outputs.build_app_platform }}" = "true" ]; then
            ARGS+=(--platform)
          fi
          if [ "${{ needs.plan.outputs.execute_full_suite }}" = "true" ] \
            || [ "${{ needs.plan.outputs.build_app_optional }}" = "true" ]; then
            ARGS+=(--optional)
          fi
          if [ "${{ needs.plan.outputs.execute_full_suite }}" = "true" ] \
            || [ "${{ needs.plan.outputs.build_app_examples }}" = "true" ]; then
            ARGS+=(--examples)
          fi
          if [ ${#ARGS[@]} -eq 0 ]; then
            ARGS=(--platform)
          fi
          cargo build-app "${ARGS[@]}"

      - name: Pinned workerd present beside helpers
        if: needs.plan.outputs.run_build_app == 'true' && (needs.plan.outputs.build_app_platform == 'true' || needs.plan.outputs.execute_full_suite == 'true')
        run: |
          test -x target/debug/bookclerk-workerd
          test -x target/debug/workerd
          test -f target/debug/workerd.version

      - name: Install platform guests into FILES_DIR
        if: needs.plan.outputs.run_build_app == 'true' && (needs.plan.outputs.build_app_platform == 'true' || needs.plan.outputs.execute_full_suite == 'true')
        env:
          BOOKCLERK_FILES_DIR: ${{ runner.temp }}/BookclerkFiles
        run: cargo install-platform --skip-build

      - name: Stage optional plugins + reference examples
        if: needs.plan.outputs.run_build_app == 'true' && (needs.plan.outputs.build_app_optional == 'true' || needs.plan.outputs.build_app_examples == 'true' || needs.plan.outputs.execute_full_suite == 'true')
        env:
          BOOKCLERK_PLUGIN_ARTIFACTS: ${{ runner.temp }}/bookclerk-plugins
        run: |
          set -euo pipefail
          ARGS=(--skip-build)
          if [ "${{ needs.plan.outputs.execute_full_suite }}" = "true" ] \
            || [ "${{ needs.plan.outputs.build_app_optional }}" = "true" ]; then
            ARGS+=(--optional)
          fi
          if [ "${{ needs.plan.outputs.execute_full_suite }}" = "true" ] \
            || [ "${{ needs.plan.outputs.build_app_examples }}" = "true" ]; then
            ARGS+=(--examples)
          fi
          cargo stage-plugins "${ARGS[@]}"

      - name: Test
        if: needs.plan.outputs.run_rust == 'true'
        env:
          BOOKCLERK_FILES_DIR: ${{ runner.temp }}/BookclerkFiles
          BOOKCLERK_PLUGIN_ARTIFACTS: ${{ runner.temp }}/bookclerk-plugins
          BOOKCLERK_SANDBOX_REQUIRE_ENFORCEMENT: "1"
          BOOKCLERK_SANDBOX_REQUIRE_SPAWN_ENFORCEMENT: "1"
          BOOKCLERK_WORKERD_BIN: ${{ github.workspace }}/target/debug/workerd
        run: |
          set -euo pipefail
          if [ -n "${BOOKCLERK_SKIP_WORKERD:-}" ]; then
            echo "CI must run the workerd contract (do not set BOOKCLERK_SKIP_WORKERD)" >&2
            exit 1
          fi
          export PATH="${{ github.workspace }}/target/debug:$PATH"
          NEED_SQLITE_GUEST=0
          if [ "${{ needs.plan.outputs.execute_full_suite }}" = "true" ]; then
            NEED_SQLITE_GUEST=1
          else
            case " ${{ needs.plan.outputs.rust_packages }} " in
              *" bookclerk-plugin-host "*) NEED_SQLITE_GUEST=1 ;;
            esac
          fi
          if [ "$NEED_SQLITE_GUEST" = 1 ]; then
            # Production Cap'n leftover LIKE needs a guest binary compiled in
            # this job. `cargo test -p bookclerk-plugin-host` does not rebuild
            # dependency bins, so a stale snapshot binary advertises
            # maxFunctionArgs=0 and fails host minimums.
            cargo build -p bookclerk-plugin-database-sqlite
          fi
          if [ "${{ needs.plan.outputs.execute_full_suite }}" = "true" ]; then
            # `--lib --bins --tests` keeps unit + integration tests and skips
            # doctests (already run in "Explicit doctests"). `--tests` alone
            # would drop `src/` unit tests.
            cargo test --workspace --lib --bins --tests
            cargo test -p bookclerk-plugin-database-sqlite --features host-helpers --lib --bins --tests
          else
            PKGS="${{ needs.plan.outputs.rust_packages }}"
            ARGS=()
            for p in $PKGS; do ARGS+=(-p "$p"); done
            cargo test "${ARGS[@]}" --lib --bins --tests
            case " $PKGS " in
              *" bookclerk-plugin-database-sqlite "*)
                cargo test -p bookclerk-plugin-database-sqlite --features host-helpers --lib --bins --tests
                ;;
            esac
          fi

  release:
    name: release build
    needs: plan
    if: needs.plan.outputs.run_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install capnproto
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends capnproto

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: RUSTFLAGS
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build

      - name: Build release binaries
        env:
          BOOKCLERK_DIAGNOSTICS_COLLECTOR_URL: ${{ vars.DIAGNOSTICS_COLLECTOR_BASE_URL }}
        run: cargo build-app --release --platform

      - name: Helper binaries are present beside the hosts
        run: |
          test -x target/release/bookclerk-media-worker
          test -x target/release/bookclerk-jail
          test -x target/release/bookclerk-workerd
          test -x target/release/workerd
          test -f target/release/workerd.version

  confinement:
    name: sandbox + jailed tiers (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.run_confinement == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: RUSTFLAGS
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: >
          cargo clippy -p bookclerk-sandbox -p bookclerk-media
          -p bookclerk-media-worker -p bookclerk-jail
          --all-targets -- -D warnings

      - name: Test
        if: matrix.os != 'windows-latest'
        env:
          BOOKCLERK_SANDBOX_REQUIRE_ENFORCEMENT: "1"
          BOOKCLERK_SANDBOX_REQUIRE_SPAWN_ENFORCEMENT: "1"
        run: >
          cargo test -p bookclerk-sandbox -p bookclerk-media -p bookclerk-media-worker
          -p bookclerk-jail

      - name: Test
        if: matrix.os == 'windows-latest'
        env:
          BOOKCLERK_SANDBOX_REQUIRE_SPAWN_ENFORCEMENT: "1"
        run: >
          cargo test -p bookclerk-sandbox -p bookclerk-media -p bookclerk-media-worker
          -p bookclerk-jail -- --test-threads=1

      - name: Install capnproto (Windows native gateway)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $url = "https://capnproto.org/capnproto-c++-win32-1.1.0.zip"
          $zip = "$env:RUNNER_TEMP\capnproto.zip"
          $expectedHash = "623b7525501d410e6479c8029eba265aa57ac8153c6fa09ab21a62f906b3e3f9"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          $actualHash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            Write-Error "capnproto checksum mismatch. Expected $expectedHash, got $actualHash"
            exit 1
          }
          Expand-Archive -Path $zip -DestinationPath "C:\capnproto" -Force
          $toolsDir = "C:\capnproto\capnproto-tools-win32-1.1.0"
          if (-not (Test-Path "$toolsDir\capnp.exe")) {
            Write-Error "capnp.exe not found at $toolsDir"
            Get-ChildItem -Path "C:\capnproto" -Recurse | Select-Object FullName
            exit 1
          }
          echo $toolsDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Clippy native-behind-workerd Windows gateway
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p bookclerk-workerd --all-targets -- -D warnings
          cargo clippy -p bookclerk-plugin-sdk --features http --all-targets -- -D warnings
          cargo clippy -p bookclerk-plugin-host --lib -- -D warnings

      - name: Test named-pipe SOCKET_PROXY
        if: matrix.os == 'windows-latest'
        run: cargo test -p bookclerk-workerd --lib

  tray:
    name: tray (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.run_tray == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: RUSTFLAGS
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy bookclerk-tray
        run: cargo clippy -p bookclerk-tray --all-targets -- -D warnings

      - name: Test bookclerk-tray
        run: cargo test -p bookclerk-tray

  postgres-jobs:
    name: postgres ${{ matrix.postgres }}
    needs: plan
    if: needs.plan.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install capnproto
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends capnproto

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: RUSTFLAGS
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Postgres job-queue tests
        env:
          BOOKCLERK_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
          BOOKCLERK_REQUIRE_POSTGRES_TESTS: "1"
        run: cargo test -p bookclerk-library --lib postgres_ -- --ignored --nocapture

      - name: Postgres TOTP atomic tests
        env:
          BOOKCLERK_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
          BOOKCLERK_REQUIRE_POSTGRES_TESTS: "1"
        run: cargo test -p bookclerk-library --lib postgres_totp -- --nocapture

      - name: Postgres shared SQL-plan vectors
        env:
          BOOKCLERK_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
          BOOKCLERK_REQUIRE_POSTGRES_TESTS: "1"
        run: cargo test -p bookclerk-library --lib typed_shared_vectors_on_postgres -- --ignored --nocapture

      - name: Postgres guest page tests
        env:
          BOOKCLERK_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
          BOOKCLERK_REQUIRE_POSTGRES_TESTS: "1"
        run: cargo test -p bookclerk-db-guest --lib postgres_ -- --ignored --nocapture

      - name: Postgres plugin binding-schema isolation tests
        env:
          BOOKCLERK_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
          BOOKCLERK_REQUIRE_POSTGRES_TESTS: "1"
        run: cargo test -p bookclerk-plugin-database-postgres --lib postgres_ -- --ignored --nocapture

      - name: Postgres production RPC proxy LIKE boundary
        env:
          BOOKCLERK_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
          BOOKCLERK_REQUIRE_POSTGRES_TESTS: "1"
          BOOKCLERK_WORKERD_BIN: ${{ github.workspace }}/target/debug/workerd
        run: |
          set -euo pipefail
          # Production spawn always goes through bookclerk-workerd; the guest
          # binary alone is not enough after the mandatory front-door change
          # (mirrors the main Test job's PATH / BOOKCLERK_WORKERD_BIN setup).
          cargo build -p bookclerk-plugin-database-postgres -p bookclerk-workerd -p bookclerk-jail
          cargo ensure-workerd
          export PATH="${{ github.workspace }}/target/debug:$PATH"
          cargo test -p bookclerk-plugin-host --lib production_rpc_proxy_keeps_like_through_postgres_guest -- --ignored --nocapture

  ci-gate:
    name: CI Gate
    needs: [plan, check, release, confinement, tray, postgres-jobs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required jobs
        env:
          PLAN: ${{ needs.plan.result }}
          CHECK: ${{ needs.check.result }}
          RELEASE: ${{ needs.release.result }}
          CONFINEMENT: ${{ needs.confinement.result }}
          TRAY: ${{ needs.tray.result }}
          POSTGRES_JOBS: ${{ needs.postgres-jobs.result }}
        run: |
          set -euo pipefail
          echo "plan=$PLAN check=$CHECK release=$RELEASE confinement=$CONFINEMENT tray=$TRAY postgres-jobs=$POSTGRES_JOBS"
          fail=0
          for pair in "plan:$PLAN" "check:$CHECK" "release:$RELEASE" "confinement:$CONFINEMENT" "tray:$TRAY" "postgres-jobs:$POSTGRES_JOBS"; do
            job="${pair%%:*}"
            result="${pair#*:}"
            case "$result" in
              success|skipped) ;;
              *)
                echo "required job $job failed: $result"
                fail=1
                ;;
            esac
          done
          exit "$fail"
