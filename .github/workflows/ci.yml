name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  # The OSV remediation workflow runs the whole suite on a lockfile bump it
  # has not published yet: every job checks out the sealed commit after
  # actions/checkout, caches are not saved, and cargo output is quiet.
  workflow_call:
    inputs:
      private-head:
        description: Check out this run's sealed OSV remediation commit in every job.
        type: boolean
        default: false
      private-sha:
        description: Id of the sealed commit (its parent is github.sha).
        type: string
        default: ""
    secrets:
      OSV_REMEDIATION_BUNDLE_KEY:
        description: Passphrase of the sealed OSV remediation bundle.
        required: false

# Cancel superseded PR runs; never cancel merge_group / main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: checkout + local cargo build/test only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  # Line tables keep file:line in panics and backtraces at a fraction of the
  # link time and cache size of full debuginfo (dev and test profiles only).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # A failing test's panic prints its backtrace. Library backtraces stay off:
  # with RUST_BACKTRACE alone, every error built by an error library such as
  # anyhow would capture a backtrace, slowing tests that create many errors.
  RUST_BACKTRACE: "1"
  RUST_LIB_BACKTRACE: "0"
  # Selective PR CI (#157). "0" = shadow: every job runs at full scope and the
  # selective prediction is recorded in the plan summary for audit. "1" = jobs
  # and checks follow the prediction. merge_group / main always --force-full.
  SELECTIVE_CI: "1"
  # A push to main compiles only, to save the dependency caches (the plan
  # job's resolve step adds --build-only on the same condition).
  CI_BUILD_ONLY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  # Quiet cargo on an unpublished OSV remediation bump: "Compiling <crate>
  # <version>" lines would show the bump in the public log.
  CARGO_TERM_QUIET: ${{ inputs.private-head && 'true' || 'false' }}

# Every job below `plan` downloads the `ci-plan` artifact, validates it
# (schema, run id, checked-out commit) and runs checks through
# `scripts/ci-exec.py run <check>`, which issues the check's prerequisites
# first. `if:` gates read the same artifact via the plan job's outputs.
# scripts/tests/test_ci_contract.py keeps this file and the planner in sync.
jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      job_check: ${{ steps.resolve.outputs.job_check }}
      job_test: ${{ steps.resolve.outputs.job_test }}
      job_e2e: ${{ steps.resolve.outputs.job_e2e }}
      job_release: ${{ steps.resolve.outputs.job_release }}
      job_confinement: ${{ steps.resolve.outputs.job_confinement }}
      job_native_gateway: ${{ steps.resolve.outputs.job_native_gateway }}
      job_tray: ${{ steps.resolve.outputs.job_tray }}
      job_postgres: ${{ steps.resolve.outputs.job_postgres }}
      job_windows_cluster: ${{ steps.resolve.outputs.job_windows_cluster }}
      job_envelope: ${{ steps.resolve.outputs.job_envelope }}
      job_site: ${{ steps.resolve.outputs.job_site }}
      check_ui: ${{ steps.resolve.outputs.check_ui }}
      check_plugin_sdk_abi: ${{ steps.resolve.outputs.check_plugin_sdk_abi }}
      check_python_sdk: ${{ steps.resolve.outputs.check_python_sdk }}
      check_author_surface: ${{ steps.resolve.outputs.check_author_surface }}
      check_fmt: ${{ steps.resolve.outputs.check_fmt }}
      check_clippy: ${{ steps.resolve.outputs.check_clippy }}
      check_clippy_publish: ${{ steps.resolve.outputs.check_clippy_publish }}
      check_api_docs: ${{ steps.resolve.outputs.check_api_docs }}
      check_doctest: ${{ steps.resolve.outputs.check_doctest }}
      check_store_free: ${{ steps.resolve.outputs.check_store_free }}
      check_site_test: ${{ steps.resolve.outputs.check_site_test }}
      check_site_audit: ${{ steps.resolve.outputs.check_site_audit }}
      check_collector_test: ${{ steps.resolve.outputs.check_collector_test }}
      check_demo_test: ${{ steps.resolve.outputs.check_demo_test }}
      check_needs_cargo: ${{ steps.resolve.outputs.check_needs_cargo }}
      check_needs_node: ${{ steps.resolve.outputs.check_needs_node }}
      check_needs_uv: ${{ steps.resolve.outputs.check_needs_uv }}
      release_mode: ${{ steps.resolve.outputs.release_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Fail closed: without the commit id no job would check the bump out,
      # and CI Gate would pass on github.sha alone.
      - name: Require the sealed commit id
        if: inputs.private-head && inputs.private-sha == ''
        run: |
          echo "::error::private-head requires private-sha"
          exit 1

      # Run by the OSV remediation workflow: test its unpublished lockfile
      # bump (see docs/contributing/automation.md#osv-remediation).
      - name: Check out the OSV remediation head
        if: inputs.private-head
        uses: ./.github/actions/osv-remediation-head
        with:
          key: ${{ secrets.OSV_REMEDIATION_BUNDLE_KEY }}
          sha: ${{ inputs.private-sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Resolve base / head
        id: shas
        run: |
          set -euo pipefail
          if [ "${{ inputs.private-head }}" = "true" ]; then
            # The sealed commit sits on top of github.sha.
            HEAD="$(git rev-parse HEAD)"
            BASE="$(git rev-parse HEAD^)"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            BASE="${{ github.event.merge_group.base_sha }}"
            HEAD="${{ github.sha }}"
          else
            # push to main: previous commit as base when available
            HEAD="${{ github.sha }}"
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              BASE="$(git rev-parse HEAD^)"
            else
              BASE="$HEAD"
            fi
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

      - name: Install CI test requirements
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ci-venv"
          "$RUNNER_TEMP/ci-venv/bin/pip" install --require-hashes -r scripts/tests/requirements.txt

      - name: Planner, executor and workflow-contract tests
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/ci-venv/bin/python"
          "$PY" scripts/tests/test_ci_plan.py
          "$PY" scripts/tests/test_ci_relations.py
          "$PY" scripts/tests/test_ci_contract.py
          "$PY" scripts/tests/test_plugin_publisher.py
          "$PY" scripts/tests/test_envelope.py
          "$PY" scripts/tests/test_source_apk_probe.py
          "$PY" scripts/tests/test_osv_remediate.py
          "$PY" scripts/tests/test_fuzz_crash_triage.py
          "$PY" scripts/tests/test_osv_advisories.py
          "$PY" scripts/tests/test_docs_markdown.py
          "$PY" scripts/tests/test_rustdoc_markdown.py
          "$PY" scripts/tests/test_python_api_markdown.py
          "$PY" scripts/tests/test_openapi_markdown.py
          "$PY" scripts/tests/test_docs_publish.py
          "$PY" scripts/tests/test_diagnostics_plan.py
          "$PY" scripts/tests/test_holding_issue.py
          "$PY" scripts/tests/test_regression_issue.py
          "$PY" scripts/tests/test_summary_comment.py
          "$PY" scripts/tests/test_release_baseline.py
          "$PY" scripts/tests/test_dev_env.py

      - name: Database plugin isolation
        run: python3 scripts/tests/test_db_plugin_isolation.py -q

      - name: Private-docs lint regression
        run: python3 scripts/tests/test_private_docs_lint.py

      - name: Resolve CI plan
        id: resolve
        run: |
          set -euo pipefail
          EXTRA=()
          # Full suite on merge_group / main push / OSV remediation regardless
          # of paths.
          if [ "${{ github.event_name }}" = "merge_group" ] || [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ inputs.private-head }}" = "true" ]; then
            EXTRA+=(--force-full)
          fi
          # main only advances through the merge queue, whose run already
          # tested this exact commit: the push run compiles and saves caches.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            EXTRA+=(--build-only)
          fi
          python3 scripts/ci-exec.py resolve \
            --base "${{ steps.shas.outputs.base }}" \
            --head "${{ steps.shas.outputs.head }}" \
            --selective "$SELECTIVE_CI" \
            "${EXTRA[@]+"${EXTRA[@]}"}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan/ci-plan.json
          if-no-files-found: error

  check:
    name: fmt / clippy / docs
    needs: plan
    if: needs.plan.outputs.job_check == 'true'
    runs-on: ubuntu-latest
    env:
      BOOKCLERK_SANDBOX_REQUIRE_ENFORCEMENT: "1"
      BOOKCLERK_SANDBOX_REQUIRE_SPAWN_ENFORCEMENT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Run by the OSV remediation workflow: test its unpublished lockfile
      # bump (see docs/contributing/automation.md#osv-remediation).
      - name: Check out the OSV remediation head
        if: inputs.private-head
        uses: ./.github/actions/osv-remediation-head
        with:
          key: ${{ secrets.OSV_REMEDIATION_BUNDLE_KEY }}
          sha: ${{ inputs.private-sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan

      - name: Validate CI plan
        run: python3 scripts/ci-exec.py validate

      - name: Install Rust toolchain
        if: needs.plan.outputs.check_needs_cargo == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Node.js
        if: needs.plan.outputs.check_needs_node == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          # No npm cache for an unpublished OSV remediation bump.
          cache: ${{ !inputs.private-head && 'npm' || '' }}
          cache-dependency-path: |
            ui/package-lock.json
            packages/plugin-sdk/package-lock.json

      # The Python SDK check and its API docs install from
      # packages/plugin-sdk-python/uv.lock. No uv cache: nothing from an
      # unpublished OSV remediation bump may be saved.
      - name: Install uv
        if: needs.plan.outputs.check_needs_uv == 'true'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.32"
          enable-cache: false

      - name: Install capnproto
        if: needs.plan.outputs.check_needs_cargo == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends capnproto

      # Build-only main push: the dependency cache key covers Cargo.lock, the
      # manifests, the toolchain and the CI env, not this repository's
      # sources, so on most merges this job's key is already saved and the
      # build would save nothing. Skip it then (docs/contributing/ci.md#build-only-main-pushes).
      - name: Look up the saved cache
        id: saved
        if: env.CI_BUILD_ONLY == 'true' && needs.plan.outputs.check_needs_cargo == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint
          env-vars: RUSTFLAGS CARGO_PROFILE_DEV_DEBUG
          cache-on-failure: true
          lookup-only: true
          save-if: false

      - name: Skip the build when the saved cache is current
        if: steps.saved.outputs.cache-hit == 'true'
        shell: bash
        run: echo "CI_SAVED_CACHE_CURRENT=true" >> "$GITHUB_ENV"

      - name: Cache cargo
        if: needs.plan.outputs.check_needs_cargo == 'true' && env.CI_SAVED_CACHE_CURRENT != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint
          env-vars: RUSTFLAGS CARGO_PROFILE_DEV_DEBUG
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' && !inputs.private-head }}

      - name: UI lint, tests and build
        if: needs.plan.outputs.check_ui == 'true'
        run: python3 scripts/ci-exec.py run ui

      - name: Plugin SDK ABI schema drift check
        if: needs.plan.outputs.check_plugin_sdk_abi == 'true'
        run: python3 scripts/ci-exec.py run plugin_sdk_abi

      - name: Python plugin SDK tools conformance
        if: needs.plan.outputs.check_python_sdk == 'true'
        run: python3 scripts/ci-exec.py run python_sdk

      - name: Author surface check
        if: needs.plan.outputs.check_author_surface == 'true'
        run: python3 scripts/ci-exec.py run author_surface

      - name: Format
        if: needs.plan.outputs.check_fmt == 'true'
        run: python3 scripts/ci-exec.py run fmt

      - name: Clippy
        if: needs.plan.outputs.check_clippy == 'true'
        run: python3 scripts/ci-exec.py run clippy

      - name: Clippy publish-crate doc lints
        if: needs.plan.outputs.check_clippy_publish == 'true'
        run: python3 scripts/ci-exec.py run clippy_publish

      - name: Generate API docs
        if: needs.plan.outputs.check_api_docs == 'true'
        run: python3 scripts/ci-exec.py run api_docs

      - name: Explicit doctests
        if: needs.plan.outputs.check_doctest == 'true'
        run: python3 scripts/ci-exec.py run doctest

      - name: Hosts build store-free, and stay cipher-free
        if: needs.plan.outputs.check_store_free == 'true'
        run: python3 scripts/ci-exec.py run store_free

  test:
    name: unit + integration tests
    needs: plan
    if: needs.plan.outputs.job_test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BOOKCLERK_SANDBOX_REQUIRE_ENFORCEMENT: "1"
      BOOKCLERK_SANDBOX_REQUIRE_SPAWN_ENFORCEMENT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Run by the OSV remediation workflow: test its unpublished lockfile
      # bump (see docs/contributing/automation.md#osv-remediation).
      - name: Check out the OSV remediation head
        if: inputs.private-head
        uses: ./.github/actions/osv-remediation-head
        with:
          key: ${{ secrets.OSV_REMEDIATION_BUNDLE_KEY }}
          sha: ${{ inputs.private-sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan

      - name: Validate CI plan
        run: python3 scripts/ci-exec.py validate

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.146

      - name: Install capnproto
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends capnproto

      # Build-only main push: the dependency cache key covers Cargo.lock, the
      # manifests, the toolchain and the CI env, not this repository's
      # sources, so on most merges this job's key is already saved and the
      # build would save nothing. Skip it then (docs/contributing/ci.md#build-only-main-pushes).
      - name: Look up the saved cache
        id: saved
        if: env.CI_BUILD_ONLY == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: debug
          env-vars: RUSTFLAGS CARGO_PROFILE_DEV_DEBUG
          cache-on-failure: true
          lookup-only: true
          save-if: false

      - name: Skip the build when the saved cache is current
        if: steps.saved.outputs.cache-hit == 'true'
        shell: bash
        run: echo "CI_SAVED_CACHE_CURRENT=true" >> "$GITHUB_ENV"

      - name: Cache cargo
        if: env.CI_SAVED_CACHE_CURRENT != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: debug
          env-vars: RUSTFLAGS CARGO_PROFILE_DEV_DEBUG
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' && !inputs.private-head }}

      - name: Test
        run: python3 scripts/ci-exec.py run rust_test

  e2e:
    name: staged plugin installation (e2e)
    needs: plan
    if: needs.plan.outputs.job_e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Run by the OSV remediation workflow: test its unpublished lockfile
      # bump (see docs/contributing/automation.md#osv-remediation).
      - name: Check out the OSV remediation head
        if: inputs.private-head
        uses: ./.github/actions/osv-remediation-head
        with:
          key: ${{ secrets.OSV_REMEDIATION_BUNDLE_KEY }}
          sha: ${{ inputs.private-sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan

      - name: Validate CI plan
        run: python3 scripts/ci-exec.py validate

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Install capnproto
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends capnproto

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: debug
          env-vars: RUSTFLAGS CARGO_PROFILE_DEV_DEBUG
          cache-on-failure: true
          save-if: false

      - name: Staged plugin installation (e2e)
        run: python3 scripts/ci-exec.py run e2e

  release:
    name: release build
    needs: plan
    if: needs.plan.outputs.job_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Run by the OSV remediation workflow: test its unpublished lockfile
      # bump (see docs/contributing/automation.md#osv-remediation).
      - name: Check out the OSV remediation head
        if: inputs.private-head
        uses: ./.github/actions/osv-remediation-head
        with:
          key: ${{ secrets.OSV_REMEDIATION_BUNDLE_KEY }}
          sha: ${{ inputs.private-sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan

      - name: Validate CI plan
        run: python3 scripts/ci-exec.py validate

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Install Node.js
        if: needs.plan.outputs.release_mode == 'full'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          # No npm cache for an unpublished OSV remediation bump.
          cache: ${{ !inputs.private-head && 'npm' || '' }}
          cache-dependency-path: ui/package-lock.json

      - name: Install capnproto
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends capnproto

      # Build-only main push: the dependency cache key covers Cargo.lock, the
      # manifests, the toolchain and the CI env, not this repository's
      # sources, so on most merges this job's key is already saved and the
      # build would save nothing. Skip it then (docs/contributing/ci.md#build-only-main-pushes).
      - name: Look up the saved cache
        id: saved
        if: env.CI_BUILD_ONLY == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release
          env-vars: RUSTFLAGS CARGO_PROFILE_DEV_DEBUG
          cache-on-failure: true
          lookup-only: true
          save-if: false

      - name: Skip the build when the saved cache is current
        if: steps.saved.outputs.cache-hit == 'true'
        shell: bash
        run: echo "CI_SAVED_CACHE_CURRENT=true" >> "$GITHUB_ENV"

      - name: Cache cargo
        if: env.CI_SAVED_CACHE_CURRENT != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release
          env-vars: RUSTFLAGS CARGO_PROFILE_DEV_DEBUG
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' && !inputs.private-head }}

      # The collector lives on diagnostics.<DOMAIN>, or on the workers.dev URL
      # the deploy stores when DOMAIN is unset
      # (.github/workflows/diagnostics-collector-deploy.yml).
      - name: Build release binaries
        env:
          BOOKCLERK_DIAGNOSTICS_COLLECTOR_URL: ${{ vars.DOMAIN && format('https://diagnostics.{0}', vars.DOMAIN) || vars.DIAGNOSTICS_COLLECTOR_BASE_URL }}
        run: python3 scripts/ci-exec.py run release

  confinement:
    name: sandbox + jailed tiers (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.job_confinement == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Run by the OSV remediation workflow: test its unpublished lockfile
      # bump (see docs/contributing/automation.md#osv-remediation).
      - name: Check out the OSV remediation head
        if: inputs.private-head
        uses: ./.github/actions/osv-remediation-head
        with:
          key: ${{ secrets.OSV_REMEDIATION_BUNDLE_KEY }}
          sha: ${{ inputs.private-sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan

      - name: Validate CI plan
        run: python scripts/ci-exec.py validate

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: debug
          env-vars: RUSTFLAGS CARGO_PROFILE_DEV_DEBUG
          cache-on-failure: true
          save-if: false

      - name: Confinement clippy + enforcement tests
        run: python scripts/ci-exec.py run confinement

  native-gateway:
    name: native-behind-workerd gateway (${{ matrix.os }})
    needs: plan
    timeout-minutes: 45
    if: needs.plan.outputs.job_native_gateway == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Run by the OSV remediation workflow: test its unpublished lockfile
      # bump (see docs/contributing/automation.md#osv-remediation).
      - name: Check out the OSV remediation head
        if: inputs.private-head
        uses: ./.github/actions/osv-remediation-head
        with:
          key: ${{ secrets.OSV_REMEDIATION_BUNDLE_KEY }}
          sha: ${{ inputs.private-sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan

      - name: Validate CI plan
        run: python scripts/ci-exec.py validate

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy

      # Build-only main push: the dependency cache key covers Cargo.lock, the
      # manifests, the toolchain and the CI env, not this repository's
      # sources, so on most merges this job's key is already saved and the
      # build would save nothing. Skip it then (docs/contributing/ci.md#build-only-main-pushes).
      # Linux never saves here (the test job saves its debug cache), so a
      # build-only Linux child always skips.
      - name: Look up the saved cache
        id: saved
        if: env.CI_BUILD_ONLY == 'true' && runner.os != 'Linux'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: debug
          env-vars: RUSTFLAGS CARGO_PROFILE_DEV_DEBUG
          cache-on-failure: true
          lookup-only: true
          save-if: false

      - name: Skip the build when the saved cache is current
        if: steps.saved.outputs.cache-hit == 'true' || (env.CI_BUILD_ONLY == 'true' && runner.os == 'Linux')
        shell: bash
        run: echo "CI_SAVED_CACHE_CURRENT=true" >> "$GITHUB_ENV"

      - name: Cache cargo
        if: env.CI_SAVED_CACHE_CURRENT != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: debug
          env-vars: RUSTFLAGS CARGO_PROFILE_DEV_DEBUG
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.os != 'ubuntu-latest' && !inputs.private-head }}

      - name: Install capnproto (Linux)
        if: runner.os == 'Linux' && env.CI_SAVED_CACHE_CURRENT != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends capnproto

      - name: Install capnproto (macOS)
        if: runner.os == 'macOS' && env.CI_SAVED_CACHE_CURRENT != 'true'
        run: brew install capnp

      - name: Install capnproto (Windows)
        if: runner.os == 'Windows' && env.CI_SAVED_CACHE_CURRENT != 'true'
        shell: pwsh
        run: |
          $url = "https://capnproto.org/capnproto-c++-win32-1.1.0.zip"
          $zip = "$env:RUNNER_TEMP\capnproto.zip"
          $expectedHash = "623b7525501d410e6479c8029eba265aa57ac8153c6fa09ab21a62f906b3e3f9"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          $actualHash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            Write-Error "capnproto checksum mismatch. Expected $expectedHash, got $actualHash"
            exit 1
          }
          Expand-Archive -Path $zip -DestinationPath "C:\capnproto" -Force
          $toolsDir = "C:\capnproto\capnproto-tools-win32-1.1.0"
          if (-not (Test-Path "$toolsDir\capnp.exe")) {
            Write-Error "capnp.exe not found at $toolsDir"
            Get-ChildItem -Path "C:\capnproto" -Recurse | Select-Object FullName
            exit 1
          }
          echo $toolsDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Native gateway smoke (+ Windows/macOS workerd checks)
        run: python scripts/ci-exec.py run native_gateway

  tray:
    name: tray (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.job_tray == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
