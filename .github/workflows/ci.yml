name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: checkout + local cargo build/test only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: RUSTFLAGS
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  release:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: RUSTFLAGS
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build

      - name: Build release binaries
        env:
          BOOKCLERK_DIAGNOSTICS_COLLECTOR_URL: ${{ vars.DIAGNOSTICS_COLLECTOR_BASE_URL }}
        run: cargo build --release -p bookclerk-cli -p bookclerkd

  # Explicit tray matrix so each OS backend is compiled (ksni on Linux,
  # tray-icon without GTK features on Windows/macOS).
  tray:
    name: tray (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: RUSTFLAGS
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy bookclerk-tray
        run: cargo clippy -p bookclerk-tray --all-targets -- -D warnings

      - name: Test bookclerk-tray
        run: cargo test -p bookclerk-tray
