    if: needs.plan.outputs.job_tray == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows joins Linux in the merge queue and on main (`os_matrix`).
        os: ${{ fromJSON(needs.plan.outputs.os_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Run by the OSV remediation workflow: test its unpublished lockfile
      # bump (see docs/contributing/automation.md#osv-remediation).
      - name: Check out the OSV remediation head
        if: inputs.private-head
        uses: ./.github/actions/osv-remediation-head
        with:
          key: ${{ secrets.OSV_REMEDIATION_BUNDLE_KEY }}
          sha: ${{ inputs.private-sha }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan

      - name: Validate CI plan
        run: python scripts/ci-exec.py validate

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: debug
          env-vars: RUSTFLAGS CARGO_PROFILE_DEV_DEBUG
          cache-on-failure: true
          save-if: false

      - name: Tray clippy + tests
        run: python scripts/ci-exec.py run tray

  # The macOS legs of `confinement`, `native-gateway` and `tray`, one step
  # each, on one runner: a run asks GitHub for one macOS runner instead of
  # three (docs/contributing/ci.md#macos-job). Each step runs when its
  # owning job is planned, and after an earlier step failed too, so one
  # round shows every failure. When GitHub never gives this job a runner
  # even after a retry, CI Gate lets the run pass without it.
  macos:
    name: macOS (sandbox, gateway, tray)
    needs: plan
    # The three legs run one after another, so they share one budget.
    timeout-minutes: 150
    # Not on pull requests (`os_legs`): the merge queue runs it.
    if: >-
      needs.plan.outputs.os_legs == 'true' && (
      needs.plan.outputs.job_confinement == 'true' ||
      needs.plan.outputs.job_native_gateway == 'true' ||
      needs.plan.outputs.job_tray == 'true')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Run by the OSV remediation workflow: test its unpublished lockfile
      # bump (see docs/contributing/automation.md#osv-remediation).
      - name: Check out the OSV remediation head
        if: inputs.private-head
        uses: ./.github/actions/osv-remediation-head
        with:
          key: ${{ secrets.OSV_REMEDIATION_BUNDLE_KEY }}
          sha: ${{ inputs.private-sha }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan

      - name: Validate CI plan
        run: python scripts/ci-exec.py validate

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy

      # Build-only main push: as in `native-gateway`, skip the build when
      # this key is already saved (docs/contributing/ci.md#build-only-main-pushes).
      - name: Look up the saved cache
        id: saved
        if: env.CI_BUILD_ONLY == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: debug
          env-vars: RUSTFLAGS CARGO_PROFILE_DEV_DEBUG
          cache-on-failure: true
          lookup-only: true
          save-if: false

      - name: Skip the build when the saved cache is current
        if: steps.saved.outputs.cache-hit == 'true'
        shell: bash
        run: echo "CI_SAVED_CACHE_CURRENT=true" >> "$GITHUB_ENV"

      - name: Cache cargo
        if: env.CI_SAVED_CACHE_CURRENT != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: debug
          env-vars: RUSTFLAGS CARGO_PROFILE_DEV_DEBUG
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' && !inputs.private-head }}

      - name: Install capnproto
        if: needs.plan.outputs.job_native_gateway == 'true' && env.CI_SAVED_CACHE_CURRENT != 'true'
        run: brew install capnp

      # Runs only when every setup step above succeeded; the legs below
      # need it, so a failed setup step doesn't start them.
      - name: Setup done
        id: setup
        run: echo "setup done"

      - name: Confinement clippy + enforcement tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.plan.outputs.job_confinement == 'true' }}
        run: python scripts/ci-exec.py run confinement

      - name: Native gateway smoke + workerd lib tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.plan.outputs.job_native_gateway == 'true' }}
        run: python scripts/ci-exec.py run native_gateway

      - name: Tray clippy + tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.plan.outputs.job_tray == 'true' }}
        run: python scripts/ci-exec.py run tray

  postgres:
    name: postgres ${{ matrix.postgres }}
    # Pull request runs take turns in one slot per job, so they leave
    # runners for the merge queue (docs/contributing/ci.md#pull-request-slots).
    concurrency:
      group: ${{ github.event_name == 'pull_request' && 'ci-pr-slot-postgres' || format('ci-{0}-{1}-postgres-{2}', github.run_id, github.run_attempt, strategy.job-index) }}
      queue: max
    needs: plan
    if: needs.plan.outputs.job_postgres == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BOOKCLERK_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      BOOKCLERK_REQUIRE_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Run by the OSV remediation workflow: test its unpublished lockfile
      # bump (see docs/contributing/automation.md#osv-remediation).
      - name: Check out the OSV remediation head
        if: inputs.private-head
        uses: ./.github/actions/osv-remediation-head
        with:
          key: ${{ secrets.OSV_REMEDIATION_BUNDLE_KEY }}
          sha: ${{ inputs.private-sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan

      - name: Validate CI plan
        run: python3 scripts/ci-exec.py validate

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Install capnproto
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends capnproto

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: debug
          env-vars: RUSTFLAGS CARGO_PROFILE_DEV_DEBUG
          cache-on-failure: true
          save-if: false

      - name: Postgres contract tests
        run: python3 scripts/ci-exec.py run postgres

  windows-cluster:
    name: windows cluster startup + identity
    needs: plan
    timeout-minutes: 45
    if: needs.plan.outputs.job_windows_cluster == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Run by the OSV remediation workflow: test its unpublished lockfile
      # bump (see docs/contributing/automation.md#osv-remediation).
      - name: Check out the OSV remediation head
        if: inputs.private-head
        uses: ./.github/actions/osv-remediation-head
        with:
          key: ${{ secrets.OSV_REMEDIATION_BUNDLE_KEY }}
          sha: ${{ inputs.private-sha }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan

      - name: Validate CI plan
        run: python scripts/ci-exec.py validate

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: debug
          env-vars: RUSTFLAGS CARGO_PROFILE_DEV_DEBUG
          cache-on-failure: true
          save-if: false

      - name: Install capnproto (Windows)
        shell: pwsh
        run: |
          $url = "https://capnproto.org/capnproto-c++-win32-1.1.0.zip"
          $zip = "$env:RUNNER_TEMP\capnproto.zip"
          $expectedHash = "623b7525501d410e6479c8029eba265aa57ac8153c6fa09ab21a62f906b3e3f9"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          $actualHash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            Write-Error "capnproto checksum mismatch. Expected $expectedHash, got $actualHash"
            exit 1
          }
          Expand-Archive -Path $zip -DestinationPath "C:\capnproto" -Force
          $toolsDir = "C:\capnproto\capnproto-tools-win32-1.1.0"
          if (-not (Test-Path "$toolsDir\capnp.exe")) {
            Write-Error "capnp.exe not found at $toolsDir"
            Get-ChildItem -Path "C:\capnproto" -Recurse | Select-Object FullName
            exit 1
          }
          echo $toolsDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cluster startup and identity tests
        run: python scripts/ci-exec.py run windows_cluster

  site:
    name: website + collector Workers
    # Pull request runs take turns in one slot per job, so they leave
    # runners for the merge queue (docs/contributing/ci.md#pull-request-slots).
    concurrency:
      group: ${{ github.event_name == 'pull_request' && 'ci-pr-slot-site' || format('ci-{0}-{1}-site-{2}', github.run_id, github.run_attempt, strategy.job-index) }}
      queue: max
    needs: plan
    if: needs.plan.outputs.job_site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # npm ci runs dependency code here; keep the token out of .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Run by the OSV remediation workflow: test its unpublished lockfile
      # bump (see docs/contributing/automation.md#osv-remediation).
      - name: Check out the OSV remediation head
        if: inputs.private-head
        uses: ./.github/actions/osv-remediation-head
        with:
          key: ${{ secrets.OSV_REMEDIATION_BUNDLE_KEY }}
          sha: ${{ inputs.private-sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan

      - name: Validate CI plan
        run: python3 scripts/ci-exec.py validate

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          # No npm cache for an unpublished OSV remediation bump.
          cache: ${{ !inputs.private-head && 'npm' || '' }}
          cache-dependency-path: |
            tools/site/package-lock.json
            tools/site/audit/package-lock.json
            tools/diagnostics-collector/package-lock.json
            tools/demo/package-lock.json

      - name: Website tests
        if: needs.plan.outputs.check_site_test == 'true'
        env:
          CI_COVERAGE_DIR: ${{ runner.temp }}/coverage
        run: python3 scripts/ci-exec.py run site_test

      # Lighthouse and axe-core against the built site under `wrangler dev`,
      # with the runner's Chrome (docs/contributing/automation.md#website-checks).
      - name: Website audit
        if: needs.plan.outputs.check_site_audit == 'true'
        env:
          CI_BUNDLE_DIR: ${{ runner.temp }}/bundles
          CI_WORKER_STARTUP: "1"
        run: python3 scripts/ci-exec.py run site_audit

      # Lighthouse reports for a failed audit. Not for an unpublished OSV
      # remediation bump: the reports name the audit's package versions.
      - name: Upload the website audit reports
        if: failure() && needs.plan.outputs.check_site_audit == 'true' && !inputs.private-head
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-audit
          path: ${{ runner.temp }}/site-audit
          if-no-files-found: ignore
          retention-days: 7

      - name: Diagnostics collector tests
        if: needs.plan.outputs.check_collector_test == 'true'
        env:
          CI_COVERAGE_DIR: ${{ runner.temp }}/coverage
          CI_BUNDLE_DIR: ${{ runner.temp }}/bundles
          CI_WORKER_STARTUP: "1"
        run: python3 scripts/ci-exec.py run collector_test

      - name: Hosted demo tests
        if: needs.plan.outputs.check_demo_test == 'true'
        env:
          CI_COVERAGE_DIR: ${{ runner.temp }}/coverage
          CI_BUNDLE_DIR: ${{ runner.temp }}/bundles
          CI_WORKER_STARTUP: "1"
        run: python3 scripts/ci-exec.py run demo_test

      # One artifact for the Workers that ran: site/, collector/ and demo/,
      # each with its JUnit report. Failed tests still upload their results.
      - name: Upload the Workers coverage reports
        if: ${{ !cancelled() && !inputs.private-head }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-workers
          path: ${{ runner.temp }}/coverage
          if-no-files-found: ignore
          retention-days: 7

      # The bundled Worker scripts for Codecov Bundle Analysis, as a deploy
      # would build them. Not for an unpublished OSV remediation bump: the
      # bundles hold the bumped dependencies' code.
      - name: Upload the Worker bundles
        if: ${{ !inputs.private-head }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-workers
          path: ${{ runner.temp }}/bundles
          if-no-files-found: ignore
          retention-days: 7

  # A merge group, like an OSV remediation run, only needs to know whether it
  # can land. Once any job fails, cancel the rest of the run so CI Gate
  # reports at once and the queue ejects the group instead of holding runners
  # until the slowest job ends. Pull requests keep running every job so one
  # round shows every failure. This job builds and runs no repository code;
  # it is the only one that can cancel the run. In a called run, job names
  # carry the caller's prefix (`<caller job> / CI Gate`).
  merge-queue-fail-fast:
    name: merge-queue fail-fast
    if: github.event_name == 'merge_group' || inputs.private-head
    runs-on: ubuntu-latest
    timeout-minutes: 310
    permissions:
      actions: write
    steps:
      - name: Cancel the run when a job fails or the group is gone
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -uo pipefail
          while true; do
            if ! jobs=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
                --jq '.jobs[] | select(.name | endswith("merge-queue fail-fast") | not) | "\(.status)|\(.conclusion)|\(.name)"'); then
              sleep 30
              continue
            fi
            # CI Gate starts only after every other job has finished; from
            # then on it reports the result, and a cancel would stop it.
            if grep -qE '^(in_progress|completed)\|[^|]*\|(.* / )?CI Gate$' <<<"$jobs"; then
              exit 0
            fi
            # The queue deletes a dropped group's branch; its run can't merge
            # (docs/contributing/ci.md#superseded-merge-groups). Exit code 2
            # means the ref is missing; a transport error just retries. The
            # queue also deletes a merged group's branch, so look again for a
            # started CI Gate first.
            if [ -n "$QUEUE_REF" ]; then
              git ls-remote --exit-code "https://github.com/$GH_REPO.git" "$QUEUE_REF" >/dev/null
              if [ $? -eq 2 ] && started=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
                  --jq '.jobs[] | select(.status != "queued") | .name') &&
                ! grep -qE '^(.* / )?CI Gate$' <<<"$started"; then
                echo "::error::cancelling the merge-group run: $QUEUE_REF no longer exists"
                gh run cancel "$RUN_ID"
                exit 0
              fi
            fi
            failed=$(grep -E '^completed\|(failure|timed_out)\|' <<<"$jobs" || true)
            # Cancel only while another job is still running or waiting.
            pending=$(grep -vE '^completed\|' <<<"$jobs" | grep -vE '\|(.* / )?CI Gate$' || true)
            if [ -n "$failed" ] && [ -n "$pending" ]; then
              echo "::error::cancelling the merge-group run: $(cut -d'|' -f3 <<<"$failed" | paste -sd, -)"
              gh run cancel "$RUN_ID"
              exit 0
            fi
            sleep 30
          done

  ci-gate:
    name: CI Gate
    needs:
      - plan
      - check
      - test
      - e2e
      - release
      - confinement
      - native-gateway
      - tray
      - macos
      - postgres
      - windows-cluster
      - site
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The stranded-job step: CI runs and their jobs, the macOS job's
      # annotations, and a merge group's pull request timeline.
      actions: read
      checks: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Run by the OSV remediation workflow: test its unpublished lockfile
      # bump (see docs/contributing/automation.md#osv-remediation).
      - name: Check out the OSV remediation head
        if: inputs.private-head
        uses: ./.github/actions/osv-remediation-head
        with:
          key: ${{ secrets.OSV_REMEDIATION_BUNDLE_KEY }}
          sha: ${{ inputs.private-sha }}

      # A failed or skipped plan job leaves no artifact: download fails and
      # so does the gate.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan

      - name: Validate CI plan
        run: python3 scripts/ci-exec.py validate

      # GitHub sometimes never gives the macOS job a runner. Once that has
      # been retried (a pull request run re-run once, a merge group
      # re-enqueued once), the gate lets the run pass without it
      # (docs/contributing/ci.md#macos-job). Reads the GitHub API only.
      # `needs` reports such a job as `abandoned` (the jobs API says
      # `cancelled`).
      - name: Check whether the macOS job never got a runner
        id: stranded
        if: contains(fromJSON('["cancelled", "abandoned"]'), needs.macos.result) && !inputs.private-head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python3 scripts/merge_queue_requeue.py --repo "$REPO" --run-id "$RUN_ID"
          --run-attempt "$RUN_ATTEMPT" --stranded-job "macOS (sandbox, gateway, tray)"

      - name: Compare job results with the expected execution
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_GATE_STRANDED: ${{ steps.stranded.outputs.stranded == 'true' && 'macos' || '' }}
        run: python3 scripts/ci-exec.py gate

      # Coverage (docs/contributing/ci.md#coverage): patch coverage of the
      # change and each area's floor, from the reports the test jobs
      # uploaded. Report-only while scripts/coverage_areas.toml says so.
      - name: Download the coverage reports
        if: ${{ !cancelled() && !inputs.private-head }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
          path: ${{ runner.temp }}/coverage

      - name: Download the change's added lines
        if: ${{ !cancelled() && !inputs.private-head }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-patch
          path: ${{ runner.temp }}/ci-patch

      - name: Coverage
        if: ${{ !cancelled() && !inputs.private-head }}
        run: >-
          python3 scripts/coverage_gate.py
          --reports "$RUNNER_TEMP/coverage"
          --diff "$RUNNER_TEMP/ci-patch/patch.diff"
          --plan "$RUNNER_TEMP/ci-plan/ci-plan.json"

      # Web API contract (docs/contributing/ci.md#web-api-contract): how
      # many declared responses the daemon's tests observed and every
      # response that disagreed with the document. A disagreement, an
      # observed share under the floor in scripts/coverage_areas.toml, or
      # no report at all when the plan ran the daemon's tests and the test
      # job succeeded, fails the gate. A run whose tests did not run (a
      # build-only main push, a selective plan) gets one log line and no
      # summary.
      - name: Web API contract
        if: ${{ !cancelled() && !inputs.private-head }}
        env:
          TESTS_RESULT: ${{ needs.test.result }}
        run: >-
          python3 scripts/contract_coverage.py
          --reports "$RUNNER_TEMP/coverage/contract"
          --plan "$RUNNER_TEMP/ci-plan/ci-plan.json"
          --tests-result "$TESTS_RESULT"
          --mode enforce
