name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: checkout + local cargo build/test only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            packages/plugin-sdk/package-lock.json

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: RUSTFLAGS
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build

      - name: Plugin SDK ABI schema drift check
        run: |
          python3 scripts/gen-plugin-abi.py --check
          python3 scripts/sync-workerd-pin.py --check
          cd packages/plugin-sdk
          npm ci
          npm run check-schema
          npm run build
          npm run test:tools

      - name: Python plugin SDK tools conformance
        run: |
          python3 -m venv .venv-ci-plugin-sdk
          .venv-ci-plugin-sdk/bin/pip install -e packages/plugin-sdk-python pytest
          .venv-ci-plugin-sdk/bin/pytest packages/plugin-sdk-python/tests -q

      - name: Rust plugin SDK tools conformance
        run: cargo test -p bookclerk-plugin-sdk --features tools --test tools_conformance

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Google-style API docs → docs/api/ (see docs/code-documentation.md).
      # --check generates into a temp dir so the workspace tree stays clean.
      - name: Generate API docs
        run: ./scripts/generate-api-docs.sh --check

      - name: Plugin host without in-process sources
        run: cargo check -p bookclerk-plugin-host --no-default-features

      # A packager who may not ship DRM code needs the hosts themselves to build
      # without a store, not just the plugin host crate. The script also asserts
      # no cipher survives in that graph, which is the part a refactor can break
      # silently.
      - name: Hosts build store-free, and stay cipher-free
        run: |
          cargo clippy -p bookclerk-cli -p bookclerkd --no-default-features \
            --all-targets -- -D warnings
          ./scripts/check-store-free-hosts.sh

      # Package list comes from directory discovery (platform / optional / examples).
      # `build-app --platform` also ensures the pinned Cloudflare `workerd` binary.
      - name: Build app (platform + optional + examples)
        run: cargo build-app --platform --optional --examples

      - name: Pinned workerd present beside helpers
        run: |
          test -x target/debug/bookclerk-workerd
          test -x target/debug/workerd
          test -f target/debug/workerd.version

      - name: Install platform guests into FILES_DIR
        env:
          BOOKCLERK_FILES_DIR: ${{ runner.temp }}/BookclerkFiles
        run: cargo install-platform --skip-build

      - name: Stage optional plugins + reference examples
        env:
          BOOKCLERK_PLUGIN_ARTIFACTS: ${{ runner.temp }}/bookclerk-plugins
        run: cargo stage-plugins --optional --examples --skip-build

      - name: Test
        env:
          BOOKCLERK_FILES_DIR: ${{ runner.temp }}/BookclerkFiles
          BOOKCLERK_PLUGIN_ARTIFACTS: ${{ runner.temp }}/bookclerk-plugins
          BOOKCLERK_SANDBOX_REQUIRE_ENFORCEMENT: "1"
          BOOKCLERK_SANDBOX_REQUIRE_SPAWN_ENFORCEMENT: "1"
          BOOKCLERK_WORKERD_BIN: ${{ github.workspace }}/target/debug/workerd
        # Prepend helpers in-shell. Do not use `env.PATH` — workflow `env:` has
        # no PATH key, so `${{ env.PATH }}` is empty and wiped `cargo` off PATH.
        # `$GITHUB_PATH` only affects *later* steps, not this one.
        run: |
          export PATH="${{ github.workspace }}/target/debug:$PATH"
          cargo test --workspace

  release:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: RUSTFLAGS
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build

      # Hosts + helpers + platform guests from directory discovery.
      - name: Build release binaries
        env:
          BOOKCLERK_DIAGNOSTICS_COLLECTOR_URL: ${{ vars.DIAGNOSTICS_COLLECTOR_BASE_URL }}
        run: cargo build-app --release --platform

      - name: Helper binaries are present beside the hosts
        run: |
          test -x target/release/bookclerk-media-worker
          test -x target/release/bookclerk-jail
          test -x target/release/bookclerk-workerd
          test -x target/release/workerd
          test -f target/release/workerd.version

  # The confinement backends are entirely per-OS, so an ubuntu-only run says
  # nothing about Seatbelt or the Windows path. This also exercises the negative
  # tests for both jailed tiers — the media worker's per-job allowlist and the
  # launcher's hand-off to a plugin guest — which are what prove neither can
  # reach anything it did not declare.
  confinement:
    name: sandbox + jailed tiers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: RUSTFLAGS
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: >
          cargo clippy -p bookclerk-sandbox -p bookclerk-media
          -p bookclerk-media-worker -p bookclerk-jail
          --all-targets -- -D warnings

      # Every enforcement test no-ops without a backend, so a runner that lost
      # Landlock would report green while proving nothing. Demand enforcement
      # where we expect it:
      # - REQUIRE_ENFORCEMENT — self-confine (Landlock/Seatbelt); empty on Windows
      # - REQUIRE_SPAWN_ENFORCEMENT — CreateProcess AppContainer (jail + media)
      - name: Test
        env:
          # Written the "true" way round on purpose: an empty string is falsy
          # in a GitHub expression, so `os == 'windows' && '' || '1'` collapses
          # to '1' everywhere and silently demands self-confine on Windows too.
          BOOKCLERK_SANDBOX_REQUIRE_ENFORCEMENT: ${{ matrix.os != 'windows-latest' && '1' || '' }}
          BOOKCLERK_SANDBOX_REQUIRE_SPAWN_ENFORCEMENT: "1"
        # DACL mutations are serialized in-process / cross-process via
        # Local\bookclerk-dacl-tx; cargo can run these tests in parallel.
        run: >
          cargo test -p bookclerk-sandbox -p bookclerk-media -p bookclerk-media-worker
          -p bookclerk-jail

  # Explicit tray matrix so each OS backend is compiled (ksni on Linux,
  # tray-icon without GTK features on Windows/macOS).
  tray:
    name: tray (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: RUSTFLAGS
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy bookclerk-tray
        run: cargo clippy -p bookclerk-tray --all-targets -- -D warnings

      - name: Test bookclerk-tray
        run: cargo test -p bookclerk-tray
