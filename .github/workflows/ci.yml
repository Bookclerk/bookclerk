name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: checkout + local cargo build/test only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: RUSTFLAGS
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Plugin host without in-process sources
        run: cargo check -p bookclerk-plugin --no-default-features

      - name: Build first-party plugin artifacts
        run: |
          cargo build -p bookclerk-plugin-echo-integration \
            -p bookclerk-plugin-source-audible \
            -p bookclerk-plugin-source-libro \
            -p bookclerk-plugin-source-chirp \
            -p bookclerk-plugin-source-graphicaudio \
            -p bookclerk-plugin-integration-audiobookshelf
          ./scripts/stage-first-party-plugins.sh debug "$RUNNER_TEMP/bookclerk-plugins"

      - name: Test
        env:
          BOOKCLERK_PLUGIN_ARTIFACTS: ${{ runner.temp }}/bookclerk-plugins
          BOOKCLERK_SANDBOX_REQUIRE_ENFORCEMENT: "1"
        run: cargo test --workspace

  release:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: RUSTFLAGS
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build

      # bookclerk-media-worker and bookclerk-jail ship with the hosts, not
      # alongside them as extras: media jobs are refused without the worker, and
      # plugins are refused without the launcher.
      - name: Build release binaries
        env:
          BOOKCLERK_DIAGNOSTICS_COLLECTOR_URL: ${{ vars.DIAGNOSTICS_COLLECTOR_BASE_URL }}
        run: >
          cargo build --release -p bookclerk-cli -p bookclerkd
          -p bookclerk-media-worker -p bookclerk-jail

      - name: Helper binaries are present beside the hosts
        run: |
          test -x target/release/bookclerk-media-worker
          test -x target/release/bookclerk-jail

  # The confinement backends are entirely per-OS, so an ubuntu-only run says
  # nothing about Seatbelt or the Windows path. This also exercises the negative
  # tests for both jailed tiers — the media worker's per-job allowlist and the
  # launcher's hand-off to a plugin guest — which are what prove neither can
  # reach anything it did not declare.
  confinement:
    name: sandbox + jailed tiers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: RUSTFLAGS
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: >
          cargo clippy -p bookclerk-sandbox -p bookclerk-media
          -p bookclerk-media-worker -p bookclerk-jail --all-targets -- -D warnings

      # Every enforcement test no-ops without a backend, so a runner that lost
      # Landlock would report green while proving nothing. Demand enforcement
      # where we expect it. Windows is exempt: a process cannot confine itself
      # there, so those tests are meant to skip until AppContainer is applied
      # at CreateProcess.
      - name: Test
        env:
          # Written the "true" way round on purpose: an empty string is falsy
          # in a GitHub expression, so `os == 'windows' && '' || '1'` collapses
          # to '1' everywhere and silently demands enforcement on Windows too.
          BOOKCLERK_SANDBOX_REQUIRE_ENFORCEMENT: ${{ matrix.os != 'windows-latest' && '1' || '' }}
        run: >
          cargo test -p bookclerk-sandbox -p bookclerk-media -p bookclerk-media-worker
          -p bookclerk-jail

  # Explicit tray matrix so each OS backend is compiled (ksni on Linux,
  # tray-icon without GTK features on Windows/macOS).
  tray:
    name: tray (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: RUSTFLAGS
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy bookclerk-tray
        run: cargo clippy -p bookclerk-tray --all-targets -- -D warnings

      - name: Test bookclerk-tray
        run: cargo test -p bookclerk-tray
