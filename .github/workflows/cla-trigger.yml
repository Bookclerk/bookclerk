# Starts the Contributor License Agreement check for a pull request.
#
# This workflow does nothing itself. It runs on `pull_request`, so it gets a
# read-only token and no secrets, and a fork's copy of it is what runs for a
# fork pull request. When it completes, the `CLA` workflow (cla.yml) runs on
# `workflow_run` from the default branch with the write token it needs,
# reads the pull request through the API, and reports the `Bookclerk CLA` status.
#
# Nothing here is trusted: a pull request that edits, renames or deletes this
# file can only start the check, start it late, or never start it, and a
# required `Bookclerk CLA` status that never arrives keeps the pull request blocked.
# The check finds the pull request from the run's head commit, branch and
# repository, which GitHub sets, not from anything this run produces.
#
# See docs/contributing/licensing.md#the-cla-check.

name: CLA trigger

on:
  pull_request:
    # `edited` covers a new base branch, which can add commits (and so
    # authors) without moving the head; other edits are filtered out below.
    # `closed` lets the other pull requests on the same head commit decide
    # its shared status alone.
    types: [opened, synchronize, reopened, edited, closed]

permissions: {}

jobs:
  trigger:
    name: CLA trigger
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hand over to the CLA workflow
        run: echo "The CLA workflow checks this pull request when this run completes."
