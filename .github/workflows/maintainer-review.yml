# Maintainer review check.
#
# Policy (scripts/maintainer_review.py):
# - A pull request whose author has write access to the repository, or is
#   Dependabot or the automation App, passes.
# - Any other author's pull request passes only once someone with write
#   access, other than the author, has approved its current head commit and
#   no such reviewer's latest review asks for changes. Every push needs a
#   fresh approval.
# - For those pull requests the check also lists the changed files that run
#   in CI or at build time, or have no text diff, and adds the
#   `touches-ci-or-build` label: a fork's pull request runs its own copy of
#   the workflows, on the pull request and in the merge queue, so a green CI
#   run proves nothing about those files.
# - The verdict is the `Maintainer review` check run on the head commit,
#   posted as the automation App so the default branch's ruleset can require
#   it from that App. Merge groups get a passing check: each pull request in
#   them already passed it to enter the queue. The check belongs to the
#   commit and passes while any open pull request on it passes, so another
#   pull request on a maintainer's commit cannot block it. **Re-run** on the check
#   (`check_run` `rerequested`) decides it again.
# - Pull request and review events reach this workflow through
#   `workflow_run`: the unprivileged `Maintainer review trigger` workflow
#   (maintainer-review-trigger.yml) runs on `pull_request` and
#   `pull_request_review`, and its completion starts this one from the
#   default branch, fork pull requests included. This avoids
#   `pull_request_target`. The check takes nothing from the trigger run but
#   the head commit, branch and repository GitHub records for it, checks out
#   the default branch only, and never checks out or runs pull request code.
#
# Setup (required check): docs/contributing/automation.md#maintainer-review

name: Maintainer review

on:
  workflow_run:
    workflows: ["Maintainer review trigger"]
    types: [completed]
  merge_group:
  # **Re-run** on the `Maintainer review` check. GitHub runs a workflow for a
  # check run's events only when another App (here the automation App)
  # created it, so this needs no webhook.
  check_run:
    types: [rerequested]

permissions: {}

jobs:
  review:
    name: Maintainer review
    # A `workflow_run` counts only for a pull request or review run that
    # completed; a cancelled or skipped one carries no information.
    if: >-
      (github.event_name == 'workflow_run' &&
        contains(fromJSON('["pull_request", "pull_request_review"]'), github.event.workflow_run.event) &&
        github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'check_run' &&
        github.event.check_run.name == 'Maintainer review')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs for one head branch wait for each other, so the newest event's
    # verdict is the one posted last.
    concurrency:
      group: maintainer-review-${{ github.event_name }}-${{ github.event.workflow_run.head_repository.id || github.ref }}-${{ github.event.workflow_run.head_branch || github.event.check_run.head_sha }}
      cancel-in-progress: false
    env:
      # Whether the automation App is configured (a fork may not have it).
      HAS_APP: ${{ secrets.AUTOMATION_APP_CLIENT_ID != '' && secrets.AUTOMATION_APP_PRIVATE_KEY != '' }}
    permissions:
      # Read the checker.
      contents: read
      # Read pull requests, their reviews and changed files.
      pull-requests: read
      # Report the check run when the App is not configured.
      checks: write
    steps:
      # The default branch's checker, never the pull request's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/maintainer_review.py
            scripts/cla_check.py
          sparse-checkout-cone-mode: false

      # Posts the check run and the label, narrowed to Checks and Pull
      # requests on this repository and revoked when the job ends.
      - name: Mint the App token
        id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-pull-requests: write

      - name: Check the review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          REVIEW_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: python3 scripts/maintainer_review.py
