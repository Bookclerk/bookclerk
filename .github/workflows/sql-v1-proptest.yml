# Longer SQL-v1 property tests and the sqlite/postgres differential. PR CI keeps
# modest in-crate case counts plus deterministic corpus replay; coverage-guided
# fuzzing runs in the ClusterFuzzLite workflows (cflite-pr.yml, cflite-batch.yml).
name: SQL-v1 property tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

# Least privilege: checkout + local cargo test / fuzz only.
permissions:
  contents: read

jobs:
  proptest:
    name: proptest (256 cases)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - name: Install capnproto
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends capnproto

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          env-vars: RUSTFLAGS
          cache-on-failure: true

      - name: Parser / TEXT / pack properties
        env:
          PROPTEST_CASES: "256"
        run: cargo test -p bookclerk-plugin-abi --features host --lib sql_text -- --test-threads=1

      - name: Lowering / proof properties
        env:
          PROPTEST_CASES: "256"
        run: cargo test -p bookclerk-db-exec --lib lower::proptests -- --test-threads=1

      - name: Grammar-aware sqlite admission
        env:
          PROPTEST_CASES: "256"
        run: cargo test -p bookclerk-library --lib grammar_aware_sql_is_admitted_on_sqlite -- --test-threads=1

  differential:
    name: sqlite/postgres differential
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - name: Install capnproto
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends capnproto

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          env-vars: RUSTFLAGS
          cache-on-failure: true

      - name: Grammar-aware sqlite vs postgres (normalized DbValue / DbErrorClass)
        env:
          BOOKCLERK_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
          BOOKCLERK_REQUIRE_POSTGRES_TESTS: "1"
        run: cargo test -p bookclerk-library --lib postgres_differential_grammar_aware_matches_sqlite -- --ignored --test-threads=1 --nocapture

