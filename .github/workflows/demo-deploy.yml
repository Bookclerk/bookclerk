# Builds the hosted demo image and deploys the demo Worker (tools/demo), which
# gives each visitor their own container. See tools/demo/README.md.
#
# The image is layered on the production image built from the same commit
# (packaging/demo/Dockerfile), so every crate and plugin in the demo is the
# version that commit ships. It is a release build (about 15 minutes, see
# packaging/demo/docker-bake.hcl), so a commit whose demo image
# images-publish.yml already pushed to GHCR is not rebuilt: the workflow
# verifies that image's build provenance and deploys it. Only a commit
# without one (a push that changes the demo, a manual run on a newer commit,
# a fork without published images) builds here.
#
# When it runs: when the demo itself changes on main, when a release is
# published, after each "Publish images" run on main (the nightly publish,
# which is when crate and plugin changes reach the demo), and by hand. A run
# after a publish or a release whose commit the live demo already runs, or
# is already past, stops before deploying.
#
# Once a day it also refreshes the seed: the baked library's store records
# and Discover shelves are cached for a day, and a container that boots
# from an older template fetches them again, which makes its first pages
# slow. When the run after the nightly publish finds that the live demo
# already runs the published commit, and no run in the last 12 hours baked
# a seed, it re-bakes only the seed on top of that commit's verified
# published image (packaging/demo/Dockerfile.refresh, a few minutes) and
# redeploys the same commit. It never moves the demo to newer code and
# never builds the release binaries. A manual run with `refresh` re-bakes
# the live commit's seed at once.
#
# GitHub repository secrets (without the first two the workflow only prints a
# notice, so a fork without Cloudflare credentials stays green):
#   CLOUDFLARE_API_TOKEN   Workers Scripts edit, Containers edit, D1 edit,
#                          Turnstile edit and Workers Routes edit on the DOMAIN
#                          zone; the first deploy creates the Worker, its D1
#                          database and its container application, see
#                          docs/contributing/automation.md#cloudflare-worker-deploys
#   CLOUDFLARE_ACCOUNT_ID
# Worker secrets are made here, never stored in GitHub: the Turnstile widget
# "bookclerk-demo" and its keys (scripts/worker-secrets.ts), and SESSION_KEY,
# generated once and kept.
#
# Where the Worker is served:
#   DOMAIN set (organization or repository variable): the custom domain
#     demo.<DOMAIN>; the banner links visitors to https://<DOMAIN>.
#   DOMAIN unset (a fork): the account's workers.dev subdomain, read from the
#     deploy output and stored in Actions variable DEMO_URL with the
#     automation App when its secrets are set (otherwise the `gh variable set`
#     command is printed). The banner then has no site link.
#
# https://github.com/cloudflare/wrangler-action
# GITHUB_TOKEN permission keys:
# https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#permissions-for-the-github_token

name: demo-deploy
# Names the deployed commit, which after a publish is not the run's head_sha
# (main's newest commit); the gate finds earlier deploys of a commit by it. A
# manual seed refresh learns its commit from the live demo, so its name names
# none and never matches a deploy.
run-name: >-
  ${{ inputs.refresh && 'Refresh demo seed'
  || format('Deploy demo {0}', github.event.workflow_run.head_sha || github.sha) }}

on:
  push:
    branches: [main]
    paths:
      - "tools/demo/**"
      - "packaging/demo/**"
      - ".github/workflows/demo-deploy.yml"
  release:
    types: [published]
  # Replaces a nightly schedule of its own: the nightly image publish builds
  # the same demo image, so the demo deploys the one it pushed, and a night
  # with nothing new to deploy refreshes the seed instead.
  workflow_run:
    workflows: ["Publish images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: Re-bake the seed on the commit the live demo runs instead of deploying this commit
        type: boolean
        default: false

# Least privilege for GITHUB_TOKEN:
#   contents → checkout
permissions:
  contents: read
  # The gate reads this workflow's past runs to see whether one already
  # finished a deploy of the same commit.
  actions: read
  # The gate verifies the published demo image's build provenance.
  attestations: read

# A deploy is never cancelled half way; a newer run waits for it.
concurrency:
  group: demo-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # A publish run started by a pull request (a dry run, nothing pushed) or
    # from another repository never deploys.
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.event != 'pull_request'
      && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: tools/demo
    steps:
      - name: Check for deploy secrets
        id: secrets
        working-directory: .
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::notice::No demo deploy: set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see the workflow header)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # This workflow's own commit, for scripts/demo_image.py (the gate's
      # reader for the registry and health answers). After a publish the
      # deployed commit is checked out over it below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.ready == 'true'
        with:
          persist-credentials: false

      # Release and after-publish runs can name a commit the live demo already
      # runs: skip those when a run for that commit already succeeded. An
      # after-publish run also stops when the live demo runs a newer commit
      # (a push deployed it while the images were building), so the demo
      # never goes back. Pushes and manual runs always deploy.
      #
      # An after-publish run that would stop because the live demo already
      # runs its commit refreshes that commit's seed instead, unless a run
      # in the last 12 hours already baked one. A manual refresh deploys the
      # commit the live demo runs.
      #
      # Then the image: the one images-publish.yml pushed for this commit,
      # when its provenance attestation proves that workflow in this
      # repository built it from this commit on a GitHub-hosted runner.
      # Otherwise the steps below build it (about 25 minutes). An
      # after-publish run without a demo image (a publish that only built
      # the Dev Container) has nothing to deploy, and a refresh only ever
      # re-bakes a verified published image.
      - name: Choose the commit and image to deploy
        id: gate
        working-directory: .
        env:
          READY: ${{ steps.secrets.outputs.ready }}
          EVENT: ${{ github.event_name }}
          REFRESH: ${{ inputs.refresh }}
          DOMAIN: ${{ vars.DOMAIN }}
          DEMO_URL: ${{ vars.DEMO_URL }}
          # After a publish, the commit that run built, which main may
          # already have moved past (GITHUB_SHA is then main's newest commit,
          # not the image's). A refresh replaces it with the live commit.
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Whether run $1 of this workflow passed its smoke check.
          checked() {
            local passed
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1/jobs" \
              --jq '[.jobs[].steps[]? | select(.name == "Check the demo answers" and .conclusion == "success")] | length' \
              2>/dev/null || echo 0)
            [ "${passed:-0}" -gt 0 ]
          }
          # Without a deploy, a refresh and an after-publish run end here
          # rather than build an image.
          strict=false
          if [ "$REFRESH" = true ] || [ "$EVENT" = workflow_run ]; then strict=true; fi
          deploy="$READY"
          live=""
          url="${DEMO_URL}"
          if [ -n "$DOMAIN" ]; then url="https://demo.${DOMAIN}"; fi
          if [ "$READY" = true ] && { [ "$REFRESH" = true ] || [ "$EVENT" = workflow_run ] || [ "$EVENT" = release ]; }; then
            if [ -n "$url" ] && body=$(curl -fsS --max-time 10 "$url/_demo/health"); then
              # A full commit id, or empty for any other answer.
              live=$(python3 scripts/demo_image.py live <<<"$body")
            fi
          fi
          # Whether a run in the last 12 hours already baked a fresh seed: a
          # push (which builds its image), an after-publish deploy (which
          # deploys the image that publish just built) or a refresh. A
          # release run does not count, since it can deploy an image built
          # days earlier.
          seed_is_fresh() {
            local since runs run
            since=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            runs=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/demo-deploy.yml/runs" \
              -f status=success -f "created=>=$since" -f per_page=100 \
              --jq '.workflow_runs[] | select(.event == "push" or .event == "workflow_run" or (.event == "workflow_dispatch" and .display_title == "Refresh demo seed")) | .id' \
              2>/dev/null || true)
            for run in $runs; do
              if checked "$run"; then return 0; fi
            done
            return 1
          }
          # Turns this run into a seed refresh of the live commit, or says
          # why it can't be one.
          refresh=false
          start_refresh() {
            if [ -z "$live" ]; then
              echo "::notice::${url:-The demo} reports no commit; no seed to refresh"
              return 1
            fi
            if ! gh api "repos/$GITHUB_REPOSITORY/contents/packaging/demo/bake-seed.sh?ref=$live" --silent 2>/dev/null; then
              echo "::notice::$live bakes no seed at build time (no packaging/demo/bake-seed.sh); nothing to refresh"
              return 1
            fi
            SHA="$live"
            refresh=true
          }
          if [ "$deploy" = true ] && [ "$REFRESH" = true ]; then
            if start_refresh; then
              echo "Refreshing the seed of $live, the commit $url runs"
            else
              deploy=false
            fi
          elif [ "$deploy" = true ] && { [ "$EVENT" = workflow_run ] || [ "$EVENT" = release ]; }; then
            # The Worker reports the new version as soon as it is uploaded,
            # before migrations, secrets and smoke checks run, so the health
            # check alone cannot tell a finished deploy from one that failed
            # half way. Skip only when an earlier run deployed this commit
            # and passed its smoke check. Runs are matched by the commit they
            # deployed: the run name, or the head_sha of a run not started by
            # a publish or a refresh (runs from before the run name existed).
            done=0
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/demo-deploy.yml/runs?status=success&per_page=100" \
              --jq ".workflow_runs[] | select(.display_title == \"Deploy demo $SHA\" or (.head_sha == \"$SHA\" and .event != \"workflow_run\" and .display_title != \"Refresh demo seed\")) | .id" \
              2>/dev/null || true)
            for run in $runs; do
              if checked "$run"; then done=1; break; fi
            done
            if [ "$live" = "$SHA" ] && [ "$done" -gt 0 ]; then
              # The nightly publish found nothing newer: keep the seed of
              # the commit the demo runs from going stale instead.
              if [ "$EVENT" = workflow_run ] && seed_is_fresh; then
                echo "::notice::$url already runs $SHA with a seed baked in the last 12 hours; nothing to deploy"
                deploy=false
              elif [ "$EVENT" = workflow_run ] && start_refresh; then
                echo "::notice::$url already runs $SHA; refreshing its seed"
              else
                echo "::notice::$url already runs $SHA; nothing to deploy"
                deploy=false
              fi
            elif [ "$EVENT" = workflow_run ] && [ -n "$live" ] && [ "$live" != "$SHA" ] \
              && [ "$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...$live" --jq '.status' 2>/dev/null || true)" = ahead ]; then
              echo "::notice::$url already runs $live, which is newer than $SHA; nothing to deploy"
              deploy=false
            fi
          fi
          image=""
          if [ "$deploy" = true ]; then
            repo="ghcr.io/${OWNER,,}/bookclerk-demo"
            # Exactly sha256:<64 hex>, or empty when the tag does not exist.
            # A package that can't be read anonymously (a fork that publishes
            # none, or a private one) also means no image for a push or
            # manual run, which then builds here. Any other registry failure
            # is retried once. An after-publish run follows a publish of this
            # repository's package, so it fails on anything but a missing
            # tag rather than skip the deploy it was started for; a refresh
            # skips the day's refresh instead.
            digest=""
            missing=false
            for attempt in 1 2; do
              if manifest=$(docker buildx imagetools inspect "$repo:sha-${SHA:0:12}" --format '{{json .Manifest}}' 2>"$RUNNER_TEMP/inspect.err"); then
                digest=$(python3 scripts/demo_image.py digest <<<"$manifest" || true)
                break
              fi
              if grep -qiE 'not found|manifest unknown' "$RUNNER_TEMP/inspect.err"; then
                missing=true
                break
              fi
              if grep -qiE 'failed to authorize|unauthorized|denied|403 forbidden' "$RUNNER_TEMP/inspect.err"; then
                cat "$RUNNER_TEMP/inspect.err" >&2
                if [ "$EVENT" = workflow_run ]; then
                  echo "::error::$repo can't be read without signing in; the package must be public (docs/contributing/packaging.md)"
                  exit 1
                fi
                missing=true
                break
              fi
              cat "$RUNNER_TEMP/inspect.err" >&2
              if [ "$attempt" -eq 1 ]; then sleep 15; fi
            done
            if [ -z "$digest" ] && [ "$missing" = false ]; then
              if [ "$EVENT" = workflow_run ]; then
                echo "::error::Could not read $repo:sha-${SHA:0:12} from the registry"
                exit 1
              fi
              if [ "$strict" = true ]; then
                echo "::warning::Could not read $repo:sha-${SHA:0:12} from the registry; no seed refresh today"
                deploy=false
              else
                echo "::warning::Could not read $repo:sha-${SHA:0:12} from the registry; building the image here instead"
              fi
            fi
            if [ -n "$digest" ]; then
              if gh attestation verify "oci://$repo@$digest" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/images-publish.yml" \
                --source-digest "$SHA" \
                --deny-self-hosted-runners >/dev/null; then
                image="$repo@$digest"
                echo "::notice::Deploying the published demo image $image"
              elif [ "$refresh" = true ]; then
                echo "::warning::$repo@$digest failed provenance verification; no seed refresh"
                deploy=false
              else
                echo "::warning::$repo@$digest failed provenance verification; building the image here instead"
              fi
            elif [ "$deploy" = false ]; then
              :
            elif [ "$strict" = true ]; then
              echo "::notice::No published demo image for $SHA; nothing to deploy"
              deploy=false
            else
              echo "No published demo image for $SHA; building it here"
            fi
          fi
          if [ "$deploy" != true ]; then refresh=false; fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "refresh=$refresh" >> "$GITHUB_OUTPUT"

      # The refresh recipe comes from this workflow's commit; the checkout
      # below replaces it with the deployed one, which may predate it.
      - name: Keep the seed refresh recipe
        if: steps.gate.outputs.refresh == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          install -d "$RUNNER_TEMP/refresh"
          cp packaging/demo/Dockerfile.refresh "$RUNNER_TEMP/refresh/Dockerfile"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.deploy == 'true' && steps.gate.outputs.sha != github.sha
        with:
          ref: ${{ steps.gate.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.deploy == 'true'
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: tools/demo/package-lock.json

      - name: Install dependencies
        if: steps.gate.outputs.deploy == 'true'
        run: npm ci
      # Wrangler bundles the Worker without checking its types, so a deploy
      # of a commit CI did not test still has to pass tsc.
      - name: Type-check the Worker
        if: steps.gate.outputs.deploy == 'true'
        run: npm run typecheck

      # The release build and two images need more than the runner's free
      # space; these preinstalled toolchains are never used here.
      - name: Free disk space
        if: steps.gate.outputs.deploy == 'true' && steps.gate.outputs.image == ''
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # From the commit being deployed, the build images-publish.yml runs:
      # the production builder and runtime stages and the demo layer in one
      # bake, which never exports the builder. Tagged bookclerk-demo:local.
      - name: Build the demo image
        if: steps.gate.outputs.deploy == 'true' && steps.gate.outputs.image == ''
        working-directory: .
        run: |
          set -euo pipefail
          git rev-parse HEAD > packaging/demo/version.txt
          docker buildx bake -f packaging/demo/docker-bake.hcl --load demo

      - name: Route the Worker
        id: route
        if: steps.gate.outputs.deploy == 'true'
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          set -euo pipefail
          if [ -z "$DOMAIN" ]; then
            # No custom domain: serve on the account's workers.dev subdomain.
            sed -i 's/^workers_dev = false$/workers_dev = true/' wrangler.toml
            grep -qx 'workers_dev = true' wrangler.toml
            echo "mode=workers_dev" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # [[ =~ ]] matches the whole value, so a trailing newline is rejected.
          hostname_re='^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$'
          if [[ ! "$DOMAIN" =~ $hostname_re ]]; then
            echo "::error::DOMAIN is not a lowercase hostname: $DOMAIN"
            exit 1
          fi
          host="demo.${DOMAIN}"
          printf '\n[[routes]]\npattern = "%s"\ncustom_domain = true\n' "$host" >> wrangler.toml
          echo "mode=custom_domain" >> "$GITHUB_OUTPUT"
          echo "url=https://${host}" >> "$GITHUB_OUTPUT"
          echo "site=https://${DOMAIN}" >> "$GITHUB_OUTPUT"

      # The bake of packaging/demo/Dockerfile's `seeded` stage, run again on
      # the published image the live demo runs: bake-seed.sh from that same
      # commit, with network access to the stores' catalogs. Only the seed
      # changes; every binary and plugin is the published image's.
      - name: Re-bake the seed
        if: steps.gate.outputs.refresh == 'true'
        working-directory: .
        env:
          BASE: ${{ steps.gate.outputs.image }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/refresh"
          cp packaging/demo/bake-seed.sh "$dir/bake-seed.sh"
          docker buildx build --load --build-arg "BASE=$BASE" --tag bookclerk-demo:local "$dir"

      # Wrangler builds a one-line Dockerfile on the demo image and pushes
      # that: the verified published image (by digest; Cloudflare's container
      # registry cannot pull from GHCR itself) or the one built or re-baked
      # above, so wrangler never compiles anything.
      - name: Point wrangler at the demo image
        if: steps.gate.outputs.deploy == 'true'
        env:
          IMAGE: ${{ (steps.gate.outputs.refresh != 'true' && steps.gate.outputs.image) || 'bookclerk-demo:local' }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/demo-image"
          mkdir -p "$dir"
          printf 'FROM %s\n' "$IMAGE" > "$dir/Dockerfile"
          sed -i \
            -e "s|^image = \"../../packaging/demo/Dockerfile\"\$|image = \"$dir/Dockerfile\"|" \
            -e "s|^image_build_context = \"../../packaging/demo\"\$|image_build_context = \"$dir\"|" \
            wrangler.toml
          grep -qxF "image = \"$dir/Dockerfile\"" wrangler.toml
          grep -qxF "image_build_context = \"$dir\"" wrangler.toml

      # Wrangler pushes the result to Cloudflare's registry.
      - name: Deploy Worker and container
        id: deploy
        if: steps.gate.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/demo
          # No wranglerVersion: the action then uses the wrangler that `npm
          # ci` installed from package-lock.json, the one the tests ran.
          command: deploy --var DEMO_VERSION:${{ steps.gate.outputs.sha }}${{ steps.route.outputs.site && format(' --var SITE_URL:{0}', steps.route.outputs.site) || '' }}

      # Cloudflare's own startup figure for this deploy
      # (docs/contributing/ci.md#worker-startup-time); warns near the limit.
      - name: Report the startup time
        if: steps.gate.outputs.deploy == 'true'
        # The job runs in the Worker's directory; the script and its budgets
        # are repository-relative. Reporting never fails a deploy.
        working-directory: .
        continue-on-error: true
        env:
          WRANGLER_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: python3 scripts/worker_startup.py deploy --worker demo

      # The binding has no id: wrangler created the database on deploy, so
      # migrations can only run now. Applied migrations are skipped.
      - name: Apply database migrations
        if: steps.gate.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote

      - name: Resolve the demo URL
        id: url
        if: steps.gate.outputs.deploy == 'true'
        env:
          MODE: ${{ steps.route.outputs.mode }}
          ROUTE_URL: ${{ steps.route.outputs.url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          if [ "$MODE" = custom_domain ]; then
            url="$ROUTE_URL"
          else
            url="${DEPLOYMENT_URL%/}"
            # <worker name from wrangler.toml>.<account subdomain>.workers.dev
            workers_dev_re='^https://[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.workers\.dev$'
            if [[ ! "$url" =~ $workers_dev_re ]]; then
              echo "::error::Deploy did not report a workers.dev URL: $url"
              exit 1
            fi
          fi
          echo "Demo URL: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "host=${url#https://}" >> "$GITHUB_OUTPUT"

      # Values go to wrangler on stdin, never on a command line or in the log.
      # Rotating SESSION_KEY would end every live session, so an existing one
      # is kept.
      - name: Upload Worker secrets
        if: steps.gate.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEMO_HOST: ${{ steps.url.outputs.host }}
        run: |
          set -euo pipefail
          # A failed list must fail the step: treating it as "no key" would
          # rotate SESSION_KEY and drop every live session.
          secrets_json=$(npx wrangler secret list --format json)
          if jq -e 'any(.[]; .name == "SESSION_KEY")' <<<"$secrets_json" >/dev/null; then
            NEED_SESSION_KEY=false
          else
            NEED_SESSION_KEY=true
          fi
          export NEED_SESSION_KEY
          node scripts/worker-secrets.ts | npx wrangler secret bulk

      # No visitor session here: Turnstile cannot be passed from CI. Checks the
      # Worker is configured, serves the launch page, and refuses the API
      # without a session before any container starts.
      - name: Check the demo answers
        if: steps.gate.outputs.deploy == 'true'
        env:
          URL: ${{ steps.url.outputs.url }}
          SHA: ${{ steps.gate.outputs.sha }}
        run: |
          set -euo pipefail
          # A new custom domain or workers.dev subdomain can take a few
          # minutes to answer; allow about six.
          for attempt in 1 2 3 4 5 6 7 8; do
            if body=$(curl -fsS --max-time 10 "$URL/_demo/health") \
              && jq -e --arg sha "$SHA" '.ok == true and .configured == true and .version == $sha' <<<"$body" >/dev/null; then
              echo "$body"
              break
            fi
            if [ "$attempt" -eq 8 ]; then
              echo "::error::$URL/_demo/health did not report this version, configured: ${body:-no answer}"
              exit 1
            fi
            sleep $((attempt * 10))
          done
          # Read the whole page first: under pipefail, `curl | grep -q` fails
          # with curl's exit 23 whenever grep stops reading early.
          page=$(curl -fsS --max-time 10 "$URL/")
          if ! grep -q 'challenges.cloudflare.com/turnstile' <<<"$page"; then
            echo "::error::$URL/ did not serve the Turnstile launch page"
            exit 1
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL/api/status")
          if [ "$status" != 401 ]; then
            echo "::error::$URL/api/status without a session answered $status, expected 401"
            exit 1
          fi

      # Only the workers.dev URL needs storing; DOMAIN readers derive theirs.
      - name: Check whether the demo URL variable needs writing
        id: record
        if: steps.gate.outputs.deploy == 'true' && steps.route.outputs.mode == 'workers_dev'
        env:
          URL: ${{ steps.url.outputs.url }}
          CURRENT: ${{ vars.DEMO_URL }}
          HAS_APP: ${{ secrets.AUTOMATION_APP_CLIENT_ID != '' && secrets.AUTOMATION_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$CURRENT" = "$URL" ]; then
            echo "DEMO_URL is already $URL"
            echo "write=false" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_APP" = true ]; then
            echo "write=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Set the demo URL by hand: gh variable set DEMO_URL --repo $GITHUB_REPOSITORY --body $URL"
            echo "write=false" >> "$GITHUB_OUTPUT"
          fi

      # The installation-token API has no Variables permission to request
      # (only listed permissions can be narrowed to), so the token carries the
      # installation's permissions; it is used for this one write and revoked
      # when the job ends.
      - name: Mint variable-write token
        id: app-token
        if: steps.record.outputs.write == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Store the demo URL
        if: steps.record.outputs.write == 'true'
        env:
          URL: ${{ steps.url.outputs.url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          name=DEMO_URL
          owner="${GITHUB_REPOSITORY%%/*}"
          # Prefer the organization (like DOMAIN); a user-owned fork, or an App
          # without the organization "Variables" permission, falls back to
          # the repository.
          if gh variable set "$name" --org "$owner" --visibility all --body "$URL"; then
            echo "Stored $name on organization $owner"
            # A repository variable overrides the organization one, so keep a
            # stale one from shadowing the new URL.
            if gh variable get "$name" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh variable set "$name" --repo "$GITHUB_REPOSITORY" --body "$URL"
              echo "Updated the repository's own $name too"
            fi
          else
            echo "::notice::Organization variable write failed; storing $name on the repository"
            gh variable set "$name" --repo "$GITHUB_REPOSITORY" --body "$URL"
          fi
