# Publishes the container images to the GitHub Container Registry of the
# repository owner (a fork publishes to its own namespace):
#
#   ghcr.io/<owner>/bookclerk       production (packaging/docker), amd64 + arm64
#   ghcr.io/<owner>/bookclerk-dev   Dev Container (.devcontainer), amd64 + arm64
#   ghcr.io/<owner>/bookclerk-demo  hosted demo (packaging/demo), amd64
#
# Tags. Before any release: `sha-<12 hex>` for the main commit it was built
# from (never moved) and `edge` (the newest build from main). A published
# release adds `<version>`, `<major>.<minor>`, `<major>` and `latest`, taken
# from its `v<semver>` tag. Consumers should pin the digest.
#
# Each image is built per architecture on a native runner, booted or probed
# before it is pushed, then joined into one multi-arch index. Every index
# carries a GitHub build-provenance attestation, signed through Sigstore with
# this workflow's OIDC identity and stored beside the image:
#   gh attestation verify oci://ghcr.io/<owner>/bookclerk:edge --owner <owner>
#
# When it runs: nightly when main has moved since the last publish (an image
# whose `sha-` tag already exists is not rebuilt), when a release is
# published (retagging the commit's existing images when present), when the
# Dev Container's inputs change on main, and by hand (from main; a run on any
# other branch is a dry run). A pull request that
# touches this workflow builds and checks every image in the dry-run job,
# which holds only `contents: read`; the build steps both jobs share live in
# .github/actions/image-build.
#
# Only the push jobs get `packages: write`; only the attest job gets
# `id-token: write` and `attestations: write`.
name: Publish images

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - "scripts/dev-env/**"
      - "scripts/tests/requirements.txt"
  pull_request:
    paths:
      - ".github/workflows/images-publish.yml"
      - ".github/actions/image-build/**"
  release:
    types: [published]
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Publishes never cancel each other; a pull request's dry run does.
concurrency:
  group: images-publish-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      registry: ${{ steps.plan.outputs.registry }}
      sha_tag: ${{ steps.plan.outputs.sha_tag }}
      tags: ${{ steps.plan.outputs.tags }}
      push: ${{ steps.plan.outputs.push }}
      build: ${{ steps.plan.outputs.build }}
      retag: ${{ steps.plan.outputs.retag }}
    steps:
      - name: Decide images and tags
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${OWNER,,}"
          sha_tag="sha-${SHA:0:12}"
          push=true
          case "$EVENT" in
            pull_request) push=false; images="bookclerk bookclerk-dev bookclerk-demo"; tags="$sha_tag" ;;
            push) images="bookclerk-dev"; tags="$sha_tag edge" ;;
            release)
              images="bookclerk bookclerk-dev bookclerk-demo"
              if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                echo "::error::release tag must be v<major>.<minor>.<patch>"
                exit 1
              fi
              tags="$sha_tag ${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]} ${BASH_REMATCH[1]}.${BASH_REMATCH[2]} ${BASH_REMATCH[1]} latest"
              ;;
            *) images="bookclerk bookclerk-dev bookclerk-demo"; tags="$sha_tag edge" ;;
          esac
          # Only reviewed code is published: a run by hand on any branch but
          # main is a dry run, so it cannot move `edge` or earn an attestation.
          if [[ "$EVENT" != release && "$REF" != refs/heads/main ]]; then
            push=false
            echo "::notice::$REF is not main: building and checking without pushing"
          fi
          build=()
          retag=()
          if [[ "$push" == true ]]; then
            printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null
          fi
          for image in $images; do
            if [[ "$push" == true ]] && docker buildx imagetools inspect "$registry/$image:$sha_tag" >/dev/null 2>&1; then
              # Already published from this commit: a release only adds its
              # version tags; anything else has nothing to do.
              if [[ "$EVENT" == release ]]; then
                echo "$image: $sha_tag exists, adding the release tags"
                retag+=("$image")
              else
                echo "$image: $sha_tag exists, skipped"
              fi
            else
              build+=("$image")
            fi
          done
          {
            echo "registry=$registry"
            echo "sha_tag=$sha_tag"
            echo "tags=$tags"
            echo "push=$push"
            echo "build=$(printf '%s\n' "${build[@]}" | jq -R 'select(length > 0)' | jq -cs .)"
            echo "retag=$(printf '%s\n' "${retag[@]}" | jq -R 'select(length > 0)' | jq -cs .)"
          } >> "$GITHUB_OUTPUT"
          echo "build: ${build[*]:-none}; retag: ${retag[*]:-none}; tags: $tags; push: $push"

  # A pull request's run: the same builds and checks with a read-only token.
  dry-run:
    name: dry run ${{ matrix.image }} (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.push == 'false'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: bookclerk, arch: amd64, runner: ubuntu-latest }
          - { image: bookclerk, arch: arm64, runner: ubuntu-24.04-arm }
          - { image: bookclerk-dev, arch: amd64, runner: ubuntu-latest }
          - { image: bookclerk-dev, arch: arm64, runner: ubuntu-24.04-arm }
          - { image: bookclerk-demo, arch: amd64, runner: ubuntu-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/image-build
        with:
          image: ${{ matrix.image }}
          revision: ${{ github.sha }}
          source: ${{ github.server_url }}/${{ github.repository }}

  build:
    name: build ${{ matrix.image }} (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.push == 'true' && needs.plan.outputs.build != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: bookclerk, arch: amd64, runner: ubuntu-latest }
          - { image: bookclerk, arch: arm64, runner: ubuntu-24.04-arm }
          - { image: bookclerk-dev, arch: amd64, runner: ubuntu-latest }
          - { image: bookclerk-dev, arch: arm64, runner: ubuntu-24.04-arm }
          - { image: bookclerk-demo, arch: amd64, runner: ubuntu-latest }
    steps:
      - name: Selected
        id: selected
        env:
          BUILD: ${{ needs.plan.outputs.build }}
          IMAGE: ${{ matrix.image }}
        run: echo "run=$(jq -r --arg i "$IMAGE" 'index($i) != null' <<<"$BUILD")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.selected.outputs.run == 'true'
        with:
          persist-credentials: false

      - uses: ./.github/actions/image-build
        if: steps.selected.outputs.run == 'true'
        with:
          image: ${{ matrix.image }}
          revision: ${{ github.sha }}
          source: ${{ github.server_url }}/${{ github.repository }}

      - name: Push the architecture tag
        if: steps.selected.outputs.run == 'true'
        env:
          REF: ${{ needs.plan.outputs.registry }}/${{ matrix.image }}:${{ needs.plan.outputs.sha_tag }}-${{ matrix.arch }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null
          docker tag local/image "$REF"
          docker push --quiet "$REF"

  publish:
    name: publish ${{ matrix.image }}
    needs: [plan, build]
    # Runs after a skipped build too (a release that only retags).
    if: >-
      always() && needs.plan.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && needs.plan.outputs.push == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: bookclerk, arches: "amd64 arm64" }
          - { image: bookclerk-dev, arches: "amd64 arm64" }
          - { image: bookclerk-demo, arches: "amd64" }
    steps:
      - name: Join architectures and tag
        env:
          IMAGE: ${{ matrix.image }}
          ARCHES: ${{ matrix.arches }}
          REGISTRY: ${{ needs.plan.outputs.registry }}
          SHA_TAG: ${{ needs.plan.outputs.sha_tag }}
          TAGS: ${{ needs.plan.outputs.tags }}
          BUILD: ${{ needs.plan.outputs.build }}
          RETAG: ${{ needs.plan.outputs.retag }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          repo="$REGISTRY/$IMAGE"
          if jq -e --arg i "$IMAGE" 'index($i) != null' <<<"$BUILD" >/dev/null; then
            sources=()
            for arch in $ARCHES; do sources+=("$repo:$SHA_TAG-$arch"); done
          elif jq -e --arg i "$IMAGE" 'index($i) != null' <<<"$RETAG" >/dev/null; then
            sources=("$repo:$SHA_TAG")
          else
            echo "$IMAGE not selected"
            exit 0
          fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null
          tag_args=()
          for tag in $TAGS; do tag_args+=(-t "$repo:$tag"); done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "$repo:$SHA_TAG" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "$repo@$digest tagged: $TAGS" >> "$GITHUB_STEP_SUMMARY"

  attest:
    name: attest ${{ matrix.image }}
    needs: [plan, publish]
    if: >-
      always() && needs.publish.result == 'success'
      && needs.plan.outputs.push == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: [bookclerk, bookclerk-dev, bookclerk-demo]
    steps:
      # The index to attest: the one this run built or retagged, or one an
      # earlier run published whose attest job failed (re-running the
      # workflow skips the build but still repairs the provenance). An
      # index that already has an attestation is left alone.
      - name: Digest
        id: digest
        env:
          IMAGE: ${{ matrix.image }}
          BUILD: ${{ needs.plan.outputs.build }}
          RETAG: ${{ needs.plan.outputs.retag }}
          REF: ${{ needs.plan.outputs.registry }}/${{ matrix.image }}:${{ needs.plan.outputs.sha_tag }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null
          if jq -n -e --argjson b "$BUILD" --argjson r "$RETAG" --arg i "$IMAGE" \
            '($b + $r) | index($i) != null' >/dev/null; then
            digest="$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' | jq -r .digest)"
          elif digest="$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest)" \
            && [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            # Published earlier: attest only when no attestation exists yet
            # (the API answers 404 when there is none).
            count="$(gh api "repos/$GH_REPO/attestations/$digest" --jq '.attestations | length' 2>/dev/null)" || count=0
            [[ "$count" =~ ^[0-9]+$ ]] || count=0
            if [[ "$count" -gt 0 ]]; then
              echo "$IMAGE: $digest already attested"
              digest=""
            else
              echo "$IMAGE: $digest has no attestation, attesting it"
            fi
          else
            digest=""
          fi
          if [[ -n "$digest" ]]; then
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: steps.digest.outputs.digest != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.plan.outputs.registry }}/${{ matrix.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
