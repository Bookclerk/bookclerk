# Codecov settings for the uploads in .github/workflows/coverage-upload.yml
# (docs/contributing/ci.md#codecov).
#
# Trial: every status is informational, so Codecov reports but never fails a
# commit. The plan is to make `codecov/patch` a required check later; drop
# its `informational` line in the same change.

codecov:
  # Uploads come from a separate workflow after CI completes, and a failed
  # CI run still uploads what it measured.
  require_ci_to_pass: false

coverage:
  precision: 1
  round: down
  status:
    project:
      default:
        informational: true
    patch:
      default:
        # The same target as CI Gate's patch coverage
        # (scripts/coverage_areas.toml).
        target: 80%
        informational: true

# Generated files, the same list as `generated` in
# scripts/coverage_areas.toml (a test keeps them equal).
ignore:
  - crates/bookclerk-plugin-abi/src/generated.rs
  - crates/bookclerk-workerd/src/pin.rs
  - packages/plugin-sdk-python/src/bookclerk_plugin_sdk/_abi.py
  - packages/plugin-sdk-python/src/bookclerk_plugin_sdk/_wire.py
  - packages/plugin-sdk-python/src/bookclerk_plugin_sdk/abi.py

comment:
  layout: "condensed_header, diff, flags, components, files"
  # Comment only when coverage changes, not on every docs-only change.
  require_changes: true
  # The same for bundle sizes: only a change of at least 1 KiB.
  require_bundle_changes: true
  bundle_change_threshold: "1Kb"

# Bundle sizes of the web UI and the three Workers
# (docs/contributing/ci.md#bundle-sizes). Informational during the trial,
# like the coverage statuses: a change past the threshold warns.
bundle_analysis:
  warning_threshold: "5%"
  status: "informational"

# One flag per area of scripts/coverage_areas.toml. A selective run measures
# only the areas whose tests it ran; carryforward keeps the others at their
# last measured value instead of reporting them as dropped.
#
# An area with a `workspace_check` (rust) that a selective run tested only in
# part goes up as `<area>-partial` instead: uploaded under the area's flag it
# would replace the carried-forward whole-workspace figure with the selected
# packages' alone. The partial flag is never carried forward, so it counts
# only on the commit it measured, merged with the carried-forward area.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: rust
      paths: [crates/, fuzz/, examples/]
    - name: rust-partial
      paths: [crates/, fuzz/, examples/]
      carryforward: false
    - name: site
      paths: [tools/site/]
    - name: demo
      paths: [tools/demo/]
    - name: collector
      paths: [tools/diagnostics-collector/]
    - name: python-sdk
      paths: [packages/plugin-sdk-python/src/]

# Components: coverage of parts of the code that cut across flags, each with
# its own figure on the dashboard and in the comment. They are views only;
# statuses stay as configured above.
component_management:
  individual_components:
    # The security surface named in AGENTS.md.
    - component_id: security-surface
      name: security surface
      paths:
        - crates/bookclerk-jail/
        - crates/bookclerk-sandbox/
        - crates/bookclerk-workerd/
        - crates/bookclerk-plugin-host/
        - crates/bookclerk-plugin-abi/
        - crates/bookclerk-db-exec/
        - crates/bookclerk-media-worker/
        - crates/bookclerk-mp4/
    - component_id: daemon
      name: daemon
      paths: [crates/bookclerkd/]
    - component_id: cli
      name: CLI
      paths: [crates/bookclerk-cli/]
    - component_id: plugins
      name: plugins
      paths: [crates/bookclerk-plugins/]
    - component_id: plugin-sdks
      name: plugin SDKs
      paths:
        - crates/bookclerk-plugin-sdk/
        - crates/bookclerk-plugin-manifest/
        - packages/plugin-sdk-python/src/
    - component_id: workers
      name: Workers
      paths: [tools/]
