# Each entry opens at most two version-update pull requests a week (one
# minor/patch group, one major group; Cargo adds the capnp group), and the
# entries are spread across the week so one week's updates never all ask
# for CI at once. Every update lands through the merge queue
# (docs/ci.md#runner-capacity).
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # Match workerd pin cooldown (supply-chain). Platform default is 3 days.
    cooldown:
      default-days: 7
    groups:
      # capnp / capnpc / capnp-rpc share a version; bumping one alone
      # dual-compiles the runtime and breaks generated Client bounds.
      capnp:
        patterns:
          - "capnp"
          - "capnp-rpc"
          - "capnpc"
          - "capnp-futures"
      cargo-minor-patch:
        update-types:
          - minor
          - patch
      cargo-major:
        update-types:
          - major

  - package-ecosystem: npm
    directory: "/tools/diagnostics-collector"
    schedule:
      interval: weekly
      day: friday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      diagnostics-collector-minor-patch:
        update-types:
          - minor
          - patch
      diagnostics-collector-major:
        update-types:
          - major

  # Web UI bundled into ui/dist and served by bookclerkd.
  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      # Vite / ESLint / TypeScript tooling releases often; one PR a week.
      ui-minor-patch:
        update-types:
          - minor
          - patch
      ui-major:
        update-types:
          - major

  # TypeScript plugin SDK, published as @bookclerk/plugin-sdk.
  - package-ecosystem: npm
    directory: "/packages/plugin-sdk"
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      plugin-sdk-minor-patch:
        update-types:
          - minor
          - patch
      plugin-sdk-major:
        update-types:
          - major

  # Python plugin SDK, published as bookclerk-plugin-sdk. It has no runtime
  # dependencies; uv.lock pins its dev and docs extras.
  - package-ecosystem: uv
    directory: "/packages/plugin-sdk-python"
    schedule:
      interval: weekly
      day: thursday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      python-sdk-minor-patch:
        update-types:
          - minor
          - patch
      python-sdk-major:
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
      github-actions-major:
        update-types:
          - major
