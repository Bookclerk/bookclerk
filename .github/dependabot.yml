version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Match workerd pin cooldown (supply-chain). Platform default is 3 days.
    cooldown:
      default-days: 7
    groups:
      # capnp / capnpc / capnp-rpc share a version; bumping one alone
      # dual-compiles the runtime and breaks generated Client bounds.
      capnp:
        patterns:
          - "capnp"
          - "capnp-rpc"
          - "capnpc"
          - "capnp-futures"
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/tools/diagnostics-collector"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
