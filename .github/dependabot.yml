version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Match workerd pin cooldown (supply-chain). Platform default is 3 days.
    cooldown:
      default-days: 7
    groups:
      # capnp / capnpc / capnp-rpc share a version; bumping one alone
      # dual-compiles the runtime and breaks generated Client bounds.
      capnp:
        patterns:
          - "capnp"
          - "capnp-rpc"
          - "capnpc"
          - "capnp-futures"
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/tools/diagnostics-collector"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # Deploy tooling (wrangler) for the bookclerk.app website.
  - package-ecosystem: npm
    directory: "/tools/site"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # Web UI bundled into ui/dist and served by bookclerkd.
  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # Vite / ESLint / TypeScript tooling releases often; one PR a week.
      ui-minor-patch:
        update-types:
          - minor
          - patch

  # TypeScript plugin SDK, published as @bookclerk/plugin-sdk.
  - package-ecosystem: npm
    directory: "/packages/plugin-sdk"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      plugin-sdk-minor-patch:
        update-types:
          - minor
          - patch

  # Python plugin SDK, published as bookclerk-plugin-sdk. It has no runtime
  # dependencies; uv.lock pins its dev and docs extras.
  - package-ecosystem: uv
    directory: "/packages/plugin-sdk-python"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      python-sdk-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
