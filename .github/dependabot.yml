version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Match workerd pin cooldown (supply-chain). Platform default is 3 days.
    cooldown:
      default-days: 7
    # One D-Bus stack: the desktop's media controls (souvlaki) and the tray
    # (ksni) are on zbus 5, so the keystore stays on zbus 5 and notify-rust
    # on 4.18, its last zbus 5 line (crates/bookclerk-desktop/Cargo.toml).
    # Lift both once those move to zbus 6.
    ignore:
      - dependency-name: "zbus"
        update-types: ["version-update:semver-major"]
      - dependency-name: "notify-rust"
        versions: [">=4.19"]
    groups:
      # capnp / capnpc / capnp-rpc share a version; bumping one alone
      # dual-compiles the runtime and breaks generated Client bounds.
      capnp:
        patterns:
          - "capnp"
          - "capnp-rpc"
          - "capnpc"
          - "capnp-futures"
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # Base images, pinned by digest: the production image, the Dev Container
  # (same rust and node images, so the toolchains stay aligned), the
  # ClusterFuzzLite builder and the Audiobookshelf integration test image.
  - package-ecosystem: docker
    directories:
      - "/packaging/docker"
      - "/.devcontainer"
      - "/.clusterfuzzlite"
      - "/tests/abs-integration"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # Versions pinned in .tool-versions move there first
    # (docs/contributing/ci.md#tool-versions): tool-versions-bump.yml bumps uv's
    # tag and digest together, and a Node.js major is changed by hand.
    # Dependabot still moves the node digest within the pinned major.
    # Dependabot names an image from a registry other than Docker Hub without
    # the host (`astral-sh/uv`, as in its PR titles), so the ignore has to use
    # that name; the full reference is kept in case it ever matches on it.
    ignore:
      - dependency-name: "astral-sh/uv"
      - dependency-name: "ghcr.io/astral-sh/uv"
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR per round across all four directories, so an image used in
      # several Dockerfiles moves to the same digest everywhere at once.
      base-images:
        patterns:
          - "*"

  # The three Cloudflare Workers: the diagnostics collector, the hosted demo
  # (Containers library) and the bookclerk.app website. They share their
  # tooling (wrangler, @cloudflare/vitest-plugin, @cloudflare/workers-types),
  # which releases together, so one pull request a week moves it in all three
  # lockfiles; separate per-package PRs conflicted with each other on every
  # merge (docs/contributing/automation.md#what-dependabot-updates).
  - package-ecosystem: npm
    directories:
      - "/tools/diagnostics-collector"
      - "/tools/demo"
      - "/tools/site"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # @vitest/coverage-v8 requires the exact vitest version it was
      # released with, so bumping either one alone fails `npm ci`.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      workers-tooling-minor-patch:
        update-types:
          - minor
          - patch

  # Lighthouse and axe-core for the website's CI audit.
  - package-ecosystem: npm
    directory: "/tools/site/audit"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # Prettier and markdownlint for the repository-wide `lint` CI check.
  - package-ecosystem: npm
    directory: "/tools/lint"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # Codecov Bundle Analysis uploader for coverage-upload.yml.
  - package-ecosystem: npm
    directory: "/tools/codecov"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # Type-check and test tooling of the first-party workerd guests; their
  # shipped modules/ import nothing from npm.
  - package-ecosystem: npm
    directories:
      - "/crates/bookclerk-plugins/optional/destination-b2"
      - "/crates/bookclerk-plugins/optional/media-download"
      - "/crates/bookclerk-plugins/optional/ingress-cloudflare"
      - "/crates/bookclerk-plugins/optional/ingress-cloudflare-dns"
      - "/crates/bookclerk-plugins/optional/ingress-cloudflare-tunnel"
      - "/crates/bookclerk-plugins/optional/ingress-ngrok"
      - "/crates/bookclerk-plugins/optional/integration-audiobookshelf"
      - "/crates/bookclerk-plugins/optional/metadata-audnexus"
      - "/crates/bookclerk-plugins/optional/metadata-files"
      - "/crates/bookclerk-plugins/optional/metadata-openlibrary"
      - "/crates/bookclerk-plugins/optional/notifier-webhook"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      workerd-guests-tooling:
        patterns:
          - "*"

  # Web UI bundled into ui/dist and served by bookclerkd.
  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # Playwright is pinned in .tool-versions (docs/contributing/ci.md#tool-versions):
    # tool-versions-bump.yml moves @playwright/test, the playwright-core
    # override and the UI visual jobs' Playwright image together, because the
    # image only ships its own release's browsers.
    ignore:
      - dependency-name: "@playwright/test"
      - dependency-name: "playwright-core"
    groups:
      # Vite / ESLint / TypeScript tooling releases often; one PR a week.
      ui-minor-patch:
        update-types:
          - minor
          - patch

  # TypeScript plugin SDK, published as @bookclerk/plugin-sdk.
  - package-ecosystem: npm
    directory: "/packages/plugin-sdk"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      plugin-sdk-minor-patch:
        update-types:
          - minor
          - patch

  # Python plugin SDK, published as bookclerk-plugin-sdk. It has no runtime
  # dependencies; uv.lock pins its dev and docs extras.
  - package-ecosystem: uv
    directory: "/packages/plugin-sdk-python"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      python-sdk-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
