# Example Bookclerk configuration.
# Copy to `$BOOKCLERK_FILES_DIR/config.toml` or pass `--config`.

[library]
auto_acquire = false
scan_interval_minutes = 60
# After scan, enrich non-Audible library rows from public Audible catalog + Audnexus.
enrich_from_audible = true
enrich_min_confidence = 90
# When matching storage, relocate matched audio + sidecars onto the naming-profile layout.
# fix_storage_layout = false

# Durable daemon job queue (scan / acquire / listen_sync). See docs/jobs.md.
[jobs]
max_pending = 32
lease_seconds = 60
max_attempts = 3
retention_days = 7
# temp_quota_bytes = 2147483648
[jobs.concurrency]
network = 1

# Durable domain-event outbox (independent of [jobs] retention). See docs/jobs.md.
[events]
retention_days = 7
dead_letter_retention_days = 30
concurrency = 1

# Library database plugin — exactly one backend (default: local SQLite).
# See docs/database.md (SeaORM; Cloudflare D1 and PostgreSQL supported).
[database]
plugin = "sqlite"   # sqlite | d1 | postgres

[database.sqlite]
# path = "library.db"   # relative to BOOKCLERK_FILES_DIR, or absolute

# [database.d1]
# account_id = "your-cloudflare-account-id"
# database_id = "your-d1-database-uuid"
# API token via env only: BOOKCLERK_D1_API_TOKEN or CLOUDFLARE_API_TOKEN.
# api_base = "https://api.cloudflare.com/client/v4"

# [database.postgres]
# PostgreSQL connection URL (contains credentials — prefer url_file in production).
# url = "postgres://user:password@localhost:5432/bookclerk"
# url_file = "/run/secrets/postgres_url"
# Env: BOOKCLERK_DATABASE_POSTGRES_URL / BOOKCLERK_DATABASE_POSTGRES_URL_FILE

[auth]
# Prefer BOOKCLERK_AUTH_PASSWORD (env). Optional TOML fallback:
# password = "your-strong-passphrase"
# Wrap an existing BCK1 master.key later with:
#   bookclerk config master-key wrap
# or set auth.password / env and reload bookclerkd (SIGHUP or POST /api/config/reload).
# password_file is no longer supported.

# Optional identity broker (Settings → Sign-in, or this file). Bookclerk remains
# the OIDC issuer for Audiobookshelf; these providers sign Users in. The Operator
# token is never an OAuth subject. Client secrets: BOOKCLERK_OIDC_<ID>_CLIENT_SECRET
# or encrypted_secrets. Mapping a role to `operator` is rejected.
# [auth.oidc]
# enabled = true
# # allowed_email_domains = ["example.com"]
#
# [[auth.oidc.providers]]
# id = "corp"
# name = "Company SSO"
# issuer = "https://idp.example.com/realms/corp"
# client_id = "bookclerk"
# scopes = ["openid", "profile", "email"]
# provision = "mapped_role"   # mapped_role | any | allowlist | invite_only
# role_claim = "groups"
# role_map = { "bookclerk-owners" = "owner", "bookclerk-admins" = "administrator", "bookclerk-users" = "member" }
# link_by_email = false
#
# [[auth.oidc.providers]]
# id = "google"
# name = "Google"
# preset = "google"           # google | github | apple | discord
# client_id = "....apps.googleusercontent.com"
# provision = "allowlist"
# default_role = "member"
# allowed_email_domains = ["family.example"]
# link_by_email = true        # social presets default on in Settings; custom OIDC stays off
#
# [[auth.oidc.providers]]
# id = "apple"
# name = "Apple"
# preset = "apple"
# client_id = "com.example.bookclerk"
# apple_team_id = "AB12CDEF34"
# apple_key_id = "WXYZ123456"
# # apple_private_key or BOOKCLERK_OIDC_APPLE_APPLE_PRIVATE_KEY (.p8 PEM)

# Codec worker pool. Decode, encode, and packaging run in short-lived
# `bookclerk-media-worker` processes that confine themselves to the paths each
# job declared. See docs/media.md.
[media]
# Reloadable: a change applies to new jobs and the previous pool drains.
# Concurrent codec jobs. 0 derives one per core, capped at 8.
workers = 0
# required    — refuse media work when the jail does not engage (default)
# best-effort — confine what the platform supports, log the rest
# off         — run codecs in-process with no jail (development only)
# On Windows the pool launches workers through bookclerk-jail (AppContainer).
# Keep the jail binary beside the worker (or set BOOKCLERK_PLUGIN_JAIL).
isolation = "required"
# Normally unset: the worker is found beside the running executable.
# worker_bin = "/usr/local/bin/bookclerk-media-worker"

# How external plugin guests are run. `bookclerk-jail` confines a guest to its
# install directory (read-only), its own data and scratch directories, and the
# download cache — then becomes the plugin. See docs/plugins.md.
[plugins]
# required    — do not load a plugin that cannot be jailed (default)
# best-effort — start it unconfined when the platform cannot jail, and warn
# off         — no jail (development only)
# Plugin guests are jailed on every platform (Landlock/Seatbelt/AppContainer).
isolation = "required"
# Normally unset: the launcher is found beside the running executable.
# jail_bin = "/usr/local/bin/bookclerk-jail"

[output]
# Packaging format: enriched_m4b | single_mp3 | split_mp3_by_chapter | split_mp3_by_size | opus | none
format = "enriched_m4b"
# split_mp3_max_mb = 200

# Prefer Widevine/CENC; L3 CDM auto-provisions via AudibleCdm.
widevine = false
xhe_aac = false
# widevine_cdm = "widevine.wvd"
# widevine_cdm_provider = "off"

# Naming profiles: audiobookshelf (default) | classic.
# naming_profile = "audiobookshelf"
# folder_template = "<first author>/<title>"
# file_template = "<title> [<asin>]"
# chapter_file_template = "<ch#> - <chapter title>"

# Path sanitization: auto | windows | posix | s3 | none.
# path_sanitization = "auto"
# replacement_characters = [{ find = ":", replace = "_" }]
# max_filename_length = 255

# Sidecars / metadata.
download_cover = true
download_pdf = true
create_cue = false
fixup_metadata = true
chapter_json = "off"
save_metadata_json = false
cover_size = "500"
chapter_layout = "tree"

# When multiple destinations are enabled and only some already have a title:
#   sync_missing    — copy from a present dest into missing ones (default; no re-fetch)
#   refetch_missing — re-download/encode, write only to missing destinations
#   refetch_all     — re-download/encode into every destination
# multi_destination = "sync_missing"

# Destination plugins (`local`, `s3`) are deployed plugin instances, not
# config.toml tables. Enable one per host and set its settings on the
# instance:
#   bookclerk plugins deploy local
#   bookclerk plugins config set local root /data/Audiobooks
#   bookclerk plugins config set s3 bucket my-audiobooks
#   bookclerk plugins config set s3 secret_access_key --secret   # value on stdin
# Each destination declares `prefix` and per-destination naming overrides
# (`naming_profile`, `folder_template`, …) in its plugin.toml [[settings]].

# Content-source plugins (audible, libro, chirp, graphicaudio, …) are enabled
# and configured the same way; their settings (bitrate, container, access,
# …) come from each plugin's declared [[settings]]:
#   bookclerk plugins list
#   bookclerk plugins config get audible
#   bookclerk plugins config set audible bitrate normal

[daemon]
listen = "127.0.0.1:8787"
json_logs = true
# Peers allowed to set X-Forwarded-For for login throttling (empty = direct peer only).
# trusted_proxies = ["127.0.0.1", "::1"]
# Env: BOOKCLERK_DAEMON_TRUSTED_PROXIES (comma-separated)

# Operator auth for the HTTP API / GUI (required when binding non-loopback).
# [daemon.auth]
# enabled = true
# session_ttl_hours = 12
# tray_handoff_ttl_secs = 180  # loopback sign-in link lifetime (clamped 30..=900)
# Env: BOOKCLERK_OPERATOR_TOKEN (optional override), BOOKCLERK_DAEMON_AUTH_ENABLED,
#      BOOKCLERK_DAEMON_AUTH_TRAY_HANDOFF_TTL_SECS
# Token is stored sealed in encrypted_secrets (not a files-dir operator.token).
# Browser sessions are hashed in operator_sessions (survive restart; logout revokes).
# Show/rotate Bearer token: `bookclerk daemon token` / `bookclerk daemon token rotate`
# Browser session: tray Copy sign-in link, or `bookclerk login` (prints the loopback URL).
# require_second_factor = false  # password login must use TOTP, or sign in with a passkey
# Env: BOOKCLERK_DAEMON_AUTH_REQUIRE_SECOND_FACTOR

# [integrations]
# public_origin = "https://bookclerk.example.com"  # required off loopback: OIDC issuer, claim URLs, SSO callback, Secure cookies

# Integration plugins (Audiobookshelf, third-party installs under
# `$BOOKCLERK_FILES_DIR/plugins/<name>/plugin.toml` or BOOKCLERK_PLUGIN_DIRS)
# are deployed plugin instances too; they default to disabled until approved
# and enabled on a host:
#   bookclerk plugins approve audiobookshelf
#   bookclerk plugins deploy audiobookshelf
#   bookclerk plugins config set audiobookshelf base_url http://audiobookshelf:80
#   bookclerk plugins config set audiobookshelf api_key --secret   # value on stdin

# Recommendations / embeddings / request queue (see docs/discovery.md).
# Storefront candidates (Libro related + Audible catalog) are the primary
# discovery path; local embeddings score those unowned hits.
[discovery]
embeddings_enabled = true
# Preferred model id; runtime falls back to local-hash-v1 if ONNX cannot load.
embedding_model = "all-minilm-l6-v2-q"
embed_intra_threads = 1
storefront_candidates = true
storefront_seed_limit = 8
storefront_max_remote_calls = 32
# Drop GraphicAudio Magento series-set SKUs from candidates (default: keep them).
# exclude_graphicaudio_series_sets = true
# Shelf visibility + default view are per-user DB prefs (GET/PATCH /api/preferences),
# not TOML — see docs/gui.md and docs/discovery.md.
# Open Library: low-volume gap-fill only (not bulk). Set a contact email so
# requests are identified per https://openlibrary.org/developers/api
openlibrary_enabled = true
# openlibrary_contact_email = "you@example.com"
openlibrary_max_requests_per_run = 25
# worldcat_enabled = false  # reserved; needs API key
# How often bookclerkd syncs listening progress from capable integrations (0 = off).
listen_sync_interval_minutes = 60
recommend_limit = 20

# [diagnostics]
# share_reports = false
# collector_url = ""
# upload_on_crash = true
# upload_on_error_burst = true
# upload_on_warn_burst = true
# error_burst_threshold = 10
# error_burst_window_secs = 60
# warn_burst_threshold = 20
# warn_burst_window_secs = 60
# ring_buffer_capacity = 200
