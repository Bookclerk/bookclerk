# Example Libation configuration.
# Copy to `$LIBATION_FILES_DIR/config.toml` or pass `--config`.

[library]
auto_liberate = false
scan_interval_minutes = 60
# After scan, enrich non-Audible library rows from public Audible catalog + Audnexus
# (title/author/duration + ISBN/narrator when available; no Audible login required).
enrich_from_audible = true
# Minimum match confidence (0–100). Default 90 matches AudioBookshelf-style scoring.
# Exact ISBN matches boost confidence but do not auto-accept (multi-ASIN ISBNs).
enrich_min_confidence = 90

# OAuth tokens live under Accounts/<account>.auth.
# Prefer encryption: LIBATION_AUTH_PASSWORD, or a password file path
# (LIBATION_AUTH_PASSWORD_FILE / [auth].password_file). Missing password-file
# paths are auto-created with a strong random secret — use a secrets volume,
# not Accounts/. Set allow_plaintext for unprotected local token files only.
[auth]
# password_file = "/run/libation/secrets/auth_password"
# allow_plaintext = false

[download]
quality = "high"   # high | normal
# Output formatting (default: highest-quality enriched M4B).
#   enriched_m4b | single_mp3 | split_mp3_by_chapter | split_mp3_by_size | opus | none
# Legacy `format = "m4b"|"mp3"` and `split_files_by_chapter` still work when `output` is unset.
# output = "enriched_m4b"
# split_mp3_max_mb = 200   # only for split_mp3_by_size
format = "m4b"     # legacy: m4b | mp3 (prefer `output`)

# Ingest quality: prefer the highest encode each store offers.
# Global default; per-source overrides live under [sources.<id>].ingest.
# [download.ingest]
# quality = "highest"   # highest | high | normal | low
# Legacy per-source map (still accepted; [sources.*.ingest] wins when both set):
# [download.ingest.sources]
# audible = "highest"
# graphicaudio = "highest"
# chirp = "highest"
# libro = "highest"

# Prefer Widevine/CENC; also enables Adrm→Widevine fallback on 000307.
# L3 CDM auto-provisions via AudibleCdm (`auth login` registers as Android).
widevine = false
# Prefer xHE-AAC on the Widevine path when the server offers it.
xhe_aac = false
# Optional BYO .wvd (else auto-provision, or {{files_dir}}/widevine.wvd / Accounts/<account>.wvd).
# widevine_cdm = "widevine.wvd"
# Override or disable CDM provider (default = classic Libation AudibleCdm; "off" = BYO only).
# widevine_cdm_provider = "off"
# Classic Libation naming templates (optional; default Author/Title/ASIN.ext).
# folder_template = "<author>/<title>"
# file_template = "<asin>"
# Path sanitization when replacement_characters is unset:
#   auto (default) — posix on Linux/macOS local, windows on Windows local, s3 for S3
#   windows | posix | s3 | none (none = separators only, same floor as posix)
# path_sanitization = "auto"
# Explicit override (classic ReplacementCharacters); non-empty wins over path_sanitization:
# replacement_characters = [{ find = ":", replace = "_" }]
# Reconcile matches existing files across profiles by treating sanitizable
# characters as wildcards; creation always follows the rules above.
# Sidecar / metadata options (classic Settings.json keys in comments).
# Defaults: cover.jpg + companion PDFs on; cue off; chapter JSON off; metadata.json off.
download_cover = true        # DownloadCoverArt — write cover.jpg next to audio
download_pdf = true          # companion PDF when the store provides one
create_cue = false           # CreateCueSheet — chapters.cue
fixup_metadata = true        # AllowLibationFixup — embed cover/chapters/tags natively
chapter_json = "off"         # off | flat | tree | both
save_metadata_json = false   # metadata.json (classic SaveMetadataToFile)
cover_size = "500"           # 500 | 1215 | native
chapter_layout = "tree"      # Audible API fetch layout when chapters are needed: tree | flat

# ---------------------------------------------------------------------------
# Content-source plugins ([sources.*])
# Each source is independently enableable. Disabled sources are not registered
# in CLI/daemon. Source-specific knobs live on that source's table.
# Env: LIBATION_SOURCE_AUDIBLE_ENABLED, LIBATION_SOURCE_LIBRO_ENABLED,
#      LIBATION_SOURCE_CHIRP_ENABLED, LIBATION_SOURCE_GRAPHICAUDIO_ENABLED
# ---------------------------------------------------------------------------
# [sources.audible]
# enabled = true
# ingest = "highest"

# [sources.libro]
# enabled = true
# ingest = "highest"

# [sources.chirp]
# enabled = true
# ingest = "highest"

# [sources.graphicaudio]
# enabled = true
# How to fetch owned GraphicAudio titles. Default: web (Browser Player).
#   web    — Magento Browser Player (no ZIP attempts, no device slot)
#   zip    — Magento ZIP download (≤3 attempts; opt-in)
#   device — Access App API (registers/uses a device activation; opt-in)
# access = "web"
# ingest = "highest"
# Env override for access: LIBATION_GA_ACCESS (legacy: LIBATION_GA_FETCH).

[storage]
backend = "local"  # local | s3

[storage.local]
# Absolute path recommended for Docker/systemd.
# Relative paths resolve under LIBATION_FILES_DIR (e.g. "Audiobooks").
root = "/data/Audiobooks"

[storage.s3]
bucket = "my-audiobooks"
prefix = "library/"
region = "us-east-1"
# endpoint = "https://minio.example.com"
# force_path_style = true

[daemon]
listen = "127.0.0.1:8787"
json_logs = true

# ---------------------------------------------------------------------------
# Integrations ([integrations.*]) — optional third-party hooks (future).
# Not used for crash/error reporting; that stays under [diagnostics].
# ---------------------------------------------------------------------------
# [integrations]

# Opt-in diagnostics: share redacted crash/ERROR-burst reports.
# Deploy: `.github/workflows/diagnostics-collector-deploy.yml` sets collector URL.
# Ingest: `.github/workflows/diagnostics-ingest.yml`.
# Ring buffer always keeps TRACE+; stderr/OS logs honor LIBATION_LOG / RUST_LOG.
# [diagnostics]
# share_reports = false
# collector_url = ""   # optional; bake LIBATION_DIAGNOSTICS_COLLECTOR_URL at cargo build
# upload_on_crash = true
# upload_on_error_burst = true
# upload_on_warn_burst = true
# error_burst_threshold = 10
# error_burst_window_secs = 60
# warn_burst_threshold = 20
# warn_burst_window_secs = 60
# ring_buffer_capacity = 200
