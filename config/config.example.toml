# Example Bookclerk configuration.
# Copy to `$BOOKCLERK_FILES_DIR/config.toml` or pass `--config`.

[library]
auto_acquire = false
scan_interval_minutes = 60
# After scan, enrich non-Audible library rows from public Audible catalog + Audnexus.
enrich_from_audible = true
enrich_min_confidence = 90
# When matching storage, relocate matched audio + sidecars onto the naming-profile layout.
# fix_storage_layout = false

[auth]
# Prefer BOOKCLERK_AUTH_PASSWORD or BOOKCLERK_AUTH_PASSWORD_FILE over plaintext token files.
# password_file = "/run/bookclerk/secrets/auth_password"
# allow_plaintext = false

[output]
# Packaging format: enriched_m4b | single_mp3 | split_mp3_by_chapter | split_mp3_by_size | opus | none
format = "enriched_m4b"
# split_mp3_max_mb = 200

# Prefer Widevine/CENC; L3 CDM auto-provisions via AudibleCdm.
widevine = false
xhe_aac = false
# widevine_cdm = "widevine.wvd"
# widevine_cdm_provider = "off"

# Naming profiles: audiobookshelf (default) | classic.
# naming_profile = "audiobookshelf"
# folder_template = "<first author>/<title>"
# file_template = "<title> [<asin>]"
# chapter_file_template = "<ch#> - <chapter title>"

# Path sanitization: auto | windows | posix | s3 | none.
# path_sanitization = "auto"
# replacement_characters = [{ find = ":", replace = "_" }]
# max_filename_length = 255

# Sidecars / metadata.
download_cover = true
download_pdf = true
create_cue = false
fixup_metadata = true
chapter_json = "off"
save_metadata_json = false
cover_size = "500"
chapter_layout = "tree"

# When multiple destinations are enabled and only some already have a title:
#   sync_missing    — copy from a present dest into missing ones (default; no re-fetch)
#   refetch_missing — re-download/encode, write only to missing destinations
#   refetch_all     — re-download/encode into every destination
# multi_destination = "sync_missing"

# Destination plugins — each has `enabled`; multiple may be on at once
# (acquired files are written to every enabled destination).
[output.local]
enabled = true
root = "/data/Audiobooks"
# prefix = "library/"
# Optional per-destination naming overrides. Unset values inherit [output].
# naming_profile = "audiobookshelf"
# folder_template = "<first author>/<title>"
# file_template = "<title> [<asin>]"
# chapter_file_template = "<ch#> - <chapter title>"

[output.s3]
enabled = false
# bucket = "my-audiobooks"
# prefix = "library/"
# region = "us-east-1"
# endpoint = "http://minio:9000"
# force_path_style = true
# Credentials JSON under Accounts/ (same pattern as source *.*.auth files).
# Default when unset: Accounts/default.s3.auth
# credentials_file = "Accounts/default.s3.auth"
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY still override when both are set.
# Optional per-destination naming overrides. Useful when object storage should
# use a different key layout than the local filesystem.
# naming_profile = "classic"
# folder_template = "<author>/<series>"
# file_template = "<asin>"
# chapter_file_template = "<asin> - <ch#>"
# Env: BOOKCLERK_OUTPUT_S3_ENABLED, BOOKCLERK_OUTPUT_S3_BUCKET,
#      BOOKCLERK_OUTPUT_S3_CREDENTIALS_FILE (or BOOKCLERK_S3_*), …

# Content-source plugins ([sources.*]). Each source has `enabled`.
# [sources.audible]
# enabled = true
# bitrate = "high"          # high | normal

# [sources.libro]
# enabled = true
# container = "m4b"         # m4b | zip

# [sources.chirp]
# enabled = true

# [sources.graphicaudio]
# enabled = true
# access = "web"            # web | zip | device
# bitrate = "hi"            # hi | lo
# container = "auto"        # auto | m4b | mp3 | flac

[daemon]
listen = "127.0.0.1:8787"
json_logs = true

# [integrations]
# portal_base_path = "/connect"
# public_origin = "https://abs.example.com"

# [integrations.audiobookshelf]
# enabled = false
# base_url = "http://audiobookshelf:80"
# # Prefer BOOKCLERK_ABS_API_KEY env over storing the key in TOML.
# # api_key = ""
# # library_id = "lib_..."
# watch_users = true
# notify_scan_on_acquire = true
# allow_credential_login = true

# Third-party plugins (see docs/plugins.md) install under
# `$BOOKCLERK_FILES_DIR/plugins/<name>/plugin.toml` (or BOOKCLERK_PLUGIN_DIRS).
# Enable / configure by id in this file — external integrations default off:
# [integrations.echo]
# enabled = true
# # … opaque knobs forwarded on handshake …

