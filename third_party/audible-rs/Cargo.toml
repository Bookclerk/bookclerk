[package]
name = "audible-rs"
version = "0.1.0-alpha.8"
edition = "2024"
authors = ["mkb79 <mkb79@hackitall.de>"]
license = "MIT"
description = "CLI and library for Audible, a Rust reimplementation of mkb79/Audible and mkb79/audible-cli"
repository = "https://github.com/mkb79/audible-rs"
publish = false

[[bin]]
name = "audible"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "audible_rs"
path = "src/lib.rs"

[features]
default = []
# `audible` CLI, local SQLite library DB, config.toml, plugin broker, and
# terminal progress. Bookclerk's source plugin leaves this off.
cli = [
    "dep:anyhow",
    "dep:async-trait",
    "dep:clap",
    "dep:clap_complete",
    "dep:comfy-table",
    "dep:console",
    "dep:dialoguer",
    "dep:indicatif",
    "dep:libc",
    "dep:mimalloc",
    "dep:qrcode",
    "dep:rusqlite",
    "dep:semver",
    "dep:tempfile",
    "dep:toml",
    "dep:toml_edit",
    "dep:tracing-subscriber",
    "dep:unicode-normalization",
    "tokio/process",
    "tokio/signal",
]

[dependencies]
# Async runtime & HTTP — library path used by Bookclerk's Audible plugin.
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net"] }
futures = "0.3"
reqwest = { version = "0.13", features = ["json", "form", "cookies", "stream", "gzip", "brotli", "deflate"] }
# Login-server reverse proxy (AUD-60). The hyper stack is already in
# the tree via reqwest; Bookclerk's Accounts UI uses this path.
hyper = { version = "1.10", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
regex = "1.12"
url = "2.5"
roxmltree = "0.21"  # read-only DASH MPD parsing (Widevine, AUD-56)

# Crypto (digest-0.10 / cipher-0.4 lineup, compatible with rsa 0.9)
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = "0.10"
pbkdf2 = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
sha1 = "0.10"
cmac = "0.7"
hmac = "0.12"

# Widevine license protocol (AUD-56): prost is the small runtime lib linked
# into the binary; the codegen (protox/prost-build) is build-time only.
prost = "0.14"

# Secret handling
secrecy = { version = "0.10", features = ["serde"] }
zeroize = "1.8"

# Amazon login HTML (OTP is completed in the browser; this crate does not
# generate TOTP codes).
scraper = "0.27"

# Config & serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cross-process auth-file write lock (file write-back and CLI config).
fd-lock = "4.0"

# Errors & logging
thiserror = "2.0"
tracing = "0.1"

# Encoding & misc
base64 = "0.22"
hex = "0.4"
rand = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

# --- CLI-only (optional; enabled by `cli`) ---
anyhow = { version = "1.0", optional = true }
async-trait = { version = "0.1", optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
clap_complete = { version = "4", optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }
toml = { version = "1.1", optional = true }
toml_edit = { version = "0.25", optional = true }
unicode-normalization = { version = "0.1", optional = true }
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
indicatif = { version = "0.18", optional = true }
console = { version = "0.16", optional = true }
comfy-table = { version = "7.2", optional = true }
dialoguer = { version = "0.12", features = ["editor"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
libc = { version = "0.2", optional = true }
tempfile = { version = "3", optional = true }
mimalloc = { version = "0.1", optional = true }
semver = { version = "1.0", optional = true }

# Build-time only (Widevine proto codegen, pure Rust — no protoc needed).
# Not linked into the release binary.
[build-dependencies]
prost-build = "0.14"
protox = "0.9"

[dev-dependencies]
insta = "1.47"
tempfile = "3"
wiremock = "0.6"

# Argon2id with production parameters (64 MiB) is unusably slow in
# unoptimized test builds.


[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/audible-{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "audible-{ version }-{ target }/{ bin }"

# Windows ships a .zip with an `.exe` (Stage 2, AUD-190); everything else keeps
# the .tar.gz defaults above.
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/audible-{ version }-{ target }.zip"
pkg-fmt = "zip"
bin-dir = "audible-{ version }-{ target }/{ bin }.exe"
