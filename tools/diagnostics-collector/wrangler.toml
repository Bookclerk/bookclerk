# Cloudflare Worker — deployed by GitHub Actions (wrangler-action).
# See .github/workflows/diagnostics-collector-deploy.yml
name = "bookclerk-diagnostics"
main = "worker.js"
compatibility_date = "2026-01-01"
# Off here: with the DOMAIN variable set, the deploy workflow adds the custom
# domain `diagnostics.<DOMAIN>` and serves only there. With DOMAIN unset (a
# fork without a domain) it turns workers_dev on instead.
workers_dev = false

[vars]
# Used by GET /report to resolve the latest stable release baseline.
GITHUB_REPOSITORY = "Bookclerk/bookclerk"
# POST /triage: model and neuron cap per UTC day (the account gets 10,000
# free neurons a day across all Workers AI use; this keeps triage to a fifth).
TRIAGE_MODEL = "@cf/ibm-granite/granite-4.0-h-micro"
TRIAGE_DAILY_NEURONS = "2000"
# Dashboard: most reports /submit indexes per UTC day, so an open /submit
# cannot spend the D1 write allowance (100,000 rows a day on the free plan).
# Each indexed report writes five rows, so this spends at most half of it.
DASHBOARD_INDEX_DAILY_ROWS = "10000"

[ai]
binding = "AI"

# Daily neuron ledger for /triage. No id: wrangler creates the namespace on
# the first deploy and keeps it linked, so a fork needs no setup.
[[kv_namespaces]]
binding = "TRIAGE_BUDGET"

[secrets]
required = [
  "B2_KEY_ID",
  "B2_APPLICATION_KEY",
  "B2_BUCKET_ID",
  "REPORT_API_KEY",
]

# Dashboard (dashboard/routes.js): report index, sessions and audit log. No
# id: wrangler creates the database on the first deploy, like TRIAGE_BUDGET,
# and the deploy workflow then applies migrations/. The dashboard stays off
# until the GitHub App secrets are set too.
[[d1_databases]]
binding = "DASHBOARD_DB"
migrations_dir = "migrations"

# Dashboard styles, script, mark and fonts, served under /static/ without
# running the Worker. Every other path reaches the Worker.
[assets]
directory = "./public"
binding = "ASSETS"

# Issue and pull request sync for the dashboard, plus the session sweep.
[triggers]
crons = ["*/30 * * * *"]

# Live dashboard updates (dashboard/live.js): one SQLite-backed Durable
# Object holds open pages' WebSockets with the hibernation API and tells them
# when the numbers change. SQLite-backed classes are the kind Workers Free
# offers; idle hibernated sockets use no duration.
[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveHub"

[[migrations]]
tag = "v1-live-hub"
new_sqlite_classes = ["LiveHub"]
