# Cloudflare Worker for the bookclerk.app website, deployed by GitHub Actions
# (.github/workflows/site-deploy.yml). The name is fixed: the deploy token is
# scoped to this Worker by name, so renaming it needs a new token scope.
name = "bookclerk-site"
compatibility_date = "2026-01-01"
# Served only on the custom domain <DOMAIN>; the deploy workflow adds that
# route from the DOMAIN organization variable.
workers_dev = false

# The Worker (entry.ts → worker.ts) runs first for page paths only: it
# renders /docs/ from the docs repository, lists its pages in /sitemap.xml and
# answers `Accept: text/markdown` with each page's Markdown version. Everything else (styles, images, the .md
# and .txt files under other paths) is served from dist/ without it.
# `npm run build` must run first: entry.ts imports generated/docs-shell.json.
main = "entry.ts"

# `npm run build` writes dist/. /download serves download.html, and unknown
# paths get 404.html with a 404 status.
[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/", "/index.html", "/index.md", "/download", "/download.html", "/download.md", "/privacy", "/privacy.html", "/privacy.md", "/security", "/security.html", "/security.md", "/404.md", "/sitemap.xml", "/docs", "/docs/*"]
