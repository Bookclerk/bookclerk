[package]
name = "author-surface-positive"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone package (NOT a workspace member): workspace feature unification
# must not leak the abi `host` feature into this dependency graph.
[workspace]

[dependencies]
bookclerk-plugin-sdk = { path = "../../../crates/bookclerk-plugin-sdk", features = ["db"] }
# Standalone resolver (not the workspace lockfile). tinyvec 1.13.0 does not
# compile on rustc 1.98 (`alloc::vec` shadows `vec!`).
tinyvec = "=1.12.0"

[lints.rust]
missing_docs = "deny"
