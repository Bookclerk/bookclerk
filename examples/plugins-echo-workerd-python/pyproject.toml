# The example's test suite, run by `bookclerk-plugin test .` (once per
# database profile) or plain `python -m pytest`. The plugin itself ships as
# `modules/` and needs no packaging; the tests import those modules directly
# and the Bookclerk Python SDK (`bookclerk_plugin_sdk`) from the environment.
[project]
name = "echo-workerd-python"
version = "1.0.0"
description = "Echo workerd Python guest: tests for its notes database"
requires-python = ">=3.11"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["modules"]

# The Python SDK's lint and format settings, so the example reads like it.
[tool.ruff]
target-version = "py311"
src = ["modules", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["D", "E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["D105", "D107", "D203", "D213", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
