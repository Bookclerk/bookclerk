api_version = 2
id = "echo_workerd_python"
name = "Echo Integration (workerd Python)"
kind = "integration"
version = "1.0.0"
runtime = "workerd"

[workerd]
compatibility_date = "2026-08-01"
# Required for Python Workers under local bookclerk-workerd (also enforced by
# `python -m bookclerk_plugin_sdk check|fmt|package`).
compatibility_flags = [
    "python_workers",
    "disable_python_external_sdk",
]
main_module = "plugin.py"
modules_dir = "modules"
entrypoint = "default"

[workerd.limits]
# Host-clamped; subrequests enforced in egress (local workerd has no Cap'n Proto cpuMs/subRequests).
cpu_ms = 30000
subrequests = 50

[[modules]]
name = "plugin.py"
path = "plugin.py"
type = "python"

[capabilities.network]
mode = "deny"

[capabilities.bindings]
config = true
plugin_kv = true

[capabilities.methods]
list = ["describe", "integration", "health", "diagnose", "onEvent", "cli"]
