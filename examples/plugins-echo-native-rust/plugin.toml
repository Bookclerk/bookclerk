api_version = 2
id = "echo_native_rust"
name = "Echo Integration (native Rust)"
kind = "integration"
version = "0.1.0"
runtime = "native"
command = "./bookclerk-plugin-echo-native-rust"

[capabilities.network]
mode = "deny"

[capabilities.bindings]
config = true
# Isolated plugin-owned databases (Workers-style named bindings): each name
# is its own database, separate from the library and every other plugin.
databases = ["DB"]

[capabilities.methods]
list = ["describe", "integration", "health", "diagnose", "onEvent", "cli"]

[capabilities.events]
subscriptions = [
  { type = "book_acquired", schema_versions = [1], supports_suspend = false },
]

[cli]
[[cli.commands]]
name = "ping"
about = "Probe echo plugin"
[[cli.commands.args]]
name = "message"
long = "message"
kind = "string"
default = "hi"
