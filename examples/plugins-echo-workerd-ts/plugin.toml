api_version = 1
id = "echo_workerd_ts"
name = "Echo Integration (workerd TypeScript)"
kind = "integration"
version = "1.0.0"
runtime = "workerd"

[workerd]
compatibility_date = "2026-08-01"
compatibility_flags = []
main_module = "index.js"
modules_dir = "modules"
entrypoint = "default"

[workerd.limits]
cpu_ms = 30000
subrequests = 50

[[modules]]
name = "index.js"
path = "index.js"
type = "js"

[capabilities.network]
mode = "deny"

[capabilities.bindings]
config = true
plugin_kv = true

[capabilities.methods]
list = ["handshake", "health", "diagnose", "onEvent", "cli"]
