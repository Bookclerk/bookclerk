api_version = 2
id = "echo_workerd_ts"
name = "Echo Integration (workerd TypeScript)"
kind = "integration"
version = "1.0.0"
runtime = "workerd"

[workerd]
compatibility_date = "2026-08-01"
compatibility_flags = []
main_module = "index.js"
modules_dir = "modules"
entrypoint = "default"

[workerd.limits]
# Host-clamped; subrequests enforced in egress (local workerd has no Cap'n Proto cpuMs/subRequests).
cpu_ms = 30000
subrequests = 50

[[modules]]
name = "index.js"
path = "index.js"
type = "js"

[capabilities.network]
mode = "deny"

[capabilities.bindings]
config = true
plugin_kv = true
# Isolated plugin-owned databases (Workers-style named bindings).
databases = ["DB"]

[capabilities.methods]
list = ["describe", "integration", "health", "diagnose", "onEvent", "cli"]

[capabilities.events]
subscriptions = [
  { type = "book_acquired", schema_versions = [1], supports_suspend = true },
]
