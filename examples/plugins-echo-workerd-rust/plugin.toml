api_version = 3
id = "echo_workerd_rust"
name = "Echo Integration (workerd Rust/Wasm)"
version = "1.0.0"
runtime = "workerd"
entrypoints = ["cli"]

[workerd]
compatibility_date = "2026-08-01"
compatibility_flags = []
main_module = "index.js"
modules_dir = "modules"
entrypoint = "default"

[workerd.limits]
# Host-clamped; subrequests enforced in egress (local workerd has no Cap'n Proto cpuMs/subRequests).
cpu_ms = 30000
subrequests = 50

[[modules]]
name = "index.js"
path = "index.js"
type = "js"

[[modules]]
name = "pkg/bookclerk_plugin_echo_workerd_rust.js"
path = "pkg/bookclerk_plugin_echo_workerd_rust.js"
type = "js"

[[modules]]
name = "pkg/bookclerk_plugin_echo_workerd_rust_bg.wasm"
path = "pkg/bookclerk_plugin_echo_workerd_rust_bg.wasm"
type = "wasm"

[capabilities.network]
mode = "deny"

[vars]

[[kv_namespaces]]
binding = "KV"

[[events.consumers]]
type = "book_acquired"
schema_versions = [1]
supports_suspend = false
