# Experimental sketch — PyInstaller onefile Echo guest.
# Support tier: EXPERIMENTAL (not Tier-1 / Rust parity).
#
# Notes:
#   - No cross-compile: build on each OS/arch runner you ship.
#   - Linux artifacts link against the runner's glibc — do not expect Alpine/musl.
#   - macOS / Windows must be built on those hosts.
#
# Intended for a standalone plugin repo (copy this directory). When kept under
# the Bookclerk monorepo, GitHub ignores nested `.github/` — treat as a template.

name: Package Echo (PyInstaller, experimental)

on:
  workflow_dispatch:
  push:
    paths:
      - "echo_plugin.py"
      - "plugin.toml"
      - "requirements-dev.txt"
      - ".github/workflows/package.yml"

permissions:
  contents: read

jobs:
  pyinstaller:
    name: py-${{ matrix.bookclerk_target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bookclerk_target: linux-x64-gnu
            archive_ext: tar.gz
            bin_name: bookclerk-plugin-echo-native-python
          - os: macos-latest
            bookclerk_target: macos-arm64
            archive_ext: tar.gz
            bin_name: bookclerk-plugin-echo-native-python
          - os: windows-latest
            bookclerk_target: windows-x64
            archive_ext: zip
            bin_name: bookclerk-plugin-echo-native-python.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install -r requirements-dev.txt

      - name: Build onefile
        shell: bash
        run: |
          set -euo pipefail
          pyinstaller --onefile --name bookclerk-plugin-echo-native-python echo_plugin.py
          test -f "dist/${{ matrix.bin_name }}" || test -f dist/bookclerk-plugin-echo-native-python

      - name: Pack archive + SHA256SUMS
        shell: bash
        env:
          TARGET: ${{ matrix.bookclerk_target }}
          EXT: ${{ matrix.archive_ext }}
          BIN: ${{ matrix.bin_name }}
          VERSION: "0.1.0"
        run: |
          set -euo pipefail
          out=dist/plugins
          mkdir -p "$out" staging
          src="dist/${BIN}"
          if [[ ! -f "$src" ]]; then src="dist/bookclerk-plugin-echo-native-python"; fi
          cp plugin.toml staging/plugin.toml
          cp "$src" "staging/${BIN}"
          if [[ "${{ runner.os }}" != "Windows" ]]; then chmod +x "staging/${BIN}"; fi
          archive="bookclerk-plugin-echo-native-python-${VERSION}-${TARGET}.${EXT}"
          if [[ "$EXT" == "zip" ]]; then
            tar -a -C staging -cf "${out}/${archive}" .
          else
            tar -C staging -czf "${out}/${archive}" .
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$out" && sha256sum "$archive" > SHA256SUMS)
          else
            (cd "$out" && shasum -a 256 "$archive" > SHA256SUMS)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bookclerk-plugin-echo-native-python-${{ matrix.bookclerk_target }}
          path: dist/plugins/*
